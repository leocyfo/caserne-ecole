# Lance toute la suite de tests à chaque envoi sur GitHub (et à chaque demande de fusion).
# Le résultat apparaît dans l’onglet « Actions » du dépôt : coche verte si tout passe, croix rouge sinon.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Assembler le site
        run: node outils/construire.js
      - name: Le site envoyé correspond aux sources
        run: git diff --exit-code -- index.html demo.html demo/donnees.js
      - name: Lancer les tests
        run: node tests/lancer.js
      - name: Garder les pages de résultats en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resultats-tests
          path: tests/out*.html
          retention-days: 7

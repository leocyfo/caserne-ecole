/* ---------- Affectation des enseignants : requis, candidatures, remplacements, disponibilités ----------
   candidatures/<séance__enseignant> : { seance, cours, groupe, date, debut, fin, enseignant, statut }
     statut : attente (a postulé) · approuve · refuse · retire (retiré de ce cours par l’administration)
   remplacements/<séance__enseignant> : l’enseignant attribué demande à être remplacé ({ motif })
   disponibilites/<enseignant> : { jours : { '2026-10-13' : 'J' | 'AM' | 'PM' } }
   Le titulaire du module (cours.enseignant) donne tous ses cours, sauf ceux dont on l’a retiré. */
const candId=(key,tid)=>(String(key)+'__'+String(tid)).replace(/[^A-Za-z0-9_-]/g,'-');
let _aff=null;
function affIdx(){
  const a=S.data.candidatures, r=S.data.remplacements;
  if(_aff&&_aff.a===a&&_aff.r===r) return _aff;
  const by={}, rp={};
  for(const d of a)(by[d.seance]||(by[d.seance]=[])).push(d);
  for(const d of r) rp[d.seance+'|'+d.enseignant]=d;
  return _aff={a,r,by,rp};
}
/* Module du programme (menu Modules) d’un cours, d’après son sigle « M7 » */
const modKey=c=>{const m=/^M?(\d+)$/i.exec(String(c&&c.code||'').trim());return m?+m[1]:null;};
const modOf=c=>{const k=modKey(c);return k==null?null:comps().find(x=>+x.code===k)||null;};
/* Enseignants requis : réglé sur le cours lui-même, sinon la valeur du module, sinon 1 */
const reqOf=s=>{const x=s.extra||s.sl||{};if(x.requis!=null&&x.requis!=='')return Math.max(0,+x.requis||0);if(isActivity(s.c))return 0;const m=modOf(s.c);return m&&+m.requis>0?+m.requis:1;};
function tchOf(c,key){
  const cs=affIdx().by[key];if(!cs) return [c.enseignant];
  const out=[];
  if(c.enseignant&&!cs.some(d=>d.enseignant===c.enseignant&&d.statut==='retire')) out.push(c.enseignant);
  for(const d of cs) if(d.statut==='approuve'&&!out.includes(d.enseignant)) out.push(d.enseignant);
  return out;
}
function staffing(s){
  const I=affIdx(), cs=I.by[s.key]||[], st={}, known=id=>!!byId(S.data.enseignants,id);
  for(const d of cs) st[d.enseignant]=d.statut;
  const assigned=s.tch.filter(id=>id&&known(id));
  const pending=cs.filter(d=>d.statut==='attente'&&known(d.enseignant)).map(d=>d.enseignant);
  const remp=assigned.filter(t=>I.rp[s.key+'|'+t]);
  const requis=reqOf(s), firm=assigned.length-remp.length, clash=isPast(s)?[]:assigned.filter(t=>busyAt(t,s));
  return {requis,assigned,pending,remp,st,firm,clash,open:Math.max(0,requis-firm)};
}
const DISPO={J:'Toute la journée',AM:'Avant-midi',PM:'Après-midi'};
const dispoOf=(tid,ds)=>{const d=S.data.dispos[tid];return (d&&d.jours&&d.jours[ds])||'';};
const dispoCovers=(v,s)=>v==='J'||(v==='AM'&&momentOf(s)==='Avant-midi')||(v==='PM'&&momentOf(s)==='Après-midi');
const hasComp=(t,c)=>{const k=modKey(c);return k==null||((t&&t.competences)||[]).some(x=>+x===k);};
const busyAt=(tid,s)=>sessionsOn(s.date).some(o=>o.key!==s.key&&!o.cancelled&&o.tch.includes(tid)&&o.start<s.end&&s.start<o.end);
const sHours=s=>Math.round((s.extra?sessMinutes(s.extra):s.end-s.start)/6)/10;
const sTitle=s=>`${codeOf(s.c)}${esc(s.c.titre)}`;
const sSub=s=>esc([sessLabel(s),cardKind(tagsOf(s)).kind].filter(Boolean).join(' · '));
const sAria=s=>`${s.c.titre} · ${dayLabel(parse(s.date))} · ${gName(s.grp)}`;
const sAt=s=>`data-key="${esc(s.key)}" data-date="${s.date}"`;
const sHot=s=>daysBetween(todayISO(),s.date)<=2?'hot':'';
const sDay=s=>{const d=parse(s.date);return `${WD[d.getDay()]} ${dn(d)} ${fMonthS.format(d)}`;};
const weekCount=(tid,mon)=>{let n=0;for(let i=0;i<5;i++)for(const x of sessionsOn(iso(addDays(mon,i))))if(!x.cancelled&&x.tch.includes(tid))n++;return n;};
function upcomingSessions(days){return sessionsBetween(todayISO(),iso(addDays(new Date(),days))).filter(s=>s.kind==='cours'&&!s.cancelled&&!isPast(s));}
const candDoc=(s,tid,statut)=>({seance:s.key,cours:s.c.id,groupe:s.grp||'',date:s.date,debut:s.sl.debut,fin:s.sl.fin,enseignant:tid,statut,maj:new Date().toISOString()});
const affTile=(k,key,tab,lbl,val,cls,sub)=>`<button type="button" class="xm-tile" id="${k}-${key}" data-act="pg-set" data-k="${k}" data-v="${key}" aria-pressed="${tab===key}"><span class="lbl">${lbl}</span><b class="${cls}">${val}</b><small>${sub}</small></button>`;

/* ---------- Enseignant : mes cours (à pourvoir, en attente, attribués, donnés) ---------- */
function teacherBoard(tid){
  const t=byId(S.data.enseignants,tid)||{}, I=affIdx(), open=[], wait=[], mine=[];let noDispo=0;
  for(const s of upcomingSessions(150)){
    const st=staffing(s), my=st.st[tid];
    if(st.assigned.includes(tid)){mine.push({s,st,remp:I.rp[s.key+'|'+tid]||null});continue;}
    if(my==='attente'||my==='refuse'){wait.push({s,st,v:my});continue;}
    if(my==='retire'||st.open<=0||!hasComp(t,s.c)||onLeave(t)) continue;
    if(!dispoCovers(dispoOf(tid,s.date),s)){noDispo++;continue;}
    if(busyAt(tid,s)) continue;
    open.push({s,st});
  }
  const past=sessionsBetween(yearStart(),todayISO()).filter(s=>s.kind==='cours'&&!s.cancelled&&isPast(s)&&s.tch.includes(tid)).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  return {t,open,wait,mine,past,noDispo};
}

      :onLeave(B.t)?emptyBox('Vous êtes en congé','Les cours à pourvoir vous seront proposés à votre retour.')

      :`<section class="panel"><p class="help">Aucun cours à pourvoir les jours où vous êtes disponible.${B.noDispo?` ${pl(B.noDispo,'cours cherche','cours cherchent')} un enseignant d’autres jours : ajoutez des disponibilités pour les voir.`:''}</p></section>`;
  }else if(tab==='wait'){

/* ---------- Disponibilités : un mois, du lundi au vendredi ; un clic change la journée ---------- */
function dispoDraft(tid){
  const st=S.pg, doc=S.data.dispos[tid];
  if(!st.dd||st.dd.tid!==tid||!st.dd.dirty) st.dd={tid,jours:Object.assign({},(doc&&doc.jours)||{}),dirty:false,maj:doc&&doc.maj};
  return st.dd;
}
function dispoMonthDays(ym){
  const [Y,M]=ym.split('-').map(Number), out=[];
  for(let d=new Date(Y,M-1,1);d.getMonth()===M-1;d=addDays(d,1)){const j=(d.getDay()+6)%7;if(j<5)out.push({d,ds:iso(d),j});}
  return out;
}
const dispoLocked=ds=>ds<todayISO()||!!offDay(ds);
function dispoCalHTML(tid,edit){
  const st=S.pg, ym=/^\d{4}-\d{2}$/.test(st.dm||'')?st.dm:todayISO().slice(0,7), [Y,M]=ym.split('-').map(Number);
  const dr=dispoDraft(tid), days=dispoMonthDays(ym), today=todayISO(), mName=fMonth.format(new Date(Y,M-1,1));
  const mine=new Set();for(const {ds} of days) if(sessionsOn(ds).some(s=>!s.cancelled&&s.tch.includes(tid))) mine.add(ds);
  let n=0;for(const {ds} of days) if(dr.jours[ds]) n++;
  const first=days[0], lead=first?first.j:0;
  let cells='';for(let i=0;i<lead;i++) cells+='<span class="dp-x" aria-hidden="true"></span>';
  for(const {d,ds,j} of days){
    const v=dr.jours[ds]||'', off=offDay(ds), lock=dispoLocked(ds);
    cells+=`<button type="button" class="dp-c${v?' on v-'+v:''}${ds<today?' past':''}${off?' off':''}${ds===today?' is-today':''}" id="dp-${ds}" data-act="dp-day" data-date="${ds}"${edit&&!lock?'':' disabled'} aria-label="${esc(`${dayLabel(d)} : ${off||DISPO[v]||'non disponible'}${mine.has(ds)?', cours attribué':''}`)}"><b>${d.getDate()}</b><span>${off?esc(off):v?DISPO[v]:'—'}</span>${mine.has(ds)?'<i class="dp-dot" title="Cours attribué ce jour-là"></i>':''}</button>`;
  }
  let state='Aucune modification';if(dr.dirty)state='Modifications non enregistrées';else if(dr.maj){const t=new Date(dr.maj);if(!isNaN(t))state=`Enregistrées le ${shortDate(t)}`;}
  return `<div class="toolbar dp-bar"><div class="weeknav"><button class="icon-btn" type="button" id="dp-prev" data-act="dp-month" data-n="-1" aria-label="Mois précédent">${icon('left')}</button><span class="range" id="dp-month">${esc(mName.charAt(0).toUpperCase()+mName.slice(1))} ${Y}</span><button class="icon-btn" type="button" id="dp-next" data-act="dp-month" data-n="1" aria-label="Mois suivant">${icon('right')}</button></div>
      <p class="summary" style="margin:0"><span><b>${n}</b>${n>1?'jours disponibles':'jour disponible'}</span></p><span class="grow"></span>
      ${edit?`<button class="btn sm" type="button" data-act="dp-all">Tout le mois</button><button class="btn sm ghost" type="button" data-act="dp-none">Effacer le mois</button>`:''}</div>
    <div class="dp-grid" role="group" aria-label="${esc('Disponibilités de '+mName+' '+Y)}">${DAYS.map((nm,i)=>edit?`<button type="button" class="dp-wd" data-act="dp-col" data-j="${i}" title="${esc('Tous les '+nm.toLowerCase()+'s du mois')}">${nm}</button>`:`<span class="dp-wd">${nm}</span>`).join('')}${cells}</div>
    <div class="dp-legend"><span><i class="dp-k v-J"></i>Toute la journée</span><span><i class="dp-k v-AM"></i>Avant-midi</span><span><i class="dp-k v-PM"></i>Après-midi</span><span><i class="dp-dot"></i>Cours attribué</span></div>
    ${edit?`<div class="row dp-save"><button class="btn primary" type="button" id="dp-save" data-act="dp-save"${S.busy||!dr.dirty?' disabled':''}>Enregistrer</button><span class="muted sm" id="dp-state">${state}</span></div><p class="help">Un clic sur un jour : toute la journée, puis avant-midi, puis après-midi, puis non disponible. Un clic sur « Lundi » change tous les lundis du mois.</p>`:''}`;
}

const dispoChip=(tid,s)=>{const v=dispoOf(tid,s.date);return dispoCovers(v,s)?'<span class="chip ok">Disponible</span>':v?`<span class="chip warn">Disponible : ${DISPO[v].toLowerCase()}</span>`:'<span class="chip off">Disponibilité non indiquée</span>';};
const whoCell=(tid,sub)=>`<div class="xm-who">${avHTML(tName(tid),'')}<span class="xm-t"><b>${esc(tName(tid))}</b>${sub?`<small>${sub}</small>`:''}</span></div>`;
function affCell(st){
  const c=st.clash.length?'bad':st.open>0?(st.firm?'warn':'bad'):'ok';
  if(!st.requis&&!st.clash.length) return `<div class="af-n"><b class="none">—</b><small>${st.assigned.length?st.assigned.map(id=>esc(shortName(tName(id)))).join(', '):'aucun enseignant requis'}</small></div>`;
  return `<div class="af-n ${c}"><b>${st.firm} / ${st.requis}</b><small>${st.clash.length?'Conflit : '+st.clash.map(id=>esc(shortName(tName(id)))).join(', '):st.pending.length?pl(st.pending.length,'candidat','candidats'):st.open>0?'aucun candidat':st.assigned.map(id=>esc(shortName(tName(id)))).join(', ')}</small></div>`;
}
function affPage(){
  const st=S.pg, g=st.g||'', hz=[7,30,90].includes(+st.hz)?+st.hz:30, tab=['open','cand','remp','all'].includes(st.at)?st.at:'open', t=todayISO(), can=isAdmin()&&S.conn==='shared';

  const cands=[];for(const d of S.data.candidatures){if(d.statut!=='attente')continue;const s=live(d);if(s)cands.push({d,s});}

    ${affTile('at','cand',tab,'Candidatures',cands.length,cands.length?'warn':'',cands.length?'en attente de votre réponse':'Aucune en attente')}

    ${affTile('at','all',tab,'Tous les cours',up.length,'',`${full} ${full>1?'complets':'complet'} · ${hz} jours`)}
  </div>`;
  const sessRows=list=>{const lim=+st.lim||30;
    return xList('xm-a6',[['Date'],['Cours'],['Classe'],['Moment'],['Enseignants'],['','r']],list.slice(0,lim).map(({s,st:a})=>xRow('xm-a6',`data-act="sess-at" ${sAt(s)}`,`${xDate(s,sHot(s))}<div class="xm-t"><b>${sTitle(s)}</b>${sSub(s)?`<small>${sSub(s)}</small>`:''}</div>${xCls(s)}<span class="xm-m">${esc(momentOf(s))}</span>${affCell(a)}<div class="xm-end">${a.clash.length?'<span class="chip bad">Conflit</span>':a.remp.length?'<span class="chip warn">Remplacement</span>':a.open>0?`<span class="chip ${a.firm?'warn':'bad'}">${a.open} à combler</span>`:'<span class="chip ok">Complet</span>'}</div>`,sAria(s))).join(''))
      +(list.length>lim?`<div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="pg-set" data-k="lim" data-v="${lim+30}">Afficher plus (${list.length-lim})</button></div>`:'');};

  else body=remps.length?xList('xm-afc',[['Enseignant'],['Cours'],['Quand'],['','r']],remps.map(({d,s})=>{const a=staffing(s);
      return xRow('xm-afc',`data-act="sess-at" ${sAt(s)}`,`${whoCell(d.enseignant,d.motif?esc(d.motif):'Aucune raison indiquée')}<div class="xm-t"><b>${sTitle(s)}</b><small>${esc(gName(s.grp))} · ${a.pending.length?pl(a.pending.length,'candidat','candidats'):'aucun candidat'}</small></div><span class="xm-m">${esc(sDay(s))}<br><span class="muted">${esc(momentOf(s))}</span></span><div class="xm-end">${can?`<button class="btn sm primary" type="button" data-act="af-retire" ${sAt(s)} data-t="${esc(d.enseignant)}"${dis()}>Libérer l’enseignant</button><button class="btn sm ghost" type="button" data-act="af-remp-no" data-id="${esc(d.id)}"${dis()}>Refuser</button>`:''}</div>`,`${tName(d.enseignant)} · ${sAria(s)}`);}).join(''))
    :'<div class="cl-list"><p class="miss-ok"><span class="chip ok">À jour</span>Aucune demande de remplacement.</p></div>';
  return tb+tiles+body;
}
/* Dans la fenêtre d’un cours (administration) : enseignants requis, attribués et candidats */
function affBoxHTML(s){
  const a=staffing(s), I=affIdx(), can=isAdmin()&&S.conn==='shared', past=isPast(s);
  const li=(tid,sub,btns)=>`<li>${avHTML(tName(tid),'')}<span class="nm">${esc(tName(tid))}<small>${sub}</small></span><span class="af-btns">${btns}</span></li>`;

/* ---------- Administration : modules du programme ----------
   Le catalogue est dans config/ecole.competences : { code, nom, heuresT, heuresP, heures, requis }.
   Chaque classe a son « cours » (cours/<id>, sigle M7) dont les séances datées sont les cours du module. */
const modList=()=>comps().map(k=>({id:String(k.code),nom:k.nom,k}));
const modCourses=code=>S.data.cours.filter(c=>modKey(c)===+code);
const modT=k=>k.heuresT!=null&&k.heuresT!==''?+k.heuresT:null;
const modP=k=>k.heuresP!=null&&k.heuresP!==''?+k.heuresP:null;
const modTot=k=>modT(k)!=null||modP(k)!=null?(modT(k)||0)+(modP(k)||0):(+k.heures||0);
const hTxt=v=>v==null?'<span class="muted">—</span>':v+' h';
/* Heures planifiées du module pour une classe, par type ; la reprise ne compte pas */
function modHours(c){
  let T=0,P=0,O=0,ex=0;const rep=[], ann=(c&&c.annulees)||[];
  for(const x of datedOf(c)){
    if(ann.includes(`${x.date}@${x.id}`)) continue;
    const m=sessMinutes(x), tg=x.tags||[];
    if(tg.includes('Reprise')&&!tg.includes('Examen')){rep.push(x.date);continue;}
    if(tg.includes('Examen')) ex++;
    if(tg.includes('Théorie')) T+=m; else if(tg.includes('Pratique')) P+=m; else O+=m;
  }
  return {T:Math.round(T/60),P:Math.round(P/60),O:Math.round(O/60),ex,rep:rep.sort()};
}

/* Enregistre le catalogue des modules, puis accorde le nom et les heures des cours des classes */
async function saveModule(code,vals,isNew){
  const c=configDoc(), i=c.competences.findIndex(x=>+x.code===+code);
  if(isNew&&i>=0){toast(`Le module M${code} existe déjà.`,'bad');return false;}
  const tot=vals.heuresT!=null||vals.heuresP!=null?(vals.heuresT||0)+(vals.heuresP||0):(i>=0?+c.competences[i].heures||0:0);
  const k=Object.assign({},i>=0?c.competences[i]:{code:+code},{nom:vals.nom,heuresT:vals.heuresT,heuresP:vals.heuresP,heures:tot,requis:vals.requis});
  if(i>=0)c.competences[i]=k;else c.competences.push(k);
  c.competences.sort((a,b)=>a.code-b.code);
  if(!await saveConfig(c,isNew?`Module M${code} créé`:'Module enregistré')) return false;
  const stale=modCourses(code).filter(x=>x.titre!==k.nom||(+x.heures||0)!==tot);
  if(stale.length) await runAll(stale.map(x=>()=>col('cours').doc(x.id).update({titre:k.nom,heures:tot||null})),'');
  return true;
}

  const dd=parse(date), j=dd.getDay(), off=offDay(date);

  if(off) return `Le ${dn(dd)} ${fMonth.format(dd)} n’est pas un jour de classe (${off}).`;
  const a0=toMin(per.debut), b0=toMin(per.fin), clash=sessionsOn(date).find(x=>x.grp===gid&&!x.cancelled&&x.start<b0&&a0<x.end);
  if(clash) return `${gName(gid)} a déjà ${clash.c.titre} ${momentIn(clash.start,clash.end)} ce jour-là.`;
  const x={id:'a'+date.replace(/-/g,'')+per.k+Math.random().toString(36).slice(2,5),date,debut:per.debut,fin:per.fin,tags:withAct([],o.type||'theorie'),label:String(o.label||'').trim()||titre,minutes:per.k==='jour'?360:180};
  const c0=mk?modCourses(mk.code).find(c=>c.groupe===gid):S.data.cours.find(c=>c.groupe===gid&&modKey(c)==null&&String(c.titre||'').trim().toLowerCase()===titre.toLowerCase());
  let ok;
  if(c0){const doc=courseDoc(c0);doc.extras.push(x);ok=await affWrite(()=>col('cours').doc(c0.id).set(doc),'Cours ajouté');}

  return ok?'':'L’enregistrement a échoué.';
}

/* ---------- Comptes et profils ----------
   Un compte relie une personne (son accès claude.ai) à un rôle et à sa fiche.
   comptes/<id de la personne> : {role, ref, fiche, maj}. Chacun ne lit que son propre compte ;
   l’administration les lit et les écrit tous. La fiche copiée permet à l’élève de voir
   ses informations sans avoir accès aux dossiers des autres élèves. */
let USER=null, ROOM;
/* Sur le site (hors claude.ai), la connexion se fait par courriel et les comptes naissent d’une demande. */
const siteMode=()=>!!window.__AUTH;
const ROLES=['admin','teacher','student'];
const ROLE_CHIP={admin:'k2',teacher:'k0',student:'k6'};
const ACCESS={admin:'Éditeur',teacher:'Contributeur',student:'Lecteur'};
const PROF={}, profAsk=new Set();
const profOf=id=>PROF[id]||null;
function needProfiles(ids){
  if(!USER) return;
  const miss=[...new Set(ids)].filter(id=>id&&!PROF[id]&&!profAsk.has(id));
  if(!miss.length) return;
  miss.forEach(id=>profAsk.add(id));
  USER.profiles(miss).then(m=>{for(const [id,p] of Object.entries(m||{}))PROF[id]=p;schedule();}).catch(()=>{});
}
const initials=n=>String(n||'').trim().split(/\s+/).map(w=>(w.match(/\p{L}/u)||[''])[0]).filter(Boolean).slice(0,2).join('').toUpperCase()||'?';
const AV_COLORS=['#2C4F78','#7043A5','#146C62','#995D12','#A3326B','#1C7951'];
function avHTML(name,url,cls){
  if(url) return `<span class="av${cls?' '+cls:''}"><img src="${esc(url)}" alt=""></span>`;
  let h=0;for(const ch of String(name||''))h=(h*31+ch.charCodeAt(0))>>>0;
  return `<span class="av${cls?' '+cls:''}" style="background:${AV_COLORS[h%AV_COLORS.length]}" aria-hidden="true">${esc(initials(name))}</span>`;
}

function ficheOf(role,ref,rec,dz){
  if(!ref) return {};

/* Rôle et fiche proposés pour une demande : la fiche d’élève ou du personnel qui porte le même nom */
function guessAcct(x){
  const s=guessRef('student',x);if(s)return {role:'student',ref:s};
  const t=guessRef('teacher',x);if(t){const p=byId(S.data.enseignants,t);return {role:p&&!isTeacher(p)?'admin':'teacher',ref:t};}
  return {role:'student',ref:''};
}
function guessRef(role,x){
  const same=(a,b)=>collator.compare(String(a||'').trim(),String(b||'').trim())===0;
  if(role==='student'){const e=S.data.eleves.find(e=>same(e.nom,x.nom));return e?e.id:'';}
  const p=S.data.enseignants.find(p=>same(p.nom,x.nom));return p?p.id:'';

function setHTML(el,html,key){
  if(el._h===html&&el._k===key) return;
  const same=key!==undefined&&el._k===key, vals={};
  const a=document.activeElement;let fid=null,sel=null;
  if(a&&el.contains(a)&&a.id){fid=a.id;try{sel=[a.selectionStart,a.selectionEnd];}catch(e){sel=null;}}
  if(same) el.querySelectorAll('input[id],textarea[id]').forEach(i=>{if(!i.dataset.f&&i.type!=='radio'&&i.type!=='checkbox')vals[i.id]=i.value;});
  const st=el.scrollTop;
  el.innerHTML=html;el._h=html;el._k=key;
  for(const [id,v] of Object.entries(vals)){const i=document.getElementById(id);if(i&&el.contains(i))i.value=v;}
  if(same) el.scrollTop=st;
  if(fid){const f=document.getElementById(fid);if(f&&el.contains(f)){f.focus({preventScroll:true});if(sel&&sel[0]!=null){try{f.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
}

/* Ligne d’une classe : quand on isole une classe puis qu’on revient à toutes les classes,
   la ligne de cette classe revient exactement à l’endroit de l’écran où on l’avait cliquée. */
function rowTop(id){const b=document.getElementById('pick-'+id), r=b&&b.closest('.wk-class');return r?r.getBoundingClientRect().top:null;}
function pinRow(pin){const t=rowTop(pin.id);if(t!=null) window.scrollBy({top:t-pin.top,behavior:'instant'});}
/* Comme l’arbre de l’Encyclopédie : les cartes glissent vers leur nouvelle place, la hauteur suit,
   les nouvelles cartes apparaissent en fondu. */
const RM=window.matchMedia?window.matchMedia('(prefers-reduced-motion: reduce)'):null;
const reduceMotion=()=>!!(RM&&RM.matches);
function measureCards(el){
  const cards=new Map();
  el.querySelectorAll('.cc[data-key]').forEach(n=>cards.set(n.dataset.key,n.getBoundingClientRect()));
  const w=el.querySelector('.week');
  return {cards,h:w?w.getBoundingClientRect().height:null};
}
function glide(el,b,keepH){
  const w=el.querySelector('.week');
  if(w&&b.h!=null&&!keepH){
    const h=w.getBoundingClientRect().height;
    if(Math.abs(h-b.h)>2){
      w.style.height=b.h+'px';w.style.overflow='hidden';w.getBoundingClientRect();
      w.style.transition='height 240ms ease-out';w.style.height=h+'px';
      const done=()=>{w.style.height='';w.style.overflow='';w.style.transition='';};
      w.addEventListener('transitionend',done,{once:true});setTimeout(done,340);
    }
  }
  el.querySelectorAll('.cc[data-key]').forEach(n=>{
    const r0=b.cards.get(n.dataset.key);
    if(!r0){n.classList.add('enter');return;}
    const r=n.getBoundingClientRect(), dx=r0.left-r.left, dy=r0.top-r.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1) return;
    n.style.transition='none';n.style.transform=`translate(${dx}px,${dy}px)`;n.getBoundingClientRect();
    n.style.transition='transform 240ms ease-out';n.style.transform='';
    const clear=()=>{n.style.transition='';};
    n.addEventListener('transitionend',clear,{once:true});setTimeout(clear,340);
  });
}

function conflicts(f,selfId){
  const out=[];
  for(const sl of f.creneaux){
    const a=toMin(sl.debut),b=toMin(sl.fin);if(isNaN(a)||isNaN(b))continue;
    for(const c of S.data.cours){
      if(c.id===selfId)continue;
      const sameG=f.groupe&&c.groupe===f.groupe, sameT=f.enseignant&&c.enseignant===f.enseignant;
      if(!sameG&&!sameT)continue;
      for(const s2 of activeSlots(c)){
        if(+s2.jour!==+sl.jour)continue;
        const x=toMin(s2.debut),y=toMin(s2.fin);
        if(a<y&&x<b) out.push(`${DAYS[sl.jour-1]} ${momentIn(a,b)} : ${sameG?`${gName(f.groupe)} a déjà ${c.titre}`:`${tName(f.enseignant)} donne déjà ${c.titre} (${gName(c.groupe)})`}`);
      }
    }
  }
  return [...new Set(out)];
}

async function saveCourse(force){
  const d=S.dr, f=d.draft;if(S.busy)return;
  const err=m=>{d.err=m;renderDrawer();};
  if(!f.titre.trim()) return err('Choisissez ou écrivez le nom du cours.');
  if(!f.groupe) return err('Choisissez la classe qui suit ce cours.');
  if(!f.creneaux.length&&!datedOf(d.id?byId(S.data.cours,d.id):null).length) return err('Ajoutez au moins une période.');
  for(const s of f.creneaux){
    const a=toMin(s.debut),b=toMin(s.fin);
    if(isNaN(a)||isNaN(b)) return err('Chaque période doit avoir une heure de début et une heure de fin.');
    if(b<=a) return err(`La période du ${DAYS[s.jour-1].toLowerCase()} se termine avant de commencer.`);
  }
  if(f.du&&f.au&&f.au<f.du) return err('La date du dernier cours précède celle du premier.');
  if(!force){const w=conflicts(f,d.id);if(w.length){d.warn=w;d.err='';renderDrawer();return;}}
  const prev=d.id?byId(S.data.cours,d.id):null;
  const ended=prev?(prev.creneaux||[]).filter(s=>s.au&&s.au<todayISO()):[];
  const doc={titre:f.titre.trim(),code:f.code.trim().toUpperCase(),couleur:+f.couleur||0,groupe:f.groupe,enseignant:f.enseignant,salle:f.salle.trim(),du:f.du,au:f.au,heures:f.heures===''||f.heures==null?null:Math.max(0,Math.round(+f.heures))||null,
    creneaux:f.creneaux.map(s=>{const o={id:s.id,jour:+s.jour,debut:s.debut,fin:s.fin,salle:String(s.salle||'').trim(),type:s.type||'activite'};if(s.du)o.du=s.du;if(s.au)o.au=s.au;return o;}).concat(ended),
    annulees:prev&&prev.annulees?[...prev.annulees]:[],extras:prev&&prev.extras?JSON.parse(JSON.stringify(prev.extras)):[]};
  const id=d.id||genId('c');
  S.busy=true;d.err='';renderDrawer();
  const ok=await write(()=>col('cours').doc(id).set(doc),d.id?'Cours enregistré':'Cours ajouté');
  S.busy=false;
  if(ok&&S.dr===d) S.dr=null;
  render();
}

/* Déplacer ou échanger des cours */
/* La période la plus utilisée dans l’horaire : proposée par défaut pour un nouveau cours */
function commonPeriod(){
  const n=new Map();
  for(const c of S.data.cours) for(const x of activeSlots(c).concat(datedOf(c))){if(x.debut&&x.fin){const k=x.debut+'-'+x.fin;n.set(k,(n.get(k)||0)+1);}}
  let best='',m=0;for(const [k,v] of n) if(v>m){best=k;m=v;}
  return best;
}
function periodOptions(extra){
  const m=new Map();
  for(const c of S.data.cours) for(const s of activeSlots(c).concat(datedOf(c))){const k=s.debut+'-'+s.fin;if(s.debut&&s.fin&&!m.has(k))m.set(k,toMin(s.debut));}
  if(extra&&!m.has(extra)) m.set(extra,toMin(extra.split('-')[0]));
  return [...m].sort((a,b)=>a[1]-b[1]).map(([k])=>k);
}
function openMove(key,date,toDate,swapKey){
  const s=findSess(date,key);if(!s)return;
  const t=swapKey?findSess(toDate,swapKey):null;
  openDrawer({kind:'move',key,date,toDate:toDate||date,time:`${s.sl.debut}-${s.sl.fin}`,scope:'once',swapKey:t?swapKey:null,err:''});
}
function moveWarnings(s,t,toDate,a,b){
  const w=[];
  if(t){
    for(const [x,y] of [[s,t],[t,s]]){
      for(const o of sessionsOn(y.date)) if(o.key!==s.key&&o.key!==t.key&&!o.cancelled&&o.start<y.end&&y.start<o.end) for(const tt of (x.tch||[]).filter(q=>q&&o.tch.includes(q)))
        w.push(`${tName(tt)} donne déjà ${o.c.titre} (${gName(o.grp)}) le ${WD[parse(y.date).getDay()].toLowerCase()} ${momentIn(o.start,o.end)}.`);
    }
    return w;
  }
  for(const o of sessionsOn(toDate)){
    if(o.key===s.key||o.cancelled||!(o.start<b&&a<o.end)) continue;
    if(o.grp===s.grp) w.push(`${gName(s.grp)} a déjà ${o.c.titre} ${momentIn(o.start,o.end)}. Glissez plutôt sur ce cours pour les échanger.`);
    else for(const tt of (s.tch||[]).filter(q=>q&&o.tch.includes(q))) w.push(`${tName(tt)} donne déjà ${o.c.titre} (${gName(o.grp)}) ${momentIn(o.start,o.end)}.`);
  }
  for(const e of S.data.examens) if(!e.seance&&e.date===toDate&&e.groupe===s.grp&&toMin(e.debut)<b&&a<toMin(e.fin)) w.push(`${gName(s.grp)} a un examen (${e.titre||'examen'}) ${momentIn(toMin(e.debut),toMin(e.fin))}.`);
  return w;
}
function moveDrawer(){
  const d=S.dr, s=findSess(d.date,d.key);
  if(!s) return goneHTML();
  const t=d.swapKey?findSess(d.toDate,d.swapKey):null;
  if(d.swapKey&&!t) return goneHTML();
  const [deb,fin]=d.time.split('-'), a=toMin(deb), b=toMin(fin), src=parse(s.date), to=parse(d.toDate);
  const regular=!s.extra&&(!t||!t.extra), wdS=WD[src.getDay()].toLowerCase(), wdT=WD[to.getDay()].toLowerCase();
  const warn=moveWarnings(s,t,d.toDate,a,b), off=offDay(d.toDate);
  let body, title, eyebrow;
  if(t){
    eyebrow='Échanger deux cours';title=`${esc(s.c.titre)} ⇄ ${esc(t.c.titre)}`;
    body=`<div class="mv-route"><div class="mv-box"><small>${esc(s.c.titre)} passe au</small><b>${esc(dayLabel(parse(t.date)))}</b><span>${momentOf(t)}</span></div><span class="mv-arrow" aria-hidden="true">⇄</span><div class="mv-box"><small>${esc(t.c.titre)} passe au</small><b>${esc(dayLabel(src))}</b><span>${momentOf(s)}</span></div></div>`;
  }else{

    const dayOpts=[0,1,2,3,4].map(i=>{const x=addDays(mon,i),ds=iso(x),o=offDay(ds);return `<option value="${ds}"${ds===d.toDate?' selected':''}${o?' disabled':''}>${esc(dayLabel(x))}${o?' ('+esc(o)+')':''}</option>`;}).join('');
    const timeOpts=periodOptions(d.time).map(k=>{const [x,y]=k.split('-'),p=PERIODES.find(z=>z.debut===x&&z.fin===y);return `<option value="${k}"${k===d.time?' selected':''}>${p?p.label:moment(toMin(x),toMin(y))+' ('+fmtT(x)+' – '+fmtT(y)+')'}</option>`;}).join('');
    body=`<div class="mv-route"><div class="mv-box"><small>De</small><b>${esc(dayLabel(src))}</b><span>${momentOf(s)}</span></div><span class="mv-arrow" aria-hidden="true">→</span><div class="mv-box"><small>Vers</small><b>${esc(dayLabel(to))}</b><span>${moment(a,b)}</span></div></div>
      <div class="grid2"><label class="field"><span>Jour</span><select id="mv-day" data-mv="toDate">${dayOpts}</select></label><label class="field"><span>Période</span><select id="mv-time" data-mv="time">${timeOpts}</select></label></div>`;
  }
  const once=t?`Seulement cette semaine`:`Seulement le ${dn(src)} ${fMonth.format(src)}`;
  const onceSub=t?'Les deux cours changent de place cette semaine. Les autres semaines ne changent pas.':`Le cours du ${wdS} ${dn(src)} est donné le ${wdT} ${dn(to)}. Les autres semaines ne changent pas.`;
  const weeklySub=t?'Les deux périodes sont échangées pour cette semaine et les suivantes. Les semaines passées ne changent pas.':`Le cours du ${wdS} devient un cours du ${wdT} ${momentIn(a,b)}, dès cette semaine. Les semaines passées ne changent pas.`;
  body+=`<div class="choice" role="radiogroup" aria-label="Portée du changement">
    <label class="opt"><input type="radio" name="mv-scope" value="once"${d.scope==='once'?' checked':''}><div><b>${once}</b><span>${onceSub}</span></div></label>
    ${regular?`<label class="opt"><input type="radio" name="mv-scope" value="weekly"${d.scope==='weekly'?' checked':''}><div><b>Chaque semaine, à partir de celle-ci</b><span>${weeklySub}</span></div></label>`:''}</div>`;
  if(presDoc(s.key)||(t&&presDoc(t.key))) body+='<p class="help">Les présences déjà prises restent enregistrées à l’ancien horaire.</p>';
  if(off) body+=`<p class="form-err">Le ${wdT} ${dn(to)} est un congé (${esc(off)}).</p>`;
  else if(warn.length) body+=`<div class="notice warn"><p><b>À vérifier</b></p><ul>${warn.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  if(d.err) body+=`<p class="form-err" role="alert">${esc(d.err)}</p>`;

  return dTop(eyebrow,title,sub)+`<div class="dr-body">${body}</div><div class="dr-foot">${foot}</div>`;
}
const courseDoc=c=>{const o=JSON.parse(JSON.stringify(c));delete o.id;o.annulees=o.annulees||[];o.extras=o.extras||[];o.creneaux=o.creneaux||[];return o;};
function moveSlotWeekly(cr,sid,jour,debut,fin,eff){
  const i=cr.findIndex(s=>s.id===sid);if(i<0)return cr;
  const s=cr[i];
  if(s.du&&s.du>=eff){cr[i]=Object.assign({},s,{jour,debut,fin});return cr;}
  const end=iso(addDays(parse(eff),-1));
  cr[i]=Object.assign({},s,{au:end});
  const n={id:slotId(),jour,debut,fin,salle:s.salle||'',du:eff};if(s.au)n.au=s.au;
  cr.push(n);
  return cr;
}
function moveOnce(doc,s,date,debut,fin){
  if(s.extra){
    const x=doc.extras.find(e=>e.id===s.extra.id);if(!x)return;
    if(x.de){const [od,osid]=x.de.split('@'),orig=doc.creneaux.find(e=>e.id===osid);
      if(orig&&od===date&&orig.debut===debut&&orig.fin===fin){doc.extras=doc.extras.filter(e=>e.id!==x.id);doc.annulees=doc.annulees.filter(t=>t!==x.de);return;}}
    Object.assign(x,{date,debut,fin});return;
  }
  const tag=`${s.date}@${s.sl.id}`;
  if(!doc.annulees.includes(tag)) doc.annulees.push(tag);
  doc.extras.push({id:'x'+Math.random().toString(36).slice(2,8),date,debut,fin,salle:s.sl.salle||'',de:tag});
}
async function applyMove(){
  const d=S.dr;if(!d||S.busy)return;
  const s=findSess(d.date,d.key), t=d.swapKey?findSess(d.toDate,d.swapKey):null;
  if(!s||(d.swapKey&&!t))return;
  const [deb,fin]=d.time.split('-');
  if(!t&&d.toDate===s.date&&deb===s.sl.debut&&fin===s.sl.fin){d.err='Choisissez un autre jour ou une autre heure.';renderDrawer();return;}
  const docs=new Map(), get=c=>{if(!docs.has(c.id))docs.set(c.id,courseDoc(c));return docs.get(c.id);};
  const prev=new Map();
  for(const c of [s.c,t&&t.c].filter(Boolean)) prev.set(c.id,courseDoc(c));
  const weekly=d.scope==='weekly'&&!s.extra&&(!t||!t.extra);
  const jourOf=ds=>(parse(ds).getDay()+6)%7+1, eff=iso(monday(parse(s.date)));
  if(t){
    if(weekly){
      const ds=get(s.c);ds.creneaux=moveSlotWeekly(ds.creneaux,s.sl.id,jourOf(t.date),t.sl.debut,t.sl.fin,eff);
      const dt=get(t.c);dt.creneaux=moveSlotWeekly(dt.creneaux,t.sl.id,jourOf(s.date),s.sl.debut,s.sl.fin,eff);
    }else{
      moveOnce(get(s.c),s,t.date,t.sl.debut,t.sl.fin);
      moveOnce(get(t.c),t,s.date,s.sl.debut,s.sl.fin);
    }
  }else if(weekly){const dc=get(s.c);dc.creneaux=moveSlotWeekly(dc.creneaux,s.sl.id,jourOf(d.toDate),deb,fin,eff);}
  else moveOnce(get(s.c),s,d.toDate,deb,fin);
  S.busy=true;renderDrawer();
  const ok=await write(async()=>{for(const [id,doc] of docs) await col('cours').doc(id).set(doc);});
  S.busy=false;
  if(ok){
    if(S.dr===d) S.dr=null;
    toast(t?'Cours échangés':'Cours déplacé',null,{label:'Annuler',fn:()=>write(async()=>{for(const [id,doc] of prev) await col('cours').doc(id).set(doc);},'Changement annulé')});
  }
  render();
}

function fillExamFromCourse(f,all){

async function saveExam(force){
  const d=S.dr, f=d.draft;if(S.busy)return;
  const err=m=>{d.err=m;renderDrawer();};
  if(d.sess){
    const x=allExamItems().find(k=>k.key===d.sess);if(!x) return err('Cet examen n’existe plus.');
    const res={};
    for(const el of studentsOf(x.grp)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
    S.busy=true;d.err='';renderDrawer();
    const ok=await writeResults(x,res,'Résultats enregistrés');
    S.busy=false;if(ok&&S.dr===d)S.dr=null;render();return;
  }
  if(S.role==='teacher'&&!f.cours) return err('Choisissez le cours visé par l’examen.');
  if(!f.groupe) return err('Choisissez la classe qui passe l’examen.');
  if(!f.date) return err('Indiquez la date de l’examen.');
  const j=parse(f.date).getDay();
  if(j===0||j===6) return err('L’examen tombe une fin de semaine.');
  const off=offDay(f.date);
  if(off) return err(`Le ${dn(parse(f.date))} ${fMonth.format(parse(f.date))} n’est pas un jour de classe (${off}).`);
  const a=toMin(f.debut),b=toMin(f.fin);
  if(isNaN(a)||isNaN(b)) return err('Indiquez l’heure de début et de fin.');
  if(b<=a) return err('L’examen se termine avant de commencer.');
  if(!force){
    const w=S.data.examens.filter(x=>!x.seance&&x.id!==d.id&&x.date===f.date&&x.groupe===f.groupe&&toMin(x.debut)<b&&a<toMin(x.fin)).map(x=>`${gName(f.groupe)} a déjà « ${x.titre||'un examen'} » ${momentIn(toMin(x.debut),toMin(x.fin))}.`);
    if(w.length){d.warn=w;d.err='';renderDrawer();return;}
  }
  const res={};for(const el of studentsOf(f.groupe)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
  const doc={cours:f.cours,groupe:f.groupe,titre:f.titre.trim()||'Examen',date:f.date,debut:f.debut,fin:f.fin,salle:f.salle.trim(),surveillant:f.surveillant,notes:f.notes.trim(),maj:new Date().toISOString()};
  const id=d.id||genId('x');
  S.busy=true;d.err='';renderDrawer();
  const prevX=d.id?byId(S.data.examens,d.id):null;
  if(prevX&&prevX.exemple) doc.exemple=true;
  let ok=await write(()=>col('examens').doc(id).set(doc),d.id?'Examen enregistré':'Examen planifié');
  if(ok&&(Object.keys(res).length||Object.keys(examResOf(examItem(Object.assign({id},prevX||doc)))).length)) ok=await writeResults(examItem(Object.assign({},prevX||{},doc,{id})),res,'');
  S.busy=false;
  if(ok&&S.dr===d) S.dr=null;
  render();
}

function examResultsHTML(f,can){
  const els=f.groupe?studentsOf(f.groupe).slice().sort(byElNum):[];
  if(!els.length) return '';
  const r=f.resultats||{}, cnt={reussi:0,reprise:0,echec:0,absent:0};for(const e of els){const v=r[e.id];if(cnt[v]!=null)cnt[v]++;}
  const none=els.length-cnt.reussi-cnt.reprise-cnt.echec-cnt.absent;
  const sum=`<div class="att-sum">${cnt.reussi?`<span class="chip ok">${pl(cnt.reussi,'réussite','réussites')}</span>`:''}${cnt.reprise?`<span class="chip info">${pl(cnt.reprise,'réussi en reprise','réussis en reprise')}</span>`:''}${cnt.echec?`<span class="chip bad">${pl(cnt.echec,'échec','échecs')}</span>`:''}${cnt.absent?`<span class="chip warn">${pl(cnt.absent,'absent','absents')}</span>`:''}${none?`<span class="chip off">${none} sans résultat</span>`:''}</div>`;
  const btn=(e,v,k,cls,l)=>`<button type="button" class="ab ${cls}" id="xr-${esc(e.id)}-${k}" data-act="x-res" data-el="${esc(e.id)}" data-v="${v}" aria-pressed="${r[e.id]===v}">${l}</button>`;
  const li=e=>{const v=r[e.id];return `<li><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span><span class="nm">${esc(e.nom)}${v==='reprise'?'<small>Réussi en reprise</small>':''}</span>${can?`<span class="att-btns" role="group" aria-label="${esc('Résultat de '+e.nom)}">${btn(e,'reussi','r','ab-P','Réussi')}${btn(e,'echec','e','ab-A','Échec')}${btn(e,'absent','a','ab-R','Absent')}</span>`:v?`<span class="chip ${RES[v][0]}">${RES[v][1]}</span>`:'<span class="chip off">—</span>'}</li>`;};
  return `<fieldset class="xr"><legend>Résultats</legend>${sum}<ul class="att-list">${els.map(li).join('')}</ul>${can&&none?'<div class="row" style="margin-top:10px"><button class="btn sm" type="button" data-act="x-res-all">Marquer les autres réussis</button></div>':''}</fieldset>`;
}

/* ---------- Écriture ---------- */
function toast(msg,kind,action){
  const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.setAttribute('role','status');
  const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.addEventListener('click',()=>{t.remove();action.fn();});t.appendChild(b);}
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),action?9000:4000);
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return 'Modification refusée : votre accès à cette page ne le permet pas.';
  if(c==='quota_exceeded') return 'Stockage plein. Supprimez d’anciennes données, puis réessayez.';
  if(c==='revoked'){S.conn='off';return 'Votre accès a changé. Rechargez la page.';}
  return 'Enregistrement impossible pour le moment. Réessayez.';
}
async function write(fn,okMsg){
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  for(let i=0;i<2;i++){
    try{await fn();if(okMsg)toast(okMsg);return true;}
    catch(e){
      if(e&&e.code==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,400+Math.random()*600));continue;}
      toast(errMsg(e),'bad');return false;
    }
  }
  return false;
}
async function runAll(fns,okMsg){
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  S.busy=true;render();
  const q=[...fns];let fail=0,first=null;
  const worker=async()=>{while(q.length){const f=q.shift();try{await f();}catch(e){fail++;first=first||e;}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.busy=false;
  if(fail) toast(errMsg(first),'bad'); else if(okMsg) toast(okMsg);
  render();
  return !fail;
}

/* ---------- Glisser-déposer (administration), à la souris ----------
   Géré avec les événements du pointeur plutôt qu’avec le glisser-déposer du navigateur : pas d’animation
   de retour qui bloque la page, et la carte est toujours remise en place, même en lâchant très vite. */
let DRAG=null, dropEl=null, pendingMain=false, swallowClick=false;
function clearDrop(){if(dropEl){dropEl.classList.remove('drop-ok','drop-swap');dropEl=null;}}
function dropAt(x,y){
  if(!DRAG) return null;
  const el=document.elementFromPoint(x,y);
  if(!el||!el.closest) return null;
  const cell=el.closest('.wk-cell[data-date]');
  if(!cell||cell.dataset.off||cell.dataset.grp!==DRAG.grp) return null;
  const card=el.closest('.cc[data-key]');
  if(card&&card.dataset.key===DRAG.key) return null;
  if(card&&card.dataset.drag==='1') return {type:'swap',el:card,key:card.dataset.key,date:card.dataset.date};
  return {type:'cell',el:cell,date:cell.dataset.date};
}
function endDrag(apply,x,y){
  const d=DRAG;if(!d)return;
  const t=apply&&d.active?dropAt(x,y):null;
  DRAG=null;
  if(d.ghost) d.ghost.remove();
  document.querySelectorAll('.cc.dragging').forEach(n=>n.classList.remove('dragging'));
  document.body.classList.remove('is-dragging');
  clearDrop();
  if(d.active){swallowClick=true;setTimeout(()=>{swallowClick=false;},0);}
  if(pendingMain){pendingMain=false;renderMain();}
  if(t) openMove(d.key,d.date,t.date,t.type==='swap'?t.key:null);
}
document.addEventListener('pointerdown',e=>{
  if(DRAG) endDrag(false);
  if(e.button!==0||e.pointerType==='touch'||S.dr) return;
  const card=e.target&&e.target.closest&&e.target.closest('.cc[data-drag="1"]');
  if(!card) return;
  DRAG={key:card.dataset.key,date:card.dataset.date,grp:card.dataset.grp,x0:e.clientX,y0:e.clientY,active:false,src:card};
});
window.addEventListener('pointermove',e=>{
  const d=DRAG;if(!d)return;
  if(!d.active){
    if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<6) return;
    if(!d.src.isConnected){DRAG=null;return;}
    d.active=true;
    const r=d.src.getBoundingClientRect();d.dx=d.x0-r.left;d.dy=d.y0-r.top;
    const g=d.src.cloneNode(true);g.removeAttribute('id');g.removeAttribute('data-act');g.classList.add('drag-ghost');g.setAttribute('aria-hidden','true');g.style.width=r.width+'px';
    document.body.appendChild(g);d.ghost=g;
    d.src.classList.add('dragging');document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  d.ghost.style.transform=`translate(${e.clientX-d.dx}px,${e.clientY-d.dy}px) rotate(1.5deg)`;
  if(e.clientY>window.innerHeight-48) window.scrollBy(0,14); else if(e.clientY<48) window.scrollBy(0,-14);
  const t=dropAt(e.clientX,e.clientY);
  if(!t){clearDrop();return;}
  if(dropEl!==t.el){clearDrop();dropEl=t.el;dropEl.classList.add(t.type==='swap'?'drop-swap':'drop-ok');}
});
window.addEventListener('pointerup',e=>{if(DRAG)endDrag(true,e.clientX,e.clientY);});
window.addEventListener('pointercancel',()=>endDrag(false));
window.addEventListener('blur',()=>endDrag(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden)endDrag(false);});
// le clic qui suit un glisser ne doit pas ouvrir le cours
document.addEventListener('click',e=>{if(swallowClick){swallowClick=false;e.preventDefault();e.stopPropagation();}},true);
setInterval(()=>{if(S.conn==='shared')renderMain();},60000);

/* ---------- Données partagées ---------- */
function onErr(e){
  if(e&&(e.code==='revoked'||e.code==='unavailable'||e.code==='not_granted'||e.code==='capability_disabled')){S.conn='off';schedule();}
}
function subWeek(){
  if(!DB)return;
  if(unsubPres){unsubPres();unsubPres=null;}
  S.data.presences={};
  const from=iso(S.week), to=iso(addDays(S.week,6));
  try{
    unsubPres=col('presences').where('date','>=',from).where('date','<=',to).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();S.data.presences=m;schedule();
    },onErr);
  }catch(e){onErr(e);}
}
function ensureTerm(){
  if(!DB)return;
  const k=yearStart()+'|'+todayISO();
  if(S.termKey===k)return;
  if(unsubTerm){unsubTerm();unsubTerm=null;}
  S.termKey=k;S.termLoaded=false;
  try{
    unsubTerm=col('presences').where('date','>=',yearStart()).where('date','<=',todayISO()).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();S.data.presTerm=m;S.termLoaded=true;schedule();
    },e=>{S.termLoaded=true;onErr(e);});
  }catch(e){onErr(e);}
}
function subscribe(){
  DB.doc('config/ecole').onSnapshot(s=>{S.data.config=s.exists?s.data():null;S.loaded.config=true;schedule();},onErr);
  for(const k of ['cours','enseignants','groupes','eleves','examens']){
    col(k).onSnapshot(q=>{S.data[k]=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.loaded[k]=true;schedule();},e=>{S.loaded[k]=true;onErr(e);});
  }
  col('dossiers-personnel').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S.data.dossiers=m;schedule();},()=>{});
  col('resultats').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S.data.resultats=m;schedule();},()=>{});
  for(const k of ['candidatures','remplacements']) col(k).onSnapshot(q=>{S.data[k]=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{});
  col('disponibilites').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S.data.dispos=m;schedule();},()=>{});
  col('profs-absents').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=(d.data().ids||[]);S.data.absProfs=m;schedule();},()=>{});
  col('presences-personnel').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S.data.staffPres=m;schedule();},()=>{});
  if(S.me.id) DB.doc('comptes/'+S.me.id).onSnapshot(x=>{S.myAcct=x.exists?Object.assign({},x.data(),{id:x.id}):null;schedule();},()=>{});
  if(S.canAdmin!==false) col('demandes').onSnapshot(q=>{S.data.demandes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{S.data.demandes=[];});
  if(S.canAdmin!==false) col('comptes').onSnapshot(q=>{S.data.comptes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{S.data.comptes=[];});
  subWeek();
}
async function init(){
  S.day=defaultDay();
  render();
  const C=window.claude;
  if(!C||typeof C.use!=='function'){S.conn='off';render();return;}
  let db=null,user=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);}catch(e){db=null;}
  if(user){
    try{S.canAdmin=await user.canEdit();}catch(e){S.canAdmin=null;}
    try{S.canWrite=await user.can('data.write');}catch(e){S.canWrite=null;}
    USER=user;
    try{const m=await user.me();S.me={id:m.id||null,name:m.name||'',avatarUrl:m.avatarUrl||''};S.isOwner=!!m.isOwner;}catch(e){}
  }
  if(!db){S.conn='off';render();return;}
  DB=db;S.conn='shared';
  subscribe();
  render();
  // Les personnes qui ont la page ouverte : l’administration peut leur créer un compte.
  C.use('room').then(r=>{ROOM=r||null;if(r)r.onPeers(ch=>{S.peers=ch.peers.filter(p=>p.kind==='viewer'&&p.by).map(p=>({by:p.by,isMe:p.isMe,guest:p.guest}));if(S.page==='comptes'||(S.dr&&S.dr.kind==='acct'))schedule();},()=>{});schedule();}).catch(()=>{ROOM=null;});
}
init();
})();
</script>

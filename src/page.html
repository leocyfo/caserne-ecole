<title>PompierNote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">

/*@@STYLES@@*/

<a class="skip" href="#main">Aller au contenu</a>
<div class="app">
  <nav class="sidebar" aria-label="Menu principal">
    <button type="button" class="brand" id="brand" data-act="home" title="Accueil">
      <span class="brand-icon"><img src="site/embleme-blanc.svg" alt="" width="38" height="38"></span>
      <span id="brand-text" class="brand-t"><span class="bn">Pompier<i>Note</i></span><small>v2</small></span>
    </button>
    <div class="ws-label" id="ws-label">Espace administrateur</div>
    <button type="button" class="side-search" id="cmdk-open" data-act="cmdk" title="Rechercher et aller vite (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>Rechercher</span><kbd>Ctrl K</kbd></button>
    <span class="nav-bulle" id="nav-bulle" aria-hidden="true"></span>
    <ul class="nav" id="nav"></ul>
    <button type="button" class="side-toggle" id="side-toggle" data-act="side" aria-expanded="true" title="Réduire le menu"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"/></svg><span>Réduire le menu</span></button>
    <button type="button" class="side-toggle side-out" id="logout-btn" data-act="logout" title="Se déconnecter" hidden><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Se déconnecter</span></button>
    <div class="person" id="person"></div>
  </nav>
  <div class="content">
    <header class="page-heading" id="heading"></header>
    <div class="demo" id="demo"><div class="demo-in">
    <section class="banner" aria-label="État de l’horaire">
      <div id="banner-text"><strong>Connexion…</strong><p>Chargement de l’horaire.</p></div>
      <div class="roles" role="group" aria-label="Profil affiché">
        <button type="button" data-act="role" data-role="admin">Administrateur</button>
        <button type="button" data-act="role" data-role="teacher">Enseignant</button>
        <button type="button" data-act="role" data-role="student">Élève</button>
        <button type="button" data-act="role" data-role="service">Service incendie</button>
      </div>
      <button type="button" class="demo-hide" id="demo-hide" data-act="demo" title="Masquer ce bandeau et l’avis des données d’exemple (pour voir la page comme une fois en service)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10.8 10.8 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.6-.6 5.1-1.5M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>Masquer</button>
    </section>
    <section class="notices" id="notices" aria-label="Avis"></section>
    </div></div>
    <section class="notices" id="annonces" aria-label="Annonces"></section>
    <main id="main" tabindex="-1"></main>
    <footer class="site-foot" id="site-foot"></footer>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dr-title"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>

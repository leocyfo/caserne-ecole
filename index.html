/* Relevé de résultats d’un élève */
function transcriptHTML(e){
  const B=examBoard(x=>x.grp===e.groupe), mine=B.items.filter(x=>x.past&&!x.rep&&x.res[e.id]).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  const ok=mine.filter(x=>resOk(x.res[e.id])).length, ko=mine.filter(x=>resKo(x.res[e.id])).length, kf=mine.filter(x=>resFail(x.res[e.id])).length, rate=ok+ko+kf?Math.round(ok/(ok+ko+kf)*100):null;
  const rows=mine.map(x=>{const dd=parse(x.date);return `<tr><td>${esc(shortDate(dd))} ${dd.getFullYear()}</td><td>${esc(x.c?(x.c.code?x.c.code+' ':'')+x.c.titre:'')}</td><td>${esc((x.e&&x.e.titre)||'Examen')}</td><td>${x.pct[e.id]!=null?esc(noteTxt(x.pct[e.id])):''}</td><td><b>${esc(RES[x.res[e.id]][1])}</b></td></tr>`;}).join('');
  return `<section class="pr-page">${prHead('Relevé de résultats',esc(e.nom)+(e.numero!=null&&e.numero!==''?' · n° '+esc(e.numero):'')+' · '+esc(gName(e.groupe)))}
    ${mine.length?`<table class="pr-t pr-res"><thead><tr><th class="u-w17">Date</th><th>Module</th><th class="u-w20">Examen</th><th class="u-w11">Note</th><th class="u-w21">Résultat</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>Aucun résultat inscrit pour l’instant.</p>'}
    <p class="pr-sum">${pl(mine.length,'examen','examens')} · ${ok} ${ok>1?'réussis':'réussi'}${ko?` · ${ko} à reprendre`:''}${kf?` · ${pl(kf,'échec de module','échecs de module')}`:''}${rate!=null?` · ${rate} % de réussite`:''}</p>
    <div class="pr-sign"><span>Remis le ${esc(longDate(new Date()))}</span><span>Signature : ______________________________</span></div>${prFoot()}</section>`;
}
async function printDoc(title,body,land,file){
  const root=$('#print-root'), css=prCSS(land), t0=document.title;
  let shown=false, done=false;
  const clean=()=>{if(done)return;done=true;window.removeEventListener('afterprint',clean);document.title=t0;document.body.classList.remove('printing');root.innerHTML='';};
  const on=()=>{shown=true;};
  root.innerHTML=`<style>${css}</style><div class="pr-doc">${body}</div>`;
  document.body.classList.add('printing');document.title=title;
  window.addEventListener('beforeprint',on);window.addEventListener('afterprint',clean);
  try{window.print();}catch(e){}
  await new Promise(r=>setTimeout(r,350));
  window.removeEventListener('beforeprint',on);
  if(shown){setTimeout(clean,120000);return true;}
  clean();
  /* la fenêtre d’impression ne s’est pas ouverte : la feuille part en fichier */
  const ok=await saveFile(file+'.html',`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}body{margin:0}</style></head><body><div class="pr-doc">${body}</div></body></html>`);
  if(ok) toast('Ouvrez ce fichier, puis imprimez-le (Ctrl+P).');
  return ok;
}

    ['new','Stock','Un menu à sections remplace le menu de gauche : tableau de bord, inventaire par catégorie (EPI, ARI et air comprimé, matériel, consommables), dotations, mouvements, inspections et réglages. Chaque article a son état (pastille verte, orange ou rouge), son emplacement et son historique.','stock'],
    ['new','Sorties, retours et bris','On sort du matériel pour une manœuvre (séance, instructeur), on le rentre avec un contrôle (nettoyé, intact) ; endommagé, il part en maintenance. On déclare un bris, on remet en service, on retire du service.','stock'],
    ['new','Inspections et épreuves','Les inspections, l’épreuve hydraulique des bouteilles d’ARI et la fin de vie se calculent selon la catégorie (réglable). Ce qui est en retard ou proche est signalé, dans le menu et dans la cloche.','stock'],
    ['new','Dotations','L’équipement remis à chaque élève (ou à la classe), la feuille de dotation à signer, et « Tout reprendre » en fin de cohorte. La fiche de l’élève a un onglet Équipement.','stock'],
    ['new','Consommables','Consommer (jamais plus que le stock), réapprovisionner, ajuster. Sous le seuil, l’alerte paraît ; un réapprovisionnement avec un coût devient une dépense dans la Compta.','stock'],
    ['new','Matériel réservable','Un camion ou un lot d’ARI marqué « réservable » s’ajoute aux locaux et équipements des séances : deux séances qui le veulent au même moment sont en conflit.','stock'],
    ['new','Compta','Un menu à sections : tableau de bord, frais des élèves, factures, paiements reçus, paie des instructeurs, achats et dépenses, budget, rapports et réglages. Montants en dollars, exports CSV pour le comptable.','compta'],
    ['new','Frais des élèves','Des tarifs par classe, payables par échéances. Pour chaque élève : dû, payé, réductions, solde et retard ; paiement, reçu et relevé de compte à imprimer.','compta'],
    ['new','Factures','Numérotées, avec TPS et TVQ au besoin ; brouillon, envoyée, en retard, payée ou annulée ; paiements et impression.','compta'],
    ['new','Paie des instructeurs','Calculée avec les heures réellement données dans le mois, au taux de chaque instructeur (ou selon la théorie ou la pratique). On approuve chaque relevé, puis on le marque payé.','compta'],
    ['new','Budget et rapports','Le prévu par poste comparé au réel, avec une alerte de dépassement ; revenus et dépenses par mois, coût par élève, coût d’une heure d’instruction et coût par module.','compta'],
    ['new','Annonces','Un bandeau en haut des pages : plusieurs annonces, pour tout le monde, les enseignants, les élèves ou des classes précises ; information, importante ou urgente ; programmée, épinglée, avec un bouton et un lien ; modèles et aperçu. Elles paraissent aussi dans la cloche.','params'],
    ['new','Clôturer l’année','Paramètres → Année scolaire : l’année est copiée dans une archive, puis on commence la suivante. Une année archivée se consulte en lecture seule avec tout le site, s’exporte ou se supprime.','params'],
    ['new','Paramètres refaits','Douze sections dans le menu de gauche, sur toute la largeur : école, annonces, année, horaire (heures des moments), résultats et présences, grades des élèves, fonctions du personnel, droits, menu et affichage (couleur, noms des entrées), notifications, impression et données.','params'],
    ['new','Droits et accès','Ce que les enseignants peuvent faire eux-mêmes (postuler, remplacement, présences, résultats, approbation automatique) et ce que chacun voit de lui-même.','params'],
    ['new','Mon profil','L’élève y voit son équipement et son compte ; l’enseignant, ses relevés de paie. Chacun ne lit que ses propres données.',''],
    ['up','Menu regroupé','Calendrier et calendrier scolaire, élèves et personnel, modules et examens sont réunis ; une bulle rouge glisse jusqu’à la page ouverte.','calendar'],
    ['up','En-têtes et affichages','Chaque page a son titre et ses outils sur une ligne (deux au plus) ; les listes s’affichent en Liste, Cartes ou Compact.','eleves'],
    ['up','Élèves','Cartes colorées selon le grade, filtres (grade, notes) et tris (nom de famille, classe, grade, note, présence).','eleves']
  ]},
  {date:'2026-10-30',id:'a0d7946',push:'Calendrier : le titre et la barre de l’horaire sur une seule ligne',items:[

    ['up','Libellés courts','Sur un écran de moins de 1 680 px de large : « 15 en retard » et « Ajouter ». Le texte complet reste dans l’info-bulle. Sous 1 180 px, la barre passe sous le titre.','calendar'],
    ['fix','Cloche','Ouvrir la cloche ne fait plus disparaître la barre de l’horaire.','']
  ]},
  {date:'2026-10-30',id:'19f19d2',push:'Style compact : plus d’information à l’écran',items:[

    ['up','Horaire','La barre de l’horaire tient sur une seule ligne sur un écran d’ordinateur, et les cartes des séances prennent moins de place.','calendar'],
    ['up','Téléphone','Les boutons des présences gardent leur taille pour le doigt, les champs leurs 16 px, et aucun texte ne descend sous 12 px.','']

  {date:'2026-10-30',id:'ebeb412',push:'Stock : équipement prêté, matériel et inspections, consommables, ventes',items:[

    ['new','Équipement prêté aux élèves','Chaque pièce (habit de combat, casque, gants…) a son numéro, sa taille et son état. On la prête à un élève, puis on note son état au retour.','stock'],
    ['new','Matériel et inspections','Pour chaque APRIA, boyau, lance ou échelle : tous les combien de jours l’inspecter. Les inspections à faire et en retard sont signalées ; une inspection non conforme met le matériel hors service.','stock'],
    ['new','Consommables','Entrées et sorties, et un seuil : sous le seuil, l’article passe « À commander ». On ne peut pas sortir plus que ce qui reste.','stock'],
    ['new','Uniformes et ventes','Le prix et la quantité de chaque taille. « Vendre » enregistre l’élève, la taille et le montant ; l’onglet Ventes donne le total du mois.','stock'],
    ['new','Historique de chaque article','La fenêtre d’un article montre tous ses mouvements : prêts, retours, inspections, entrées, sorties, ventes. Ils s’inscrivent aussi dans l’Historique, sous « Stock ».','historique'],
    ['up','Cloche','L’administration y voit les consommables à commander, les inspections en retard et l’équipement à réparer ou hors service.',''],
    ['up','Fiche de l’élève','L’équipement qui lui est prêté et ses achats. L’élève voit son équipement dans « Mon profil ».','eleves']

const NV_TYPES={new:['ok','Nouveau'],up:['info','Amélioration'],fix:['warn','Correction']};
/* Ce qui a été vu : la clé du dernier push ouvert (date + numéro du push, car il y a souvent plusieurs pushes le même jour).
   Une ancienne valeur enregistrée est une date seule : tout ce jour-là compte comme vu. */
const nvKey=i=>NOUVEAUTES[i].date+'#'+String(NOUVEAUTES.length-i).padStart(3,'0');
const nvSeenKey=()=>{const s=S.nvSeen||'';return s&&!s.includes('#')?s+'#999':s;};
const nvLatest=()=>nvKey(0);
const nvUnseen=()=>NOUVEAUTES.reduce((n,v,i)=>n+(nvKey(i)>nvSeenKey()?v.items.length:0),0);
function newsPage(){
  const st=S.pg, f=NV_TYPES[st.nf]?st.nf:'', all=!!st.nall, byDate=st.nv==='date', N=NOUVEAUTES.length;
  if(st.since==null) st.since=nvSeenKey();
  // la pastille du menu disparaît dès qu’on a ouvert la page
  if(S.nvSeen!==nvLatest()){S.nvSeen=nvLatest();savePrefs();schedule();}
  const cnt={new:0,up:0,fix:0};let tot=0;for(const v of NOUVEAUTES)for(const it of v.items){cnt[it[0]]++;tot++;}
  const view=`<div class="seg" role="group" aria-label="Regrouper les changements">${[['','push','Par push'],['date','date','Par date']].map(([k,id,l])=>`<button type="button" id="nv-v-${id}" data-act="pg-set" data-k="nv" data-v="${k}" aria-pressed="${byDate===(k==='date')}">${l}</button>`).join('')}</div>`;
  const seg=`<div class="seg" role="group" aria-label="Filtrer">${[['','Tout',tot],['new','Nouvelles fonctions',cnt.new],['up','Améliorations',cnt.up],['fix','Corrections',cnt.fix]].map(([k,l,n])=>`<button type="button" id="nv-f-${k||'all'}" data-act="pg-set" data-k="nf" data-v="${k}" aria-pressed="${f===k}">${l} · ${n}</button>`).join('')}</div>`;
  const pages=new Set(NAV.admin.map(n=>n[0]));
  const row=([t,titre,texte,page])=>`<article class="nv-row"><span class="chip ${NV_TYPES[t][0]}">${NV_TYPES[t][1]}</span><div class="xm-t"><b>${esc(titre)}</b><small>${esc(texte)}</small></div><div class="xm-end">${page&&pages.has(page)&&page!=='nouveautes'?`<button class="btn sm" type="button" data-act="nav" data-page="${page}">Ouvrir</button>`:''}</div></article>`;
  /* Un bloc par push, ou un bloc par jour (les pushes du même jour réunis) */
  let groups;
  if(byDate){
    const m=new Map();
    NOUVEAUTES.forEach((v,i)=>{const g=m.get(v.date)||{date:v.date,items:[],n:0,fresh:false};g.items=g.items.concat(v.items);g.n++;if(nvKey(i)>st.since)g.fresh=true;m.set(v.date,g);});
    groups=[...m.values()];
  }else groups=NOUVEAUTES.map((v,i)=>({p:v,num:N-i,date:v.date,items:v.items,fresh:nvKey(i)>st.since}));
  /* avec un filtre, on garde seulement les blocs qui ont ce type de changement, puis on en montre les premiers */
  const vis=groups.map(g=>Object.assign({},g,{its:g.items.filter(it=>!f||it[0]===f)})).filter(g=>g.its.length);
  const lim=byDate?2:5, shown=all?vis:vis.slice(0,lim);
  const blocks=shown.map(g=>{
    const items=g.its;
    const d=parse(g.date), day=`${dayLabel(d)} ${d.getFullYear()}`, fresh=g.fresh?'<span class="chip exam">Depuis votre dernière visite</span>':'', n=`<span class="nv-n">${pl(items.length,'changement','changements')}</span>`;
    const link=g.p?(g.p.id?`<a href="${NV_REPO}/commit/${esc(g.p.id)}" target="_blank" rel="noopener" title="Voir ce push sur GitHub">${esc(g.p.id)}</a>`:`<a href="${NV_REPO}/commits/main" target="_blank" rel="noopener" title="Voir les pushes sur GitHub">le plus récent</a>`):'';
    const head=g.p?`<div class="xm-hd nv-hd nv-push"><span class="cl-num sm nv-num" title="Push n° ${g.num}">${g.num}</span><div class="nv-pt"><b>${esc(g.p.push)}</b><small>${esc(day)} · push ${link}</small></div>${fresh}${n}</div>`
      :`<div class="xm-hd nv-hd"><span>${esc(day)}</span>${g.n>1?`<span class="nv-k">${g.n} pushes</span>`:''}${fresh}${n}</div>`;
    return `<section class="cl-list nv-list" id="nv-${g.p?'p'+g.num:g.date}">${head}${items.map(row).join('')}</section>`;
  }).join('');
  const more=!all&&vis.length>lim?`<div class="row u-mt4"><button class="btn" type="button" id="nv-more" data-act="pg-set" data-k="nall" data-v="1">${byDate?'Voir les jours précédents':`Voir les ${vis.length-lim} pushes précédents`}</button></div>`:'';
  return `<div class="toolbar">${view}${seg}</div>`+(blocks||'<section class="panel"><p class="help">Rien de ce type dans les dernières mises à jour.</p></section>')+more;
}

function keyDates(){
  const c=cfg(), out=[];
  if(c.debut) out.push({date:c.debut,label:'Premier jour de classe',chip:['ok','Rentrée']});
  for(const e of c.etapes||[]){if(e.du)out.push({date:e.du,label:'Début : '+(e.nom||'Étape'),chip:['info','Étape']});if(e.au)out.push({date:e.au,label:'Fin : '+(e.nom||'Étape'),chip:['info','Étape']});}
  for(const k of c.conges||[]) if(k.du) out.push({date:k.du,end:k.au&&k.au!==k.du?k.au:'',label:k.nom||'Congé',chip:['warn','Congé']});
  if(c.fin) out.push({date:c.fin,label:'Dernier jour de classe',chip:['ok','Fin']});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

  const et=(c.etapes||[]).map((e,i)=>({e,i})).sort((a,b)=>String(a.e.du).localeCompare(String(b.e.du)));
  const cg=(c.conges||[]).map((k,i)=>({k,i})).sort((a,b)=>String(a.k.du).localeCompare(String(b.k.du)));
  const rng=(a,b)=>b&&b!==a?`${shortDate(parse(a))} au ${shortDate(parse(b))}`:shortDate(parse(a));
  return head+`<div class="two"><section class="panel"><div class="t-head u-mb6"><h2 class="u-m0">Dates importantes</h2><button class="btn sm ghost" type="button" data-act="pg-set" data-k="all" data-v="${all?'':'1'}">${all?'Masquer les dates passées':'Voir toute l’année'}</button></div>${tl}</section>
    <div class="stackp">${(()=>{const mine=x=>S.role==='teacher'?x.tch.includes(S.teacher):S.role==='student'?x.grp===S.group:true, up=allExamItems().filter(x=>x.date>=t&&mine(x)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start), ex=up.filter(x=>!x.rep), rp=up.find(x=>x.rep), d0=ex[0]&&parse(ex[0].date), d1=rp&&parse(rp.date);
      return `<section class="panel" id="yr-exams"><h2>Examens</h2><p class="help u-mb8">${ex.length?`<b>${ex.length}</b> ${ex.length>1?'examens à venir':'examen à venir'}. Prochain : ${esc(dayLabel(d0).toLowerCase())}.`:'Aucun examen à venir.'}${rp?` Prochaine journée de reprise : ${esc(dayLabel(d1).toLowerCase())}.`:''}</p><div class="row"><button class="btn sm" type="button" data-act="nav" data-page="examens">Voir les examens</button></div></section>`;})()}<section class="panel"><h2>Étapes</h2>${et.length?`<ul class="plist">${et.map(({e,i})=>`<li><span><b>${esc(e.nom||'Étape')}</b> <span class="muted">${esc(rng(e.du,e.au))}</span></span>${adm?`<button type="button" class="x" data-act="p-del-etape" data-i="${i}" aria-label="${esc('Retirer '+(e.nom||'cette étape'))}"${dis()}>×</button>`:''}</li>`).join('')}</ul>`:'<p class="help">Aucune étape inscrite.</p>'}

      ${adm?`<form class="inline-add u-mt10" data-form="p-add-conge"><label class="field"><span>Nom</span><input id="p-cnom" maxlength="60" placeholder="Journée pédagogique" autocomplete="off"></label><label class="field u-f0-150"><span>Du</span><input type="date" id="p-cdu"></label><label class="field u-f0-150"><span>Au</span><input type="date" id="p-cau"></label><button class="btn" type="submit"${dis()}>Ajouter</button></form>`:''}</section></div></div>`;

/* Applique les réglages qui changent l’apparence ou les listes : heures des moments, couleur principale, fonctions du personnel */
let cfgInit=false;
function applyConfig(){
  const c=cfg(), m=c.moments, am=PERIODES[0], pm=PERIODES[1], jr=PERIODES[2];
  const ok=t=>/^\d{1,2}:\d{2}$/.test(t||'');
  am.debut=m&&m.am&&ok(m.am.debut)?m.am.debut:'08:00';am.fin=m&&m.am&&ok(m.am.fin)?m.am.fin:'11:00';
  pm.debut=m&&m.pm&&ok(m.pm.debut)?m.pm.debut:'12:00';pm.fin=m&&m.pm&&ok(m.pm.fin)?m.pm.fin:'15:00';
  jr.debut=am.debut;jr.fin=pm.fin;
  const st=document.documentElement.style, col=c.couleur==='perso'&&okHex(c.couleurPerso)?['perso','',c.couleurPerso,darker(c.couleurPerso)]:COULEURS.find(x=>x[0]===(c.couleur||''))||COULEURS[0];
  if(col[0]){st.setProperty('--accent',col[2]);st.setProperty('--accent-hover',col[3]);st.setProperty('--today',col[2]);}
  else{st.removeProperty('--accent');st.removeProperty('--accent-hover');st.removeProperty('--today');}
  const fl=Array.isArray(c.fonctions)&&c.fonctions.length?c.fonctions:FONCTIONS_DEF;
  if(fl.join('|')!==FONCTIONS.join('|')) FONCTIONS.splice(0,FONCTIONS.length,...fl);
  /* à l’ouverture du site : la vue du calendrier et la page d’accueil choisies (si la personne n’a rien choisi elle-même) */
  if(!cfgInit&&S.data.config){cfgInit=true;
    if(c.vueCal==='jour'&&!prefs.view) S.view='jour';
    if(S.role==='admin'&&S.page==='accueil'&&c.ouverture&&c.ouverture!=='accueil'&&navGroup(c.ouverture)) S.page=c.ouverture;}
}

/* Exports de la page Données */
async function exportData(kind){
  const D=S.data, day=todayISO();
  if(kind==='json'){
    const strip=a=>(a||[]).map(x=>Object.assign({},x));
    const out={exporte:new Date().toISOString(),site:'PompierNote',config:D.config,groupes:strip(D.groupes),eleves:strip(D.eleves),enseignants:strip(D.enseignants),dossiersPersonnel:D.dossiers,cours:strip(RAWC),examens:strip(D.examens),resultats:D.resultats,candidatures:strip(D.candidatures),remplacements:strip(D.remplacements),disponibilites:D.dispos,presencesPersonnel:D.staffPres,comptes:strip(D.comptes)};
    return saveFile(`pompiernote-donnees-${day}.json`,new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  }
  if(kind==='eleves') return saveFile(`pompiernote-eleves-${day}.csv`,new Blob([csvText([['Numéro','Nom','Classe','Grade','Courriel','Téléphone','Date de naissance','Contact d’urgence']].concat(sortElsByClass(D.eleves).map(e=>[e.numero,e.nom,gName(e.groupe),e.fonction,e.courriel,e.telephone,e.naissance,e.parent])))],{type:'text/csv'}));
  if(kind==='seances'){
    const c=cfg(), a=c.debut||yearStart(), b=c.fin||iso(addDays(parse(a),365));
    const rows=sessionsBetween(a,b).filter(s=>s.kind==='cours').sort((x,y)=>x.date.localeCompare(y.date)||x.start-y.start||gName(x.grp).localeCompare(gName(y.grp)));
    const hm=v=>pad(Math.floor(v/60))+':'+pad(v%60);
    return saveFile(`pompiernote-horaire-${day}.csv`,new Blob([csvText([['Date','Début','Fin','Moment','Classe','Code','Cours','Enseignants','Annulée']].concat(rows.map(s=>[s.date,hm(s.start),hm(s.end),momentOf(s),gName(s.grp),s.c.code||'',s.c.titre||'',(s.tch||[]).map(tName).join(', '),s.cancelled?'Oui':''])))],{type:'text/csv'}));
  }
  return saveFile(`pompiernote-personnel-${day}.csv`,new Blob([csvText([['Nom','Fonction','Statut','Courriel','Téléphone']].concat(staff().map(p=>[p.nom,p.fonction||'Enseignant',p.statut||'Actif',p.courriel,(D.dossiers[p.id]||{}).telephone])))],{type:'text/csv'}));
}

const AN_NIV=[['info','Information','info'],['warn','Important','warn'],['urgent','Urgent','bad']];

const AN_MODELES=[

  ['evac','Exercice d’évacuation','Exercice d’évacuation','Un exercice d’évacuation aura lieu [jour] à [heure]. Suivez les consignes des instructeurs.','warn'],
  ['examen','Rappel d’examen','Examen à venir','Rappel : examen de [module] le [jour]. Présentez-vous 15 minutes à l’avance avec votre équipement complet.','warn'],
  ['local','Changement de local','Changement de local','La séance de [jour] se donne exceptionnellement à [local].','info'],
  ['tenue','Tenue exigée','Tenue de service','Tenue de service complète exigée [jour], pour [raison].','info'],
  ['conge','Congé','Congé','Aucun cours le [jour] : [raison]. Bon congé !','info']];
/* La liste ; l’ancienne annonce unique (config.annonce) est reprise telle quelle */
function annList(){
  const c=cfg();if(Array.isArray(c.annonces)) return c.annonces;
  const a=c.annonce;return a&&String(a.texte||'').trim()?[{id:'a0',titre:'',texte:a.texte,niv:a.ton==='warn'?'warn':'info',pub:a.pub||'tous',classes:[],actif:a.on===true,fermable:true,ou:'toutes'}]:[];
}
const annState=a=>{const t=todayISO();return !a.actif?'brouillon':a.du&&t<a.du?'prog':a.au&&t>a.au?'fini':'cours';};
const annKey=a=>a.id+'@'+(a.maj||a.cree||'');
const annNiv=a=>AN_NIV.some(x=>x[0]===a.niv)?a.niv:'info';
/* ordre : urgentes, épinglées, importantes, puis les plus récentes */
const annRank=a=>annNiv(a)==='urgent'?0:a.epingle?1:annNiv(a)==='warn'?2:3;
const annSort=(a,b)=>annRank(a)-annRank(b)||String(b.maj||b.cree||'').localeCompare(String(a.maj||a.cree||''));
/* Pour la personne affichée ? (l’administration voit toutes celles en cours) */
function annFor(a,anyPage){
  if(annState(a)!=='cours') return false;
  if(!anyPage&&a.ou==='calendrier'&&S.page!=='calendar') return false;
  if(S.role==='admin') return true;
  const p=a.pub||'tous', cl=a.classes||[];
  if(p==='tous') return true;
  if(p==='teacher') return S.role==='teacher';
  if(p==='student') return S.role==='student';
  if(p==='classes') return S.role==='student'?cl.includes(S.group):S.role==='teacher'&&!!a.profs&&principalClasses(S.teacher).some(g=>cl.includes(g.id));
  return false;
}
function annAud(a){
  const p=a.pub||'tous';if(p!=='classes') return (AN_PUB.find(x=>x[0]===p)||AN_PUB[0])[1];
  const n=(a.classes||[]).map(gName).filter(Boolean);
  return (n.length?'Élèves de '+n.join(', '):'Aucune classe')+(a.profs?', et leur enseignant principal':'');
}
/* Le texte : retours à la ligne gardés, adresses web cliquables */
const annText=t=>esc(t||'').replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)»])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
function annNotice(a,preview){
  const niv=annNiv(a), adm=S.role==='admin', url=a.lien&&a.lien.url;
  const meta=[a.epingle?icon('pin')+'Épinglée':'',adm?esc(annAud(a)):'',a.par?'Par '+esc(a.par):'',a.maj||a.cree?esc(ago(a.maj||a.cree)):'',a.au?'Jusqu’au '+esc(shortDate(parse(a.au))):''].filter(Boolean);
  return `<div class="notice ann ${niv==='urgent'?'bad':niv}"${preview?'':` id="ann-${esc(a.id)}"`} role="${niv==='urgent'&&!preview?'alert':'status'}">
    <span class="ann-ic" aria-hidden="true">${icon('mega')}</span>
    <div class="ann-b">${a.titre?`<b class="ann-t">${niv==='urgent'?'<span class="ann-u">Urgent</span>':''}${esc(a.titre)}</b>`:niv==='urgent'?'<b class="ann-t"><span class="ann-u">Urgent</span></b>':''}<p>${annText(a.texte)||'<span class="muted">Votre message paraîtra ici.</span>'}</p>${meta.length?`<small class="ann-m">${meta.join(' · ')}</small>`:''}</div>
    <div class="ann-a">${url?`<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">${esc(a.lien.texte||'En savoir plus')}${icon('ext')}</a>`:''}${!preview&&adm&&isAdmin()&&S.conn==='shared'?`<button class="btn sm ghost" type="button" data-act="an-edit" data-id="${esc(a.id)}">Modifier</button>`:''}${!preview&&a.fermable!==false&&niv!=='urgent'?`<button class="ann-x" type="button" data-act="an-hide" data-id="${esc(a.id)}" aria-label="Masquer cette annonce" title="Masquer (elle reste dans la cloche)">${icon('x')}</button>`:''}</div></div>`;

/* Sous le bandeau : urgentes et épinglées d’abord ; au-delà de deux, les autres se déplient */
function annoncesHTML(){
  const vu=new Set(S.annVu||[]), vis=annList().filter(a=>annFor(a)&&!vu.has(annKey(a))).sort(annSort);
  if(!vis.length) return '';

/* Dans la cloche : les annonces en cours pour la personne (même masquées) */

}

  const dr=st.adraft&&st.adraft._for===st.aed+'|'+(st.adup||'')?st.adraft:null;

}
/* Ce que contient le formulaire (aperçu et enregistrement) */

async function annWrite(list,msg){
  const c=configDoc();

  const fin=list.filter(a=>annState(a)==='fini').sort((a,b)=>String(a.maj||a.cree||'').localeCompare(String(b.maj||b.cree||'')));
  while(list.length>60&&fin.length){const x=fin.shift();list=list.filter(a=>a!==x);}
  c.annonces=list;delete c.annonce;
  return saveConfig(c,msg);
}
async function annSave(f,actif){
  const a=annFromForm(f);
  if(!a.texte){toast('Écrivez le message de l’annonce.','bad');f.querySelector('#an-texte').focus();return;}
  if(a.pub==='classes'&&!a.classes.length){toast('Choisissez au moins une classe.','bad');return;}
  if(a.du&&a.au&&a.au<a.du){toast('La date de fin précède la date de début.','bad');return;}
  if(a.lien&&!/^https?:\/\/[^\s]+\.[^\s]+$/i.test(a.lien.url)){toast('Le lien du bouton doit être une adresse web complète (https://…).','bad');return;}
  const st=S.pg, now=new Date().toISOString(), id=st.aed==='new'?'an'+Date.now().toString(36):st.aed, old=annList().find(x=>x.id===id)||{};
  Object.assign(a,{id,actif,cree:old.cree||now,maj:now,par:old.par||S.me.name||''});
  const msg=!actif?'Brouillon enregistré':annState(a)==='prog'?`Annonce programmée pour le ${shortDate(parse(a.du))}`:annState(a)==='fini'?'Annonce enregistrée (sa date de fin est passée)':'Annonce publiée';

/* ---------- Clôture de l’année et archives ----------

   les réglages, les modules, les locaux, le personnel et les comptes ; au choix, les classes et leurs élèves.
   Consulter : tout le site s’affiche avec les données de l’archive, en lecture seule (S.conn = 'archive') ; les données en

/* Première étape : vérifier la nouvelle année et demander confirmation */
function askCloseYear(f){

  if(nom===(c.annee||'')){toast('La nouvelle année doit porter un autre nom que l’année en cours.','bad');return;}

async function closeYear(){
  const p=S.pg.close;if(!p||S.busy||S.archive) return;
  S.busy=true;S.pg.close=null;render();
  let sn;try{sn=await yearSnapshot();}catch(e){S.busy=false;render();toast(errMsg(e),'bad');return;}
  const id='a'+Date.now().toString(36), txt=JSON.stringify(sn), parts=[];
  for(let i=0;i<txt.length;i+=ARCH_PART) parts.push(txt.slice(i,i+ARCH_PART));
  const seances=sessionsBetween(sn.debut||yearStart(),sn.fin||todayISO()).filter(s=>s.kind==='cours'&&!s.cancelled).length;
  const meta={nom:sn.nom||'Année sans nom',debut:sn.debut,fin:sn.fin,cloture:new Date().toISOString(),par:S.me.name||'',parts:parts.length,taille:txt.length,garde:p.keep,
    compte:{classes:sn.groupes.length,eleves:sn.eleves.length,seances,examens:sn.examens.length,presences:sn.presences.length}};
  /* 1. l’archive, le résumé en dernier : une archive incomplète n’apparaît jamais dans la liste */
  try{for(let k=0;k<parts.length;k++) await col('archives-parts').doc(id+'-'+k).set({archive:id,part:k,json:parts[k]});await col('archives').doc(id).set(meta);}
  catch(e){S.busy=false;render();toast('L’archive n’a pas pu être enregistrée ; rien n’a été retiré. '+errMsg(e),'bad');return;}
  /* 2. on retire l’année archivée et on ouvre la nouvelle (dates, sans étapes ni congés) */
  const c=configDoc();c.annee=p.nom;c.debut=p.debut;c.fin=p.fin;c.etapes=[];c.conges=[];
  const fns=yearDocs(sn,p.keep).map(([k,d])=>()=>col(k).doc(d).delete());
  /* une facture encore ouverte passe à la nouvelle année, avec ce qui a déjà été payé */
  for(const f of (sn.factures||[]).filter(x=>yearOpenInv(x,sn))) fns.push(()=>col('compta-factures').doc(f.id).update({report:sumC((sn.compta||[]).filter(x=>x.type==='rev'&&x.facture===f.id).map(x=>x.ttc))+(+f.report||0)}));
  fns.push(()=>DB.doc('config/ecole').set(c));
  S.busy=false;
  if(await runAll(fns,`${meta.nom} est archivée ; ${p.nom} commence.`)){S.week=monday(parse(p.debut>todayISO()?todayISO():p.debut));render();}
}
async function loadArchive(id){
  const meta=archList().find(a=>a.id===id);if(!meta) throw {message:'Archive introuvable.'};
  const q=await col('archives-parts').where('archive','==',id).get();
  const ps=q.docs.map(d=>d.data()).sort((a,b)=>a.part-b.part);
  if(ps.length!==meta.parts) throw {message:'Cette archive est incomplète.'};
  return {meta,sn:JSON.parse(ps.map(x=>x.json).join(''))};
}

/* Rôle et fiche proposés pour une demande : la fiche d’élève ou du personnel qui porte le même nom */
function guessAcct(x){
  const s=guessRef('student',x);if(s)return {role:'student',ref:s};
  const t=guessRef('teacher',x);if(t){const p=byId(S.data.enseignants,t);return {role:p&&!isTeacher(p)?'admin':'teacher',ref:t};}
  return {role:'student',ref:''};
}
function guessRef(role,x){
  const same=(a,b)=>collator.compare(String(a||'').trim(),String(b||'').trim())===0;
  if(role==='student'){const e=S.data.eleves.find(e=>same(e.nom,x.nom));return e?e.id:'';}
  const p=S.data.enseignants.find(p=>same(p.nom,x.nom));return p?p.id:'';
}

const titleOf=c=>`${c.code?`<span class="chip ${tone(c)}">${esc(c.code)}</span>`:''}<span>${esc(c.titre)}</span>`;
/* Forme de chaque fenêtre : chaque liste ouvre toujours la même, taillée pour ce qu’elle montre.
   side : panneau à droite, la liste reste visible (fiche à consulter, longue liste à cocher)
   center : fenêtre au centre, pour un formulaire qu’on remplit puis ferme
   sheet : grande feuille presque plein écran, pour un tableau ou beaucoup de cases
   bottom : bande en bas, la semaine reste visible au-dessus
   pop : bulle collée à ce qu’on vient de cliquer, pour quelques renseignements (au centre si ouverte autrement)
   Sur téléphone, side et sheet prennent tout l’écran ; les autres montent du bas. */
const DR_SHAPES={
  info:['pop',360],att:['side',600],course:['side',660],move:['bottom',760],print:['center',480],notifs:['pop',420,'below'],
  addc:['center',600],exam:['center',600],student:['center',660],staff:['side',600],acct:['center',520],
  'fo:grille':['side',720],'fo:sheet':['sheet',980],'fo:grp':['center',620],'fo:view':['side',480],'fo:pre':['center',760],'fo:certs':['side',560],'fo:enpq':['side',520],
  'fo:qrin':['pop',360,'below'],'fo:afauto':['sheet',1100],'fo:serv':['sheet',980],'fo:q':['center',640],'fo:qimp':['center',840],'fo:blanc':['center',840]
};
const drShape=d=>DR_SHAPES[d.kind+':'+d.mode]||DR_SHAPES[d.kind]||['side',520];
/* La bulle se colle au dernier élément cliqué hors de la fenêtre */
let drFrom=null;
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('button,a,[data-act],[data-key],[tabindex]');if(t&&!t.closest('#drawer'))drFrom={el:t,t:Date.now()};},true);
function drPlace(el,d){
  el.style.left=el.style.top=el.style.maxHeight='';
  const [sh,,at]=drShape(d);
  if(sh!=='pop'||!d.at||matchMedia('(max-width:760px)').matches) return;
  const a=d.at, vw=innerWidth, vh=innerHeight, m=12;
  if(at==='below') el.style.maxHeight=(vh-a.b-8-m)+'px';
  const W=el.offsetWidth, H=el.offsetHeight;
  let x,y;
  if(at==='below'){x=a.r-W;y=a.b+8;}
  else{x=a.r+10;if(x+W>vw-m)x=a.l-10-W;if(x<m)x=a.l;y=a.t;}
  el.style.left=Math.max(m,Math.min(x,vw-m-W))+'px';el.style.top=Math.max(m,Math.min(y,vh-m-H))+'px';
}
window.addEventListener('resize',()=>{if(S.dr)drPlace($('#drawer'),S.dr);});
function openDrawer(dr){
  dr.uid=++uidSeq;S.dr=dr;
  if(drShape(dr)[0]==='pop'&&drFrom&&Date.now()-drFrom.t<1500&&drFrom.el.isConnected){const r=drFrom.el.getBoundingClientRect();dr.at={l:r.left,t:r.top,r:r.right,b:r.bottom};}
  if(dr.kind==='att'||dr.kind==='info') loadPres(dr.key,dr.date);
  else if(dr.kind==='course'&&dr.sess) loadPres(dr.sess.key,dr.sess.date);
  renderDrawer();
}
function closeDrawer(force){
  const d=S.dr;if(!d)return;
  for(const o of optAll()) if(o.closeDrawer) o.closeDrawer();
  if(d.kind==='att'&&d.dirty&&!force){d.confirmClose=true;renderDrawer();return;}
  S.dr=null;renderDrawer();
}
function renderDrawer(){
  const el=$('#drawer'), sc=$('#scrim');
  if(!S.dr){
    if(!el.hidden){el.hidden=true;sc.hidden=true;el.innerHTML='';el._h='';el._k=undefined;document.body.classList.remove('lock');}
    return;
  }
  const d=S.dr;
  if(d.kind==='att') syncAtt();
  const od=optAll().find(o=>o.drawers&&o.drawers[d.kind]);
  const html=od?od.drawers[d.kind]():d.kind==='att'?attDrawer():d.kind==='fo'?foDrawer():d.kind==='addc'?addCourseDrawer():d.kind==='course'?courseDrawer():d.kind==='exam'?examDrawer():d.kind==='student'?studentDrawer():d.kind==='staff'?staffDrawer():d.kind==='move'?moveDrawer():d.kind==='acct'?accountDrawer():d.kind==='print'?printDrawer():d.kind==='notifs'?notifDrawer():infoDrawer();
  const fresh=el._k!==d.uid, [shape,w]=drShape(d), sh=shape==='pop'&&!d.at?'center':shape;
  el.className='drawer sh-'+sh;el.style.setProperty('--dw',w+'px');
  sc.classList.toggle('light',sh==='pop'||sh==='bottom');
  setHTML(el,html,d.uid);
  if(fresh) el.scrollTop=0;
  if(el.hidden){el.hidden=false;sc.hidden=false;document.body.classList.add('lock');const c=$('#dr-close');if(c)c.focus({preventScroll:true});}
  drPlace(el,d);
}

/* Présences d’un cours */
function syncAtt(){
  const d=S.dr;if(d.dirty)return;
  const p=presDoc(d.key);
  d.draft={statuts:Object.assign({},(p&&p.statuts)||{}),note:(p&&p.note)||''};
  d.savedAt=p&&p.maj||null;
}
function attDrawer(){
  const d=S.dr, s=findSess(d.date,d.key);
  if(!s) return goneHTML();
  const c=s.c, els=studentsOf(c.groupe), st=d.draft.statuts;
  const cnt={P:0,A:0,R:0,M:0};let marked=0;
  for(const e of els){const v=st[e.id];if(cnt[v]!=null){cnt[v]++;marked++;}}
  const sub=esc(`${dayLabel(parse(s.date))} · ${momentOf(s)} · ${gName(c.groupe)}${s.salle?' · Local '+s.salle:''}`);
  let body=choreNote(s)+foAttWarn(s)+qrAttHTML(s);
  if(!isPast(s)) body+='<p class="help">'+W('Cette séance n’a pas encore commencé.','Ce cours n’a pas encore commencé.')+' Vous pouvez quand même préparer la liste.</p>';
  if(!els.length) body+=`<div class="notice"><p>Aucun élève dans ${esc(gName(c.groupe))}. L’administration les inscrit dans le menu Classes.</p></div>`;
  else{
    const chips=['P','A','R','M'].filter(k=>cnt[k]).map(k=>`<span class="chip ${CHIP[k]}">${cnt[k]} ${LBLS[k][cnt[k]>1?1:0]}</span>`).join('');
    body+=`<div class="row"><div class="att-sum">${chips}${els.length-marked?`<span class="chip off">${pl(els.length-marked,'non marqué','non marqués')}</span>`:''}</div><span class="u-f1"></span><button class="btn sm" type="button" data-act="att-all"${els.length===marked?' disabled':''}>Marquer les autres présents</button></div>
    <ul class="att-list">${els.map(e=>`<li><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span><span class="nm">${esc(e.nom)}${e.fonction?`<span class="role-chip">${esc(e.fonction)}</span>`:''}</span><span class="att-btns" role="group" aria-label="${esc('Présence de '+e.nom)}">${['P','A','R','M'].map(v=>`<button type="button" class="ab ab-${v}" id="ab-${esc(e.id)}-${v}" data-act="att-set" data-el="${esc(e.id)}" data-v="${v}" aria-pressed="${st[e.id]===v}" title="${LBL[v]}"><span class="full">${LBL[v]}</span><span class="abbr">${v}</span></button>`).join('')}</span></li>`).join('')}</ul>`;
  }
  body+=`<label class="field"><span>Remarque pour ${W('cette séance','ce cours')}</span><textarea id="a-note" data-f="note" rows="2" placeholder="Ex. exercice à l’extérieur, matériel manquant…">${esc(d.draft.note)}</textarea></label>`;
  let foot;
  if(d.confirmClose) foot=`<p>Les présences modifiées ne sont pas enregistrées.</p><button class="btn primary" type="button" data-act="att-save-close"${dis()}>Enregistrer et fermer</button><button class="btn danger" type="button" data-act="att-discard">Fermer sans enregistrer</button><button class="btn ghost" type="button" data-act="att-keep">Continuer</button>`;
  else{
    let state='Pas encore enregistrées';
    if(d.dirty) state='Modifications non enregistrées';
    else if(d.savedAt){const t=new Date(d.savedAt);if(!isNaN(t))state=`Enregistrées le ${shortDate(t)} à ${fmtT(t.getHours()*60+t.getMinutes())}`;}
    foot=`<button class="btn primary" type="button" data-act="att-save"${S.busy||!d.dirty?' disabled':''}>Enregistrer les présences</button><span class="state${d.dirty?' dirty':''}">${state}</span>`;
  }
  return dTop('Présences',titleOf(c),sub)+`<div class="dr-body">${body}</div><div class="dr-foot">${foot}</div>`;
}
async function saveAtt(closeAfter){
  const d=S.dr, s=findSess(d.date,d.key);if(!s||S.busy)return;
  const st={};for(const e of studentsOf(s.c.groupe)) if(d.draft.statuts[e.id]) st[e.id]=d.draft.statuts[e.id];
  S.busy=true;renderDrawer();
  const ok=await write(()=>col('presences').doc(d.key).set({cours:s.c.id,creneau:s.sl.id,date:s.date,groupe:s.c.groupe||'',statuts:st,note:String(d.draft.note||'').trim(),maj:new Date().toISOString()}),'Présences enregistrées');
  S.busy=false;
  if(ok){d.dirty=false;d.confirmClose=false;if(closeAfter&&S.dr===d)S.dr=null;}
  render();
}

function openCourse(id,sess,preset){
  const c=id?byId(S.data.cours,id):null;
  const draft=c?{heures:c.heures!=null?String(c.heures):'',titre:c.titre||'',code:c.code||'',couleur:+c.couleur||0,groupe:c.groupe||'',enseignant:c.enseignant||'',salle:c.salle||'',du:c.du||'',au:c.au||'',creneaux:activeSlots(c).map(s=>({type:s.type||'activite',id:s.id,jour:String(s.jour),debut:s.debut||'',fin:s.fin||'',salle:s.salle||'',du:s.du||'',au:s.au||''}))}

  if(preset) Object.assign(draft,preset);
  openDrawer({kind:'course',id:id||null,sess:sess||null,draft,err:'',warn:null,confirmDel:false});

function conflicts(f,selfId){
  const out=[];
  for(const sl of f.creneaux){
    const a=toMin(sl.debut),b=toMin(sl.fin);if(isNaN(a)||isNaN(b))continue;
    for(const c of S.data.cours){
      if(c.id===selfId)continue;
      const sameG=f.groupe&&c.groupe===f.groupe, sameT=f.enseignant&&c.enseignant===f.enseignant;
      if(!sameG&&!sameT)continue;
      for(const s2 of activeSlots(c)){
        if(+s2.jour!==+sl.jour)continue;
        const x=toMin(s2.debut),y=toMin(s2.fin);
        if(a<y&&x<b) out.push(`${DAYS[sl.jour-1]} ${momentIn(a,b)} : ${sameG?`${gName(f.groupe)} a déjà ${c.titre}`:`${tName(f.enseignant)} donne déjà ${c.titre} (${gName(c.groupe)})`}`);
      }
    }
  }
  return [...new Set(out)];
}

async function saveCourse(force){
  const d=S.dr, f=d.draft;if(S.busy)return;

  if(!f.groupe) return err('Choisissez la classe qui suit ce cours.');
  if(!f.creneaux.length&&!datedOf(d.id?byId(S.data.cours,d.id):null).length) return err('Ajoutez au moins une période.');
  for(const s of f.creneaux){
    const a=toMin(s.debut),b=toMin(s.fin);
    if(isNaN(a)||isNaN(b)) return err('Chaque période doit avoir une heure de début et une heure de fin.');
    if(b<=a) return err(`La période du ${DAYS[s.jour-1].toLowerCase()} se termine avant de commencer.`);
  }

  const doc={titre:f.titre.trim(),code:f.code.trim().toUpperCase(),couleur:+f.couleur||0,groupe:f.groupe,enseignant:f.enseignant,salle:f.salle.trim(),du:f.du,au:f.au,heures:f.heures===''||f.heures==null?null:Math.max(0,Math.round(+f.heures))||null,
    creneaux:f.creneaux.map(s=>{const o={id:s.id,jour:+s.jour,debut:s.debut,fin:s.fin,salle:String(s.salle||'').trim(),type:s.type||'activite'};if(s.du)o.du=s.du;if(s.au)o.au=s.au;return o;}).concat(ended),
    annulees:prev&&prev.annulees?[...prev.annulees]:[],extras:prev&&prev.extras?JSON.parse(JSON.stringify(prev.extras)):[]};
  const id=d.id||genId('c');
  S.busy=true;d.err='';renderDrawer();
  const ok=await write(()=>putCours(id,doc),d.id?W('Enregistré','Cours enregistré'):'Cours ajouté');
  S.busy=false;
  if(ok&&S.dr===d) S.dr=null;
  render();

function commonPeriod(){

}
function periodOptions(extra){

const courseDoc=c=>{const o=JSON.parse(JSON.stringify(c));delete o.id;delete o.ens0;delete o.seances;o.annulees=o.annulees||[];o.extras=o.extras||[];o.creneaux=o.creneaux||[];return o;};

let RAWC=[];
function normCours(raw){
  const ch=new Map(comps().filter(k=>k.charge).map(k=>[+k.code,k.charge]));
  return raw.map(r=>{
    const c=Object.assign({},r), m=new Map();
    for(const x of r.extras||[]) if(x&&x.id) m.set(x.id,x);
    for(const [id,v] of Object.entries(r.seances||{})){
      if(!v){m.delete(id);continue;}
      const o=Object.assign({},m.get(id),v,{id});
      for(const k of Object.keys(o)) if(o[k]===null) delete o[k];
      m.set(id,o);
    }
    c.extras=[...m.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.debut).localeCompare(String(b.debut)));
    delete c.seances;
    /* Le chargé de cours du module donne ses séances à toutes les classes */
    const t=ch.get(modKey(r));
    if(t){c.ens0=r.enseignant||'';c.enseignant=t;}
    return c;

function putCours(id,doc){

  for(const xid of a.keys()) if(!b.has(xid)) sx[xid]=null;

    toast(t?W('Séances échangées','Cours échangés'):W('Séance déplacée','Cours déplacé'),null,{label:'Annuler',fn:async()=>{if(await write(async()=>{for(const [id,doc] of prev) await putCours(id,doc);},'Changement annulé'))logEv('horaire','a annulé son changement',what);}});
  }
  render();
}

async function saveExam(force){
  const d=S.dr, f=d.draft;if(S.busy)return;
  const err=m=>{d.err=m;renderDrawer();};
  if(d.sess){
    const x=allExamItems().find(k=>k.key===d.sess);if(!x) return err('Cet examen n’existe plus.');
    const res={};
    for(const el of studentsOf(x.grp)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
    S.busy=true;d.err='';renderDrawer();
    const ok=await writeResults(x,res,'Résultats enregistrés',f.pct||{});
    S.busy=false;if(ok&&S.dr===d)S.dr=null;render();return;
  }
  if(S.role==='teacher'&&!f.cours) return err('Choisissez le cours visé par l’examen.');
  if(!f.groupe) return err('Choisissez la classe qui passe l’examen.');
  if(!f.date) return err('Indiquez la date de l’examen.');
  const j=parse(f.date).getDay();
  if(j===0||j===6) return err('L’examen tombe une fin de semaine.');
  const off=offDay(f.date);
  if(off) return err(`Le ${dn(parse(f.date))} ${fMonth.format(parse(f.date))} n’est pas un jour de classe (${off}).`);
  const a=toMin(f.debut),b=toMin(f.fin);
  if(isNaN(a)||isNaN(b)) return err('Indiquez l’heure de début et de fin.');
  if(b<=a) return err('L’examen se termine avant de commencer.');
  if(!force){
    const w=S.data.examens.filter(x=>!x.seance&&x.id!==d.id&&x.date===f.date&&x.groupe===f.groupe&&toMin(x.debut)<b&&a<toMin(x.fin)).map(x=>`${gName(f.groupe)} a déjà « ${x.titre||'un examen'} » ${momentIn(toMin(x.debut),toMin(x.fin))}.`);
    if(w.length){d.warn=w;d.err='';renderDrawer();return;}
  }
  const res={};for(const el of studentsOf(f.groupe)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
  const doc={cours:f.cours,groupe:f.groupe,titre:f.titre.trim()||'Examen',date:f.date,debut:f.debut,fin:f.fin,salle:f.salle.trim(),surveillant:f.surveillant,notes:f.notes.trim(),maj:new Date().toISOString()};
  const id=d.id||genId('x');
  S.busy=true;d.err='';renderDrawer();
  const prevX=d.id?byId(S.data.examens,d.id):null;
  if(prevX&&prevX.exemple) doc.exemple=true;
  let ok=await write(()=>col('examens').doc(id).set(doc),d.id?'Examen enregistré':'Examen planifié');
  if(ok&&(Object.keys(res).length||Object.keys(examResOf(examItem(Object.assign({id},prevX||doc)))).length)) ok=await writeResults(examItem(Object.assign({},prevX||{},doc,{id})),res,'',f.pct||{});
  S.busy=false;
  if(ok&&S.dr===d) S.dr=null;
  render();
}

function examResultsHTML(f,can){

  const btn=(e,v,k,cls,l)=>`<button type="button" class="ab ${cls}" id="xr-${esc(e.id)}-${k}" data-act="x-res" data-el="${esc(e.id)}" data-v="${v}" aria-pressed="${r[e.id]===v}">${l}</button>`;
  const li=e=>{const v=r[e.id];return `<li><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span><span class="nm">${esc(e.nom)}${v==='reprise'?'<small>Réussi en reprise</small>':v==='echecf'?'<small>Échec du module</small>':''}</span>${can?`<input class="xr-n" type="number" id="xn-${esc(e.id)}" data-xn="${esc(e.id)}" data-f="pct" min="0" max="100" step="1" inputmode="numeric" placeholder="%" aria-label="${esc('Note de '+e.nom+' en %')}" value="${p[e.id]!=null?esc(p[e.id]):''}"><span class="att-btns" role="group" aria-label="${esc('Résultat de '+e.nom)}">${btn(e,'reussi','r','ab-P','Réussi')}${btn(e,'echec','e','ab-A','Échec')}${btn(e,'absent','a','ab-R','Absent')}</span>`:v?`<span class="chip ${RES[v][0]}">${RES[v][1]}${p[e.id]!=null?' · '+esc(noteTxt(p[e.id])):''}</span>`:'<span class="chip off">—</span>'}</li>`;};
  return `<fieldset class="xr"><legend>Résultats</legend>${sum}<ul class="att-list">${els.map(li).join('')}</ul>${can?`<p class="help u-mt8">La note en % est facultative. Elle inscrit le résultat : réussi à partir de ${seuil()} %.</p>`:''}${can&&none?'<div class="row u-mt10"><button class="btn sm" type="button" data-act="x-res-all">Marquer les autres réussis</button></div>':''}</fieldset>`;
}

const csvText=lines=>String.fromCharCode(0xFEFF)+lines.map(l=>l.map(v=>{const s=String(v==null?'':v);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\r\n')+'\r\n';
/* Remet un fichier à la personne : par la fenêtre de claude.ai quand la page y est ouverte, sinon par le navigateur */
async function saveFile(name,data){
  try{
    const C=window.claude, dl=C&&typeof C.use==='function'?await C.use('downloads'):null;
    if(dl){await dl.save({filename:name,data});toast('Fichier enregistré : '+name);return true;}
  }catch(e){
    const c=e&&e.code;
    if(c==='declined'||c==='rate_limited') return false;
    if(c&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){toast('Le fichier n’a pas pu être préparé.','bad');return false;}
  }
  try{
    const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data])), a=document.createElement('a');
    a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
    toast('Fichier téléchargé : '+name);return true;
  }catch(e){toast('Téléchargement impossible dans cette fenêtre.','bad');return false;}
}
function toast(msg,kind,action){
  const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.setAttribute('role','status');
  const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.addEventListener('click',()=>{t.remove();action.fn();});t.appendChild(b);}
  $('#toasts').appendChild(t);
  /* le message reste tant que la souris ou le clavier est dessus : on a le temps de le lire (WCAG 2.2.1) */
  const bye=()=>{if(!t.isConnected)return;if(t.matches(':hover,:focus-within'))setTimeout(bye,1500);else t.remove();};setTimeout(bye,action?9000:5000);
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return 'Modification refusée : votre accès à cette page ne le permet pas.';
  if(c==='quota_exceeded') return 'Stockage plein. Supprimez d’anciennes données, puis réessayez.';
  if(c==='revoked'){S.conn='off';return 'Votre accès a changé. Rechargez la page.';}
  return 'Enregistrement impossible pour le moment. Réessayez.';
}
/* Sans réseau, la base garde l’écriture sur l’appareil, mais sa promesse n’aboutit qu’au retour du réseau : on n’attend pas */
function offlineRun(fns,okMsg){
  for(const fn of fns){try{const p=fn();if(p&&p.catch)p.catch(e=>toast(errMsg(e),'bad'));}catch(e){toast(errMsg(e),'bad');return false;}}
  toast((okMsg?okMsg+' · ':'')+'gardé sur cet appareil, envoyé au retour du réseau');return true;
}
async function write(fn,okMsg){
  if(S.archive){toast('Archive en lecture seule : revenez à l’année en cours pour modifier.','bad');return false;}
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  if(S.offline) return offlineRun([fn],okMsg);
  for(let i=0;i<2;i++){
    try{await fn();if(okMsg)toast(okMsg);return true;}
    catch(e){
      if(e&&e.code==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,400+Math.random()*600));continue;}
      toast(errMsg(e),'bad');return false;
    }
  }
  return false;
}
async function runAll(fns,okMsg){
  if(S.archive){toast('Archive en lecture seule : revenez à l’année en cours pour modifier.','bad');return false;}
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  if(S.offline){const ok=offlineRun(fns,okMsg);render();return ok;}
  S.busy=true;render();
  const q=[...fns];let fail=0,first=null;
  const worker=async()=>{while(q.length){const f=q.shift();try{await f();}catch(e){fail++;first=first||e;}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.busy=false;
  if(fail) toast(errMsg(first),'bad'); else if(okMsg) toast(okMsg);
  render();
  return !fail;
}

/* ---------- Glisser-déposer (administration), à la souris ----------
   Géré avec les événements du pointeur plutôt qu’avec le glisser-déposer du navigateur : pas d’animation
   de retour qui bloque la page, et la carte est toujours remise en place, même en lâchant très vite. */
let DRAG=null, dropEl=null, pendingMain=false, swallowClick=false;
function clearDrop(){if(dropEl){dropEl.classList.remove('drop-ok','drop-swap');dropEl=null;}}
function dropAt(x,y){
  if(!DRAG) return null;
  const el=document.elementFromPoint(x,y);
  if(!el||!el.closest) return null;
  const cell=el.closest('.wk-cell[data-date]');
  if(!cell||cell.dataset.off||cell.dataset.grp!==DRAG.grp) return null;
  const card=el.closest('.cc[data-key]');
  if(card&&card.dataset.key===DRAG.key) return null;
  if(card&&card.dataset.drag==='1') return {type:'swap',el:card,key:card.dataset.key,date:card.dataset.date};
  return {type:'cell',el:cell,date:cell.dataset.date};
}
function endDrag(apply,x,y){
  const d=DRAG;if(!d)return;
  const t=apply&&d.active?dropAt(x,y):null;
  DRAG=null;
  if(d.ghost) d.ghost.remove();
  document.querySelectorAll('.cc.dragging').forEach(n=>n.classList.remove('dragging'));
  document.body.classList.remove('is-dragging');
  clearDrop();
  if(d.active){swallowClick=true;setTimeout(()=>{swallowClick=false;},0);}
  if(pendingMain){pendingMain=false;renderMain();}
  if(t) openMove(d.key,d.date,t.date,t.type==='swap'?t.key:null);
}
document.addEventListener('pointerdown',e=>{
  if(DRAG) endDrag(false);
  if(e.button!==0||e.pointerType==='touch'||S.dr) return;
  const card=e.target&&e.target.closest&&e.target.closest('.cc[data-drag="1"]');
  if(!card) return;
  DRAG={key:card.dataset.key,date:card.dataset.date,grp:card.dataset.grp,x0:e.clientX,y0:e.clientY,active:false,src:card};
});
window.addEventListener('pointermove',e=>{
  const d=DRAG;if(!d)return;
  if(!d.active){
    if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<6) return;
    if(!d.src.isConnected){DRAG=null;return;}
    d.active=true;
    const r=d.src.getBoundingClientRect();d.dx=d.x0-r.left;d.dy=d.y0-r.top;
    const g=d.src.cloneNode(true);g.removeAttribute('id');g.removeAttribute('data-act');g.classList.add('drag-ghost');g.setAttribute('aria-hidden','true');g.style.width=r.width+'px';
    document.body.appendChild(g);d.ghost=g;
    d.src.classList.add('dragging');document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  d.ghost.style.transform=`translate(${e.clientX-d.dx}px,${e.clientY-d.dy}px) rotate(1.5deg)`;
  if(e.clientY>window.innerHeight-48) window.scrollBy(0,14); else if(e.clientY<48) window.scrollBy(0,-14);
  const t=dropAt(e.clientX,e.clientY);
  if(!t){clearDrop();return;}
  if(dropEl!==t.el){clearDrop();dropEl=t.el;dropEl.classList.add(t.type==='swap'?'drop-swap':'drop-ok');}
});
window.addEventListener('pointerup',e=>{if(DRAG)endDrag(true,e.clientX,e.clientY);});
window.addEventListener('pointercancel',()=>endDrag(false));
window.addEventListener('blur',()=>endDrag(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden)endDrag(false);});
// le clic qui suit un glisser ne doit pas ouvrir le cours
document.addEventListener('click',e=>{if(swallowClick){swallowClick=false;e.preventDefault();e.stopPropagation();}},true);

/* ---------- Données partagées ---------- */
function onErr(e){
  if(e&&(e.code==='revoked'||e.code==='unavailable'||e.code==='not_granted'||e.code==='capability_disabled')){S.conn='off';schedule();}
}
function subWeek(){
  if(!DB||S.archive)return;
  if(unsubPres){unsubPres();unsubPres=null;}
  S.data.presences={};
  const from=iso(S.week), to=iso(addDays(S.week,6));
  try{
    unsubPres=col('presences').where('date','>=',from).where('date','<=',to).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().presences=m;schedule();
    },onErr);
  }catch(e){onErr(e);}
}
/* Présences passées : on ne charge que la période que la page affiche (le mois en cours par défaut), et on l’élargit
   quand une page en demande plus (« Depuis la rentrée », la fiche d’un élève). Une fois élargie, elle le reste. */
function ensureTerm(from){
  if(!DB||S.archive)return;
  const t=todayISO(), now=new Date(), want=from||iso(new Date(now.getFullYear(),now.getMonth(),1)), f=S.termFrom&&S.termFrom<=want?S.termFrom:want, k=f+'|'+t;
  if(S.termKey===k)return;
  if(unsubTerm){unsubTerm();unsubTerm=null;}
  S.termKey=k;S.termFrom=f;S.termLoaded=false;
  try{
    unsubTerm=col('presences').where('date','>=',f).where('date','<=',t).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();const D=LIVE();D.presTerm=Object.assign({},D.presOne,m);if(!S.archive)S.termLoaded=true;schedule();
    },e=>{S.termLoaded=true;onErr(e);});
  }catch(e){onErr(e);}
}
/* Les présences d’une séance hors de la période chargée (ouverte depuis l’historique ou les examens) se lisent à la demande,
   pour ne jamais ouvrir une feuille vide par-dessus des présences déjà prises. */
const _pw=new Set();
function loadPres(key,date){
  if(!DB||S.archive||!key||!date||S.role==='student'||presDoc(key)||_pw.has(key)) return;
  if(date>todayISO()||(date>=iso(S.week)&&date<=iso(addDays(S.week,6)))||(S.termLoaded&&S.termFrom&&date>=S.termFrom)) return;
  _pw.add(key);
  col('presences').doc(key).get().then(s=>{
    if(!s.exists) return;
    const D=LIVE();D.presOne[key]=s.data();
    if(!D.presTerm[key]) D.presTerm=Object.assign({},D.presTerm,{[key]:s.data()});
    schedule();
  }).catch(()=>{_pw.delete(key);});
}

  DB.doc('config/ecole').onSnapshot(s=>{LIVE().config=s.exists?s.data():null;S.loaded.config=true;if(!S.archive)S.data.cours=normCours(RAWC);schedule();},onErr);
  for(const k of ['cours','enseignants','groupes','eleves','examens']){
    col(k).onSnapshot(q=>{const a=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(k==='cours'){if(S.archive)S.liveRawc=a;else{RAWC=a;S.data.cours=normCours(a);}}else LIVE()[k]=a;S.loaded[k]=true;schedule();},e=>{S.loaded[k]=true;onErr(e);});
  }

  col('resultats').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().resultats=m;schedule();},()=>{});
  for(const k of ['candidatures','remplacements']) col(k).onSnapshot(q=>{LIVE()[k]=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{});
  col('disponibilites').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().dispos=m;schedule();},()=>{});
  col('profs-absents').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=(d.data().ids||[]);LIVE().absProfs=m;schedule();},()=>{});
  col('presences-personnel').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().staffPres=m;schedule();},()=>{});
  if(S.me.id) DB.doc('comptes/'+S.me.id).onSnapshot(x=>{S.myAcct=x.exists?Object.assign({},x.data(),{id:x.id}):null;schedule();},()=>{});
  if(S.canAdmin!==false) col('demandes').onSnapshot(q=>{LIVE().demandes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{LIVE().demandes=[];});
  if(S.canAdmin!==false) col('comptes').onSnapshot(q=>{LIVE().comptes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{LIVE().comptes=[];});
  for(const o of optAll()) if(o.listen) o.listen();
  /* années clôturées (administration seulement) */
  if(S.canAdmin!==false) col('archives').onSnapshot(q=>{LIVE().archives=q.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((x,y)=>String(y.cloture||'').localeCompare(String(x.cloture||'')));schedule();},()=>{LIVE().archives=[];});
  foSubscribe();
  subWeek();
}

/* ---------- Téléphone : coquille mobile ----------
   Sur un écran étroit (jusqu’à 760 px, comme les styles de téléphone), le menu de gauche cède la place à :
   - des onglets en bas (4 pages selon le rôle + « Plus ») ;
   - « Plus » : une feuille qui monte du bas avec tout le menu, le profil, la recherche et la déconnexion ;
   - les sections des pages à sous-menu (Paramètres, Stock, Compta, Formation) en pastilles sous le titre.
   Le menu de gauche reste rendu (caché) : c’est lui que le site met à jour, on le relit ici. Styles : 20-mobile.css.
   Sur un grand écran, rien ne change. */
const M={more:false,close:false,mq:matchMedia('(max-width:760px)')};
const mOn=()=>M.mq.matches;

const M_IC={
  more:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>'
};
const mIcon=k=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${M_IC[k]||IC[k]||''}</svg>`;
const mShort=(k,l)=>k==='formation'?(S.role==='teacher'?'Évaluations':'Formation'):M_SHORT[k]||navLbl(k,l);

  return o?`<label class="m-apercu"><span>Aperçu</span><select id="m-sel-eleve" aria-label="Élève affiché (aperçu)">${o}</select></label>`:'';
};}
document.addEventListener('change',e=>{
  if(e.target.id!=='m-sel-eleve') return;
  S.student=e.target.value;const el=byId(S.data.eleves,e.target.value);if(el)S.group=el.groupe;savePrefs();render();
});
/* Horaire de l’élève sur téléphone : pas de bloc « Prochains examens » (ils sont dans l’onglet Examens) */
{const _sm=studentMain;studentMain=function(){const h=_sm();return mOn()?h.replace(/<section class="panel"><h2>Prochains examens<\/h2>[\s\S]*?<\/section>/,''):h;};}
/* Le site redessine son menu dans renderSide ; on redessine les onglets juste après */
{const _side=renderSide;renderSide=function(){_side();try{mRender();}catch(e){console.error(e);}};}
/* Un choix dans « Plus » (ou un toucher à côté) ferme la feuille. On le note avant que le site redessine
   la page (le bouton touché n’est alors plus dans la feuille), puis on ferme après son traitement. */
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-act]');
  M.close=M.more&&(e.target.id==='mmore'||!!(b&&b.closest('#mmore')&&b.dataset.act!=='m-more'));
},true);
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-act]');
  if(b&&b.dataset.act==='m-more'){M.more=!M.more;mRender();return;}
  if(M.close){M.close=false;M.more=false;mRender();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M.more){M.more=false;mRender();const t=$('#m-more');if(t)t.focus();}});
/* on passe de l’ordinateur au téléphone (fenêtre rétrécie, tablette tournée) : tout est redessiné */
if(M.mq.addEventListener) M.mq.addEventListener('change',()=>render());else if(M.mq.addListener) M.mq.addListener(()=>render());
try{mRender();}catch(e){}
</script>

</body>

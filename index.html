const courseDoc=c=>{const o=JSON.parse(JSON.stringify(c));delete o.id;o.annulees=o.annulees||[];o.extras=o.extras||[];o.creneaux=o.creneaux||[];return o;};
function moveSlotWeekly(cr,sid,jour,debut,fin,eff){
  const i=cr.findIndex(s=>s.id===sid);if(i<0)return cr;
  const s=cr[i];
  if(s.du&&s.du>=eff){cr[i]=Object.assign({},s,{jour,debut,fin});return cr;}
  const end=iso(addDays(parse(eff),-1));
  cr[i]=Object.assign({},s,{au:end});
  const n={id:slotId(),jour,debut,fin,salle:s.salle||'',du:eff};if(s.au)n.au=s.au;
  cr.push(n);
  return cr;
}
function moveOnce(doc,s,date,debut,fin){
  if(s.extra){
    const x=doc.extras.find(e=>e.id===s.extra.id);if(!x)return;
    if(x.de){const [od,osid]=x.de.split('@'),orig=doc.creneaux.find(e=>e.id===osid);
      if(orig&&od===date&&orig.debut===debut&&orig.fin===fin){doc.extras=doc.extras.filter(e=>e.id!==x.id);doc.annulees=doc.annulees.filter(t=>t!==x.de);return;}}
    Object.assign(x,{date,debut,fin});return;
  }
  const tag=`${s.date}@${s.sl.id}`;
  if(!doc.annulees.includes(tag)) doc.annulees.push(tag);
  doc.extras.push({id:'x'+Math.random().toString(36).slice(2,8),date,debut,fin,salle:s.sl.salle||'',de:tag});
}
async function applyMove(){
  const d=S.dr;if(!d||S.busy)return;
  const s=findSess(d.date,d.key), t=d.swapKey?findSess(d.toDate,d.swapKey):null;
  if(!s||(d.swapKey&&!t))return;
  const [deb,fin]=d.time.split('-');
  if(!t&&d.toDate===s.date&&deb===s.sl.debut&&fin===s.sl.fin){d.err='Choisissez un autre jour ou une autre heure.';renderDrawer();return;}
  const docs=new Map(), get=c=>{if(!docs.has(c.id))docs.set(c.id,courseDoc(c));return docs.get(c.id);};
  const prev=new Map();
  for(const c of [s.c,t&&t.c].filter(Boolean)) prev.set(c.id,courseDoc(c));
  const weekly=d.scope==='weekly'&&!s.extra&&(!t||!t.extra);
  const jourOf=ds=>(parse(ds).getDay()+6)%7+1, eff=iso(monday(parse(s.date)));
  if(t){
    if(weekly){
      const ds=get(s.c);ds.creneaux=moveSlotWeekly(ds.creneaux,s.sl.id,jourOf(t.date),t.sl.debut,t.sl.fin,eff);
      const dt=get(t.c);dt.creneaux=moveSlotWeekly(dt.creneaux,t.sl.id,jourOf(s.date),s.sl.debut,s.sl.fin,eff);
    }else{
      moveOnce(get(s.c),s,t.date,t.sl.debut,t.sl.fin);
      moveOnce(get(t.c),t,s.date,s.sl.debut,s.sl.fin);
    }
  }else if(weekly){const dc=get(s.c);dc.creneaux=moveSlotWeekly(dc.creneaux,s.sl.id,jourOf(d.toDate),deb,fin,eff);}
  else moveOnce(get(s.c),s,d.toDate,deb,fin);
  S.busy=true;renderDrawer();
  const ok=await write(async()=>{for(const [id,doc] of docs) await col('cours').doc(id).set(doc);});
  S.busy=false;
  if(ok){
    if(S.dr===d) S.dr=null;
    toast(t?'Cours échangés':'Cours déplacé',null,{label:'Annuler',fn:()=>write(async()=>{for(const [id,doc] of prev) await col('cours').doc(id).set(doc);},'Changement annulé')});
  }
  render();
}

async function saveExam(force){
  const d=S.dr, f=d.draft;if(S.busy)return;
  const err=m=>{d.err=m;renderDrawer();};
  if(S.role==='teacher'&&!f.cours) return err('Choisissez le cours visé par l’examen.');
  if(!f.groupe) return err('Choisissez la classe qui passe l’examen.');
  if(!f.date) return err('Indiquez la date de l’examen.');
  const j=parse(f.date).getDay();
  if(j===0||j===6) return err('L’examen tombe une fin de semaine.');
  const off=offDay(f.date);
  if(off) return err(`Le ${dn(parse(f.date))} ${fMonth.format(parse(f.date))} n’est pas un jour de classe (${off}).`);
  const a=toMin(f.debut),b=toMin(f.fin);
  if(isNaN(a)||isNaN(b)) return err('Indiquez l’heure de début et de fin.');
  if(b<=a) return err('L’examen se termine avant de commencer.');
  if(!force){
    const w=S.data.examens.filter(x=>x.id!==d.id&&x.date===f.date&&x.groupe===f.groupe&&toMin(x.debut)<b&&a<toMin(x.fin)).map(x=>`${gName(f.groupe)} a déjà « ${x.titre||'un examen'} » ${momentIn(toMin(x.debut),toMin(x.fin))}.`);
    if(w.length){d.warn=w;d.err='';renderDrawer();return;}
  }
  const res={};for(const el of studentsOf(f.groupe)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
  const doc={resultats:res,cours:f.cours,groupe:f.groupe,titre:f.titre.trim()||'Examen',date:f.date,debut:f.debut,fin:f.fin,salle:f.salle.trim(),surveillant:f.surveillant,notes:f.notes.trim(),maj:new Date().toISOString()};

  S.busy=true;d.err='';renderDrawer();

  render();
}

/* ---------- Écriture ---------- */
function toast(msg,kind,action){
  const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.setAttribute('role','status');
  const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.addEventListener('click',()=>{t.remove();action.fn();});t.appendChild(b);}
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),action?9000:4000);
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return 'Modification refusée : votre accès à cette page ne le permet pas.';
  if(c==='quota_exceeded') return 'Stockage plein. Supprimez d’anciennes données, puis réessayez.';
  if(c==='revoked'){S.conn='off';return 'Votre accès a changé. Rechargez la page.';}
  return 'Enregistrement impossible pour le moment. Réessayez.';
}
async function write(fn,okMsg){
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  for(let i=0;i<2;i++){
    try{await fn();if(okMsg)toast(okMsg);return true;}
    catch(e){
      if(e&&e.code==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,400+Math.random()*600));continue;}
      toast(errMsg(e),'bad');return false;
    }
  }
  return false;
}
async function runAll(fns,okMsg){
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  S.busy=true;render();
  const q=[...fns];let fail=0,first=null;
  const worker=async()=>{while(q.length){const f=q.shift();try{await f();}catch(e){fail++;first=first||e;}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.busy=false;
  if(fail) toast(errMsg(first),'bad'); else if(okMsg) toast(okMsg);
  render();
  return !fail;
}
const col=n=>DB.collection(n);

async function clearExamples(){
  const fns=[];
  for(const k of ['comptes','cours','eleves','enseignants','groupes','examens']) for(const d of S.data[k]) if(d.exemple) fns.push(()=>col(k).doc(d.id).delete());

  for(const [id,z] of Object.entries(S.data.staffPres)) if(z&&z.exemple) fns.push(()=>col('presences-personnel').doc(id).delete());
  try{const q=await col('presences').where('exemple','==',true).get();for(const d of q.docs)fns.push(()=>col('presences').doc(d.id).delete());}catch(e){}

    ci.value='';ni.value='';hi.value='';
    const ok=await saveConfig(c,'Nom de cours enregistré');if(!ok){ci.value=code;ni.value=nom;hi.value=h==null?'':h;}return;
  }
  if(k==='p-add-conge'||k==='p-add-etape'){
    const pre=k==='p-add-conge'?'c':'e', n=$('#p-'+pre+'nom'),a=$('#p-'+pre+'du'),b=$('#p-'+pre+'au');
    const nom=n.value.trim()||(pre==='c'?'Congé':'Étape'),du=a.value,au=b.value||(pre==='c'?a.value:'');
    if(!du){a.focus();toast('Indiquez la date de début.','bad');return;}
    if(pre==='e'&&!au){b.focus();toast('Indiquez la date de fin de l’étape.','bad');return;}
    if(au<du){toast('La date de fin précède la date de début.','bad');return;}
    const c=configDoc();c[pre==='c'?'conges':'etapes'].push({nom,du,au});
    n.value='';a.value='';b.value='';
    const ok=await saveConfig(c,pre==='c'?'Congé ajouté':'Étape ajoutée');
    if(!ok){const n2=$('#p-'+pre+'nom'),a2=$('#p-'+pre+'du'),b2=$('#p-'+pre+'au');if(n2){n2.value=nom;a2.value=du;b2.value=au;}}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ac-q'&&S.dr&&S.dr.kind==='acct'){
    const d=S.dr, q=t.value.trim();d.q=t.value;
    if(!q||!USER){d.hits=[];renderDrawer();return;}
    USER.search(q).then(h=>{if(S.dr===d&&d.q.trim()===q){d.hits=h||[];for(const p of d.hits)PROF[p.id]=p;renderDrawer();}}).catch(()=>{});
    return;
  }
  if(t.id==='s-q'){S.pg.q=t.value;render();return;}
  const d=S.dr, f=t.dataset&&t.dataset.f;
  if(!d||!f)return;
  if(d.kind==='course'){
    if(t.dataset.i!=null){const s=d.draft.creneaux[+t.dataset.i];if(s)s[f]=t.value;}else d.draft[f]=t.value;
    if(f==='titre'){const k=comps().find(x=>x.nom.toLowerCase()===t.value.trim().toLowerCase());if(k&&!d.draft.code){d.draft.code='M'+k.code;d.draft.couleur=(+k.code)%8;if(k.heures&&!d.draft.heures)d.draft.heures=String(k.heures);renderDrawer();}}
    if(d.err||d.warn){d.err='';d.warn=null;renderDrawer();}
  }else if(d.kind==='att'&&f==='note'){d.draft.note=t.value;if(!d.dirty){d.dirty=true;renderDrawer();}}
  else if(d.kind==='exam'){
    d.draft[f]=t.value;
    if(f==='cours'){fillExamFromCourse(d.draft,true);d.err='';d.warn=null;renderDrawer();}
    else if(f==='date'){if(d.draft.cours)fillExamFromCourse(d.draft,false);d.err='';d.warn=null;renderDrawer();}
    else if(d.err||d.warn){d.err='';d.warn=null;renderDrawer();}
  }else if(d.kind==='student'||d.kind==='staff'){d.draft[f]=t.value;if(d.err){d.err='';renderDrawer();}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.gp){
    const gid=t.dataset.gp, v=t.value;if(S.busy)return;
    S.busy=true;render();
    await write(()=>col('groupes').doc(gid).update({principal:v}),v?`${tName(v)} est prof principal de ${gName(gid)}`:`${gName(gid)} n’a plus de prof principal`);
    S.busy=false;render();return;
  }
  if(t.id==='ac-ref'&&S.dr&&S.dr.kind==='acct'){S.dr.draft.ref=t.value;S.dr.err='';renderDrawer();return;}
  if(t.id==='pf-who'){if(S.role==='teacher')S.teacher=t.value;else{S.student=t.value;const e=byId(S.data.eleves,t.value);if(e)S.group=e.groupe;}savePrefs();render();return;}
  if(t.id==='f-filtre'){S.filtre=t.value;savePrefs();render();}
  else if(t.id==='sel-teacher'){S.teacher=t.value;savePrefs();render();}
  else if(t.id==='sel-group'){S.group=t.value;savePrefs();render();}
  else if(t.id==='s-g'||t.id==='x-g'){S.pg.g=t.value;render();}
  else if(t.dataset&&t.dataset.assign){const id=t.dataset.assign,v=t.value;S.busy=true;render();await write(()=>col('cours').doc(id).update({enseignant:v}),v?'Enseignant assigné':'Cours à assigner');S.busy=false;render();}
  else if(t.name==='c-color'&&S.dr&&S.dr.kind==='course'){S.dr.draft.couleur=+t.value;}
  else if(t.dataset&&t.dataset.slotp!=null&&S.dr&&S.dr.kind==='course'){
    const sl=S.dr.draft.creneaux[+t.dataset.slotp];if(!sl)return;
    if(t.value==='autre')sl.custom=true;else{const p=PERIODES.find(x=>x.k===t.value);sl.custom=false;sl.debut=p.debut;sl.fin=p.fin;}
    S.dr.err='';S.dr.warn=null;renderDrawer();
  }
  else if(t.dataset&&t.dataset.sb&&S.dr&&S.dr.kind==='course'&&S.dr.sess&&!S.busy){
    const d=S.dr, se=findSess(d.sess.date,d.sess.key);if(!se)return;
    if(t.dataset.sb==='menage'){await setChoreDay(se.grp,se.date,t.checked);return;}
    if(!se.extra)return;
    if(t.dataset.sb==='per'&&t.value==='autre'){openMove(se.key,se.date,se.date,null);return;}
    const c=byId(S.data.cours,se.c.id);if(!c)return;
    const doc=courseDoc(c), x=doc.extras.find(e=>e.id===se.extra.id);if(!x)return;
    if(t.dataset.sb==='per'){const p=PERIODES.find(y=>y.k===t.value);x.debut=p.debut;x.fin=p.fin;}
    else x.tags=withAct(x.tags,t.value);
    S.busy=true;renderDrawer();await write(()=>col('cours').doc(c.id).set(doc),'Séance modifiée');S.busy=false;render();
  }
  else if(t.id==='c-nom-sel'&&S.dr&&S.dr.kind==='course'){
    const d=S.dr,f=d.draft;d.err='';d.warn=null;
    if(t.value==='__autre'){d.customName=true;if(comps().some(k=>k.nom===f.titre))f.titre='';renderDrawer();const i=$('#c-titre');if(i)i.focus();}
    else if(t.value===''){d.customName=false;f.titre='';renderDrawer();}
    else{const k=comps().find(x=>String(x.code)===t.value);if(k){d.customName=false;f.titre=k.nom;f.code='M'+k.code;f.couleur=(+k.code)%8;if(k.heures)f.heures=String(k.heures);}renderDrawer();}
  }
  else if(S.dr&&S.dr.kind==='move'&&(t.name==='mv-scope'||t.dataset.mv)){if(t.name==='mv-scope')S.dr.scope=t.value;else S.dr[t.dataset.mv]=t.value;S.dr.err='';renderDrawer();}
});
$('#scrim').addEventListener('click',()=>closeDrawer());
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('cl-row')){e.preventDefault();openFiche('classes',e.target.dataset.id);return;}
  if(e.key==='Escape'&&DRAG){e.preventDefault();endDrag(false);return;}
  if(e.key==='Escape'&&S.dr){e.preventDefault();closeDrawer();return;}
  if(!S.dr&&S.pg&&S.pg.fiche&&(S.page==='eleves'||S.page==='personnel'||S.page==='classes')&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')){
    if(e.key==='ArrowLeft'){e.preventDefault();ficheStep(-1);return;}
    if(e.key==='ArrowRight'){e.preventDefault();ficheStep(1);return;}
    if(e.key==='Escape'){e.preventDefault();closeFiche();return;}
  }
  if(S.dr||S.page!=='calendar'||e.altKey||e.ctrlKey||e.metaKey) return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')) return;
  if(e.key==='ArrowLeft'&&!e.shiftKey){e.preventDefault();if(dayMode())stepDay(-1);else setWeek(addDays(S.week,-7));}
  else if(e.key==='ArrowRight'&&!e.shiftKey){e.preventDefault();if(dayMode())stepDay(1);else setWeek(addDays(S.week,7));}
  else if((e.key==='+'||e.key==='=')&&S.compact){S.compact=false;savePrefs();render();}
  else if((e.key==='-'||e.key==='_')&&!S.compact){S.compact=true;savePrefs();render();}
});

/* ---------- Glisser-déposer (administration), à la souris ----------
   Géré avec les événements du pointeur plutôt qu’avec le glisser-déposer du navigateur : pas d’animation
   de retour qui bloque la page, et la carte est toujours remise en place, même en lâchant très vite. */
let DRAG=null, dropEl=null, pendingMain=false, swallowClick=false;
function clearDrop(){if(dropEl){dropEl.classList.remove('drop-ok','drop-swap');dropEl=null;}}
function dropAt(x,y){
  if(!DRAG) return null;
  const el=document.elementFromPoint(x,y);
  if(!el||!el.closest) return null;
  const cell=el.closest('.wk-cell[data-date]');
  if(!cell||cell.dataset.off||cell.dataset.grp!==DRAG.grp) return null;
  const card=el.closest('.cc[data-key]');
  if(card&&card.dataset.key===DRAG.key) return null;
  if(card&&card.dataset.drag==='1') return {type:'swap',el:card,key:card.dataset.key,date:card.dataset.date};
  return {type:'cell',el:cell,date:cell.dataset.date};
}
function endDrag(apply,x,y){
  const d=DRAG;if(!d)return;
  const t=apply&&d.active?dropAt(x,y):null;
  DRAG=null;
  if(d.ghost) d.ghost.remove();
  document.querySelectorAll('.cc.dragging').forEach(n=>n.classList.remove('dragging'));
  document.body.classList.remove('is-dragging');
  clearDrop();
  if(d.active){swallowClick=true;setTimeout(()=>{swallowClick=false;},0);}
  if(pendingMain){pendingMain=false;renderMain();}
  if(t) openMove(d.key,d.date,t.date,t.type==='swap'?t.key:null);
}
document.addEventListener('pointerdown',e=>{
  if(DRAG) endDrag(false);
  if(e.button!==0||e.pointerType==='touch'||S.dr) return;
  const card=e.target&&e.target.closest&&e.target.closest('.cc[data-drag="1"]');
  if(!card) return;
  DRAG={key:card.dataset.key,date:card.dataset.date,grp:card.dataset.grp,x0:e.clientX,y0:e.clientY,active:false,src:card};
});
window.addEventListener('pointermove',e=>{
  const d=DRAG;if(!d)return;
  if(!d.active){
    if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<6) return;
    if(!d.src.isConnected){DRAG=null;return;}
    d.active=true;
    const r=d.src.getBoundingClientRect();d.dx=d.x0-r.left;d.dy=d.y0-r.top;
    const g=d.src.cloneNode(true);g.removeAttribute('id');g.removeAttribute('data-act');g.classList.add('drag-ghost');g.setAttribute('aria-hidden','true');g.style.width=r.width+'px';
    document.body.appendChild(g);d.ghost=g;
    d.src.classList.add('dragging');document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  d.ghost.style.transform=`translate(${e.clientX-d.dx}px,${e.clientY-d.dy}px) rotate(1.5deg)`;
  if(e.clientY>window.innerHeight-48) window.scrollBy(0,14); else if(e.clientY<48) window.scrollBy(0,-14);
  const t=dropAt(e.clientX,e.clientY);
  if(!t){clearDrop();return;}
  if(dropEl!==t.el){clearDrop();dropEl=t.el;dropEl.classList.add(t.type==='swap'?'drop-swap':'drop-ok');}
});
window.addEventListener('pointerup',e=>{if(DRAG)endDrag(true,e.clientX,e.clientY);});
window.addEventListener('pointercancel',()=>endDrag(false));
window.addEventListener('blur',()=>endDrag(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden)endDrag(false);});
// le clic qui suit un glisser ne doit pas ouvrir le cours
document.addEventListener('click',e=>{if(swallowClick){swallowClick=false;e.preventDefault();e.stopPropagation();}},true);
setInterval(()=>{if(S.conn==='shared')renderMain();},60000);

/* ---------- Données partagées ---------- */
function onErr(e){
  if(e&&(e.code==='revoked'||e.code==='unavailable'||e.code==='not_granted'||e.code==='capability_disabled')){S.conn='off';schedule();}
}
function subWeek(){
  if(!DB)return;
  if(unsubPres){unsubPres();unsubPres=null;}
  S.data.presences={};
  const from=iso(S.week), to=iso(addDays(S.week,6));
  try{
    unsubPres=col('presences').where('date','>=',from).where('date','<=',to).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();S.data.presences=m;schedule();
    },onErr);
  }catch(e){onErr(e);}
}
function ensureTerm(){
  if(!DB)return;
  const k=yearStart()+'|'+todayISO();
  if(S.termKey===k)return;
  if(unsubTerm){unsubTerm();unsubTerm=null;}
  S.termKey=k;S.termLoaded=false;
  try{
    unsubTerm=col('presences').where('date','>=',yearStart()).where('date','<=',todayISO()).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();S.data.presTerm=m;S.termLoaded=true;schedule();
    },e=>{S.termLoaded=true;onErr(e);});
  }catch(e){onErr(e);}
}
function subscribe(){
  DB.doc('config/ecole').onSnapshot(s=>{S.data.config=s.exists?s.data():null;S.loaded.config=true;schedule();},onErr);
  for(const k of ['cours','enseignants','groupes','eleves','examens']){
    col(k).onSnapshot(q=>{S.data[k]=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.loaded[k]=true;schedule();},e=>{S.loaded[k]=true;onErr(e);});
  }
  col('dossiers-personnel').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S.data.dossiers=m;schedule();},()=>{});
  col('profs-absents').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=(d.data().ids||[]);S.data.absProfs=m;schedule();},()=>{});
  col('presences-personnel').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();S.data.staffPres=m;schedule();},()=>{});
  if(S.me.id) DB.doc('comptes/'+S.me.id).onSnapshot(x=>{S.myAcct=x.exists?Object.assign({},x.data(),{id:x.id}):null;schedule();},()=>{});
  if(S.canAdmin!==false) col('demandes').onSnapshot(q=>{S.data.demandes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{S.data.demandes=[];});
  if(S.canAdmin!==false) col('comptes').onSnapshot(q=>{S.data.comptes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{S.data.comptes=[];});
  subWeek();
}
async function init(){
  S.day=defaultDay();
  render();
  const C=window.claude;
  if(!C||typeof C.use!=='function'){S.conn='off';render();return;}
  let db=null,user=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);}catch(e){db=null;}
  if(user){
    try{S.canAdmin=await user.canEdit();}catch(e){S.canAdmin=null;}
    try{S.canWrite=await user.can('data.write');}catch(e){S.canWrite=null;}
    USER=user;
    try{const m=await user.me();S.me={id:m.id||null,name:m.name||'',avatarUrl:m.avatarUrl||''};S.isOwner=!!m.isOwner;}catch(e){}
  }
  if(!db){S.conn='off';render();return;}
  DB=db;S.conn='shared';
  subscribe();
  render();
  // Les personnes qui ont la page ouverte : l’administration peut leur créer un compte.
  C.use('room').then(r=>{ROOM=r||null;if(r)r.onPeers(ch=>{S.peers=ch.peers.filter(p=>p.kind==='viewer'&&p.by).map(p=>({by:p.by,isMe:p.isMe,guest:p.guest}));if(S.page==='comptes'||(S.dr&&S.dr.kind==='acct'))schedule();},()=>{});schedule();}).catch(()=>{ROOM=null;});
}
init();
})();

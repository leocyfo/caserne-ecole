/* Listes des élèves et du personnel : cellules du tableau */
.tb-who{display:flex;align-items:center;gap:12px;min-width:0}
.tb-who .link{font-size:.9375rem;font-weight:700;color:var(--ink)}
.tb-who .av{width:36px;height:36px;font-size:.78125rem}
.tb-sub{display:block;margin-top:2px;font-size:.78125rem;color:var(--muted)}
.tb-rate{min-width:120px}
.tb-rate b{font-size:1.125rem}
.tb-rate .meter{max-width:150px;height:6px}
.tb-n{font-size:1.125rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.tb-n.zero{color:#A9B4C2;font-weight:400}.tb-n.bad{color:var(--bad)}.tb-n.warn{color:var(--warn)}
/* Cours à rattraper */
.miss-list .lrow{grid-template-columns:52px minmax(0,1fr) auto;gap:16px;padding:14px 22px;cursor:pointer}
.miss-list .lrow:hover{background:var(--surface-2)}
.miss-list .lrow+.lrow{border-top:1px solid var(--line-2)}
.miss-d{width:52px;height:52px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.miss-d b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.miss-d small{margin-top:3px;font-size:.6875rem;font-weight:700;text-transform:uppercase}
.miss-list .what .ti{font-size:1rem}
.miss-list .what .sub{font-size:.84375rem}
.panel .miss-list .lrow{padding:12px 0}
.panel .miss-list .lrow:hover{background:none}
.miss-ok{display:flex;align-items:center;gap:10px;padding:18px 22px;font-size:.9375rem;color:var(--ink)}
@container (max-width:560px){.miss-go{display:none}}
.stackf{display:flex;flex-direction:column;gap:12px}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.kpi b.ok{color:var(--ok)}.kpi b.warn{color:var(--warn)}.kpi b.bad{color:var(--bad)}
.fiche-act .seg{margin-right:4px}
@media (prefers-reduced-motion: reduce){.cl-row{transition:none}}
.row-prin{display:block;margin-top:4px;font-size:.75rem;font-weight:600;color:#566A84}
.col-prin{display:block;font-size:.71875rem;font-weight:600;color:#566A84;margin-top:2px}
.prin-chip{background:#E3EEFB;color:#275F9D}
@media (max-width:760px){
  /* À rattraper : la date à gauche, le bouton sous le titre */
  .miss-list .lrow{grid-template-columns:52px minmax(0,1fr);column-gap:14px;row-gap:10px}
  .miss-list .lrow>.miss-d{grid-column:1;grid-row:1/span 2;align-self:start}
  .miss-list .lrow>.what{grid-column:2;grid-row:1}
  .miss-list .lrow>.miss-go{grid-column:2;grid-row:2;justify-self:start}
}
/* Fiches en pleine page : liste à gauche, fiche à droite */
.fiche{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.fiche-list{position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fiche-list ul{list-style:none;margin:0;padding:4px;overflow-y:auto;flex:1}
.fl-tools{display:flex;flex-direction:column;gap:6px;padding:10px;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.fl-tools .search,.fl-tools select{width:100%;min-height:36px;font-size:.8125rem}
.fl-item{display:flex;flex-direction:column;gap:2px;width:100%;padding:8px 10px;border:0;border-radius:var(--r-sm);background:none;text-align:left;color:var(--ink)}
.fl-item:hover{background:var(--surface-2)}
.fl-item[aria-current="true"]{background:#E8F0FA;box-shadow:inset 3px 0 var(--role)}
.fl-name{font-weight:700;font-size:.875rem;line-height:1.25}
.fl-sub{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted)}
.fiche-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.fiche-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.fiche-nav .grow{flex:1}
.fi-lbl{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fiche-head{display:flex;flex-direction:column;gap:0;padding:0;overflow:hidden}
.fh-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 16px}
.fh-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin:0;border-top:1px solid var(--line-2);background:var(--surface-2)}
.fh-stats>div{padding:8px 14px;border-left:1px solid var(--line-2);min-width:0}
.fh-stats>div:first-child{border-left:0}
.fh-stats dt{font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fh-stats dd{margin:1px 0 0;font-size:1.1875rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fh-stats dd.ok{color:var(--ok)}.fh-stats dd.warn{color:var(--warn)}.fh-stats dd.bad{color:var(--bad)}
.fiche-tabs{align-self:flex-start}
.fiche-tabs button{padding:9px 18px;font-size:.875rem}
.fiche-body{min-width:0}
.fiche-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.fiche-two.wide{grid-template-columns:minmax(0,2fr) minmax(260px,1fr)}
@media (max-width:900px){.fiche-two.wide{grid-template-columns:1fr}}
.facts3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fiche .plist{max-height:420px;overflow-y:auto}
.panel.fiche-head .prof-id h2{margin:0;font-size:1.5rem;font-weight:700;line-height:1.2;letter-spacing:0;text-transform:none;color:var(--ink)}
.fiche-act{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.facts .wide{grid-column:1/-1}
.facts dd a{color:var(--head-ink)}
.pre{white-space:pre-wrap;font-weight:400}
.fiche-h3{margin:14px 0 4px;font-size:.71875rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.panel h2+.fiche-h3{margin-top:0}
.cg-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);text-align:left;color:var(--ink)}
.cg-head:hover{border-color:var(--line-strong)}
.cg-head .ic{width:16px;height:16px;flex:none;transition:transform .15s}
.cg-head[aria-expanded="true"] .ic{transform:rotate(90deg)}
.cg-body{padding:2px 4px 4px 12px}
.cg-body .muted,.fiche .plist .chip{white-space:nowrap;flex:none}
@media (prefers-reduced-motion: reduce){.cg-head .ic{transition:none}}
@media (max-width:980px){.fiche{grid-template-columns:1fr}.fiche-list{display:none}}
.dem-list{list-style:none;margin:0;padding:0}
.dem-list li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.dem-list li:first-child{border-top:0;padding-top:2px}
.dem-what{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.dem-msg{flex-basis:100%;color:var(--muted);font-size:.8125rem;font-style:italic;overflow-wrap:anywhere}
.dem-act{display:flex;gap:6px}
.side-out{margin-top:0}
@media (max-width:760px){.dem-list li{grid-template-columns:1fr}}
/* Fiche d’un élève : une chemise de dossier en carton, avec ses intercalaires ; dedans, une feuille blanche.
   « Retour », « n sur N » et « Précédent / Suivant » sont dans l’en-tête de la page (.sf-nav). */
.dos{--kraft:#F1E6CB;--kraft-2:#E5D5AE;--kraft-line:#D2BF92;--kraft-ink:#5A4720}
.dos.enter{animation:sf-in .22s ease-out backwards}
@keyframes sf-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dos-tabs{position:relative;z-index:1;display:flex;gap:3px;padding:0 14px;margin-bottom:-1px;overflow-x:auto;scrollbar-width:none}
.dos-tabs::-webkit-scrollbar{display:none}
.dos-tab{flex:none;padding:9px 18px;border:1px solid var(--kraft-line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--kraft-2);font:inherit;font-size:.875rem;font-weight:600;color:var(--kraft-ink);cursor:pointer;transition:background .15s}
.dos-tab:hover{background:#EBDDBB}
.dos-tab[aria-pressed="true"]{background:var(--kraft);color:#3B2E12;padding-bottom:10px;margin-bottom:-1px}
.dos-tab small{margin-left:4px;font-size:.75rem;font-weight:600}
.dos-body{padding:16px;background:var(--kraft);border:1px solid var(--kraft-line);border-radius:4px 12px 12px 12px;box-shadow:0 1px 2px rgba(60,45,10,.08)}
.dos-sheet{min-height:300px;padding:20px 26px 24px;background:#FFFFFF;border:1px solid #E4D9BF;border-radius:3px;box-shadow:0 1px 2px rgba(60,45,10,.08),0 8px 22px rgba(60,45,10,.10)}
.dos-top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;padding-bottom:12px;margin-bottom:18px;border-bottom:2px solid var(--ink)}
.dos-tt{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;min-width:0}
.dos-tt h2{flex-basis:100%;margin:2px 0 0;font-size:1.5625rem;font-weight:700;line-height:1.2;color:var(--ink)}
.dos-kind{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--ink)}
.dos-ref{font-size:.8125rem;color:var(--muted)}
.dos-top .grow{flex:1}
.dos-c h4{margin:14px 0 6px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dos-c>h4:first-child{margin-top:0}
.dos-c .panel{padding:10px 0 0;border:0;box-shadow:none;background:none}
.dos-c .fiche-two{gap:4px 36px}
/* Identité : la photo d’identité, puis le formulaire (libellé, pointillés, valeur) */
.dos-id{display:flex;align-items:flex-start;gap:28px}
.dos-form{flex:1;min-width:0}
.dos-lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:2px 40px}
.dos-l{display:flex;align-items:baseline;gap:8px;padding:7px 0;min-width:0}
.dos-l .k{flex:none;font-size:.8125rem;color:var(--muted)}
.dos-l i{flex:1;min-width:16px;border-bottom:1px dotted #C2B490;transform:translateY(-4px)}
.dos-l .v{min-width:0;font-size:.9375rem;font-weight:600;color:var(--ink);text-align:right;overflow-wrap:anywhere}
.dos-l .v a{color:var(--head-ink)}
.dos-l .role-chip{margin:0}
.dos-foot{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 24px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line-2)}
.av.id{width:120px;height:150px;border-radius:6px;font-size:2.125rem;box-shadow:0 1px 3px rgba(0,0,0,.18);border:3px solid #FFFFFF;outline:1px solid #DDD3BC}
.ph-pick:has(.av.id){border-radius:6px}
/* Documents : les pièces du dossier d’admission, cochées quand elles sont reçues */
.dos-docs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:2px 24px}
.dos-docs .ck{align-items:center}
.dos-docs .ck span{display:flex;flex-direction:column}
.dos-docs small{font-size:.75rem;color:var(--ok)}
.sf-more{position:relative}
.sf-more>summary{list-style:none;min-width:34px;justify-content:center;font-weight:800;letter-spacing:.08em}
.sf-more>summary::-webkit-details-marker{display:none}
.sf-menu{position:absolute;right:0;top:calc(100% + 6px);z-index:5;display:flex;flex-direction:column;min-width:210px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sf-menu button{padding:8px 10px;border:0;border-radius:var(--r-sm);background:none;text-align:left;font:inherit;font-size:.875rem;color:var(--ink);cursor:pointer}
.sf-menu button:hover{background:var(--surface-2)}
.sf-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:0;font-size:.9375rem;color:var(--ink-2)}
.sf-line b{font-size:1rem;color:var(--ink)}
.sf-line .ok-t b,.sf-line .warn-t b,.sf-line .bad-t b{color:inherit}
.sf-dot{color:var(--line-strong)}
.sf-sub{font-size:.875rem;color:var(--muted)}
.sf-sub b{font-size:.875rem}
.sf-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:0 36px;margin-top:6px}
@media (prefers-reduced-motion: reduce){.dos.enter{animation:none}.dos-tab{transition:none}}
@media (max-width:760px){.dos-body{padding:8px}.dos-sheet{padding:14px}.dos-id{flex-direction:column;gap:14px}.av.id{width:96px;height:120px;font-size:1.75rem}.dos-tt h2{font-size:1.3125rem}.dos-tab{padding:8px 12px;font-size:.8125rem}.sf-nav .muted{display:none}}
/* Photo de profil : pour l’administration, un clic sur la photo (ou les initiales) en choisit une autre */
.ph-pick{position:relative;display:inline-flex;flex:none;border-radius:50%;cursor:pointer}
.ph-pick:hover .av{filter:brightness(.85)}
.ph-pick:focus-within{outline:2px solid var(--focus);outline-offset:3px}
.ph-cam{position:absolute;right:-3px;bottom:-3px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink-2);box-shadow:var(--shadow-sm)}
.ph-cam .ic{width:14px;height:14px}
.ph-row{display:flex;align-items:center;gap:16px;padding:2px 0 8px}
.ph-row b{font-size:.875rem}
.ph-row .help{margin:2px 0 6px}
/* Sigle du cours devant son nom */
.cc-code{font-weight:700;color:var(--chip-ink,var(--muted))}
/* Affichage des listes (Affectations, Classes, Élèves, Personnel, Modules, Examens) : Liste par défaut, Cartes ou Compact.
   #main porte la classe view-cards ou view-dense ; le choix est retenu pour chaque page (bouton dans la barre du titre). */
#main.view-cards .xm-list>.xm-row.xm-lite>.xm-t:not([data-l]){flex:1 1 100%}

/* ----- Cartes : listes à lignes (Affectations, Modules, Examens, Stock) : légères ----- 
   En haut le titre, la date à gauche ; dessous, les valeurs à la suite, chacune avec son libellé en petit devant
   (posé par labelCards) ; les pastilles et les boutons au bout de la ligne. */
#main.view-cards .xm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px;background:none;border:0;box-shadow:none;overflow:visible}
#main.view-cards .xm-list>.xm-hd{display:none}
#main.view-cards .xm-list>.xm-row{display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:6px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm)}
#main.view-cards .xm-list>.xm-row.go:hover{background:var(--surface);border-color:var(--line-strong)}
#main.view-cards .xm-list>.xm-row>*{min-width:0}
#main.view-cards .xm-list>.xm-row:has(>.xm-d){position:relative;min-height:74px;padding-left:68px}
#main.view-cards .xm-list>.xm-row>.xm-d{position:absolute;top:12px;left:14px}
#main.view-cards .xm-list>.xm-row>.xm-t:not([data-l]){flex:1 1 calc(100% - 80px)}
#main.view-cards .xm-list>.xm-row:has(>.xm-d)>.xm-t:not([data-l]){flex-basis:100%}
#main.view-cards .xm-list>.xm-row .xm-t b,#main.view-cards .xm-list>.xm-row .xm-t small{white-space:normal}
#main.view-cards .xm-list>.xm-row>.xm-m{font-size:.78125rem;color:var(--muted)}
#main.view-cards .xm-list>.xm-row>[data-l]{display:inline-flex;flex-direction:row;align-items:baseline;gap:5px;text-align:left;font-size:.8125rem}
#main.view-cards .xm-list>.xm-row>[data-l]::before{content:attr(data-l);flex:none;font-size:.78125rem;font-weight:400;color:var(--muted)}
#main.view-cards .xm-list>.xm-row>.xm-end{flex:0 1 auto;margin-left:auto;justify-content:flex-end;flex-wrap:wrap;gap:6px}
#main.view-cards .xm-list>.xm-row>.xm-end:empty{display:none}
/* les grands chiffres (enseignants 1 / 2, résultats 8 / 12) en taille de texte, sur la ligne */
#main.view-cards .xm-list>.xm-row>.af-n{flex-wrap:wrap;gap:0 5px}
#main.view-cards .xm-list>.xm-row>.af-n b{flex:none;font-size:.875rem;white-space:nowrap}
#main.view-cards .xm-list>.xm-row>.af-n small{max-width:100%;font-size:.78125rem}
#main.view-cards .xm-list>.xm-row>.cl-big[data-l]{align-items:center;gap:6px}
#main.view-cards .xm-list>.xm-row>.cl-big b{font-size:.875rem}
#main.view-cards .xm-list>.xm-row>.cl-big .meter{width:56px;height:6px}
#main.view-cards .xm-list>.xm-row>.md-h{font-size:.8125rem}
#main.view-cards .xm-list>.xm-row>.md-h b{font-weight:600}
#main.view-cards .md-cols>.ic{display:none}

/* ----- Cartes : classes (mêmes principes : libellés en petit devant la valeur) ----- */
#main.view-cards .cl-list:not(.xm-list){display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;background:none;border:0;box-shadow:none;overflow:visible}
#main.view-cards .cl-list:not(.xm-list)>.cl-hd{display:none}
#main.view-cards .cl-list:not(.xm-list)>.cl-row{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm);padding:12px 14px}
#main.view-cards .cl-list:not(.xm-list)>.cl-row:hover{border-color:var(--line-strong)}
#main.view-cards .cl-row.cl-cols{grid-template-columns:1fr 1fr;grid-template-areas:"c c" "p p" "n s" "r a" "go go";gap:8px 14px}
#main.view-cards .cl-row .cl-c{grid-area:c}
#main.view-cards .cl-row .cl-prin{grid-area:p;flex-wrap:wrap;row-gap:4px}
#main.view-cards .cl-row .cl-n{grid-area:n;display:flex;align-items:baseline;gap:5px;font-size:.875rem;text-align:left}
#main.view-cards .cl-row .cl-st{grid-area:s;justify-self:start}
#main.view-cards .cl-row .cl-st .chip{font-size:.75rem;padding:3px 8px}
#main.view-cards .cl-row .cl-rate{grid-area:r}
#main.view-cards .cl-row .cl-adv{grid-area:a;display:flex}
#main.view-cards .cl-row .cl-big{flex-flow:row wrap;align-items:baseline;gap:4px 5px}
#main.view-cards .cl-row .cl-big b{font-size:.875rem}
#main.view-cards .cl-row .cl-big .meter{flex-basis:100%;height:5px}
#main.view-cards .cl-row .cl-basis{flex-basis:100%;font-size:.75rem}
#main.view-cards .cl-row .cl-go{grid-area:go;justify-content:space-between;padding-top:2px}
#main.view-cards .cl-row .cl-go-t,#main.view-cards .cl-row .cl-go>.ic{display:inline}
#main.view-cards .cl-row [data-l]::before{content:attr(data-l);display:inline;font-size:.78125rem;font-weight:400;color:var(--muted)}
#main.view-cards .cl-row .cl-prin[data-l]::before{content:"Principal"}
#main.view-cards .cl-row .cl-big[data-l]::before{flex:none}
#main.view-cards .cl-row .cl-st[data-l]::before{display:none}

/* ----- Cartes : élèves et personnel (tableaux) ----- */
#main.view-cards .tbl-wrap:has(>.tbl.stack){overflow:visible;background:none;border:0;box-shadow:none}
#main.view-cards table.tbl.stack{display:block;width:100%;min-width:0}
#main.view-cards .tbl.stack thead{display:none}
#main.view-cards .tbl.stack tbody{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
#main.view-cards .tbl.stack tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm)}
#main.view-cards .tbl.stack tr.row-link:hover{border-color:var(--line-strong)}
#main.view-cards .tbl.stack tr.row-link:hover td{background:none}
#main.view-cards .tbl.stack td{display:block;padding:0;border:0;font-size:.84375rem;text-align:left}
#main.view-cards .tbl.stack td:first-child{flex:1 1 0;min-width:0}
#main.view-cards .tbl.stack tr::after{content:"";order:1;flex-basis:100%;margin-top:-6px}
#main.view-cards .tbl.stack td.tb-line{flex-basis:100%}
#main.view-cards .tbl.stack td.tb-top{order:1;flex:none;margin-left:auto}
#main.view-cards .tbl.stack td:not(:first-child):not(.tb-top){order:2;color:var(--ink-2)}
#main.view-cards .tbl.stack td.tb-act{margin-left:auto}
#main.view-cards .tbl.stack td[data-l]::before{content:attr(data-l) " ";color:var(--muted)}
#main.view-cards .tbl.stack td:has(>.tb-empty){display:none}
#main.view-cards .tbl.stack .tb-n{font-size:.875rem}
#main.view-cards .tbl.stack .tb-cls .cl-num,#main.view-cards .tbl.stack .tb-rate .meter{display:none}
#main.view-cards .tbl.stack .tb-rate{min-width:0}


/* ----- Cartes des élèves : compactes (numéro, nom, rôle, présence ; puis la classe, et les absences et retards seulement
   s’il y en a ; le téléphone reste dans la fiche). Capitaine en rouge foncé, lieutenants en bleu marine. ----- */
#main.view-cards .st-cards tbody{grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
#main.view-cards .st-cards tr{padding:10px 12px;gap:4px 10px}
#main.view-cards .st-cards .tb-who{gap:9px}
#main.view-cards .st-cards .tb-who .link{font-size:.875rem;line-height:1.25}
#main.view-cards .st-cards .role-chip{display:table;margin:3px 0 0}
#main.view-cards .st-cards td.tb-tel,#main.view-cards .st-cards td:has(>.tb-n.zero){display:none}
#main.view-cards .st-cards td:not(:first-child):not(.tb-top),#main.view-cards .st-cards .tb-cls .muted{font-size:.78125rem}
#main.view-cards .st-cards .tb-n{font-size:.78125rem}
#main.view-cards .st-cards .tb-rate b{font-size:1.0625rem}
#main.view-cards .st-cards tr[data-fn="cap"]{background:#9F2D35;border-color:#9F2D35}
#main.view-cards .st-cards tr[data-fn="lt"]{background:#1E3A5F;border-color:#1E3A5F}
#main.view-cards .st-cards tr[data-fn="vert"]{background:#1F5F45;border-color:#1F5F45}
#main.view-cards .st-cards tr[data-fn="or"]{background:#8A6416;border-color:#8A6416}
#main.view-cards .st-cards tr[data-fn="gris"]{background:#4B5563;border-color:#4B5563}
#main.view-cards .st-cards tr[data-fn]:hover{border-color:transparent;filter:brightness(1.08)}
#main.view-cards .st-cards tr[data-fn] td,#main.view-cards .st-cards tr[data-fn] .link,#main.view-cards .st-cards tr[data-fn] .tb-n{color:#FFFFFF}
#main.view-cards .st-cards tr[data-fn] .muted,#main.view-cards .st-cards tr[data-fn] td[data-l]::before{color:rgba(255,255,255,.75)}
#main.view-cards .st-cards tr[data-fn] .st-num{background:rgba(255,255,255,.16);color:#FFFFFF}
#main.view-cards .st-cards tr[data-fn] .role-chip{background:rgba(255,255,255,.2);color:#FFFFFF}
#main.view-cards .st-cards tr[data-fn] .cl-big b{color:#FFFFFF}
#main.view-cards .st-cards tr[data-fn] .cl-big.warn b{color:#FFD98A}
#main.view-cards .st-cards tr[data-fn] .cl-big.bad b{color:#FFB8BD}

/* ----- Compact : lignes serrées, titre et détail sur la même ligne ----- */
#main.view-dense .xm-hd{padding-top:6px;padding-bottom:6px}
#main.view-dense .xm-row{padding-top:3px;padding-bottom:3px}
#main.view-dense .xm-d{width:38px;height:32px;border-radius:7px}
#main.view-dense .xm-d small:first-child{display:none}
#main.view-dense .xm-d b{font-size:.875rem}
#main.view-dense .xm-t{flex-direction:row;align-items:baseline;gap:10px}
#main.view-dense .xm-t b{font-size:.84375rem;flex:none;max-width:60%}
#main.view-dense .xm-t small{font-size:.75rem}
#main.view-dense .cl-num,#main.view-dense .md-num{width:30px;height:30px;font-size:.78125rem;border-radius:7px}
#main.view-dense .btn.sm{min-height:26px;padding:2px 9px;font-size:.78125rem}
#main.view-dense .chip{padding:1px 7px}
#main.view-dense .cl-hd{padding-top:6px;padding-bottom:6px}
#main.view-dense .cl-row{padding-top:5px;padding-bottom:5px}
#main.view-dense .cl-name b{font-size:.875rem}
#main.view-dense .cl-name small{font-size:.75rem}
#main.view-dense .cl-n,#main.view-dense .cl-big b{font-size:1rem}
#main.view-dense .cl-big{gap:4px}
#main.view-dense .cl-big .meter{height:5px}
#main.view-dense .cl-prin .av,#main.view-dense .tb-who .av{width:24px;height:24px;font-size:.65625rem}
#main.view-dense .cl-prin select{min-height:28px;font-size:.84375rem}
#main.view-dense .cl-go .btn{min-height:28px}
#main.view-dense .tbl th{padding-top:6px;padding-bottom:6px}
#main.view-dense .tbl td{padding-top:4px;padding-bottom:4px;font-size:.8125rem}
#main.view-dense .tb-n,#main.view-dense .tb-rate b{font-size:.875rem}
#main.view-dense .tb-rate .meter{height:4px}
/* la flèche qui termine une ligne cliquable ne sert pas sur une carte (toute la carte s’ouvre) */
#main.view-cards .xm-list>.xm-row>svg.ic:last-child{display:none}
/* Paramètres : les sections sont dans le menu de gauche (voir 02-coquille.css), une section à la fois, chacune avec son bouton Enregistrer */
.ps-body{display:flex;flex-direction:column;gap:12px;min-width:0}
.ps-form{display:flex;flex-direction:column;gap:12px;min-width:0}
.ps-top{display:flex;flex-direction:column;gap:2px}
.ps-top .help{margin:0}
.ps-h{margin:0;font-size:1.0625rem;font-weight:700;color:var(--ink)}
/* les cartes d’une section se placent côte à côte et s’étirent pour remplir chaque rangée */
.ps-cards{display:flex;flex-wrap:wrap;gap:12px}
.ps-card{flex:1 1 360px;display:flex;flex-direction:column;gap:10px;min-width:0;margin:0}
.ps-card h3{margin:0;font-size:.875rem;font-weight:700;color:var(--ink)}
.ps-card .help{margin:0}
.ps-wide{flex-basis:100%}
.ps-wide .ps-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:8px}
/* le bouton Enregistrer reste au bas de l’écran tant que la section défile */
.ps-save{position:sticky;bottom:0;z-index:4;display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:0 -4px 14px rgba(15,23,42,.06)}
.ps-save .help{margin:0}
.ps-chk{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer}
.ps-chk:hover{border-color:var(--line-strong)}
.ps-chk input{margin-top:2px;flex:none;width:16px;height:16px;accent-color:var(--accent)}
.ps-chk b{display:block;font-size:.84375rem;color:var(--ink)}
.ps-chk small{display:block;margin-top:1px;font-size:.78125rem;color:var(--muted)}
.ps-list{display:flex;flex-direction:column;gap:8px}
.ps-times{display:grid;grid-template-columns:110px repeat(2,minmax(0,160px));gap:8px 12px;align-items:end}
.ps-tl{padding-bottom:10px;font-size:.84375rem;font-weight:600;color:var(--ink)}
.ps-colors{display:flex;flex-wrap:wrap;gap:8px}
.ps-color{position:relative;display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.8125rem;font-weight:600;cursor:pointer}
.ps-color input{position:absolute;width:1px;height:1px;opacity:0}
.ps-color input[type=color]{position:static;width:30px;height:22px;opacity:1;padding:0;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer}
.ps-color:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.ps-color:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.ps-sw{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.ps-exp{display:flex;flex-direction:column}
.ps-exp>div{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"t b" "s b";gap:2px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.ps-exp>div:first-child{border-top:0;padding-top:0}
.ps-exp b{grid-area:t;font-size:.875rem}
.ps-exp small{grid-area:s;font-size:.78125rem;color:var(--muted)}
.ps-exp .btn{grid-area:b}
/* grades des élèves : une ligne par grade (nom, couleur) */
.ps-grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:8px 18px}
.ps-grade{display:grid;grid-template-columns:20px minmax(0,1fr) 130px 14px;gap:8px;align-items:center}
.ps-gi{font-size:.75rem;font-weight:700;color:var(--muted);text-align:right}
.ps-gs{width:14px;height:14px;border-radius:50%}
/* entrées du menu : visible ou non, et un autre nom */
.ps-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:8px 14px}
.ps-mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:6px 8px 6px 10px;border:1px solid var(--line);border-radius:var(--r-sm)}
.ps-mchk{display:flex;align-items:center;gap:8px;font-size:.84375rem;font-weight:600;cursor:pointer;min-width:0}
.ps-mchk input{flex:none;width:16px;height:16px;accent-color:var(--accent)}
.ps-mrow:has(input[type=checkbox]:not(:checked)) .ps-mchk span{color:var(--muted);text-decoration:line-through}
.pr-sign{width:240px;margin:34px 0 0 auto;padding-top:4px;border-top:1px solid #333;font-size:.6875rem;color:#333;text-align:center}
/* clôture de l’année et années archivées */
.ps-ny{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.ps-close{border-color:#F1D39C;background:#FFFBF2}
.ps-recap{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.84375rem}
.ps-alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ps-arow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 0;border-top:1px solid var(--line-2)}
.ps-arow:first-child{border-top:0;padding-top:0}
.ps-arow.cur{background:var(--surface-2);margin:0 -10px;padding:10px;border-radius:var(--r-sm)}
.ps-at{display:flex;flex-direction:column;gap:2px;min-width:0}
.ps-at b{font-size:.90625rem}
.ps-at small{font-size:.78125rem;color:var(--muted)}
.notice.arch{border-color:#1E3A5F;background:#EEF2F8}
/* Annonces : bandeau en haut des pages */
.notice.ann{flex-wrap:nowrap;align-items:flex-start;gap:12px;padding:10px 12px;border-left-width:4px}
.notice.ann.info{border-color:#C9DAF3;border-left-color:#2C5AA0;background:#F3F7FD}
.notice.ann.warn{border-left-color:#D97706}
.notice.ann.bad{border-color:#EDB4B8;border-left-color:#B42318;background:#FFF2F3}
.ann-ic{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#FFFFFF}
.notice.ann.info .ann-ic{color:#2C5AA0}.notice.ann.warn .ann-ic{color:#B45309}.notice.ann.bad .ann-ic{color:#B42318}
.ann-b{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.ann-b p{flex:none;margin:0;overflow-wrap:anywhere}
.ann-b a{color:inherit;text-decoration:underline}
.ann-t{display:flex;align-items:center;gap:6px;font-size:.875rem}
.ann-u{padding:1px 7px;border-radius:999px;background:#B42318;color:#FFFFFF;font-size:.6875rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ann-m{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:.75rem;color:var(--muted)}
.ann-m .ic{width:12px;height:12px}
.ann-a{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
.ann-a .btn .ic{width:13px;height:13px}
.ann-x{display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:var(--r-sm);background:none;color:var(--muted);cursor:pointer}
.ann-x:hover{background:rgba(15,23,42,.07);color:var(--ink)}
.ann-more{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border:0;background:none;color:var(--ink-2);font-size:.8125rem;font-weight:600;cursor:pointer}
.ann-more:hover{color:var(--ink)}
.notice.ann.flash{animation:annFlash 1.2s ease-out}
@keyframes annFlash{0%{box-shadow:0 0 0 3px var(--focus)}100%{box-shadow:0 0 0 0 transparent}}
/* Paramètres > Annonces */
.an-top{flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.an-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.an-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.an-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface)}
.an-row.n-info{border-left-color:#2C5AA0}.an-row.n-warn{border-left-color:#D97706}.an-row.n-urgent{border-left-color:#B42318}
.an-row.st-fini,.an-row.st-brouillon{background:var(--surface-2)}
.an-main{min-width:0;display:flex;flex-direction:column;gap:3px}
.an-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.an-h b{font-size:.875rem}
.an-h .chip .ic{width:11px;height:11px}
.an-x{margin:0;font-size:.8125rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.an-meta{font-size:.75rem;color:var(--muted)}
.an-act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:520px}
.an-cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-bottom:8px}
.an-cls .ps-mchk{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-sm)}
.an-niv-info .ps-sw{background:#2C5AA0}.an-niv-warn .ps-sw{background:#D97706}.an-niv-urgent .ps-sw{background:#B42318}
.an-prev{display:flex;flex-direction:column;gap:8px}
@media (max-width:760px){.notice.ann{flex-wrap:wrap}.ann-ic{display:none}.ann-a{width:100%;justify-content:flex-start}.an-row{grid-template-columns:1fr}.an-act{justify-content:flex-start;max-width:none}}
.pr-pied{margin:0 0 10px;font-size:.6875rem;font-style:italic;color:#555}
@media (max-width:760px){.ps-grade{grid-template-columns:20px minmax(0,1fr) 116px}.ps-gs{display:none}.ps-mrow{grid-template-columns:1fr}.ps-times{grid-template-columns:1fr 1fr}.ps-tl{grid-column:1/-1;padding:0}.ps-exp>div{grid-template-columns:1fr;grid-template-areas:"t" "s" "b"}.ps-exp .btn{justify-self:start;margin-top:6px}}
/* ---------- Formation : grilles pratiques, évaluations, carnets, examens blancs, services ---------- */
.sec-h{margin:18px 0 8px;font-size:.875rem;font-weight:700;color:var(--ink)}
.xm-fg{grid-template-columns:minmax(0,2.4fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,.9fr) minmax(120px,auto)}
.xm-fe{grid-template-columns:62px minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(150px,auto)}
.xm-qb{grid-template-columns:minmax(0,3fr) minmax(0,1.6fr) minmax(0,.8fr) minmax(110px,auto)}
.xm-qe{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.3fr) 90px}
.xm-sv{grid-template-columns:minmax(0,2.4fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,1.2fr) minmax(130px,auto)}
.xm-fg .xm-end,.xm-fe .xm-end,.xm-qb .xm-end,.xm-qe .xm-end,.xm-sv .xm-end{justify-content:flex-end;flex-wrap:wrap;gap:4px}
/* évaluer : la liste de la classe */
.fo-elist{list-style:none;margin:0;padding:0}
.fo-er{display:grid;grid-template-columns:22px 30px minmax(0,1fr) auto auto auto;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.fo-er:first-child{border-top:0}
.fo-er .nm{min-width:0;font-weight:600;color:var(--ink)}
.fo-er .nm small{font-weight:400}
.fo-er.done .nm{color:var(--ink-2)}
.fo-ck{display:flex;align-items:center;justify-content:center}
.fo-ck input{width:16px;height:16px;margin:0}
/* la grille remplie sur la tablette */
.fo-chrono{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
.fo-time{font:700 1.625rem/1 var(--font);font-variant-numeric:tabular-nums;color:var(--ink);min-width:86px}
.fo-pts{margin:0 0 8px;padding:0;list-style:none;counter-reset:pt}
.fo-pts>li{counter-increment:pt;border-top:1px solid var(--line)}
.fo-pts>li:first-child{border-top:0}
.fo-pt{display:flex;align-items:center;gap:10px;padding:10px 4px;min-height:44px;cursor:pointer}
.fo-pt input{width:20px;height:20px;flex:none;margin:0}
.fo-pt span:not(.chip){flex:1;min-width:0}
.fo-pt span:not(.chip)::before{content:counter(pt) '. ';color:var(--muted)}
.fo-pt.crit{font-weight:600}
.fo-done>li{padding:6px 2px;font-size:.8125rem}
.fo-sum{margin:10px 0;font-size:.84375rem}
.fo-sig{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px 10px;margin:10px 0}
.fo-sig legend{padding:0 4px;font-size:.78125rem;font-weight:700;color:var(--ink-2)}
.fo-sig .ck{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.fo-cf{border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px 2px;margin:0 0 10px}
.fo-cf legend{padding:0 4px;font-weight:700;font-size:.8125rem}
/* carnets : élèves × grilles */
.fo-mat th,.fo-mat td{padding:5px 6px}
.fo-gh{text-align:center;width:34px}
.fo-c{text-align:center}
.fo-cb{width:30px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:700 .8125rem/1 var(--font);cursor:pointer;color:var(--muted)}
.fo-c.ok .fo-cb{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.fo-c.ko .fo-cb{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.fo-c.out .fo-cb{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.fo-cb:hover{border-color:var(--line-strong)}
.fo-leg{margin:10px 0 0;padding-left:22px;columns:2;column-gap:28px;font-size:.78125rem;color:var(--ink-2)}
.fo-leg li{break-inside:avoid;padding:2px 0}
.fo-bar{display:block;width:100%;height:6px;margin-top:6px;background:var(--line);border-radius:999px;overflow:hidden}
.fo-bar i{display:block;height:100%;background:var(--ok)}
.fo-req{display:block;margin-top:4px}
.fo-req .chip{margin:2px 4px 0 0}
.fo-miss{margin:6px 0 0;padding-left:18px;font-size:.78125rem}
.fo-enpq td{font-size:.8125rem}
.fo-enpq .fo-ck{width:34px}
.fo-miss-t{color:var(--ink-2);line-height:1.45}
.fo-rel .tbl{margin-bottom:10px}
/* banque de questions et examens blancs */
.qb-ch{border:0;padding:0;margin:0 0 10px}
.qb-ch legend{font-size:.78125rem;font-weight:600;color:var(--ink-2);margin-bottom:8px}
/* Fenêtre d’une question : chaque choix est une carte, la bonne réponse en vert pâle */
#qq-texte{font-size:.96875rem;line-height:1.45}
.qb-c{display:grid;grid-template-columns:18px 26px minmax(0,1fr) auto;align-items:center;gap:10px;margin-bottom:6px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);cursor:pointer}
.qb-c:hover{border-color:var(--line-strong)}
.qb-c:focus-within{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.qb-c input[type=radio]{width:18px;height:18px;margin:0;accent-color:var(--ok)}
.qb-c b{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--info-bg);color:var(--info);font-size:.78125rem}
.qb-c input:not([type]){border:0;background:none;padding:8px 2px;font:inherit;font-size:.9375rem;color:var(--ink);min-width:0;outline:0}
.qb-good{display:none;font-size:.6875rem;font-weight:700;color:var(--ok);background:#FFFFFFB3;border-radius:999px;padding:2px 8px;white-space:nowrap}
.qb-c:has(input[type=radio]:checked){background:var(--ok-bg);border-color:#9FD8BB}
.qb-c:has(input[type=radio]:checked) b{background:var(--ok);color:#FFFFFF}
.qb-c:has(input[type=radio]:checked) .qb-good{display:inline-block}
.qb-expl{background:var(--info-bg);border-radius:var(--r-sm);padding:10px 12px 12px}
.qb-expl>span{color:var(--info)}
.qb-expl small{font-weight:400;color:var(--muted);margin-left:4px}
.qb-expl textarea{background:var(--surface)}
.qb-my{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.qb-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qb-h h2{margin:0}
.qb-card .row{margin-top:10px}
.qb-bar{gap:12px}
.qb-time b{font-variant-numeric:tabular-nums;font-size:1rem;margin-left:4px}
.qb-q h2{font-size:1.0625rem;line-height:1.4;margin:6px 0 14px}
.qb-opts{display:flex;flex-direction:column;gap:8px}
.qb-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:10px 14px;text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);font:inherit;color:var(--ink);cursor:pointer}
.qb-opt b{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:.78125rem}
.qb-opt:hover:not(:disabled){border-color:var(--ink-2)}
.qb-opt[aria-checked=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qb-opt[aria-checked=true] b{background:var(--accent);border-color:var(--accent);color:#FFF}
.qb-opt.good{border-color:var(--ok);background:var(--ok-bg)}
.qb-opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.qb-opt:disabled{cursor:default}
.qb-nav{margin-top:14px}
.qb-dots{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.qb-dot{width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:600 .75rem/1 var(--font);color:var(--muted);cursor:pointer}
.qb-dot.done{background:var(--info-bg);color:var(--ink);border-color:transparent}
.qb-dot.on{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}
.qb-end{gap:10px;align-items:center}
.qb-end p{margin:0}
.qb-score{font-size:.9375rem;margin:6px 0 0}
.qb-score b{font-size:1.625rem;margin-right:4px}
.qb-cors{margin:0;padding:0;list-style:none}
.qb-cors li{padding:10px 12px;border-left:3px solid var(--line);margin-bottom:8px;background:var(--surface-2);border-radius:0 var(--r-sm) var(--r-sm) 0}
.qb-cors li.good{border-left-color:var(--ok)}
.qb-cors li.bad{border-left-color:var(--bad)}
.qb-cors p{margin:0 0 4px}
/* présence par code QR */
.qr-row{margin:6px 0 10px;gap:10px;align-items:center}
.qr-box{display:flex;gap:16px;align-items:flex-start;padding:12px;margin:6px 0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
.qr-img{flex:none;width:168px;height:168px;display:flex;align-items:center;justify-content:center;background:#FFF;border-radius:var(--r-sm);padding:8px;text-align:center}
.qr-img svg{width:100%;height:100%}
.qr-t{min-width:0}
.qr-t p{margin:0 0 6px}
.qr-code{font:700 1.25rem/1.2 Consolas,monospace;letter-spacing:2px;color:var(--ink)}
#drawer .field input.qr-input,.qr-input{font:700 1.375rem/1.2 Consolas,monospace;letter-spacing:4px;text-transform:uppercase}
/* les noms d’élèves en tête de ligne : comme du texte, pas comme un en-tête de colonne */
#fo-mat tbody th,#fo-certs-t tbody th,#fo-enpq-t tbody th,#svc-t tbody th{text-transform:none;letter-spacing:0;font-size:.84375rem;font-weight:600;color:var(--ink);text-align:left;white-space:nowrap}
#svc-t tbody th small{font-weight:400}
#fo-mycarnet .plist li{display:grid;grid-template-columns:minmax(0,1fr) auto 56px;gap:10px;align-items:center}
#fo-mycarnet .plist li .btn{justify-self:end}
@media (max-width:760px){.fo-er{grid-template-columns:22px minmax(0,1fr) auto auto auto;gap:8px}.fo-er .nm small{display:block}.fo-er .st-num{display:none}.fo-leg{columns:1}.qr-box{flex-direction:column}}
/* Relevé sur téléphone : un tableau plus large que l’écran défile dans sa case, pas la page entière (IFT1005, ch. 6 : éviter le défilement horizontal) */
@media (max-width:760px){.fo-rel .tbl{display:block;min-width:0;max-width:100%;overflow-x:auto}}
/* Confort : recherche Ctrl+K, vues enregistrées, modification sur place */
/* recherche Ctrl+K : le bouton sous le logo, puis la boîte */
.side-search{display:flex;align-items:center;gap:10px;width:calc(100% - 20px);margin:0 10px 8px;padding:6px 10px;border:1px solid var(--side-line);border-radius:var(--r-sm);background:none;color:var(--side-muted);font:inherit;font-size:.8125rem;text-align:left;cursor:pointer}
.side-search:hover{background:var(--side-hover);color:#FFFFFF}
.side-search span{flex:1}
.side-search kbd{font:600 .71875rem/1 var(--font);padding:3px 5px;border:1px solid var(--side-line);border-radius:4px;color:var(--side-muted)}
.side-mini .side-search{justify-content:center;width:36px;margin:0 auto 8px;padding:6px 0}
.side-mini .side-search span,.side-mini .side-search kbd{display:none}
.cmdk{position:fixed;inset:0;z-index:80;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;background:rgba(14,26,43,.35)}
.cmdk[hidden]{display:none}
.cmdk-box{width:min(620px,100%);max-height:70vh;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
#cmdk-q{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:.9375rem;height:auto;outline:none;background:var(--surface)}
#cmdk-l{list-style:none;margin:0;padding:6px;overflow:auto}
.ck-g{padding:8px 10px 4px;font-size:.71875rem;font-weight:700;color:var(--muted);text-transform:none}
.ck-it{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer}
.ck-it b{font-weight:600;color:var(--ink)}
.ck-it small{color:var(--muted);font-size:.78125rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-it.on{background:var(--info-bg)}
.ck-none{padding:14px 10px;color:var(--muted)}
.cmdk-help{margin:0;padding:8px 14px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted)}
/* vues enregistrées */
.sv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px}
.sv-chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:.78125rem;font-weight:600;color:var(--ink-2)}
button.sv-chip,.sv-chip>button{border:0;background:none;font:inherit;color:inherit;padding:5px 12px;cursor:pointer;border-radius:999px}
button.sv-chip{border:1px solid var(--line)}
.sv-chip.on{border-color:var(--ink-2);color:var(--ink);background:var(--surface-2)}
.sv-chip .sv-x{padding:5px 10px 5px 2px;color:var(--muted)}
.sv-chip>button:first-child{padding-right:6px}
.sv-form{display:inline-flex;gap:6px;align-items:center}
.sv-form input{height:30px;width:180px}
/* modification sur place */
.ie-btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-left:6px;padding:0;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;opacity:0;vertical-align:middle}
.ie-btn .ic{width:14px;height:14px}
tr:hover .ie-btn,.ie-btn:focus-visible{opacity:1}
.ie-btn:hover{background:var(--surface-2);color:var(--ink)}
.ie-edit input,.ie-edit select{height:30px;min-width:140px;font-size:.8125rem}
@media (hover:none){.ie-btn{opacity:.6}}
@media (max-width:760px){.side-search,#sv-save{display:none}}
/* Téléphone : ce qui change partout sur un écran étroit (jusqu’à 760 px). Chaque fichier finit par ses propres règles
   de téléphone ; celles-ci valent pour tout le site. Vérifié par tests/steps-phone.js à 390 px. */
@media (max-width:760px){
  /* Champs à 16 px : en dessous, l’iPhone zoome chaque fois qu’on touche un champ */
  :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea){font-size:1rem}
  /* Petits textes : 12 px au moins */
  .chip,.chore-chip,.role-chip,.wk-corner,.wk-class small,.day-pick small,.cc-kind,.cc-flag,.kpi span,.tbl th,.eyebrow,.facts dt,
  .cl-hd,.cl-row [data-l]::before,.xm-tile .lbl,.xm-hd,.xm-d small,.nav-n,.nav-todo,.dp-wd,.dp-c span,.md-m>span,.xg thead th,.xg tfoot .xg-n,
  .xg thead .xg-r,.xg-r small,.xg-h small,.st-hd,.st-row [data-l]::before,.miss-d small,.col-prin,.fh-stats dt,.fiche-h3,
  .cell-chore small,.fchip small,.mv-box small,.pick-hint{font-size:.75rem}
}
/* Téléphone (jusqu’à 760 px) : la coquille mobile de src/js/29-mobile.js (onglets en bas, menu « Plus », sous-menus en pastilles)
   et son apparence (Barlow, charbon et jaune). Sur un grand écran, rien ici ne s’applique. */
@media (max-width:760px){
:root{
  --side:#1B1F24; --side-ink:#EEF0F2; --side-soft:#C9CED4; --side-muted:#8A929B; --side-line:#2C333B; --side-hover:#252B32; --side-active:#2C333B;
  --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F6F1; --head:#F8F6F1; --head-ink:#4A525C; --row-ink:#1B1F24;
  --ink:#1B1F24; --ink-2:#3A424C; --muted:#5C636C; --line:#E4DFD5; --line-2:#ECE8DF; --line-strong:#CFC8BB;
  --role:#1B1F24; --role-bg:#E9E5DC; --eyebrow:#5C636C;
  --accent:#C8402E; --accent-hover:#AD3524; --today:#C8402E; --focus:#B98A00;
  --y:#F2B705; --y-ink:#1B1F24; --y-soft:#FBEFC4; --y-hover:#E0A800;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --fh:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --r:14px; --r-sm:10px;
  --mtabs-h:64px;
}
body{font-size:.9375rem;line-height:1.45;font-feature-settings:normal}
h1,h2,h3,.dr-top h2,.page-heading h1{font-family:var(--fh);letter-spacing:.01em}

/* ---------- coquille ---------- */
.m .sidebar{display:none!important}
.m .app{display:block;min-height:100vh}
.m .content{padding:0 16px calc(var(--mtabs-h) + 28px + env(safe-area-inset-bottom,0px));gap:14px}
.m .page-heading{margin:0 -16px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg);border-bottom:0;min-height:0}
.m .page-heading h1{font-size:1.875rem;font-weight:700;line-height:1.05}
.m .page-heading p{font-size:.875rem}

/* onglets du bas */
.mtabs{position:fixed;left:0;right:0;bottom:0;z-index:19;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(27,31,36,.06)}
.mtabs button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;padding:4px 2px;font-size:.75rem;font-weight:600;color:var(--muted);border-radius:12px;-webkit-tap-highlight-color:transparent}
.mtabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtabs .ic{width:22px;height:22px;padding:4px 16px;box-sizing:content-box;border-radius:999px;transition:background .15s}
.mtabs button[aria-current="page"]{color:var(--ink)}
.mtabs button[aria-current="page"] .ic{background:var(--y);color:var(--y-ink)}
.m-dot{position:absolute;top:4px;left:calc(50% + 12px);width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}

/* sous-menus (Paramètres, Stock, Compta, Formation) : pastilles qui défilent */
.msub{display:flex;gap:6px;overflow-x:auto;margin:-4px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.msub::-webkit-scrollbar{display:none}
.msub[hidden]{display:none!important}
.msub button{flex:none;position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.875rem;color:var(--ink-2);white-space:nowrap}
.msub button .ic{width:16px;height:16px}
.msub button[aria-current="page"]{background:var(--side);border-color:var(--side);color:#FFFFFF}
.msub .nav-todo{margin-left:2px;padding:0 6px;border-radius:999px;background:var(--line-2);color:var(--ink-2);font-size:.75rem;font-style:normal}
.msub .nav-todo.bad{background:var(--accent);color:#FFFFFF}
.msub button[aria-current="page"] .nav-todo{background:rgba(255,255,255,.2);color:#FFFFFF}

/* menu « Plus » : feuille qui monte du bas */
.mmore{position:fixed;inset:0;z-index:40;background:rgba(15,18,22,.45);display:flex;align-items:flex-end;animation:mFade .15s}
.mmore[hidden]{display:none!important}
.mm-in{background:var(--bg);width:100%;max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:mUp .22s ease-out;overscroll-behavior:contain}
.mm-grab{width:42px;height:5px;border-radius:9px;background:var(--line-strong);margin:4px auto 10px}
.mm-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mm-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mm-brand .lg{width:38px;height:38px;border-radius:10px;background:var(--side);display:grid;place-items:center;flex:none}
.mm-brand .lg img{width:26px;height:26px}
.mm-brand b{font-family:var(--fh);font-size:1.375rem;display:block;line-height:1}
.mm-brand b i{font-style:normal;color:var(--accent)}
.mm-brand small{display:block;color:var(--muted);font-size:.78125rem}
.mm-x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.mm-person .person-btn{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;text-align:left}
.mm-person .pinfo b{display:block;font-size:.9375rem}
.mm-person .pinfo small{display:block;color:var(--muted);font-size:.8125rem}
.mm-search{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:.9375rem;text-align:left}
.mm-sec{font-family:var(--fh);font-weight:700;font-size:.8125rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.mm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mm-grid:first-of-type{margin-top:14px}
.mm-grid button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:10px 6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);font-weight:600;font-size:.84375rem;line-height:1.15;text-align:center;color:var(--ink)}
.mm-grid .ic{width:24px;height:24px}
.mm-grid button[aria-current="page"]{background:var(--y);border-color:var(--y);color:var(--y-ink)}
.mm-todo{position:absolute;top:6px;right:6px;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#FFFFFF;font-size:.75rem;font-style:normal;font-weight:700;line-height:18px}
.mm-out{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:18px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;font-weight:600;color:var(--accent)}
@keyframes mFade{from{opacity:0}}
@keyframes mUp{from{transform:translateY(40px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.mmore,.mm-in{animation:none}.mtabs .ic{transition:none}}

/* ---------- apparence ---------- */
.btn.primary{background:var(--y);border-color:var(--y);color:var(--y-ink);box-shadow:none}
.btn.primary:hover{background:var(--y-hover);border-color:var(--y-hover)}
.btn{border-radius:var(--r-sm)}
.chip.today{background:var(--y);color:var(--y-ink)}
.banner{border-left-color:var(--y);border-radius:var(--r)}
.roles{border-radius:12px}
.roles button{border-radius:9px}
.notice,.card,.panel{border-radius:var(--r)}
/* aperçu de l’espace élève : « Aperçu » + choix de l’élève */
.m-apercu{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.m-apercu span{flex:none;padding:2px 8px;border-radius:999px;background:var(--y-soft);color:var(--ink);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.m-apercu select{min-width:0;max-width:220px}
/* barre « Enregistrer » des Paramètres : collée au-dessus des onglets, pas dessous */
.m .ps-save{bottom:calc(var(--mtabs-h) + 10px + env(safe-area-inset-bottom,0px))}
/* bouton de fermeture des fenêtres à la taille du doigt */
.dr-top .icon-btn{width:44px;height:44px;font-size:1.5rem;line-height:1;flex:none;display:grid;place-items:center}
.toasts{bottom:calc(var(--mtabs-h) + 18px + env(safe-area-inset-bottom,0px))}
.toast{background:var(--side);border-radius:12px}

/* écran de connexion (site/connexion.js) : mêmes couleurs et polices ; « html #gate » l’emporte sur ses propres styles */
html #gate{background:var(--bg);font-family:var(--font);color:var(--ink);align-items:flex-start;padding:0}
html #gate .g-card{border:0;border-radius:0;box-shadow:none;min-height:100%;width:100%;align-content:start;background:var(--bg)}
html #gate .g-side{background:var(--side);padding:calc(28px + env(safe-area-inset-top,0px)) 22px 26px;border-radius:0 0 26px 26px}
html #gate .g-brand{font-family:var(--fh);font-size:1.75rem;font-weight:700;letter-spacing:.01em}
html #gate .g-brand i{color:var(--y)}
html #gate .g-brand small{font-family:var(--font);font-size:.8125rem}
html #gate .g-side li::before{background:var(--y)}
html #gate .g-main{padding:24px 20px 32px}
html #gate .g-main h1{font-family:var(--fh);font-size:2rem;font-weight:700}
html #gate .g-btn{background:var(--y);border-color:var(--y);color:var(--y-ink);border-radius:12px;min-height:50px;font-weight:700}
html #gate .g-btn:hover{background:var(--y-hover)}
html #gate .g-btn.alt{background:var(--surface);border-color:var(--line-strong)}
html #gate .g-tabs{background:var(--role-bg);border-radius:12px}
html #gate .g-tabs button{border-radius:9px;font-size:.90625rem}
html #gate .g-field input,html #gate .g-field select,html #gate .g-field textarea{border-radius:12px;min-height:48px;border-color:var(--line-strong);font-size:1rem}
html #gate .g-field input:focus,html #gate .g-field select:focus,html #gate .g-field textarea:focus{outline-color:var(--focus);border-color:var(--focus)}
html #gate .g-link{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
html #gate .g-demo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
html #gate .g-demo-btns{flex-direction:column}
html #gate .g-demo-btns button{border-radius:12px;padding:12px 14px;text-align:left;font-size:.9375rem;border-color:var(--line)}
html #gate .g-demo-btns button:hover{background:var(--y-soft);border-color:var(--y)}

/* fenêtres : feuilles arrondies qui montent du bas, avec une poignée */
.drawer.sh-center,.drawer.sh-bottom,.drawer.sh-pop{border-radius:22px 22px 0 0}
.drawer.sh-center::before,.drawer.sh-bottom::before,.drawer.sh-pop::before{content:"";display:block;flex:none;width:42px;height:5px;border-radius:9px;background:var(--line-strong);margin:8px auto 0}
.dr-top h2{font-size:1.5rem}
.icon-btn{border-radius:12px}
.scrim{background:rgba(15,18,22,.45)}
}
/* Petites classes utilitaires (u-…) : elles remplacent les style="…" qui étaient écrits dans le code (IFT1005, ch. 3 : la présentation
 dans les feuilles de style, pas dans le HTML). Fichier lu en dernier ; la classe est répétée (.u-x.u-x.u-x) pour gagner sur les règles
 des autres fichiers, comme le faisait l’attribut style. */
.u-f0-130.u-f0-130.u-f0-130{flex:0 1 130px}
.u-f0-150.u-f0-150.u-f0-150{flex:0 1 150px}
.u-f0-160.u-f0-160.u-f0-160{flex:0 1 160px}
.u-f0-170.u-f0-170.u-f0-170{flex:0 1 170px}
.u-f0-180.u-f0-180.u-f0-180{flex:0 1 180px}
.u-f0-190.u-f0-190.u-f0-190{flex:0 1 190px}
.u-f0-200.u-f0-200.u-f0-200{flex:0 1 200px}
.u-f0-220.u-f0-220.u-f0-220{flex:0 1 220px}
.u-f0-70.u-f0-70.u-f0-70{flex:0 1 70px}
.u-f0-90.u-f0-90.u-f0-90{flex:0 1 90px}
.u-f1.u-f1.u-f1{flex:1}
.u-f1-200.u-f1-200.u-f1-200{flex:1 1 200px}
.u-f1-220.u-f1-220.u-f1-220{flex:1 1 220px}
.u-f1m.u-f1m.u-f1m{flex:1;min-width:0}

   Le fichier est là : l’option s’affiche. Pas de fichier : le site fonctionne sans elle, et ses données restent dans la base.
   On le met ou on l’enlève avec node outils/options.js <nom> on|off, ou depuis le hub (Projet › PompierNote).
   Le fichier voit tout le code du site et s’inscrit avec addOption(nom, { ... }). Le site, lui, ne passe que par opt(nom)
   et optAll() : rien ne manque quand le fichier n’est pas là.
   Ce qu’une option peut fournir (tout est facultatif, sauf page) :
     page(), sub                       sa page, qui porte son nom, et son menu à sections (voir SUBNAV)
     listen()                          ses données, une seule fois, quand la base est là

     notifs(D,jour,qui), search(add,rôle,admin), actions(A), render()
     profileStudent(e), profileTeacher(id)     ses panneaux dans « Mon profil »

function offDay(ds){
  const c=cfg();

  for(const k of c.conges||[]){ if(k&&k.du&&ds>=k.du&&ds<=(k.au||k.du)) return k.nom||'Congé'; }

}

   Le tableau rendu est figé : qui veut le trier ou le filtrer en fait une copie. */
let _so={c:null,g:null,a:null,m:new Map()};
function sessionsOn(ds){
  const D=S.data;
  if(_so.c!==D.cours||_so.g!==D.config||_so.a!==D.candidatures) _so={c:D.cours,g:D.config,a:D.candidatures,m:new Map()};
  let r=_so.m.get(ds);

  return r;
}
function sessionsOnRaw(ds){
  const d=parse(ds), j=(d.getDay()+6)%7+1;
  if(j>5||offDay(ds)) return [];
  const out=[];
  for(const c of S.data.cours){
    const ann=c.annulees||[];
    if(!((c.du&&ds<c.du)||(c.au&&ds>c.au))) for(const sl of c.creneaux||[]){
      if(+sl.jour!==j||(sl.du&&ds<sl.du)||(sl.au&&ds>sl.au)) continue;
      const a=toMin(sl.debut), b=toMin(sl.fin);
      if(isNaN(a)||isNaN(b)||b<=a) continue;
      const tag=`${ds}@${sl.id}`, cancelled=ann.includes(tag);
      out.push({kind:'cours',key:`${c.id}_${sl.id}_${ds}`,c,sl,date:ds,start:a,end:b,grp:c.groupe,tch:tchOf(c,`${c.id}_${sl.id}_${ds}`),salle:String(sl.salle||c.salle||'').trim(),cancelled,movedX:cancelled?(c.extras||[]).find(x=>x.de===tag)||null:null});
    }
    for(const x of c.extras||[]){
      if(x.date!==ds) continue;
      const a=toMin(x.debut), b=toMin(x.fin);
      if(isNaN(a)||isNaN(b)||b<=a) continue;
      out.push({kind:'cours',key:`${c.id}_${x.id}_${ds}`,c,sl:{id:x.id,jour:j,debut:x.debut,fin:x.fin,salle:x.salle||''},extra:x,date:ds,start:a,end:b,grp:c.groupe,tch:tchOf(c,`${c.id}_${x.id}_${ds}`),salle:String(x.salle||c.salle||'').trim(),cancelled:ann.includes(`${ds}@${x.id}`)});
    }
  }
  return out.sort((x,y)=>x.start-y.start||x.end-y.end);
}
/* On parle d’avant-midi, d’après-midi ou de toute la journée, jamais d’heures. */

function moment(a,b){const cm=cfg().moments, m=cm?(toMin(PERIODES[0].fin)+toMin(PERIODES[1].debut))/2:12*60;if(a<m&&b>m+60)return 'Toute la journée';return a<m?'Avant-midi':'Après-midi';}

  out=out.concat(S.data.examens.filter(e=>!e.seance&&e.date>=from&&e.date<=to).map(examItem));

function isPast(s){const t=todayISO();return s.date<t||(s.date===t&&s.start<=nowMin());}

function attInfo(s){
  if(s.cancelled) return {state:'cancelled',c:{},marked:0,total:0,past:isPast(s),due:false};
  const els=studentsOf(s.c.groupe), p=presDoc(s.key), st=(p&&p.statuts)||{};
  const c={P:0,A:0,R:0,M:0}; let marked=0;
  for(const e of els){const v=st[e.id];if(c[v]!=null){c[v]++;marked++;}}
  const past=isPast(s);

  const state=els.length&&marked>=els.length?'done':marked>0?'partial':past?(isActivity(s.c)?'none':'todo'):'future';
  return {state,c,marked,total:els.length,past,doc:p,due:past&&els.length>0&&(state==='todo'||state==='partial')};

function statusChip(s,mode){return (!s.cancelled&&profAbsent(s)?'<span class="chip bad">Enseignant absent</span>':'')+statusChip0(s,mode);}
function statusChip0(s,mode){

/* Numéro du cours dans l’horaire annuel : « 7.5 » devient « Cours 7.5 » */
function sessLabel(s){

  if(!l||l.toLowerCase()===String(s.c&&s.c.titre||'').toLowerCase()) return '';
  /* « 8.1–8.2 » : deux cours ; « 16-6 » : un seul cours, numéroté avec un trait d’union */
  const r=/^(\d+(?:[.,-]\d+)*)\s*–\s*(\d+(?:[.,-]\d+)*)$/.exec(l)||/^(\d+(?:[.,]\d+)*)\s+-\s+(\d+(?:[.,]\d+)*)$/.exec(l);

/* Étiquettes d’une séance de l’horaire annuel (Pratique, Théorie, Examen, Ménage…), comme sur le site. */
const TAGCHIP={Pratique:'ok',Théorie:'info',Examen:'bad',Reprise:'bad',Simulation:'k2',Sport:'k2',Stage:'k5',Visite:'k4',Musée:'k4',Ménage:'warn','Ménage ?':'warn',Maison:'off',Congé:'off'};

const tagsOf=s=>(s.extra&&s.extra.tags)||(s.sl&&s.sl.type?withAct([],s.sl.type):[]);

const PERIODES=[{k:'am',label:'Avant-midi',debut:'08:00',fin:'11:00'},{k:'pm',label:'Après-midi',debut:'12:00',fin:'15:00'},{k:'jour',label:'Toute la journée',debut:'08:00',fin:'15:00'}];
const ACTIVITES=[{k:'theorie',label:'Théorie',tags:['Théorie']},{k:'pratique',label:'Pratique',tags:['Pratique']},{k:'examen',label:'Examen',tags:['Examen']},{k:'examen-t',label:'Examen théorique',tags:['Examen','Théorie']},{k:'examen-p',label:'Examen pratique',tags:['Examen','Pratique']},{k:'reprise',label:'Reprise',tags:['Reprise']},{k:'simulation',label:'Simulation',tags:['Simulation']},{k:'conge',label:'Congé / journée spéciale',tags:['Congé']},{k:'visite',label:'Visite',tags:['Visite']},{k:'stage',label:'Stage',tags:['Stage']},{k:'activite',label:'Activité',tags:[]}];
const ACT_TAGS=new Set(['Théorie','Pratique','Examen','Reprise','Simulation','Visite','Congé','Stage']);

   Elle est notée dans la classe (groupes/<id>.menage : liste de dates) ; les anciennes étiquettes « Ménage »
   d’une séance de la classe ce jour-là comptent aussi. */
let choreMemo=new Map();
function choreDay(gid,date){
  if(!gid||!date||cfg().menage===false) return '';

  let r='';
  const g=byId(S.data.groupes,gid);
  if(g&&Array.isArray(g.menage)&&g.menage.includes(date)) r='oui';
  else for(const x of sessionsOn(date)){
    if(x.grp!==gid||x.kind==='exam'||x.cancelled) continue;
    const t=tagsOf(x);if(t.includes('Ménage')){r='oui';break;}if(t.includes('Ménage ?'))r='maybe';
  }

}
const choreOf=s=>!s||s.kind==='exam'||s.cancelled?'':choreDay(s.grp,s.date);
async function setChoreDay(gid,date,on){
  const g=byId(S.data.groupes,gid);if(!g||S.busy)return;
  const days=new Set(Array.isArray(g.menage)?g.menage:[]);
  if(on) days.add(date); else days.delete(date);
  const jobs=[()=>col('groupes').doc(gid).update({menage:[...days].sort()})];
  // en retirant la corvée, les anciennes étiquettes « Ménage » des séances de ce jour disparaissent aussi
  if(!on) for(const c of S.data.cours.filter(c=>c.groupe===gid)){
    if(!(c.extras||[]).some(x=>x.date===date&&(x.tags||[]).some(t=>CHORE_TAGS.has(t)))) continue;

  S.busy=true;render();
  await write(async()=>{for(const j of jobs)await j();},on?'Corvée de ménage ajoutée pour la journée':'Corvée de ménage retirée');
  S.busy=false;render();
}

function sessionsBetween(from,to){

function periodRange(p){
  const t=todayISO(), d=new Date();
  if(p==='semaine') return [iso(monday(d)),t];
  if(p==='mois') return [iso(new Date(d.getFullYear(),d.getMonth(),1)),t];
  return [yearStart(),t];
}

/* ---------- Rendu : tableau de la semaine ---------- */
/* Carte d’un cours : heure et activité en haut, nom, enseignant et local, puis une ligne discrète
   (présences, Ménage…) seulement quand il y a quelque chose à dire. */
function cardKind(tags){
  const k=actOf(tags), used=new Set();let kind='';
  if(k==='examen-t'||k==='examen-p'){kind=k==='examen-t'?'Examen théorique':'Examen pratique';used.add('Examen').add(k==='examen-t'?'Théorie':'Pratique');}
  else{const f=tags.find(x=>TAGTONE[x]);if(f){kind=f;used.add(f);}}
  return {kind,flags:tags.filter(x=>!used.has(x))};
}
function cardStatus(s,mode){
  if(s.kind==='exam'||s.cancelled) return '';
  const moved=s.extra&&s.extra.de?'<span class="cc-st info">Déplacé ici</span>':'';
  if(mode==='student') return moved;
  const a=attInfo(s);
  let aff='';
  if(mode==='admin'&&!isPast(s)){const f=staffing(s);aff=(f.clash.length?`<span class="cc-st bad" title="${esc(f.clash.map(tName).join(', ')+W(' : aussi dans une autre séance à ce moment',' : aussi dans un autre cours à ce moment'))}">Conflit</span>`:'')+(f.rclash.length?`<span class="cc-st bad" title="${esc(ressNames([...new Set(f.rclash.map(x=>x.id))])+' : déjà pris à ce moment')}">${ressClashLbl(f.rclash)}</span>`:'')+(f.open>0?`<span class="cc-st warn" title="Enseignants attribués sur enseignants requis">${f.firm}/${f.requis} ens.</span>`:f.requis>1?`<span class="cc-st ok">${f.firm}/${f.requis} ens.</span>`:'')+(f.pending.length?`<span class="cc-st info">${f.pending.length} cand.</span>`:'')+(f.remp.length?'<span class="cc-st warn">Remplacement</span>':'');}
  return moved+aff+(a.state==='done'?'<span class="cc-st ok">Présences faites</span>':a.state==='partial'?`<span class="cc-st warn">${a.marked}/${a.total} marqués</span>`:a.state==='todo'?'<span class="cc-st warn">Présences à faire</span>':'');
}
const cardTop=(time,kind,ch)=>`<span class="cc-top"><span class="cc-time">${time}</span><span class="cc-tr">${ch?`<span class="cc-chore-pill${ch==='maybe'?' maybe':''}" title="Corvée de ménage de la classe, toute la journée">${icon('broom')}<span class="vh">Corvée de ménage</span></span>`:''}${kind?`<span class="cc-kind">${esc(kind)}</span>`:''}</span></span>`;

  const {kind,flags}=cardKind(tagsOf(s)), ch=dayChore?'':choreOf(s), foot=s.cancelled?'':cardStatus(s,mode)+flags.filter(t=>!CHORE_TAGS.has(t)).map(t=>`<span class="cc-flag">${esc(t)}</span>`).join('');

    ${cardTop(momentOf(s),kind,ch)}
    <span class="cc-title"><span class="tstart">${fmtT(s.start)}</span><strong>${codeOf(c)}${esc(c.titre)}</strong></span>${meta?`<span class="cc-meta">${esc(meta)}</span>`:''}${note?`<span class="cc-note">${esc(note)}</span>`:''}${foot?`<span class="cc-foot">${foot}</span>`:''}${badge?`<span class="cc-badge ${badge[0]}">${badge[1]}</span>`:''}</button>`;

function rowLabel(name){
  const m=/^(groupe|classe)\s+(.+)$/i.exec(String(name||''));
  return m?`<small>${esc(m[1].charAt(0).toUpperCase()+m[1].slice(1).toLowerCase())}</small>${esc(m[2])}`:esc(name);
}

const profAbsent=s=>{if(!s||s.kind==='exam'||!s.c)return false;const abs=S.data.absProfs[s.date]||[];return (s.tch||[]).some(t=>t&&abs.includes(t));};
/* Les enseignants d’un cours, en court : « M. Leduc +1 » */

/* ---------- Accueil : la journée de chacun ----------
   La page où l’on arrive en se connectant, et où l’on revient en cliquant sur le logo ou le nom du site.
   À gauche, la journée en ligne du temps (ou le prochain jour de classe) ; à droite, l’avancement de l’année,
   ce qui est à faire (les notifications) et les prochains examens ; chacun ne voit que ce qui le concerne.

const homePage=()=>S.role==='service'?'recrues':'accueil';

/* Le titre de l’accueil : « Bonjour Marie » (le jour est en tête de la journée) */
function accueilTitle(){
  const nm=S.role==='teacher'?tName(S.teacher):S.role==='student'?(byId(S.data.eleves,S.student)||{}).nom||'':whoAmI();
  const first=String(nm||'').trim().split(/\s+/)[0];

}
const homeMine=s=>S.role==='teacher'?s.tch.includes(S.teacher):S.role==='student'?s.grp===S.group:true;
/* Le jour à montrer : aujourd’hui s’il y a des séances, sinon le prochain jour de classe (trois semaines au plus) */
function homeDay(){
  const t=parse(todayISO());
  for(let i=0;i<21;i++){const ds=iso(addDays(t,i)), ss=sessionsOn(ds).filter(homeMine);if(ss.length) return {ds,i,ss:ss.slice().sort((a,b)=>a.start-b.start||a.end-b.end)};}
  return null;
}
/* Les classes d’un enseignant : celles où il donne une séance dans les quatre prochaines semaines */
function homeGroups(){const t=parse(todayISO()), g=new Set();for(let i=0;i<28;i++)for(const s of sessionsOn(iso(addDays(t,i))))if(s.tch.includes(S.teacher))g.add(s.grp);return g;}
/* Présences en retard cette semaine (séances passées dont les présences ne sont pas prises) */
const homeLate=()=>weekItems().filter(s=>s.kind!=='exam'&&homeMine(s)&&attInfo(s).due).length;

/* La ligne du temps : l’heure, un point de la couleur du module, la carte de la séance ; « Maintenant » entre le passé et la suite */
function homeTimeline(day){
  const now=day.i===0?nowMin():null;let out='', prev=null, nowDone=now==null;
  const nowLi=()=>`<li class="tl-now"><span class="tl-h">${fmtT(now)}</span><span class="tl-dot" aria-hidden="true"></span><span class="tl-nl">Maintenant</span></li>`;
  for(const s of day.ss){
    if(!nowDone&&s.start>now){out+=nowLi();nowDone=true;}
    const on=now!=null&&s.start<=now&&now<s.end&&!s.cancelled, meta=[S.role==='student'?'':gName(s.grp),S.role==='teacher'?'':tchNames(s),sessLabel(s),s.salle?'Local '+s.salle:''].filter(Boolean).join(' · ');
    const st=on?'<span class="chip today">En cours</span>':S.role==='student'?(s.cancelled?'<span class="chip off">Annulé</span>':''):statusChip(s,S.role);
    out+=`<li class="tl-it ${tone(s.c)}${s.cancelled?' off':''}"><span class="tl-h">${prev===s.start+'-'+s.end?'':fmtT(s.start)+'<small>à '+fmtT(s.end)+'</small>'}</span><span class="tl-dot" aria-hidden="true"></span>
      <button type="button" class="tl-card" data-act="sess-at" data-key="${esc(s.key)}" data-date="${s.date}"><span class="tl-t"><b>${codeOf(s.c)}${esc(s.c.titre)}</b>${choreChip(s)}</span><span class="tl-m">${esc(meta)}</span>${st?`<span class="tl-s">${st}</span>`:''}</button></li>`;
    prev=s.start+'-'+s.end;
  }
  if(!nowDone) out+=nowLi();
  return `<ol class="tl-day">${out}</ol>`;
}
/* L’année scolaire : un anneau d’avancement, la semaine en cours et le programme */
function homeYear(){
  const c=cfg(), t=todayISO(), a=c.debut, b=c.fin;
  if(!a||!b||b<=a) return '';
  const tot=daysBetween(a,b), pct=Math.max(0,Math.min(100,Math.round(daysBetween(a,t)*100/tot)));
  const wk=Math.max(1,Math.min(Math.ceil((tot+1)/7),Math.floor(daysBetween(iso(monday(parse(a))),t)/7)+1)), wks=Math.ceil((daysBetween(iso(monday(parse(a))),b)+1)/7);
  const ms=comps(), h=ms.reduce((n,k)=>n+modTot(k),0), u=ms.reduce((n,k)=>n+(+k.unites||0),0);
  const prog=[c.programme||'',h?h+' h':'',u?u+' unités':''].filter(Boolean).join(' · ');
  const when=t<a?'Débute le '+shortDate(parse(a)):t>b?'Terminée le '+shortDate(parse(b)):`<b>Semaine ${wk}</b> sur ${wks}`;
  return `<section class="panel hm-year"><div class="ring" role="img" aria-label="${pct} % de l’année scolaire"><svg viewBox="0 0 36 36" aria-hidden="true"><circle class="rt" cx="18" cy="18" r="15.915"/><circle class="rv" cx="18" cy="18" r="15.915" stroke-dasharray="${pct} 100"/></svg><b>${pct} %</b></div>
    <div class="hm-yt"><h2>${S.role==='student'?'Mon année':'L’année scolaire'}</h2><p>${when}</p><p class="muted">${esc(c.annee||'')}${c.annee?' · ':''}du ${esc(shortDate(parse(a)))} au ${esc(shortDate(parse(b)))}</p>${prog?`<p class="muted">${esc(prog)}</p>`:''}</div></section>`;
}

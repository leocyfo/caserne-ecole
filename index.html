function courseLoad(c){
  const w=activeSlots(c).length, dated=datedOf(c), ann=c.annulees||[];
  const mins=dated.reduce((n,x)=>n+(ann.includes(`${x.date}@${x.id}`)?0:sessMinutes(x)),0), h=Math.round(mins/60);
  const label=w&&!dated.length?`${w} / sem.`:dated.length?String(dated.length)+(w?` + ${w} / sem.`:''):'—';
  const hp=heuresOf(c), hours=hp?`<span class="chip ${h>=hp?'ok':h>=hp*0.8?'warn':'bad'}" title="Heures planifiées / heures prévues au programme">${h} / ${hp} h</span>`:dated.length?`${h} h`:'—';
  return {label,hours};
}

/* Rôle d’un élève dans sa classe : capitaine ou lieutenant (couleur de sa carte et de son étiquette) */
/* Le grade d’un élève : sa place dans la liste des grades (Paramètres > Élèves), -1 s’il n’en a pas ;
   « Lieutenant » seul retrouve « Lieutenant 1 » (même premier mot). Sa couleur sert aux cartes et aux étiquettes. */
const gradeIdx=f=>{const x=String(f||'').trim().toLowerCase();if(!x)return -1;const gs=gradesL();let i=gs.findIndex(g=>g.nom.toLowerCase()===x);
  if(i<0){const w=x.split(/\s+/)[0];i=gs.findIndex(g=>g.nom.toLowerCase().split(/\s+/)[0]===w);}return i;};
const fnKind=f=>{const i=gradeIdx(f);return i<0?'':gradesL()[i].c||'gris';};
/* ---------- Pages : élèves ---------- */
/* Notes d’un élève, d’après les résultats d’examens : moyenne des notes en %, examens réussis, examens à reprendre */
function studentNotes(){
  const out={};
  for(const d of Object.values(S.data.resultats||{})){
    const r=(d&&d.resultats)||{}, p=(d&&d.pct)||{};
    for(const [id,v] of Object.entries(r)){
      if(!v) continue;
      const o=out[id]||(out[id]={sum:0,np:0,ok:0,tot:0,todo:0});
      o.tot++;if(v==='reussi'||v==='reprise')o.ok++;if(v==='echec'||v==='absent')o.todo++;
      const x=p[id];if(x!=null&&x!==''&&!isNaN(+x)){o.sum+=+x;o.np++;}
    }
  }
  for(const o of Object.values(out)) o.avg=o.np?Math.round(o.sum/o.np):null;
  return out;
}
/* Ordre des grades : celui de la liste, puis les autres fonctions, puis sans grade */
const gradeRank=f=>{const x=String(f||'').trim();if(!x)return 999;const i=gradeIdx(x);return i<0?500:i;};
/* Nom de famille d’abord (« Beaulieu Alexandre ») pour trier par nom */
const famKey=n=>{const p=String(n||'').trim().split(/\s+/);return p.length>1?p.slice(1).join(' ')+' '+p[0]:String(n||'');};
const EL_SORTS=[['num','numéro'],['nom','nom'],['classe','classe'],['grade','grade'],['note-d','note ↓'],['note-a','note ↑'],['pres','présence ↑']];
/* Filtre « Afficher » : un grade (g0, g1… dans l’ordre de la liste), sans grade, ou un état des notes */
const elFilters=()=>gradesL().map((g,i)=>['g'+i,g.nom]).concat([['none','Sans grade'],['sous','Moyenne sous le seuil'],['rep','Examens à reprendre']]);
function studentsPage(){
  if(S.pg.fiche) return studentFiche();
  const st=S.pg, q=String(st.q||'').trim().toLowerCase(), g=st.g||'';
  const per=st.period||'mois', [from,to]=periodRange(per);
  ensureTerm(from);
  const stats=studentStats(from,to);
  const ff=elFilters().some(x=>x[0]===st.ff)?st.ff:'', fg=/^(g\d+|none)$/.test(ff)?ff:'', fn=['sous','rep'].includes(ff)?ff:'', so=EL_SORTS.some(x=>x[0]===st.so)?st.so:'num', notes=studentNotes(), sl=seuil();
  let els=sortElsByClass(S.data.eleves);
  if(g) els=els.filter(e=>e.groupe===g);
  if(q) els=els.filter(e=>String(e.nom||'').toLowerCase().includes(q));
  if(fg) els=els.filter(e=>fg==='none'?gradeIdx(e.fonction)<0:gradeIdx(e.fonction)===+fg.slice(1));
  if(fn==='sous') els=els.filter(e=>notes[e.id]&&notes[e.id].avg!=null&&notes[e.id].avg<sl);
  if(fn==='rep') els=els.filter(e=>notes[e.id]&&notes[e.id].todo>0);
  /* tri : à égalité, l’ordre habituel (classe, puis numéro) départage */
  const base=new Map(els.map((e,i)=>[e.id,i])), avg=e=>notes[e.id]&&notes[e.id].avg!=null?notes[e.id].avg:null, pr=e=>rateOf(stats[e.id]);
  const last=(x,y,f)=>x==null&&y==null?0:x==null?1:y==null?-1:f(x,y);
  const cmp={nom:(a,b)=>collator.compare(famKey(a.nom),famKey(b.nom)),classe:(a,b)=>collator.compare(gName(a.groupe),gName(b.groupe)),grade:(a,b)=>gradeRank(a.fonction)-gradeRank(b.fonction),
    'note-d':(a,b)=>last(avg(a),avg(b),(x,y)=>y-x),'note-a':(a,b)=>last(avg(a),avg(b),(x,y)=>x-y),pres:(a,b)=>last(pr(a),pr(b),(x,y)=>x-y)}[so];
  if(cmp) els=[...els].sort((a,b)=>cmp(a,b)||base.get(a.id)-base.get(b.id));
  const tb=`<div class="toolbar"><input class="search" id="s-q" type="search" placeholder="Rechercher un élève" aria-label="Rechercher un élève" autocomplete="off" value="${esc(S.pg.q||'')}"><select id="s-g" aria-label="Classe"><option value="">Toutes les classes</option>${groups().map(x=>`<option value="${esc(x.id)}"${g===x.id?' selected':''}>${esc(x.nom)}</option>`).join('')}</select><select id="s-ff" aria-label="Afficher"><option value="">Tous les élèves</option><optgroup label="Grade">${elFilters().filter(x=>/^(g\d+|none)$/.test(x[0])).map(([k,l])=>`<option value="${k}"${ff===k?' selected':''}>${esc(l)}</option>`).join('')}</optgroup><optgroup label="Notes (seuil ${sl} %)">${elFilters().filter(x=>x[0]==='sous'||x[0]==='rep').map(([k,l])=>`<option value="${k}"${ff===k?' selected':''}>${l}</option>`).join('')}</optgroup></select><select id="s-so" aria-label="Trier par">${EL_SORTS.map(([k,l])=>`<option value="${k}"${so===k?' selected':''}>Tri : ${l}</option>`).join('')}</select>${periodSeg(per)}<span class="grow"></span><button class="btn" type="button" id="st-import" data-act="st-import" title="Importer une liste" aria-label="Importer une liste">${icon('up')}<span class="t-long">Importer une liste</span></button><button class="btn primary" type="button" data-act="new-student">${icon('plus')}<span class="t-long">Ajouter un élève</span><span class="t-short">Ajouter</span></button></div>`;
  if(!S.data.eleves.length) return tb+emptyBox('Aucun élève inscrit','Ajoutez des élèves un à la fois ici, ou collez une liste complète dans le menu Classes.');
  const body=els.map(e=>{const s=stats[e.id], r=rateOf(s);
    const a=s?s.A+s.M:0, rt=s?s.R:0, cls=rateCls(r);
    const fk=fnKind(e.fonction);
    return `<tr class="row-link" data-act="student" data-id="${esc(e.id)}"${fk?` data-fn="${fk}"`:''}><td><span class="tb-who"><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span><span><button class="link" type="button" data-act="student" data-id="${esc(e.id)}">${esc(e.nom)}</button>${e.fonction?`<span class="role-chip${fk?' rc-'+fk:''}">${esc(e.fonction)}</span>`:''}</span></span></td><td class="tb-cls"><span class="tb-who"><span class="cl-num sm" aria-hidden="true">${esc(String(gName(e.groupe)).replace(/^(Classe|Groupe)\s+/i,'').slice(0,4))}</span><span class="muted sm">${esc(gName(e.groupe))}</span></span></td><td class="tb-top">${r==null?'<span class="muted tb-empty">—</span>':`<div class="cl-big tb-rate ${cls}"><b>${r} %</b><div class="meter ${cls}" aria-hidden="true"><i style="width:${r}%"></i></div></div>`}</td><td class="num" data-l="Note">${avg(e)!=null?`<span class="tb-n${avg(e)<sl?' bad':''}">${avg(e)} %</span>`:'<span class="muted tb-empty">—</span>'}</td><td class="num" data-l="Absences"><span class="tb-n ${a?'bad':'zero'}">${a}</span></td><td class="num" data-l="Retards"><span class="tb-n ${rt?'warn':'zero'}">${rt}</span></td><td class="tb-tel ie-cell">${e.telephone?esc(e.telephone):'<span class="muted tb-empty">—</span>'}${ieBtn('el-tel',e.id)}</td></tr>`;}).join('');
  return tb+`<p class="summary"><span><b>${els.length}</b>${els.length>1?'élèves':'élève'}</span><span>Présences comptées depuis le ${esc(longDate(parse(from)))}</span>${S.termLoaded?'':'<span>Chargement des présences…</span>'}</p>
    <div class="tbl-wrap"><table class="tbl stack st-cards"><thead><tr><th>Élève</th><th>Classe</th><th>Présence</th><th class="num" title="Moyenne des notes d’examens en %">Note</th><th class="num">Absences</th><th class="num">Retards</th><th>Téléphone</th></tr></thead><tbody>${body||'<tr><td colspan="7" class="muted">Aucun élève ne correspond à la recherche ou aux filtres.</td></tr>'}</tbody></table></div>`;
}

/* ---------- Photos de profil (élèves et personnel) ----------
   Gardée dans la fiche de la personne (eleves/<id>.photo, enseignants/<id>.photo) : une image JPEG carrée de 240 px,
   recadrée au centre et allégée dans le navigateur (une quinzaine de Ko). L’administration la choisit en cliquant
   sur la photo (ou les initiales) de la fiche, ou dans « Modifier » ; sans photo, les initiales restent. */
const PH_COL={eleve:'eleves',staff:'enseignants'};
const photoOf=id=>{const p=byId(S.data.eleves,id)||byId(S.data.enseignants,id);return (p&&p.photo)||'';};
const canPhoto=()=>isAdmin()&&S.conn==='shared'&&!S.archive;
/* La photo (ou les initiales) ; pour l’administration, un clic choisit une image (l’appareil photo sur un téléphone) */
const photoPick=(kind,p,cls)=>{
  const av=avHTML(p.nom,p.photo||'',cls), lbl=(p.photo?'Changer la photo de ':'Ajouter une photo de ')+(p.nom||'');
  return canPhoto()&&p.id?`<label class="ph-pick" title="${esc(p.photo?'Changer la photo':'Ajouter une photo')}">${av}<span class="ph-cam" aria-hidden="true">${icon('cam')}</span><input type="file" accept="image/*" class="vh" data-photo="${kind}" data-id="${esc(p.id)}" aria-label="${esc(lbl)}"></label>`:av;

/* Dans « Modifier » : la photo, puis Changer / Retirer (enregistré tout de suite, sans attendre le bouton du formulaire) */
const photoRow=(kind,p)=>!p?'':`<div class="ph-row">${photoPick(kind,p,'lg')}<div><b>Photo</b><p class="help">${canPhoto()?(p.photo?'Cliquez sur la photo pour la changer.':'Cliquez sur les initiales pour choisir une photo.'):'Seule l’administration peut changer la photo.'}</p>${p.photo&&canPhoto()?`<button class="btn sm ghost" type="button" data-act="photo-del" data-kind="${kind}" data-id="${esc(p.id)}">Retirer la photo</button>`:''}</div></div>`;
function readPhoto(file){
  return new Promise((ok,ko)=>{
    if(!file||!/^image\//.test(file.type)) return ko(new Error('Choisissez une image (photo JPEG, PNG…).'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const n=240, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(w,h), c=document.createElement('canvas'), x=c.getContext('2d');
      c.width=c.height=n;x.fillStyle='#FFFFFF';x.fillRect(0,0,n,n);x.drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,n,n);
      URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);ko(new Error('Cette image ne peut pas être lue.'));};
    img.src=url;
  });
}

/* ---------- Heures enseignées : par enseignant et par mois, pour la paie des instructeurs ----------
   Une séance compte une fois qu’elle a eu lieu (passée, non annulée), pour chaque enseignant qui y était attribué
   et qui n’était pas marqué absent ce jour-là. */
function taughtRows(){
  const out=[];
  for(const s of sessionsBetween(yearStart(),todayISO())){
    if(s.kind!=='cours'||s.cancelled||!isPast(s)) continue;
    const abs=S.data.absProfs[s.date]||[];
    for(const id of new Set(s.tch)) if(id&&byId(S.data.enseignants,id)&&!abs.includes(id)) out.push({t:id,s,h:sHours(s)});
  }
  return out;
}
const hrMonths=()=>{const out=[];let d=parse(yearStart());d=new Date(d.getFullYear(),d.getMonth(),1);const end=new Date();while(d<=end&&out.length<14){out.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d=new Date(d.getFullYear(),d.getMonth()+1,1);}return out;};
const hrDate=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1);
const hrMonthName=m=>`${fMonth.format(hrDate(m))} ${hrDate(m).getFullYear()}`;
const hrFmt=h=>String(Math.round(h*10)/10).replace('.',',');
function hoursPage(segP){
  const rows=taughtRows(), ms=hrMonths(), cur=S.pg.hm==='all'||ms.includes(S.pg.hm)?S.pg.hm:ms[ms.length-1], by={}, totM={};let tot=0;
  for(const r of rows){const m=r.s.date.slice(0,7), o=by[r.t]||(by[r.t]={tot:0});o[m]=(o[m]||0)+r.h;o.tot+=r.h;totM[m]=(totM[m]||0)+r.h;tot+=r.h;}
  const ts=staff().filter(p=>by[p.id]||(isTeacher(p)&&p.statut!=='Inactif')), all=cur==='all', sel=all?tot:(totM[cur]||0);
  const cell=(h,m)=>`<td class="num${m===cur?' on':''}">${h?hrFmt(h):'<span class="muted">—</span>'}</td>`;
  const tb=`<div class="toolbar">${segP}<p class="summary u-m0"><span><b id="hr-sum">${hrFmt(sel)}</b>${sel>=2?'heures':'heure'} ${all?'depuis la rentrée':'en '+esc(hrMonthName(cur))}</span></p><span class="grow"></span><button class="btn primary" type="button" id="hr-export" data-act="hr-export" data-m="${esc(cur)}"${sel?'':' disabled'}>${icon('down')}Exporter ${all?'l’année':esc(fMonth.format(hrDate(cur)))}</button></div>`;
  if(!ts.length) return tb+emptyBox('Aucun enseignant','Ajoutez les enseignants dans la liste du personnel.');
  const th=m=>`<th class="num${m===cur?' on':''}"><button type="button" class="hr-m" id="hm-${m}" data-act="pg-set" data-k="hm" data-v="${m}" aria-pressed="${m===cur}" title="${esc('Choisir '+hrMonthName(m)+' pour l’export')}">${esc(fMonthS.format(hrDate(m)))}</button></th>`;
  const body=ts.map(p=>{const o=by[p.id]||{tot:0};
    return `<tr class="row-link" data-act="staff" data-id="${esc(p.id)}"><td><span class="tb-who">${avHTML(p.nom,p.photo||'')}<span><button class="link" type="button" data-act="staff" data-id="${esc(p.id)}">${esc(p.nom)}</button><small class="tb-sub">${esc(p.fonction||'Enseignant')}</small></span></span></td>${ms.map(m=>cell(o[m],m)).join('')}<td class="num${all?' on':''}"><b>${o.tot?hrFmt(o.tot):'—'}</b></td></tr>`;}).join('');
  const foot=`<tr class="hr-tot"><td>Total</td>${ms.map(m=>cell(totM[m],m)).join('')}<td class="num${all?' on':''}"><b>${tot?hrFmt(tot):'—'}</b></td></tr>`;
  return tb+`<div class="tbl-wrap"><table class="tbl hr-tbl" id="hr-tbl"><thead><tr><th>Enseignant</th>${ms.map(th).join('')}<th class="num${all?' on':''}"><button type="button" class="hr-m" id="hm-all" data-act="pg-set" data-k="hm" data-v="all" aria-pressed="${all}" title="Choisir toute l’année pour l’export">Total</button></th></tr></thead><tbody>${body}${foot}</tbody></table></div>
    <p class="help u-mt10">Heures des ${W('séances données','cours donnés')} depuis la rentrée. Une ${W('séance annulée','période annulée')} ou un enseignant marqué absent ne compte pas. Cliquez un mois pour le choisir, puis Exporter.</p>`;
}
/* Fichier pour la paie : un sommaire par enseignant, puis le détail séance par séance */
function hoursCSV(m){
  const rows=taughtRows().filter(r=>m==='all'||r.s.date.slice(0,7)===m);
  if(!rows.length){toast('Aucune heure à exporter pour cette période.','bad');return null;}
  const T=id=>byId(S.data.enseignants,id)||{}, fn=id=>T(id).fonction||'Enseignant';
  rows.sort((a,b)=>collator.compare(T(a.t).nom||'',T(b.t).nom||'')||a.s.date.localeCompare(b.s.date)||a.s.start-b.s.start);
  const sum=new Map();for(const r of rows){const o=sum.get(r.t)||{n:0,h:0};o.n++;o.h+=r.h;sum.set(r.t,o);}
  const L=[['Enseignant','Fonction',W('Séances','Cours'),'Heures']];
  for(const [id,o] of sum) L.push([T(id).nom,fn(id),o.n,hrFmt(o.h)]);
  L.push([],['Enseignant','Fonction','Date','Classe',W('Module','Cours'),W('Séance','Détail'),'Type','Moment','Heures']);
  for(const r of rows){const s=r.s;L.push([T(r.t).nom,fn(r.t),s.date,gName(s.grp),(s.c.code?s.c.code+' ':'')+s.c.titre,sessLabel(s),cardKind(tagsOf(s)).kind||'',momentOf(s),hrFmt(r.h)]);}
  return {name:`heures-${m==='all'?(String(cfg().annee||'').replace(/[^0-9A-Za-z]+/g,'-').replace(/^-|-$/g,'')||'annee'):m}.csv`,text:csvText(L)};
}

/* Présences d’une classe sur une période : cours passés, complétés, à rattraper, et totaux des élèves */
function classAtt(gid,from,to,stats,sess){
  const els=studentsOf(gid), mine=sess.filter(s=>s.grp===gid);
  let done=0;const missing=[];for(const s of mine){const a=attInfo(s);if(a.state==='done')done++;else if(a.due)missing.push(s);}
  let P=0,A=0,R=0,M=0,N=0;for(const e of els){const s=stats[e.id];if(s){P+=s.P;A+=s.A;R+=s.R;M+=s.M;N+=s.n;}}
  return {els,past:mine.length,done,missing:missing.sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start),P,A,R,M,N,rate:N?Math.round((P+R)/N*100):null};
}

/* ---------- Pages : examens ---------- */
/* Résultats : réussi, échec, absent (à reprendre) et réussi en reprise */
const RES={reussi:['ok','Réussi'],echec:['bad','Échec'],absent:['warn','Absent'],reprise:['info','Réussi en reprise'],echecf:['bad','Échec du module']};
const resOk=v=>v==='reussi'||v==='reprise', resKo=v=>v==='echec'||v==='absent';
/* Notes en % : facultatives. resultats/<examen>.pct = { élève: note } ; une note inscrit le résultat (réussi à partir du seuil). */
const seuil=()=>{const n=+cfg().seuil;return n>=1&&n<=100?Math.round(n):60;};
const noteTxt=n=>n==null?'':`${String(Math.round(n*10)/10).replace('.',',')} %`;
function examPctOf(x){
  if(S.role==='student'&&cfg().notesEleves===false) return {};
  const d=S.data.resultats[resKeyOf(x)], p=Object.assign({},d&&d.pct), mine=(S.data.mesPct||{})[resKeyOf(x)];
  if(mine!=null&&S.student&&p[S.student]==null) p[S.student]=mine;
  return p;
}
const sxId=key=>'sx-'+String(key).replace(/[^A-Za-z0-9_-]/g,'-');
const resKeyOf=x=>x.fromSess?sxId(x.key):x.e.id;
const resElId=(el,id)=>(String(el)+'__'+String(id)).replace(/[^A-Za-z0-9_-]/g,'-');
/* Résultats d’un examen. Les anciens résultats, rangés dans la fiche d’examen, restent lus tant qu’on ne les a pas réenregistrés. */
function examResOf(x){
  const d=S.data.resultats[resKeyOf(x)];
  let r=d&&d.resultats;
  if(!r){if(x.fromSess){const old=S.data.examens.find(q=>q.seance===x.key);r=old&&old.resultats;}else r=x.e&&x.e.resultats;}
  r=r||{};
  const mine=S.data.mesRes[resKeyOf(x)];
  return mine&&S.student&&!r[S.student]?Object.assign({},r,{[S.student]:mine}):r;
}
/* Enregistre les résultats d’un examen, et le résultat de chaque élève touché dans sa propre fiche */
/* pct : les notes en % par élève ; reps : l’issue des reprises. Sans ces paramètres, ce qui est déjà inscrit est gardé.
   Une reprise n’est gardée que tant que le résultat de l’élève en vient (réussi en reprise, ou échec du module). */
async function writeResults(x,res,msg,pct,reps){
  const id=resKeyOf(x), prev=examResOf(x), cur=S.data.resultats[id]||null, p0=(cur&&cur.pct)||{}, p1={}, r0=reps||(cur&&cur.reprises)||{}, r1={}, now=new Date().toISOString(), ex=!!(cur&&cur.exemple);
  for(const el of Object.keys(res)){
    const n=pct?pct[el]:p0[el];if(n!=null&&n!==''&&!isNaN(+n)&&res[el]!=='absent') p1[el]=Math.max(0,Math.min(100,+n));
    if(r0[el]&&(res[el]==='reprise'||res[el]==='echecf')) r1[el]=r0[el];
  }
  const doc={examen:x.fromSess?'':x.e.id,seance:x.fromSess?x.key:'',cours:x.c?x.c.id:'',groupe:x.grp||'',titre:(x.e&&x.e.titre)||'Examen',date:x.date,resultats:res,pct:p1,reprises:r1,maj:now};
  if(ex) doc.exemple=true;
  const fns=[()=>col('resultats').doc(id).set(doc)];
  for(const el of new Set([...Object.keys(prev),...Object.keys(res)])){
    if(prev[el]===res[el]&&p0[el]===p1[el]&&cur) continue;
    const rid=resElId(el,id);
    fns.push(res[el]?()=>col('resultats-eleves').doc(rid).set(Object.assign({eleve:el,examen:id,v:res[el],date:x.date,maj:now},p1[el]!=null?{pct:p1[el]}:{},ex?{exemple:true}:{})):()=>col('resultats-eleves').doc(rid).delete());
  }
  if(x.fromSess){const old=S.data.examens.find(q=>q.seance===x.key);if(old)fns.push(()=>col('examens').doc(old.id).delete());}
  else if(x.e&&x.e.resultats&&Object.keys(x.e.resultats).length&&byId(S.data.examens,x.e.id)) fns.push(()=>col('examens').doc(x.e.id).update({resultats:{}}));
  return write(async()=>{for(const f of fns) await f();},msg);
}
const elNum=e=>e&&e.numero!=null&&e.numero!==''&&!isNaN(+e.numero)?+e.numero:1e9;
const byElNum=(a,b)=>elNum(a)-elNum(b)||collator.compare(a.nom||'',b.nom||'');
function canEditExam(e){
  if(S.role==='admin') return S.canAdmin!==false;
  if(S.role==='teacher'){if(!permOn('notes'))return false;if(!e)return true;const c=byId(S.data.cours,e.cours);return (c&&c.enseignant===S.teacher)||e.surveillant===S.teacher;}
  return false;
}
const canEditItem=x=>x.fromSess?(S.role==='admin'?S.canAdmin!==false:S.role==='teacher'&&permOn('notes')&&(x.tch||[]).includes(S.teacher)):canEditExam(x.e);
/* Tous les examens de l’année avec leurs résultats : fiche d’examen, ou résultats rattachés à une séance « Examen » de l’horaire */
function examBoard(filter){
  const items=allExamItems().filter(filter).map(x=>{
    const res=examResOf(x), doc=S.data.resultats[resKeyOf(x)]||null, els=studentsOf(x.grp);
    let ok=0,ko=0,kf=0,got=0;for(const e of els){const v=res[e.id];if(!v)continue;got++;if(resOk(v))ok++;else if(resKo(v))ko++;else if(v==='echecf')kf++;}
    const pct=examPctOf(x), ps=els.map(e=>pct[e.id]).filter(n=>n!=null);
    return Object.assign(x,{doc,res,els,ok,ko,kf,got,pct,avg:ps.length?Math.round(ps.reduce((a,b)=>a+ +b,0)/ps.length):null,past:isPast(x)});
  });
  const asc=(a,b)=>a.date.localeCompare(b.date)||a.start-b.start, desc=(a,b)=>-asc(a,b);
  const up=items.filter(x=>!x.past&&(!x.rep||x.els.length)).sort(asc), graded=items.filter(x=>x.past&&!x.rep&&x.els.length);
  const todo=graded.filter(x=>x.got<x.els.length).sort(desc), done=graded.filter(x=>x.got).sort(desc);
  const reps=[];for(const x of graded) for(const e of x.els) if(resKo(x.res[e.id])) reps.push({x,e,v:x.res[e.id]});
  reps.sort((a,b)=>collator.compare(gName(a.x.grp),gName(b.x.grp))||asc(a.x,b.x)||byElNum(a.e,b.e));
  let ok=0,got=0;for(const x of done){ok+=x.ok;got+=x.ok+x.ko+x.kf;}
  return {items,up,todo,done,reps,rate:got?Math.round(ok/got*100):null,got};
}

/* Grille des résultats d’une classe : une ligne par élève, une colonne par examen passé (le plus récent à gauche) */
const GRID={reussi:['ok','✓'],echec:['bad','✗'],absent:['warn','Abs'],reprise:['info','✓R'],echecf:['fail','ÉM']};
function resultsGrid(gid,filter){
  const B=examBoard(x=>x.grp===gid&&(!filter||filter(x)));
  const xs=B.items.filter(x=>x.past&&!x.rep).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  const els=studentsOf(gid).slice().sort(byElNum);
  if(!els.length) return '<p class="help">Aucun élève dans cette classe.</p>';
  if(!xs.length) return '<p class="help">Aucun examen passé pour l’instant : la grille se remplira au fil des examens.</p>';
  const code=x=>x.c&&x.c.code?x.c.code:'Exam.';
  const sub=x=>{const t=String(x.e.titre||'');return x.fromSess?t.replace(/^Examen\s*/,''):t;};
  const name=x=>x.c?(x.c.code?x.c.code+' ':'')+x.c.titre:(x.e.titre||'Examen');
  const head=xs.map(x=>{const d=parse(x.date),todo=x.got<x.els.length;
    return `<th scope="col" class="xg-h${todo?' todo':''}"><button type="button" ${xOpen(x)} title="${esc(`${name(x)}${sub(x)?' · '+sub(x):''} · ${dayLabel(d)}${todo?' · résultats à entrer':''}`)}"><b>${esc(code(x))}</b><small>${esc(sub(x))||'&nbsp;'}</small><small>${dn(d)} ${esc(fMonthS.format(d).replace('.',''))}</small></button></th>`;}).join('');
  const rows=els.map(e=>{let ok=0,ko=0,kf=0;
    const cells=xs.map(x=>{const v=x.res[e.id], g=GRID[v];if(resOk(v))ok++;else if(resKo(v))ko++;else if(v==='echecf')kf++;
      return `<td><button type="button" class="xg-c ${g?g[0]:'none'}" ${xOpen(x)} aria-label="${esc(`${e.nom} · ${name(x)} · ${v?RES[v][1]:'sans résultat'}`)}" title="${esc(v?RES[v][1]+(x.pct[e.id]!=null?' · '+noteTxt(x.pct[e.id]):''):'Sans résultat')}">${g&&x.pct[e.id]!=null?Math.round(x.pct[e.id]):g?g[1]:'·'}</button></td>`;}).join('');
    const t=ok+ko+kf, r=t?Math.round(ok/t*100):null;
    return `<tr><th scope="row" class="xg-n"><button type="button" class="xg-who" data-act="student" data-id="${esc(e.id)}"><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span>${esc(e.nom)}</button></th><td class="xg-r ${passCls(r)}">${r==null?'—':r+' %'}${ko?`<small>${pl(ko,'à reprendre','à reprendre')}</small>`:''}${kf?`<small>${pl(kf,'échec de module','échecs de module')}</small>`:''}</td>${cells}</tr>`;}).join('');
  const foot=xs.map(x=>{const t=x.ok+x.ko+x.kf;return `<td class="xg-f">${t?`${x.ok}/${t}`:'—'}</td>`;}).join('');
  const legend=`<div class="xg-legend">${Object.entries(GRID).map(([k,[c,l]])=>`<span><i class="xg-c ${c}" aria-hidden="true">${l}</i>${RES[k][1]}</span>`).join('')}<span><i class="xg-c none" aria-hidden="true">·</i>Sans résultat</span></div>`;
  return legend+`<div class="xg-wrap"><table class="xg"><thead><tr><th scope="col" class="xg-n">Élève</th><th scope="col" class="xg-r">Réussite</th>${head}</tr></thead><tbody>${rows}</tbody><tfoot><tr><th scope="row" class="xg-n">Réussis</th><td class="xg-r"></td>${foot}</tr></tfoot></table></div>`;
}
/* Onglet Examens d’une fiche d’élève : ses résultats, ses reprises et ses prochains examens */
function studentExamsTab(e){

let _afLoad=null;
function afLoad(){

  const v={};
  for(const s of sessionsBetween(t,iso(addDays(new Date(),30)))) if(s.kind==='cours'&&!s.cancelled) for(const id of new Set(s.tch)) if(id) v[id]=(v[id]||0)+sHours(s);
  _afLoad={t,c:S.data.cours,a:S.data.candidatures,v};return v;
}
function afSuggest(s,a,extra){
  const L=afLoad(), add=extra||{}, k=modKey(s.c), mod=k!=null?comps().find(x=>+x.code===k):null;
  return teachers().filter(t=>!a.assigned.includes(t.id)&&!onLeave(t)&&hasComp(t,s.c)&&!busyAt(t.id,s)&&!(add[t.id]||[]).some(o=>o.date===s.date&&o.start<s.end&&s.start<o.end))

      return {t,dispo,ch,pend,h,score:(pend?4:0)+(dispo?3:0)+(ch?2:0)};})

function afPlan(){

/* ---------- Affectation des enseignants : requis, candidatures, remplacements, disponibilités ----------
   candidatures/<séance__enseignant> : { seance, cours, groupe, date, debut, fin, enseignant, statut }
     statut : attente (a postulé) · approuve · refuse · retire (retiré de ce cours par l’administration)
   remplacements/<séance__enseignant> : l’enseignant attribué demande à être remplacé ({ motif })
   disponibilites/<enseignant> : { jours : { '2026-10-13' : 'J' | 'AM' | 'PM' } }
   Le titulaire du module (cours.enseignant) donne tous ses cours, sauf ceux dont on l’a retiré. */
const candId=(key,tid)=>(String(key)+'__'+String(tid)).replace(/[^A-Za-z0-9_-]/g,'-');
let _aff=null;
function affIdx(){
  const a=S.data.candidatures, r=S.data.remplacements;
  if(_aff&&_aff.a===a&&_aff.r===r) return _aff;
  const by={}, rp={};
  for(const d of a)(by[d.seance]||(by[d.seance]=[])).push(d);
  for(const d of r) rp[d.seance+'|'+d.enseignant]=d;
  return _aff={a,r,by,rp};
}
/* Module du programme (menu Modules) d’un cours, d’après son sigle « M7 » */
const modKey=c=>{const m=/^M?(\d+)$/i.exec(String(c&&c.code||'').trim());return m?+m[1]:null;};
const modOf=c=>{const k=modKey(c);return k==null?null:comps().find(x=>+x.code===k)||null;};
/* Enseignants requis : ceux du cours du module que la séance donne (le plus grand s’il y en a plusieurs).
   Pour un examen, une reprise ou une activité : la valeur réglée sur la séance, sinon 1 (0 pour une activité). */
const reqOf=s=>{const x=s.extra||s.sl||{}, m=modOf(s.c), ks=m?xCours(m,x):[];if(ks.length)return Math.max(...ks.map(cReq));if(x.requis!=null&&x.requis!=='')return Math.max(0,+x.requis||0);if(isActivity(s.c))return 0;return m&&+m.requis>0?+m.requis:reqDef();};
const linkedX=s=>!!(s&&s.extra&&acad()&&xCours(modOf(s.c),s.extra).length);
function tchOf(c,key){
  const cs=affIdx().by[key];if(!cs) return [c.enseignant];
  const out=[];
  if(c.enseignant&&!cs.some(d=>d.enseignant===c.enseignant&&d.statut==='retire')) out.push(c.enseignant);
  for(const d of cs) if(d.statut==='approuve'&&!out.includes(d.enseignant)) out.push(d.enseignant);
  return out;
}
function staffing(s){
  const I=affIdx(), cs=I.by[s.key]||[], st={}, known=id=>!!byId(S.data.enseignants,id);
  for(const d of cs) st[d.enseignant]=d.statut;
  const assigned=s.tch.filter(id=>id&&known(id));
  const pending=cs.filter(d=>d.statut==='attente'&&known(d.enseignant)).map(d=>d.enseignant);
  const remp=assigned.filter(t=>I.rp[s.key+'|'+t]);
  const requis=reqOf(s), firm=assigned.length-remp.length, clash=isPast(s)?[]:assigned.filter(t=>busyAt(t,s));
  return {requis,assigned,pending,remp,st,firm,clash,rclash:isPast(s)?[]:ressClash(s),open:Math.max(0,requis-firm)};
}
const DISPO={J:'Toute la journée',AM:'Avant-midi',PM:'Après-midi'};

/* ---------- Enseignant : mes cours (à pourvoir, en attente, attribués, donnés) ---------- */
function teacherBoard(tid){
  const t=byId(S.data.enseignants,tid)||{}, I=affIdx(), open=[], wait=[], mine=[];let noDispo=0;

/* ---------- Disponibilités : un mois, du lundi au vendredi ; un clic change la journée ---------- */
function dispoDraft(tid){
  const st=S.pg, doc=S.data.dispos[tid];
  if(!st.dd||st.dd.tid!==tid||!st.dd.dirty) st.dd={tid,jours:Object.assign({},(doc&&doc.jours)||{}),dirty:false,maj:doc&&doc.maj};
  return st.dd;
}
function dispoMonthDays(ym){
  const [Y,M]=ym.split('-').map(Number), out=[];
  for(let d=new Date(Y,M-1,1);d.getMonth()===M-1;d=addDays(d,1)){const j=(d.getDay()+6)%7;if(j<5)out.push({d,ds:iso(d),j});}
  return out;
}
const dispoLocked=ds=>ds<todayISO()||!!offDay(ds);

/* ---------- Administration : modules du programme ----------
   Le catalogue est dans config/ecole.competences : { code, nom, heuresT, heuresP, heures, unites, charge, cours[], examens[] } (unites : les unités du programme du Ministère).
   · COURS du module : { id, num, type, requis } — ce qui compose le module, pareil pour toutes les classes.
   · EXAMENS du module : { id, type (t : théorique, p : pratique), nom }.
   · SÉANCE : un cours ou un examen donné à une classe, à une date. Chaque classe a son document cours/<id> (sigle M7) ;
     ses séances pointent vers les cours (x.cours) ou les examens (x.examens) du module.
   · CHARGÉ DE COURS (charge) : l’enseignant du module ; il donne ses séances à toutes les classes. */
const modList=()=>comps().map(k=>({id:String(k.code),nom:k.nom,k}));
const modCourses=code=>S.data.cours.filter(c=>modKey(c)===+code);
const modT=k=>k.heuresT!=null&&k.heuresT!==''?+k.heuresT:null;
const modP=k=>k.heuresP!=null&&k.heuresP!==''?+k.heuresP:null;
const modTot=k=>modT(k)!=null||modP(k)!=null?(modT(k)||0)+(modP(k)||0):(+k.heures||0);
const hTxt=v=>v==null?'<span class="muted">—</span>':v+' h';
const COURS_TYPES=['theorie','pratique','simulation','visite','stage','activite'];
const actLabel=k=>(ACTIVITES.find(a=>a.k===k)||{}).label||'';
const EXAM_T={t:'Théorique',p:'Pratique'};
const examActOf=e=>e.type==='t'?'examen-t':e.type==='p'?'examen-p':'examen';
const mCours=k=>(k&&Array.isArray(k.cours)?k.cours:[]).slice().sort((a,b)=>collator.compare(String(a.num),String(b.num)));
const mExams=k=>(k&&Array.isArray(k.examens)?k.examens:[]);
const xCours=(k,x)=>k&&x&&Array.isArray(x.cours)?x.cours.map(id=>(k.cours||[]).find(c=>c.id===id)).filter(Boolean):[];
const xExams=(k,x)=>k&&x&&Array.isArray(x.examens)?x.examens.map(id=>(k.examens||[]).find(e=>e.id===id)).filter(Boolean):[];
const cReq=c=>c.requis==null||c.requis===''?reqDef():Math.max(0,Math.min(9,+c.requis||0));
const autoLabel=a=>a.length===2?a.join('–'):a.join(', ');
const chargeName=k=>k&&k.charge&&byId(S.data.enseignants,k.charge)?tName(k.charge):'';
/* Dans quelles classes chaque cours et chaque examen du module est à l’horaire */
function modUse(code){
  const use={};
  for(const c of modCourses(code)) for(const x of datedOf(c)) for(const id of (x.cours||[]).concat(x.examens||[])) (use[id]||(use[id]=new Set())).add(c.groupe);
  return {use,n:id=>use[id]?use[id].size:0};
}
function chargeSelect(id,cur,k){

/* Enregistre le catalogue des modules, puis accorde le nom et les heures des cours des classes */
async function saveModule(code,vals,isNew){
  const c=configDoc(), i=c.competences.findIndex(x=>+x.code===+code);
  if(isNew&&i>=0){toast(`Le module M${code} existe déjà.`,'bad');return false;}
  const tot=vals.heuresT!=null||vals.heuresP!=null?(vals.heuresT||0)+(vals.heuresP||0):(i>=0?+c.competences[i].heures||0:0);
  const k=Object.assign({cours:[],examens:[]},i>=0?c.competences[i]:{code:+code},{nom:vals.nom,heuresT:vals.heuresT,heuresP:vals.heuresP,heures:tot,charge:vals.charge||''});
  if(vals.unites!==undefined){if(vals.unites==null)delete k.unites;else k.unites=vals.unites;}
  delete k.requis;
  if(i>=0)c.competences[i]=k;else c.competences.push(k);
  c.competences.sort((a,b)=>a.code-b.code);
  if(!await saveConfig(c,isNew?`Module M${code} créé`:'Module enregistré')) return false;
  const stale=modCourses(code).filter(x=>x.titre!==k.nom||(+x.heures||0)!==tot);
  if(stale.length) await runAll(stale.map(x=>()=>col('cours').doc(x.id).update({titre:k.nom,heures:tot||null})),'');
  return true;
}

  if(S.busy) return false;
  const c=configDoc(), k=c.competences.find(x=>String(x.code)===String(code));if(!k) return false;
  k.cours=(k.cours||[]).map(x=>Object.assign({},x));k.examens=(k.examens||[]).map(x=>Object.assign({},x));
  const r=fn(k);if(r===false) return false;
  return saveConfig(c,typeof msg==='function'?msg():msg);
}
/* Après un changement de type dans le module : les séances de toutes les classes suivent */
async function syncSeances(code,fn){
  const jobs=[];
  for(const c of modCourses(code)){const doc=courseDoc(c);let ch=false;for(const x of doc.extras) if(fn(x)) ch=true;if(ch) jobs.push(()=>putCours(c.id,doc));}
  if(jobs.length) await runAll(jobs,'');
}
const numOrNull=v=>{const s=String(v==null?'':v).trim();if(s==='')return null;const n=Math.round(+s);return isNaN(n)||n<0?null:n;};

/* ---------- Vocabulaire : un MODULE (M7 Autopompe) a des COURS (une journée ou une demi-journée d’une classe).
   Ce qui n’appartient à aucun module (Accueil, Graduation…) est une ACTIVITÉ.
   Une école sans catalogue de modules garde l’ancien fonctionnement : un cours et ses périodes de la semaine. ---------- */
const acad=()=>comps().length>0;
/* Vocabulaire : avec des modules, ce qui est à l’horaire d’une classe est une « séance » (un cours du module donné
   à une date) ; dans une école sans modules, on garde « cours ». W(mot pour l’académie, mot d’origine). */
const W=(a,b)=>acad()?a:b;
const isActivity=c=>acad()&&!!c&&modKey(c)==null;
/* Heures prévues : celles du module du programme, sinon celles inscrites sur le cours */
const heuresOf=c=>{const m=acad()?modOf(c):null;return m?modTot(m):(+(c&&c.heures)||0);};
/* Un seul formulaire pour ajouter une séance : depuis le calendrier, une classe ou un module */

}

/* Ajoute une séance à une classe : un ou plusieurs cours (ou examens) du module, ou une activité sans module.
   o.items : 'c:<id>' (cours), 'e:<id>' (examen), 'rep' (reprise). Renvoie un message d’erreur, ou '' */
async function addCourseDay(o){
  const gid=o.groupe, date=o.date, per=PERIODES.find(p=>p.k===o.per)||PERIODES[2];
  const mk=o.module&&o.module!=='__act'?comps().find(x=>String(x.code)===String(o.module)):null, titre=mk?mk.nom:String(o.titre||'').trim();
  if(!gid) return 'Choisissez la classe.';
  if(!mk&&o.module!=='__act') return 'Choisissez le module, ou « Autre activité ».';
  if(!titre) return 'Écrivez le nom de l’activité.';
  const items=o.items||[], ks=mk?mCours(mk).filter(c=>items.includes('c:'+c.id)):[], es=mk?mExams(mk).filter(e=>items.includes('e:'+e.id)):[], rep=items.includes('rep');
  if(mk&&!ks.length&&!es.length&&!rep) return mCours(mk).length||mExams(mk).length?'Cochez le cours ou l’examen donné à cette séance.':'Ce module n’a pas encore de cours : ajoutez-les dans le menu Modules.';
  if(!date) return 'Indiquez la date de la séance.';
  const dd=parse(date), j=dd.getDay(), off=offDay(date);
  if(j===0||j===6) return 'Cette date tombe une fin de semaine.';
  if(off) return `Le ${dn(dd)} ${fMonth.format(dd)} n’est pas un jour de classe (${off}).`;
  const a0=toMin(per.debut), b0=toMin(per.fin), clash=sessionsOn(date).find(x=>x.grp===gid&&!x.cancelled&&x.start<b0&&a0<x.end);
  if(clash) return `${gName(gid)} a déjà ${clash.c.titre} ${momentIn(clash.start,clash.end)} ce jour-là.`;
  const x={id:'a'+date.replace(/-/g,'')+per.k+Math.random().toString(36).slice(2,5),date,debut:per.debut,fin:per.fin,tags:[],label:titre,minutes:perMin(per)};
  if(!mk) x.tags=withAct([],o.type||'activite');
  else if(es.length||ks.length){
    x.tags=withAct([],es.length?examActOf(es[0]):ks[0].type);
    x.label=autoLabel(ks.map(c=>c.num).concat(es.map(e=>e.nom)));
    if(ks.length) x.cours=ks.map(c=>c.id);
    if(es.length) x.examens=es.map(e=>e.id);
  }else{x.tags=['Reprise'];x.label='Reprise';}
  const c0=mk?modCourses(mk.code).find(c=>c.groupe===gid):S.data.cours.find(c=>c.groupe===gid&&modKey(c)==null&&String(c.titre||'').trim().toLowerCase()===titre.toLowerCase());
  const msg=o.quiet?'':mk?'Séance ajoutée':'Activité ajoutée';let ok;
  if(c0){const doc=courseDoc(c0);doc.extras.push(x);ok=await affWrite(()=>putCours(c0.id,doc),msg);}
  else ok=await affWrite(()=>putCours(genId('c'),{titre,code:mk?'M'+mk.code:'',couleur:mk?(+mk.code)%8:7,groupe:gid,enseignant:'',salle:'',du:'',au:'',heures:mk?modTot(mk)||null:null,creneaux:[],annulees:[],extras:[x]}),msg);
  if(ok) logEv('horaire',mk?'a ajouté la séance':'a ajouté l’activité',`${mk?'M'+mk.code+' ':''}${titre}${mk&&x.label?' ('+x.label+')':''} · ${gName(gid)}, ${dayLabel(dd).toLowerCase()}`);
  return ok?'':'L’enregistrement a échoué.';
}

/* ---------- Formation : évaluations pratiques, carnets, préalables, certificats, dossier ENPQ, relevés ----------
   grilles/<id> : une grille d’évaluation pratique { nom, module, points [{ t, crit }], seuil (%), temps (min), essais, autre, enpq, note, maj, par }
     Un point critique manqué fait échouer l’essai ; sinon il est réussi à partir du seuil (et dans le temps limite).
   evaluations/<id> : un essai { grille, nom, eleve, groupe, date, essai, ens, evalNom, coches [bool], score, crit, temps (s), niveau,
     resultat reussi|echec, motif, note, sig { ev { nom, le }, el { nom, le, sur } }, lot (réussite en groupe), le, par }
   certificats/<élève> : { items [{ type, obtenu, expire, num }], maj } ; dossiers-enpq/<élève> : { coches { pièce : date }, envoye, note, maj }
   Réglages (config/ecole.formation) : types de certificats, préalables par module, pièces du dossier ENPQ, frais d’examen,
   niveaux de maîtrise 1 à 4, services incendie. */
const FO_DEF={
  certs:[{id:'ps',nom:'Premiers soins',mois:36,enpq:true},{id:'masque',nom:'Essai d’ajustement du masque',mois:12,enpq:false},{id:'med',nom:'Examen médical',mois:24,enpq:false},{id:'4a',nom:'Permis de conduire classe 4A',mois:0,enpq:false},{id:'embarc',nom:'Carte d’embarcation de plaisance',mois:0,enpq:false}],
  pieces:[{id:'form',nom:'Formulaire d’inscription signé'},{id:'id',nom:'Pièce d’identité vérifiée'},{id:'photo',nom:'Photo récente'}],
  frais:[{nom:'Examens théoriques de l’ENPQ',montant:46000},{nom:'Examen pratique de l’ENPQ',montant:34430}]
};
function foCfg(){
  const c=cfg().formation||{};
  return {certs:Array.isArray(c.certs)?c.certs:FO_DEF.certs,pieces:Array.isArray(c.pieces)?c.pieces:FO_DEF.pieces,frais:Array.isArray(c.frais)?c.frais:FO_DEF.frais,
    alerte:+c.alerte>0?+c.alerte:30,niveaux:c.niveaux===true,prereq:c.prereq&&typeof c.prereq==='object'?c.prereq:{},services:Array.isArray(c.services)?c.services:[]};
}
const FO_NIV=['','1 · Débutant','2 · En progrès','3 · Maîtrisé','4 · Très bonne maîtrise'];
/* Tout lire : l’administration et le personnel ; un compte élève ne reçoit que ses propres documents */
const foFull=()=>S.canAdmin!==false||S.role!=='student';
const foG=()=>(S.data.grilles||[]).slice().sort((a,b)=>(+a.module||99)-(+b.module||99)||collator.compare(a.nom||'',b.nom||''));
const foEvs=()=>S.data.evals||[];
const foEvOf=(eid,gid)=>foEvs().filter(x=>x.eleve===eid&&(!gid||x.grille===gid)).sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.le).localeCompare(String(b.le)));
const foGName=g=>(g.module?'M'+g.module+' · ':'')+(g.nom||'Grille');
/* L’élève affiché ; un compte élève ne lit pas la liste des élèves : sa fiche vient de son compte */
const foMe=()=>byId(S.data.eleves,S.student)||(()=>{const a=myAcct();return a&&a.role==='student'&&a.ref&&a.ref===S.student?Object.assign({},a.fiche||{},{id:a.ref}):null;})();
const foId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* Où en est un élève pour une grille : réussie, échouée (essais restants ou épuisés), ou pas encore évaluée */
function foState(eid,g){
  const E=foEvOf(eid,g.id), ok=E.find(x=>x.resultat==='reussi');
  if(ok) return {k:'ok',ev:ok,n:E.length,last:E[E.length-1]};
  if(!E.length) return {k:'none',n:0};
  const max=+g.essais||2;
  return {k:E.length>=max?'out':'ko',ev:E[E.length-1],n:E.length,last:E[E.length-1]};
}
const FO_ST={ok:['ok','Réussie'],ko:['warn','À reprendre'],out:['bad','Essais épuisés'],none:['off','Pas évaluée']};
function foScore(g,coches){
  const P=g.points||[], n=P.length, got=P.filter((p,i)=>coches[i]).length, crit=P.every((p,i)=>!p.crit||coches[i]);
  return {n,got,pct:n?Math.round(got/n*100):0,crit};
}
/* Le résultat d’un essai : critère, seuil, temps */
function foVerdict(g,coches,sec){
  const s=foScore(g,coches), lim=(+g.temps||0)*60, over=lim&&sec>lim, seuil=+g.seuil||70;
  const motif=!s.crit?'Point critique manqué':s.pct<seuil?`Sous le seuil de ${seuil} %`:over?'Temps limite dépassé':'';
  return Object.assign(s,{ok:!motif,motif,over,seuil});
}
/* ---------- Certificats ---------- */
const foCertDoc=eid=>(S.data.certs||{})[eid]||{};
const foCertOf=(eid,type)=>((foCertDoc(eid).items)||[]).find(x=>x.type===type)||null;
function foCertSt(it,at){
  const t=at||todayISO(), soon=iso(addDays(parse(t),foCfg().alerte));
  if(!it||(!it.obtenu&&!it.expire)) return ['off','Manquant'];
  if(it.expire&&it.expire<t) return ['bad','Expiré le '+shortDate(parse(it.expire))];
  if(it.expire&&it.expire<=soon) return ['warn','Expire le '+shortDate(parse(it.expire))];
  return ['ok',it.expire?'Valide jusqu’au '+shortDate(parse(it.expire)):'Valide'];
}
const foCertOk=(eid,type,at)=>{const s=foCertSt(foCertOf(eid,type),at)[0];return s==='ok'||s==='warn';};
/* ---------- Modules réussis (examens) ---------- */
let _foMod=null;
function foModOk(eid,code){
  if(!_foMod||_foMod.r!==S.data.resultats||_foMod.c!==S.data.cours||_foMod.x!==S.data.examens){
    const by={};
    for(const x of allExamItems()){const k=x.c?modKey(x.c):null;if(k==null||!x.past||x.rep)continue;(by[k]=by[k]||[]).push(x);}
    _foMod={r:S.data.resultats,c:S.data.cours,x:S.data.examens,by};
  }
  const L=(_foMod.by[+code]||[]).filter(x=>x.grp===(byId(S.data.eleves,eid)||{}).groupe);
  return !!L.length&&L.every(x=>resOk(x.res[eid]));
}
/* ---------- Préalables : ce qu’il faut avoir réussi avant les séances d’un module ---------- */
const foPre=code=>foCfg().prereq[String(code)]||null;
function foMissing(e,code,date){
  const p=foPre(code);if(!p) return [];
  const out=[];
  for(const gid of p.grilles||[]){const g=byId(S.data.grilles||[],gid);if(g&&foState(e.id,g).k!=='ok')out.push(g.nom);}
  for(const m of p.modules||[]) if(!foModOk(e.id,m)) out.push('module M'+m);
  for(const t of p.certs||[]){const c=foCfg().certs.find(x=>x.id===t);if(c&&!foCertOk(e.id,t,date))out.push(c.nom.toLowerCase());}
  return out;
}
/* Les séances à venir des modules qui ont des préalables, avec les élèves à qui il manque quelque chose */
let _foBl=null;
function foBlocked(days){
  const t=todayISO(), to=iso(addDays(new Date(),days||14));
  if(_foBl&&_foBl.t===t&&_foBl.to===to&&_foBl.c===S.data.cours&&_foBl.r===S.data.resultats&&_foBl.e===S.data.evals&&_foBl.ce===S.data.certs&&_foBl.g===S.data.config&&_foBl.el===S.data.eleves) return _foBl.out;
  const P=foCfg().prereq, out=[];
  if(Object.keys(P).length) for(const s of sessionsBetween(t,to)){
    if(s.kind!=='cours'||s.cancelled) continue;
    const code=modKey(s.c);if(code==null||!P[String(code)]) continue;
    const miss=studentsOf(s.grp).map(e=>({e,m:foMissing(e,code,s.date)})).filter(x=>x.m.length);
    if(miss.length) out.push({s,code,miss});
  }
  _foBl={t,to,c:S.data.cours,r:S.data.resultats,e:S.data.evals,ce:S.data.certs,g:S.data.config,el:S.data.eleves,out};
  return out;
}
/* ---------- Dossier ENPQ ---------- */
let _foN=null;
/* Résultats d’examens par élève ; un compte élève n’a que les siens (mesRes) */
const foNotes=()=>{
  if(!foFull()){const v=Object.values(S.data.mesRes||{}).filter(Boolean);return {[S.student]:{tot:v.length,ok:v.filter(resOk).length,todo:v.filter(resKo).length}};}
  if(!_foN||_foN.r!==S.data.resultats)_foN={r:S.data.resultats,v:studentNotes()};return _foN.v;
};
function foEnpq(e){
  const C=foCfg(), G=foG().filter(g=>g.enpq), d=(S.data.enpq||{})[e.id]||{}, items=[];
  for(const c of C.certs.filter(x=>x.enpq)) items.push({k:'c-'+c.id,l:c.nom,ok:foCertOk(e.id,c.id),detail:foCertSt(foCertOf(e.id,c.id))[1],auto:true});
  if(G.length){const n=G.filter(g=>foState(e.id,g).k==='ok').length;items.push({k:'grilles',l:'Grilles pratiques requises',ok:n===G.length,detail:`${n} sur ${G.length} réussies`,auto:true});}
  const N=foNotes()[e.id]||{tot:0,ok:0,todo:0};
  items.push({k:'exam',l:'Examens de l’école',ok:!N.todo&&!!N.tot,detail:N.tot?(N.todo?pl(N.todo,'examen à reprendre','examens à reprendre'):`${N.ok} réussis`):'Aucun résultat',auto:true});
  const cp=opt('compta'), cpt=!cp?null:foFull()?(S.loaded.compta?cp.entries():null):(permOn('compteEl')?S.data.mesCpt||[]:null);
  if(cpt){const f=cp.fee(e,cpt.filter(x=>x.note!=='ENPQ'));items.push({k:'frais',l:'Frais à jour',ok:f.etat!=='retard',detail:f.etat==='retard'?'paiement en retard':cp.feeStates[f.etat][1],auto:true});}
  for(const p of C.pieces) items.push({k:'p-'+p.id,id:p.id,l:p.nom,ok:!!(d.coches||{})[p.id],detail:(d.coches||{})[p.id]?'reçu le '+shortDate(parse((d.coches||{})[p.id])):'à recevoir',auto:false});
  const miss=items.filter(x=>!x.ok).length;
  return {items,miss,ok:!miss,envoye:d.envoye||'',note:d.note||'',doc:d};
}
/* ---------- Heures suivies par module (présences de l’élève) ---------- */
function foHours(e){
  const by={};
  for(const [k,p] of Object.entries(S.data.presTerm||{})){
    const v=p&&p.statuts&&p.statuts[e.id];if(v!=='P'&&v!=='R') continue;
    const s=findSess(p.date,k);if(!s) continue;
    const m=modKey(s.c);if(m==null) continue;
    by[m]=(by[m]||0)+sHours(s);
  }
  return by;
}

    {k:'serv',l:'Services incendie',i:'teach',sec:'Gestion',n:foCfg().services.length},{k:'regl',l:'Réglages',i:'gear',nt:'Réglages de la formation'}];

    ...certBad.slice(0,6).map(x=>`<li><span>${esc(x.e.nom)} · <span class="muted sm">${esc(x.c.nom)}</span></span><span class="chip ${x.s[0]}">${esc(x.s[1])}</span></li>`),

/* Chronomètre : il tourne même si le tiroir se redessine */
const foSec=d=>Math.round((d.acc||0)+(d.run?(Date.now()-d.t0)/1000:0));
const foClock=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;
let foTimer=null;
function foTick(){
  const d=S.dr;if(!d||d.kind!=='fo'||d.mode!=='sheet'||!d.run){clearInterval(foTimer);foTimer=null;return;}
  const el=$('#fo-chrono');if(!el) return;
  const s=foSec(d), g=byId(S.data.grilles||[],d.gr), over=g&&+g.temps&&s>g.temps*60;
  el.textContent=foClock(s);el.classList.toggle('bad-t',!!over);
}
async function foSaveSheet(){

  const niv=$('#fo-niv')?+$('#fo-niv').value||null:null;
  if(!d.ens){d.err='Choisissez l’évaluateur.';renderDrawer();return;}
  const prev=foEvOf(e.id,g.id);
  if(g.autre&&prev.length&&prev.some(x=>x.ens===d.ens)){d.err='Choisissez un autre évaluateur pour cet essai.';renderDrawer();return;}
  if(!d.sigEv){d.err='Cochez la confirmation de l’évaluateur pour signer l’évaluation.';renderDrawer();return;}
  if(d.run){d.acc=foSec(d);d.run=false;}
  const sec=foSec(d), v=foVerdict(g,d.coches,sec), now=new Date().toISOString(), en=tName(d.ens);
  const doc={grille:g.id,nom:g.nom,module:g.module||null,eleve:e.id,groupe:e.groupe||'',date:d.date,essai:prev.length+1,ens:d.ens,evalNom:en,coches:d.coches.slice(),score:v.pct,crit:v.crit,temps:sec,niveau:niv,
    resultat:v.ok?'reussi':'echec',motif:v.motif,note:d.note,sig:{ev:{nom:en,le:now},el:d.sigEl?{nom:e.nom,le:now,sur:'appareil de l’évaluateur'}:null},le:now,par:whoAmI()};
  S.busy=true;renderDrawer();
  const ok=await write(()=>col('evaluations').doc(foId('v')).set(doc),v.ok?`${e.nom} : réussite enregistrée`:`${e.nom} : échec enregistré (${v.motif.toLowerCase()})`);
  S.busy=false;if(ok){logEv('formation',`a évalué ${e.nom} : ${g.nom} (${v.ok?'réussie':'échec'})`);if(S.dr===d)S.dr=null;}render();
}

/* ---------- Données : tout pour le personnel ; ses propres documents pour un compte élève ---------- */
/* Les listes complètes restent de côté (FO_ALL) : elles reviennent dès qu’on quitte l’aperçu d’un élève, ou dès que le rôle du
   compte est connu (au tout premier chargement, il vaut « élève » un instant) */
const FO_ALL={};
function foSubscribe(){
  const L=(c,k,own)=>{try{col(c).onSnapshot(q=>{const v=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(own){FO_ALL[k]=v;if(!foFull())return;}LIVE()[k]=v;schedule();},()=>{});}catch(e){}};
  const M=(c,k)=>{try{col(c).onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();FO_ALL[k]=m;if(!foFull())return;LIVE()[k]=m;schedule();},()=>{});}catch(e){}};
  L('grilles','grilles');L('questions','questions');L('ex-blancs','blancs');
  /* tout lire : le personnel (un compte élève ne demande que ses propres documents, dans foMine) ; dans la démo, rien n’est protégé */
  if(S.canAdmin!==false||S.canWrite!==false||window.__DEMO_LOCAL){L('evaluations','evals',1);L('ex-tentatives','tentatives',1);M('certificats','certs');M('dossiers-enpq','enpq');}
  if(S.canAdmin!==false) L('rapports-service','rapports');
}
let foUnsub=[];
function foMine(){
  if(!DB||S.archive) return;
  const who=foFull()?'':S.student||'';
  if(S._foFor===who) return;
  foUnsub.forEach(u=>{try{u();}catch(e){}});foUnsub=[];S._foFor=who;
  if(!who){Object.assign(S.data,FO_ALL);return;}
  Object.assign(S.data,{evals:[],tentatives:[],certs:{},enpq:{}});
  const sub=(q,key)=>{try{foUnsub.push(q.onSnapshot(x=>{if(S._foFor!==who||foFull())return;S.data[key]=x.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{}));}catch(e){}};
  const one=(c,key)=>{try{foUnsub.push(DB.doc(c+'/'+who).onSnapshot(s=>{if(S._foFor!==who||foFull())return;S.data[key]=s.exists?{[who]:s.data()}:{};schedule();},()=>{}));}catch(e){}};
  sub(col('evaluations').where('eleve','==',who),'evals');sub(col('ex-tentatives').where('eleve','==',who),'tentatives');
  one('certificats','certs');one('dossiers-enpq','enpq');
}
/* La cloche : préalables et certificats (administration), séances de l’enseignant, examens blancs et signatures (élève) */
function foNotifs(){
  const out=[], day=todayISO();
  if(!nfOn('formation')) return out;
  if(S.role==='admin'){
    const bl=foBlocked(7), n=new Set(bl.flatMap(b=>b.miss.map(x=>x.e.id))).size;

/* ---------- Journées de reprise ----------
   Une journée de reprise est une séance « Reprise » à l’horaire d’une classe. On la crée d’abord, puis on y ajoute des
   modules (x.modules). Chaque élève qui a échoué ou manqué un examen d’un de ces modules le reprend ce jour-là :
   une reprise par examen échoué. Réussie : le résultat devient « réussi en reprise ». Ratée : « échec du module ».
   La liste des reprises se déduit des résultats ; resultats/<examen>.reprises = { élève : { date, v, de, pct } }
   garde la date et l’issue de chaque reprise (de : le premier résultat, pour pouvoir annuler). */
const resFail=v=>v==='echecf';
function repSessions(){
  const out=[];
  for(const c of S.data.cours) for(const x of datedOf(c)){
    const tg=x.tags||[];if(!tg.includes('Reprise')||tg.includes('Examen')) continue;
    if((c.annulees||[]).includes(`${x.date}@${x.id}`)||offDay(x.date)) continue;
    const own=modKey(c), mods=[...new Set((own!=null?[own]:[]).concat((x.modules||[]).map(Number).filter(n=>n>0)))].sort((a,b)=>a-b);
    out.push({c,x,own,date:x.date,grp:c.groupe,mods,key:`${c.id}_${x.id}_${x.date}`});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date)||collator.compare(gName(a.grp),gName(b.grp)));
}
/* La journée où se reprend un examen échoué : la première journée de reprise de la classe, après l’examen et pas encore passée, qui a son module */
function repDayFor(x,RS){
  const mk=x.c?modKey(x.c):null, t=todayISO();
  return mk==null?null:(RS||repSessions()).find(r=>r.grp===x.grp&&r.date>=t&&r.date>x.date&&r.mods.includes(mk))||null;
}
const modLbl=code=>{const k=comps().find(m=>+m.code===+code);return k?`M${k.code} ${k.nom}`:'M'+code;};
/* Modules échoués par un élève : une reprise ratée suffit */
function failedModules(e,items){
  const out=new Map();
  for(const x of items) if(resFail(x.res[e.id])&&x.c) out.set(modKey(x.c)!=null?'M'+modKey(x.c):x.c.id,(x.c.code?x.c.code+' ':'')+x.c.titre);
  return [...out.values()];
}
/* Ce qu’un élève doit reprendre, avec la date de chaque reprise quand elle est fixée */
function repNotice(e,items,RS){
  const pend=items.filter(x=>x.past&&!x.rep&&resKo(x.res[e.id])), fail=failedModules(e,items);
  const one=x=>{const d=repDayFor(x,RS);return `${esc((x.c&&x.c.code?x.c.code+' ':'')+(x.c?x.c.titre:'Examen'))}${x.e&&x.e.titre&&x.e.titre!=='Examen'?' ('+esc(x.e.titre)+')':''} : ${d?'reprise le '+esc(dayLabel(parse(d.date)).toLowerCase()):'date de reprise à venir'}`;};
  return (pend.length?`<div class="notice warn" id="rp-note"><p><b>${pl(pend.length,'reprise à faire','reprises à faire')}</b></p><ul>${pend.map(x=>`<li>${one(x)}</li>`).join('')}</ul></div>`:'')
    +(fail.length?`<div class="notice bad" id="rp-fail"><p><b>${fail.length>1?'Modules échoués':'Module échoué'}</b> : ${esc(fail.join(', '))}. La reprise n’a pas été réussie.</p></div>`:'');
}
/* Inscrit l’issue d’une reprise : réussie → « réussi en reprise » ; ratée → « échec du module » ; ok === null : on annule */
async function setRetake(key,el,ok,date,pct){
  const x=allExamItems().find(k=>k.key===key);if(!x||S.busy) return false;
  const cur=S.data.resultats[resKeyOf(x)]||{}, reps=Object.assign({},cur.reprises), res=Object.assign({},examResOf(x)), was=res[el], t=todayISO();
  if(ok===null){const r=reps[el];if(!r) return false;res[el]=r.de||'echec';delete reps[el];}
  else{
    if(!resKo(was)&&!reps[el]) return false;
    reps[el]=Object.assign({date:date||t,v:ok?'reussi':'echec',de:reps[el]?reps[el].de:was},pct!=null?{pct}:{});
    res[el]=ok?'reprise':'echecf';
  }
  S.busy=true;render();
  const done=await writeResults(x,res,ok===null?'Reprise annulée':ok?'Reprise réussie inscrite':'Échec du module inscrit',undefined,reps);
  S.busy=false;render();
  return done;
}
/* Ajoute ou retire un module d’une journée de reprise, pour toutes les classes qui ont cette journée */
async function repModules(date,code,add){
  const jobs=[];
  for(const r of repSessions().filter(r=>r.date===date)){
    if(r.own===+code) continue;
    const doc=courseDoc(r.c), x=doc.extras.find(e=>e.id===r.x.id);if(!x) continue;
    const set=new Set((x.modules||[]).map(Number));if(add)set.add(+code);else set.delete(+code);
    x.modules=[...set].sort((a,b)=>a-b);
    jobs.push(()=>putCours(r.c.id,doc));
  }
  if(!jobs.length) return false;
  const lbl=dayLabel(parse(date)).toLowerCase(), ok=await runAll(jobs,add?`M${code} ajouté à la reprise du ${lbl}`:`M${code} retiré de la reprise du ${lbl}`);
  if(ok) logEv('horaire',add?`a ajouté le module M${code} à la journée de reprise`:`a retiré le module M${code} de la journée de reprise`,lbl);
  return ok;
}

/* ---------- Locaux et équipements (salles, camions, tour, bassin…) ----------
   Le catalogue est dans config/ecole.ressources : { id, nom, type } — type : local | equip.
   Chaque cours d’un module peut en demander (cours[].ress), pour toutes les classes ; une séance peut avoir les siens (x.ress).
   Deux séances au même moment avec le même local ou équipement sont en conflit, sauf si c’est le même module
   (les classes sont alors réunies), comme pour les enseignants. */
const RES_T={local:'Local',equip:'Équipement'};
const ressCat=()=>(cfg().ressources||[]).concat(opt('stock')?opt('stock').resources():[]);
const ressAll=()=>ressCat().slice().sort((a,b)=>(a.type===b.type?0:a.type==='local'?-1:1)||collator.compare(a.nom||'',b.nom||''));
const ressName=id=>{const r=ressCat().find(x=>x.id===id);return r?r.nom:'';};
const ressNames=ids=>ids.map(ressName).filter(Boolean).join(', ');
function ressOf(s){
  if(!s||s.kind!=='cours'||!ressCat().length) return [];
  const x=s.extra||{};
  if(Array.isArray(x.ress)) return x.ress.filter(ressName);
  const out=[];for(const c of xCours(modOf(s.c),x)) for(const id of c.ress||[]) if(ressName(id)&&!out.includes(id)) out.push(id);
  return out;
}
function ressClash(s){
  const mine=ressOf(s);if(!mine.length||s.cancelled) return [];
  const out=[];
  for(const o of sessionsOn(s.date)){
    if(o.key===s.key||o.cancelled||o.kind!=='cours'||!(o.start<s.end&&s.start<o.end)||sameMod(o.c,s.c)) continue;
    const theirs=ressOf(o);for(const id of mine) if(theirs.includes(id)) out.push({id,o});
  }
  return out;
}
const ressClashLbl=cl=>{const types=new Set(cl.map(x=>(ressCat().find(r=>r.id===x.id)||{}).type));return types.size===1&&types.has('local')?'Conflit de local':types.size===1?'Conflit d’équipement':'Conflit de local et d’équipement';};

/* ---------- Import : liste d’élèves, copie de l’horaire d’une classe ----------
   Liste d’élèves collée ou lue d’un fichier, une ligne par élève. Colonnes séparées par une tabulation (cellules copiées
   d’Excel), un point-virgule ou une virgule : numéro, nom (ou prénom et nom), courriel, téléphone.
   Une première ligne de titres est reconnue ; sans titres, on devine chaque case. */
function csvCells(line,sep){
  const out=[];let cur='', q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"'&&!cur) q=true;
    else if(ch===sep){out.push(cur);cur='';}
    else cur+=ch;}
  out.push(cur);
  return out.map(c=>c.replace(/\s+/g,' ').trim());
}
function parseStudents(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(0,400);
  if(!lines.length) return [];
  const count=ch=>lines.slice(0,10).reduce((n,l)=>n+l.split(ch).length-1,0), sep=count('\t')?'\t':count(';')?';':count(',')?',':null;
  let rows=lines.map(l=>sep?csvCells(l,sep):[l.replace(/\s+/g,' ').trim()]), map=null;
  const H={numero:/^(n[°ºo]\.?|no\.?|num[ée]ro|#|matricule)$/i,prenom:/^pr[ée]nom$/i,nom:/^(nom|nom de famille|[ée]l[èe]ve|nom complet)$/i,courriel:/^(courriel|e-?mail|adresse courriel)$/i,telephone:/^(t[ée]l[ée]phone|t[ée]l\.?|cellulaire)$/i};
  const head=rows[0].map(c=>Object.keys(H).find(k=>H[k].test(c))||'');
  if(head.includes('nom')||head.includes('prenom')){map=head;rows=rows.slice(1);}
  return rows.map(r=>{
    const o={nom:'',numero:null,courriel:'',telephone:''}, names=[];let pre='';
    r.forEach((c,i)=>{
      if(!c) return;
      const k=map?map[i]:/^\d{1,3}$/.test(c)&&o.numero==null?'numero':/@/.test(c)?'courriel':/^[\d\s().+-]{7,}$/.test(c)?'telephone':'nom';
      if(k==='numero'){const n=parseInt(c,10);if(n>0)o.numero=n;}
      else if(k==='prenom') pre=c;
      else if(k==='nom') names.push(c);
      else if(k==='courriel') o.courriel=c;
      else if(k==='telephone') o.telephone=c;
    });
    o.nom=(pre?pre+' ':'')+names.join(' ');
    return o;
  }).filter(o=>o.nom.trim());
}
/* Lit un fichier texte ; un CSV enregistré par Excel sous Windows n’est pas en UTF-8 : on le relit alors en Windows-1252 */
function readTextFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(r.error);
    r.onload=()=>{const t=String(r.result||'');if(!t.includes(String.fromCharCode(0xFFFD))){res(t);return;}const r2=new FileReader();r2.onerror=()=>res(t);r2.onload=()=>res(String(r2.result||''));r2.readAsText(file,'windows-1252');};
    r.readAsText(file);
  });
}
/* Copie de l’horaire d’une classe vers une autre : la première journée de classe de la source tombe à la date choisie,
   et les journées suivantes se suivent dans le même ordre, en sautant les fins de semaine et les congés.
   Les séances annulées, les présences et les résultats ne sont pas copiés. */
function copyPlan(src,dst,start){
  const items=[], schoolDay=ds=>{const j=parse(ds).getDay();return j!==0&&j!==6&&!offDay(ds);};
  for(const c of S.data.cours.filter(c=>c.groupe===src)) for(const x of datedOf(c)) if(!(c.annulees||[]).includes(`${x.date}@${x.id}`)&&schoolDay(x.date)) items.push({c,x});
  if(!items.length||!start) return {n:0,items:[]};
  items.sort((a,b)=>a.x.date.localeCompare(b.x.date)||String(a.x.debut).localeCompare(String(b.x.debut)));
  const first=items[0].x.date, last=items[items.length-1].x.date, from=[], to=[];
  for(let d=parse(first),n=0;iso(d)<=last&&n<800;d=addDays(d,1),n++) if(schoolDay(iso(d))) from.push(iso(d));
  for(let d=parse(start),n=0;to.length<from.length&&n<800;d=addDays(d,1),n++) if(schoolDay(iso(d))) to.push(iso(d));
  const map=new Map(from.map((ds,i)=>[ds,to[i]||'']));
  let out=0, clash=0;const keep=[];
  for(const it of items){
    const nd=map.get(it.x.date);
    if(!nd){out++;continue;}
    const a=toMin(it.x.debut), b=toMin(it.x.fin);
    if(sessionsOn(nd).some(s=>s.grp===dst&&!s.cancelled&&s.start<b&&a<s.end)){clash++;continue;}
    keep.push(Object.assign({nd},it));
  }
  return {n:keep.length,items:keep,out,clash,first,last,from:keep.length?keep[0].nd:'',to:keep.length?keep[keep.length-1].nd:''};
}
async function copySchedule(src,dst,start){
  const P=copyPlan(src,dst,start);if(!P.n) return false;
  const bySrc=new Map();for(const it of P.items){if(!bySrc.has(it.c.id))bySrc.set(it.c.id,{c:it.c,xs:[]});bySrc.get(it.c.id).xs.push(it);}
  const jobs=[];
  for(const {c,xs} of bySrc.values()){
    const mk=modKey(c), t0=mk!=null?S.data.cours.find(o=>o.groupe===dst&&modKey(o)===mk):S.data.cours.find(o=>o.groupe===dst&&modKey(o)==null&&String(o.titre||'').trim().toLowerCase()===String(c.titre||'').trim().toLowerCase());
    const doc=t0?courseDoc(t0):{titre:c.titre,code:c.code||'',couleur:+c.couleur||0,groupe:dst,enseignant:mk!=null?'':principalOf(dst),salle:c.salle||'',du:'',au:'',heures:c.heures||null,creneaux:[],annulees:[],extras:[]};
    const used=new Set(doc.extras.map(x=>x.id));
    for(const {x,nd} of xs){
      let id='a'+nd.replace(/-/g,'')+(toMin(x.debut)<720?'am':'pm');while(used.has(id)) id+=Math.random().toString(36).slice(2,4);
      used.add(id);
      const o={id,date:nd,debut:x.debut,fin:x.fin,tags:(x.tags||[]).filter(t=>!CHORE_TAGS.has(t)),label:x.label||''};
      for(const k of ['minutes','cours','examens','requis','salle']) if(x[k]!=null&&x[k]!=='') o[k]=JSON.parse(JSON.stringify(x[k]));
      doc.extras.push(o);
    }
    const id=t0?t0.id:genId('c');
    jobs.push(()=>putCours(id,doc));
  }
  const ok=await runAll(jobs,`${pl(P.n,'séance copiée','séances copiées')} vers ${gName(dst)}`);
  if(ok) logEv('horaire',`a copié l’horaire de ${gName(src)} vers ${gName(dst)}`,`${pl(P.n,'séance','séances')}, à partir du ${longDate(parse(P.from))}`);
  return ok;
}

function copyPanel(g){
  const st=S.pg, others=groups().filter(x=>x.id!==g.id&&S.data.cours.some(c=>c.groupe===x.id&&datedOf(c).length)), src=others.some(x=>x.id===st.cps)?st.cps:'', P=src&&st.cpd?copyPlan(src,g.id,st.cpd):null;
  const d=ds=>longDate(parse(ds));
  const info=!others.length?'Aucune autre classe n’a d’horaire à copier.':!P?'Choisissez la classe à copier et la première journée de classe.'
    :!P.n?'Aucune séance ne peut être copiée à partir de cette date.'
    :`${pl(P.n,'séance','séances')} de ${esc(gName(src))} (du ${esc(d(P.first))} au ${esc(d(P.last))}) ${P.n>1?'seront copiées':'sera copiée'} du ${esc(d(P.from))} au ${esc(d(P.to))}, dans le même ordre, en sautant les fins de semaine et les congés.${P.out?` ${pl(P.out,'séance tombe','séances tombent')} après la fin de l’année scolaire et ne ${P.out>1?'seront pas copiées':'sera pas copiée'}.`:''}${P.clash?` ${pl(P.clash,'séance est ignorée','séances sont ignorées')} : ${esc(g.nom)} a déjà quelque chose à ce moment-là.`:''} Les présences et les résultats ne sont pas copiés.`;
  return `<div class="cp-box" id="cp-box"><h3 class="fiche-h3">Copier l’horaire d’une autre classe</h3><form class="inline-add" data-form="cp-go" data-g="${esc(g.id)}">
      <label class="field u-f0-220"><span>Classe à copier</span><select id="cp-src" data-cp="src"${others.length?'':' disabled'}><option value="">Choisir…</option>${others.map(x=>`<option value="${esc(x.id)}"${x.id===src?' selected':''}>${esc(x.nom)}</option>`).join('')}</select></label>
      <label class="field u-f0-220"><span>Première journée de ${esc(g.nom)}</span><input type="date" id="cp-date" data-cp="date" data-f="cpd" value="${esc(st.cpd||'')}"></label>
      <button class="btn primary" type="submit" id="cp-go"${P&&P.n?dis():' disabled'}>${P&&P.n?'Copier '+pl(P.n,'séance','séances'):'Copier'}</button></form>
    <p class="help u-mt8" id="cp-info">${info}</p></div>`;
}

/* ---------- Historique : qui a fait quoi, et quand ----------
   journal/<AAAA-MM> : un document par mois, où chaque action est une entrée de « ev » (la base ne grossit pas d’un
   document par clic ; au-delà de 600 entrées le mois continue dans AAAA-MM-2). Entrée : { le, par, role, cat, txt, obj,
   seance, date, groupe } — cat : horaire | aff | module. L’écriture ne bloque ni ne fait échouer l’action elle-même. */
const sObj=s=>`${s.c.code?s.c.code+' ':''}${s.c.titre} · ${gName(s.grp)}, ${dayLabel(parse(s.date)).toLowerCase()}`;
async function logEv(cat,txt,obj,s){
  if(!DB) return;
  try{
    const now=new Date(), ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
    const cur=(S.data.journal||[]).filter(d=>d.id===ym||d.id.startsWith(ym+'-')).sort((a,b)=>collator.compare(a.id,b.id)).pop();
    const id=!cur?ym:Object.keys(cur.ev||{}).length>=600?ym+'-'+((+(cur.id.split('-')[2]||1))+1):cur.id;
    const ev={le:now.toISOString(),par:whoAmI(),role:S.role,cat,txt,obj:obj||''};
    if(s){ev.seance=s.key;ev.date=s.date;ev.groupe=s.grp||'';}
    const body={ev:{[now.getTime().toString(36)+Math.random().toString(36).slice(2,5)]:ev}}, ref=col('journal').doc(id);
    try{await ref.update(body);}
    catch(e){
      /* le document du mois n’existe pas encore : on le crée (jamais d’écrasement d’un mois existant) */
      if(!e||e.code!=='invalid_argument') return;
      const snap=await ref.get();if(!snap.exists) await ref.set(body);
    }
  }catch(e){}
}
function ensureJournal(){
  if(!DB||S.jrSub) return;S.jrSub=true;
  try{col('journal').onSnapshot(q=>{LIVE().journal=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.jrLoaded=true;schedule();},()=>{S.jrLoaded=true;schedule();});}
  catch(e){S.jrLoaded=true;}
}
const JR_CAT={horaire:['info','Horaire'],aff:['warn','Affectations'],module:['k5','Modules']};
function historyPage(){
  ensureJournal();
  const st=S.pg, f=JR_CAT[st.jc]?st.jc:'', q=String(st.jq||'').trim().toLowerCase(), lim=+st.jl||60, all=[];
  for(const d of S.data.journal||[]) for(const [id,e] of Object.entries(d.ev||{})) if(e&&e.le&&JR_CAT[e.cat]) all.push(Object.assign({id},e));
  all.sort((a,b)=>b.le.localeCompare(a.le));
  const cnt={horaire:0,aff:0,module:0};for(const e of all) cnt[e.cat]++;
  const list=all.filter(e=>(!f||e.cat===f)&&(!q||`${e.par} ${e.txt} ${e.obj}`.toLowerCase().includes(q)));
  const seg=`<div class="seg" role="group" aria-label="Filtrer">${[['','Tout',all.length],['horaire','Horaire',cnt.horaire],['aff','Affectations',cnt.aff],['module','Modules',cnt.module]].map(([k,l,n])=>`<button type="button" id="jr-f-${k||'all'}" data-act="pg-set" data-k="jc" data-v="${k}" aria-pressed="${f===k}">${l} · ${n}</button>`).join('')}</div>`;
  const tb=`<div class="toolbar">${seg}<span class="grow"></span><input class="search" id="jr-q" type="search" placeholder="Rechercher une personne, un module…" aria-label="Rechercher dans l’historique" autocomplete="off" value="${esc(st.jq||'')}"></div>`;
  if(!S.jrLoaded) return tb+'<section class="panel"><p class="help">Chargement de l’historique…</p></section>';
  if(!all.length) return tb+emptyBox('Rien dans l’historique pour l’instant','Les séances annulées, déplacées, ajoutées ou supprimées, les candidatures et les attributions s’inscrivent ici, avec le nom de la personne et l’heure.');
  if(!list.length) return tb+'<section class="panel"><p class="help">Aucune action ne correspond.</p></section>';
  const rows=list.slice(0,lim).map(e=>{const d=new Date(e.le), s=e.seance&&e.date?findSess(e.date,e.seance):null;
    return xRow('xm-jr',s?`data-act="sess-at" ${sAt(s)}`:'',`<span class="jr-w"><b>${dn(d)} ${esc(fMonthS.format(d))}</b><small>${pad(d.getHours())} h ${pad(d.getMinutes())}</small></span><div class="xm-t"><b>${esc(e.par||'Quelqu’un')} ${esc(e.txt)}</b>${e.obj?`<small>${esc(e.obj)}</small>`:''}</div><div class="xm-end"><span class="chip ${JR_CAT[e.cat][0]}">${JR_CAT[e.cat][1]}</span></div>`,`${e.par} ${e.txt} ${e.obj}`);}).join('');
  return tb+xList('xm-jr',[['Quand','',1],['Action'],['','r']],rows)+(list.length>lim?`<div class="row u-mt12"><button class="btn" type="button" id="jr-more" data-act="pg-set" data-k="jl" data-v="${lim+60}">Afficher plus (${list.length-lim})</button></div>`:'');
}

/* ---------- Notifications (la cloche) ----------
   Rien de plus n’est enregistré : la liste se déduit de ce que la personne peut déjà lire — ses candidatures,
   les demandes de remplacement, les séances annulées. Ce qui a été vu est noté dans le navigateur.
   Le courriel viendra avec la connexion Firebase (il faut un serveur pour l’envoyer). */
const whoAmI=()=>(S.me&&S.me.name)||'';
const ago=t=>{if(!t)return '';const m=Math.round((Date.now()-new Date(t).getTime())/60000);if(isNaN(m))return '';if(m<1)return 'à l’instant';if(m<60)return `il y a ${m} min`;const h=Math.round(m/60);if(h<24)return `il y a ${h} h`;const d=Math.round(h/24);return d===1?'hier':d<14?`il y a ${d} jours`:shortDate(new Date(t));};
let _nf=null;
function notifs(){
  const D=S.data, who=S.role==='teacher'?S.teacher:S.role==='student'?S.group:'', day=todayISO(), k=S.role+'|'+who+'|'+day;
  if(_nf&&_nf.c===D.cours&&_nf.a===D.candidatures&&_nf.r===D.remplacements&&_nf.g===D.config&&_nf.st===D.stock&&_nf.cp===D.compta&&_nf.ev===D.evals&&_nf.ce===D.certs&&_nf.bl===D.blancs&&_nf.tt===D.tentatives&&_nf.k===k) return _nf.out;
  const out=[], recent=iso(addDays(new Date(),-7));
  const info=(date,key)=>{const s=findSess(date,key);return s?{s,txt:`${s.c.code?s.c.code+' ':''}${s.c.titre} · ${gName(s.grp)}, ${dayLabel(parse(s.date)).toLowerCase()}`}:null;};
  /* séances annulées à venir : pour l’enseignant qui les donnait, ou pour la classe */
  const cancelled=(match,pre)=>{
    for(const c of D.cours) for(const tag of c.annulees||[]){
      const [date,sid]=String(tag).split('@');if(!sid||date<day) continue;
      const x=info(date,`${c.id}_${sid}_${date}`);if(!x||!x.s.cancelled||x.s.movedX||!match(x.s)) continue;
      const a=(c.annule||{})[tag]||{};
      out.push({id:`a:${pre}:${x.s.key}`,t:a.le||'',tone:'bad',title:W('Séance annulée','Cours annulé'),text:x.txt+'.',go:{k:'sess',key:x.s.key,date}});
    }
  };
  if(S.role==='teacher'&&who){
    if(nfOn('aff')) for(const d of D.candidatures){
      if(d.enseignant!==who||d.date<recent) continue;
      const T={approuve:d.par==='admin'?['ok','Séance attribuée','Vous donnez ']:['ok','Candidature approuvée','Vous donnez '],refuse:['bad','Candidature refusée','Pour '],retire:['warn','Séance retirée','Vous ne donnez plus ']}[d.statut], x=T&&info(d.date,d.seance);
      if(x) out.push({id:`c:${d.id}:${d.statut}`,t:d.maj||'',tone:T[0],title:T[1],text:T[2]+x.txt+'.',go:{k:'mes',tab:d.statut==='approuve'?'mine':'open'}});
    }
    if(nfOn('annulT')) cancelled(s=>(s.tch||[]).includes(who),'t:'+who);
  }else if(S.role==='student'&&who){if(nfOn('annulE')) cancelled(s=>s.grp===who,'g:'+who);}
  else if(S.role==='admin'){
    if(nfOn('remp')) for(const d of D.remplacements){
      if(d.date<day) continue;const x=info(d.date,d.seance);
      if(x&&!x.s.cancelled&&(x.s.tch||[]).includes(d.enseignant)) out.push({id:`r:${d.id}`,t:d.maj||'',tone:'warn',title:'Remplacement demandé',text:`${tName(d.enseignant)} · ${x.txt}.${d.motif?' Raison : '+d.motif:''}`,go:{k:'aff',tab:'remp'}});
    }
    if(nfOn('cand')) for(const d of D.candidatures){
      if(d.statut!=='attente'||d.date<day) continue;const x=info(d.date,d.seance);
      if(x&&!x.s.cancelled&&byId(D.enseignants,d.enseignant)) out.push({id:`c:${d.id}:attente`,t:d.maj||'',tone:'info',title:'Nouvelle candidature',text:`${tName(d.enseignant)} · ${x.txt}.`,go:{k:'aff',tab:'cand'}});
    }
  }
  for(const o of optAll()) if(o.notifs) out.push(...o.notifs(D,day,who));
  out.push(...foNotifs());
  out.push(...annNotifs());
  out.sort((a,b)=>(b.t||'').localeCompare(a.t||''));
  _nf={c:D.cours,a:D.candidatures,r:D.remplacements,g:D.config,st:D.stock,cp:D.compta,ev:D.evals,ce:D.certs,bl:D.blancs,tt:D.tentatives,k,out};
  return out;
}
const nfNew=()=>{const seen=new Set(S.nfSeen||[]);return notifs().filter(n=>!seen.has(n.id));};
function bellHTML(){
  if(S.conn!=='shared'||!allLoaded()) return '';
  const n=nfNew().length;
  return `<button type="button" class="bell" id="nf-bell" data-act="nf-open" aria-label="${n?pl(n,'nouvelle notification','nouvelles notifications'):'Notifications'}" title="Notifications">${icon('bell')}${n?`<i class="bell-n" id="nf-n">${n>9?'9+':n}</i>`:''}</button>`;
}
function notifDrawer(){
  const d=S.dr, list=notifs(), fresh=new Set(d.fresh||[]), n=list.filter(x=>fresh.has(x.id)).length;
  const empty=S.role==='admin'?'Les demandes de remplacement et les nouvelles candidatures apparaîtront ici.':S.role==='teacher'?'Vos candidatures approuvées ou refusées et vos séances annulées apparaîtront ici.':'Les séances annulées de votre classe apparaîtront ici.';

}

const prSlug=v=>String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'feuille';
/* Ligne de signature au bas de chaque page (Paramètres > Impression) */
const prFoot=()=>{const x=String(cfg().impSign||'').trim();return x?`<p class="pr-sign">${esc(x)}</p>`:'';};
/* Le logo de l’Académie (site/logo.svg) : adresse complète, pour qu’il paraisse aussi dans la feuille remise en fichier */
const prLogo=()=>cfg().impLogo===false?'':`<img class="pr-logo" src="${esc(new URL('site/logo.svg',location.href).href)}" alt="" width="893" height="335">`;
function prHead(title,sub){const c=cfg(), co=c.impCoord!==false, ad=[c.adresse,c.tel,c.courriel,c.web].filter(Boolean);return `<header class="pr-head">${prLogo()}<div><h1>${esc(title)}</h1><p>${sub}</p></div><div class="pr-org"><b>${esc(c.nom||'')}</b><br>${esc(c.annee||'')}${c.programme?'<br>'+esc(c.programme):''}${co&&c.resp?'<br>'+esc(c.resp):''}${co&&ad.length?'<br>'+esc(ad.join(' · ')):''}${c.impDate===true?'<br>Imprimé le '+esc(longDate(new Date())):''}</div></header>${c.pied?`<p class="pr-pied">${esc(c.pied)}</p>`:''}`;}
const prWeekLbl=mon=>{const a=mon, b=addDays(mon,4);return a.getMonth()===b.getMonth()?`${dn(a)} au ${dn(b)} ${fMonth.format(b)} ${b.getFullYear()}`:`${dn(a)} ${fMonth.format(a)} au ${dn(b)} ${fMonth.format(b)} ${b.getFullYear()}`;};
/* Tout ce qui est à l’horaire d’une semaine (du lundi au vendredi) */
function weekItemsOf(mon){
  let out=[];for(let i=0;i<5;i++) out=out.concat(sessionsOn(iso(addDays(mon,i))));
  const a=iso(mon), b=iso(addDays(mon,4));
  return out.concat(S.data.examens.filter(e=>!e.seance&&e.date>=a&&e.date<=b).map(examItem));
}
function prSess(s,who){
  const where=who==='g'?(s.tch||[]).filter(id=>id&&byId(S.data.enseignants,id)).map(id=>shortName(tName(id))).join(', '):gName(s.grp);
  if(s.kind==='exam') return `<div class="pr-s ex"><b>${esc(s.c?(s.c.code?s.c.code+' ':'')+s.c.titre:(s.e.titre||'Examen'))}</b><span>${esc(s.c?(s.e.titre||'Examen'):'Examen')}</span><span>${esc([where,s.salle?'Local '+s.salle:''].filter(Boolean).join(' · '))}</span></div>`;
  const tg=tagsOf(s);
  return `<div class="pr-s${s.cancelled?' off':''}${tg.includes('Examen')?' ex':''}"><b>${esc((s.c.code?s.c.code+' ':'')+s.c.titre)}</b><span>${esc([sessLabel(s),cardKind(tg).kind].filter(Boolean).join(' · '))}</span><span>${esc([where,s.salle?'Local '+s.salle:'',ressNames(ressOf(s))].filter(Boolean).join(' · '))}</span>${s.cancelled?`<i>${W('Séance annulée','Cours annulé')}</i>`:''}</div>`;

/* Une page : les cinq jours en colonnes, l’avant-midi et l’après-midi en lignes ; une journée complète occupe les deux */
function prWeekPage(title,sub,items,mon,who,gid){
  const days=[0,1,2,3,4].map(i=>{const d=addDays(mon,i), ds=iso(d), list=items.filter(s=>s.date===ds).sort((a,b)=>a.start-b.start), part=k=>list.filter(s=>moment(s.start,s.end)===k);
    return {d,off:offDay(ds),full:part('Toute la journée'),am:part('Avant-midi'),pm:part('Après-midi'),chore:gid?choreDay(gid,ds):''};});
  const lines=a=>a.map(s=>prSess(s,who)).join('')||'<span class="pr-none">—</span>';
  const span=x=>x.off||(x.full.length&&!x.am.length&&!x.pm.length);
  const head=days.map(x=>`<th>${esc(WD[x.d.getDay()])} ${dn(x.d)} ${esc(fMonthS.format(x.d))}${x.chore?`<small>Corvée de ménage${x.chore==='maybe'?' ?':''}</small>`:''}</th>`).join('');
  const am=days.map(x=>x.off?`<td rowspan="2" class="pr-off">${esc(x.off)}</td>`:span(x)?`<td rowspan="2">${lines(x.full)}</td>`:`<td>${lines(x.full.concat(x.am))}</td>`).join('');
  const pm=days.map(x=>span(x)?'':`<td>${lines(x.full.concat(x.pm))}</td>`).join('');
  return `<section class="pr-page">${prHead(title,sub)}<table class="pr-t pr-wk"><thead><tr><th class="pr-m"></th>${head}</tr></thead><tbody><tr><th class="pr-m">Avant-midi</th>${am}</tr><tr><th class="pr-m">Après-midi</th>${pm}</tr></tbody></table>${prFoot()}</section>`;
}
/* Pour qui on imprime : la classe ou l’enseignant choisi, sinon toutes les classes ; un enseignant ou un élève imprime le sien */
function printTargets(d){
  if(S.role==='student') return S.group?[{k:'g',id:S.group}]:[];
  if(S.role==='teacher') return S.teacher?[{k:'t',id:S.teacher}]:[];
  if(d.t) return [{k:'t',id:d.t}];
  return (d.g?[d.g]:groups().map(g=>g.id)).map(id=>({k:'g',id}));
}
function weekSheet(d){
  const mon=parse(d.week), items=weekItemsOf(mon), wk='Semaine du '+esc(prWeekLbl(mon));
  return printTargets(d).map(t=>t.k==='g'
    ?prWeekPage('Horaire · '+gName(t.id),wk+(principalOf(t.id)?' · Enseignant principal : '+esc(tName(principalOf(t.id))):''),items.filter(s=>s.grp===t.id),mon,'g',t.id)
    :prWeekPage('Horaire · '+tName(t.id),wk,items.filter(s=>(s.tch||[]).includes(t.id)),mon,'t','')).join('');
}
/* Feuille de présences : une page par classe, les élèves en lignes, les séances de la semaine en colonnes.
   Les présences déjà prises y sont inscrites ; le reste est à cocher à la main. */
function attSheet(d){
  const mon=parse(d.week), tid=S.role==='teacher'?S.teacher:(d.t||''), wk='Semaine du '+esc(prWeekLbl(mon));
  const items=weekItemsOf(mon).filter(s=>s.kind==='cours'&&!s.cancelled&&!isActivity(s.c)&&(!tid||(s.tch||[]).includes(tid)));
  const gs=tid?groups().map(g=>g.id).filter(id=>items.some(s=>s.grp===id)):(d.g?[d.g]:groups().map(g=>g.id));
  return gs.map(gid=>{
    const ss=items.filter(s=>s.grp===gid).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start), els=studentsOf(gid);

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caserne-École</title>
<meta name="description" content="Horaire, présences et examens de l’Académie des pompiers.">
</head>
<body>
<script src="config.js"></script>
<script src="site/connexion.js"></script>
<script type="module" src="site/firebase.js"></script>
<title>Calendrier des cours</title>
<style>
:root{
  /* Layout : barre latérale marine, contenu clair, tableau classes × jours avec cartes pastel (repris du site de l’Académie). Thème clair seulement. */
  color-scheme:light;
  --side:#142132; --side-ink:#E6EAF0; --side-soft:#C7CED8; --side-muted:#8C9AAD; --side-line:#2C394A; --side-hover:#1C2B3F; --side-active:#26364D;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#F7FAFD; --head:#F1F6FB; --head-ink:#2C4F78; --row-ink:#263F60;
  --ink:#1A2940; --ink-2:#3D4F66; --muted:#64758A; --line:#DCE6EF; --line-2:#E4ECF4; --line-strong:#C3CFDB; --role:#1D2D44; --role-bg:#EEF2F6;
  --accent:#BC322D; --accent-hover:#A92C27; --accent-ink:#FFFFFF; --eyebrow:#8A5551; --today:#B53536; --focus:#2563C9;
  --ok:#1C7951; --ok-bg:#D7F6E6; --warn:#995D12; --warn-bg:#FFEBC7; --bad:#B1353F; --bad-bg:#FFE0E1; --info:#275F9D; --info-bg:#DCEAFD; --off:#5B6777; --off-bg:#E4E7EB;
  --font:Arial,Helvetica,"Segoe UI",sans-serif;
  --shadow:0 12px 40px rgba(20,33,50,.2);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k0{--card:#EDF4FE;--chip:#DCEAFD;--chip-ink:#275F9D;--bar:#7AA9E3}
.k1{--card:#FFF6E6;--chip:#FFEBC7;--chip-ink:#995D12;--bar:#E5A84B}
.k2{--card:#F5EFFE;--chip:#EADCFC;--chip-ink:#7043A5;--bar:#A982DB}
.k3{--card:#FDF0F6;--chip:#FBDCEC;--chip-ink:#A3326B;--bar:#DA7BA8}
.k4{--card:#F8F6E8;--chip:#F0EAC2;--chip-ink:#6F6311;--bar:#C2B04A}
.k5{--card:#EBF8F6;--chip:#D2F1EC;--chip-ink:#146C62;--bar:#4DB3A5}
.k6{--card:#EDF9F2;--chip:#D7F6E6;--chip-ink:#1C7951;--bar:#56B486}
.k7{--card:#F0F3F8;--chip:#E1E7F2;--chip-ink:#546C91;--bar:#9AA8BD}
.kx{--card:#FFF0F1;--chip:#FFE0E1;--chip-ink:#B1353F;--bar:#E26A70}
.role-chip{display:inline-flex;align-items:center;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;background:#FFF1E0;color:#995D12;vertical-align:1px}
/* Coquille */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.app.side-mini{grid-template-columns:72px minmax(0,1fr)}
@media (prefers-reduced-motion: reduce){.app{transition:none}}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:0 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:25px 6px 26px;color:#FFFFFF;font-weight:800;font-size:17px;letter-spacing:.035em;line-height:1.3;text-transform:uppercase;min-width:0}
.brand>div{min-width:0;overflow-wrap:anywhere}
.brand .bn{white-space:nowrap;font-size:16px;letter-spacing:.02em}
.brand small{display:block;font-size:11px;letter-spacing:.16em;color:var(--side-soft);font-weight:700}
.brand-icon{width:43px;height:49px;border-radius:11px 11px 18px 18px;background:var(--accent);display:grid;place-items:center;flex:none;color:#FFFFFF}
.brand-icon svg{width:24px;height:24px}
.ws-label{color:var(--side-muted);letter-spacing:.12em;font-size:12px;font-weight:700;padding:0 9px 12px;text-transform:uppercase}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;border-radius:7px;background:none;color:var(--side-soft);font-size:15px;text-align:left}
.nav button:hover{background:var(--side-hover);color:#FFFFFF}
.nav button[aria-current="page"]{background:var(--side-active);color:#FFFFFF}
.nav button[aria-current="page"]::after{content:"";width:6px;height:6px;border-radius:50%;background:#E2524C;margin-left:auto;flex:none}
.person{border-top:1px solid var(--side-line);display:flex;align-items:center;gap:10px;padding:16px 6px 18px;font-size:12px;color:var(--side-ink)}
.person b{display:block;font-size:12px}
.person small{display:block;color:var(--side-muted);margin-top:3px;font-size:12px}
.content{min-width:0;padding:22px clamp(16px,2.4vw,28px) 56px;display:flex;flex-direction:column;gap:16px}
/* Menu rétractable */
.side-toggle{margin-top:auto;margin-bottom:6px;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:7px;background:none;color:var(--side-muted);font-size:13.5px;text-align:left}
.side-toggle:hover{background:var(--side-hover);color:#FFFFFF}
.side-toggle .ic{transition:transform .2s}
.side-mini .sidebar{padding:0 10px}
.side-mini .brand{justify-content:center;padding-inline:0}
.side-mini .brand>div,.side-mini .ws-label,.side-mini .person>div{display:none}
.side-mini .nav button,.side-mini .side-toggle{justify-content:center;padding-inline:0;position:relative}
.side-mini .nav button>span,.side-mini .side-toggle>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.side-mini .nav button[aria-current="page"]::after{position:absolute;top:7px;right:9px;margin:0}
.side-mini .side-toggle .ic{transform:rotate(180deg)}
.side-mini .person{justify-content:center;padding-inline:0}
@media (prefers-reduced-motion: reduce){.side-toggle .ic{transition:none}}
/* Bandeau et profils */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:9px;padding:12px 12px 12px 16px}
.banner strong{display:block;font-size:16px;color:var(--ink)}
.banner p{margin:4px 0 0;color:var(--muted);font-size:13px}
.banner>div:first-child{min-width:0;flex:1 1 280px}
.roles{display:inline-flex;gap:4px;padding:4px;background:var(--role-bg);border-radius:9px}
.roles button{border:0;background:none;padding:9px 16px;border-radius:7px;font-weight:700;font-size:15px;color:var(--muted)}
.roles button:hover{color:var(--ink)}
.roles button[aria-pressed="true"]{background:var(--role);color:#FFFFFF}
/* Bandeau de démonstration (profils + données d’exemple) : se replie, le choix est retenu */
.demo{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s ease,opacity .2s ease,margin .26s ease}
.demo-in{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:16px}
.demo.is-hidden{grid-template-rows:0fr;opacity:0;margin-bottom:-16px;visibility:hidden;transition:grid-template-rows .26s ease,opacity .2s ease,margin .26s ease,visibility 0s .26s}
.demo-hide{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:13px;font-weight:700;flex:none}
.demo-hide:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.head-side{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:4px}
.demo-show{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:700}
.demo-show:hover{color:var(--ink);border-color:var(--line-strong)}
.demo-hide .ic,.demo-show .ic{width:15px;height:15px}
@media (prefers-reduced-motion: reduce){.demo,.demo.is-hidden{transition:none}}
.notices{display:flex;flex-direction:column;gap:8px}
.notices:empty{display:none}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.notice.warn{border-color:#F1D39C;background:#FFF8EA}
.notice p{margin:0;flex:1 1 280px;min-width:0}
.notice ul{margin:4px 0 0;padding-left:18px;flex-basis:100%}
/* Titre de page */
.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 20px;flex-wrap:wrap}
.page-heading h1{margin:0;font-size:28px;line-height:1.15;color:var(--ink);text-wrap:balance}
.page-heading p{margin:5px 0 0;color:#737D8B;font-size:15px}
/* Boutons et champs */
.btn{min-height:40px;padding:9px 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 2px 3px rgba(134,37,32,.08)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad);border-color:#EBB7BC;background:var(--surface)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--role-bg)}
.btn.sm{min-height:34px;padding:6px 11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:inline-grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
select,.search{min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 10px;font-size:14px;color:var(--ink);min-width:0;max-width:100%}
.search{padding-left:12px;width:240px}
.seg{display:inline-flex;gap:3px;padding:3px;background:var(--role-bg);border-radius:8px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 13px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,33,50,.14)}
/* Barre d’outils */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .grow{flex:1 1 0}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
.summary{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink);font-size:16px;margin-right:4px}
.summary .need b{color:var(--warn)}
/* Étiquettes */
.chip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:5px;font-size:11.5px;font-weight:700;line-height:1.25;white-space:nowrap;background:var(--chip,#E1E7F2);color:var(--chip-ink,#546C91);font-variant-numeric:tabular-nums;flex:none}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad,.chip.exam{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.off{background:var(--off-bg);color:var(--off)}
.chip.today{background:var(--accent);color:var(--accent-ink)}
/* Tableau de la semaine */
.week{display:grid;grid-template-columns:104px repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.wk-row{display:contents}
.wk-corner,.wk-day{background:var(--head);color:var(--head-ink);border-bottom:1px solid #E0E8F0;padding:12px 6px;font-size:13px;font-weight:700;text-align:center}
.wk-corner{text-align:left;padding-left:12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.wk-day.is-today{box-shadow:inset 0 -3px var(--today)}
.wk-class{background:var(--surface-2);border-bottom:1px solid var(--line-2);padding:12px;display:flex;flex-direction:column;color:var(--row-ink);font-weight:700;font-size:17px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.wk-class small{color:#60758F;font-size:11px;font-weight:500;margin-bottom:2px}
.day-head{font-size:16px}
.day-head small{text-transform:capitalize;font-size:12px;font-weight:700}
.day-head.is-today{box-shadow:inset 3px 0 var(--today)}
.wk-day.day-col{padding:0}
.day-pick{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:12px 6px;border:0;background:none;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.day-pick:hover{background:#E4ECF6}
.day-pick small{font-size:11px;font-weight:600;margin-top:2px}
.wk-day.day-col.on{background:#E8F0FA;box-shadow:inset 0 -3px var(--role)}
.wk-day-range{min-width:190px;text-transform:none}
.wk-cell{border-bottom:1px solid var(--line-2);border-left:1px solid var(--line-2);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.wk-cell.is-today{background:#F9FBFF}
.week>.wk-row:last-child>*{border-bottom:0}
.cell-note{margin:0;padding:10px 6px;font-size:13px;color:#8E9AAB}
.cc{display:flex;flex-direction:column;gap:4px;width:100%;padding:9px 11px 10px;border:1px solid transparent;border-left:3px solid var(--bar,#9AA8BD);border-radius:8px;background:var(--card,#F1F4F9);text-align:left;color:var(--ink);min-width:0;transition:border-color .15s,box-shadow .15s}
button.cc:hover{border-top-color:#C8D3DF;border-right-color:#C8D3DF;border-bottom-color:#C8D3DF;box-shadow:0 2px 8px rgba(20,33,50,.09)}
.cc-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:3px 8px}
.cc-time{font-size:12.5px;font-weight:700;color:var(--chip-ink,var(--muted));font-variant-numeric:tabular-nums;white-space:nowrap}
.cc-kind{padding:2px 8px;border-radius:999px;background:var(--chip,#E1E7F2);color:var(--chip-ink,#546C91);font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap}
.cc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;padding-top:6px;border-top:1px solid rgba(20,33,50,.08)}
.cc-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.cc-st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.cc-st.ok{color:var(--ok)}
.cc-st.warn{color:var(--warn)}
.cc-st.info{color:var(--info)}
.cc-st.bad{color:var(--bad)}
.cc-flag{margin-left:auto;padding:1px 7px;border:1px solid var(--line-strong);border-radius:5px;background:rgba(255,255,255,.65);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.cc-st+.cc-flag,.cc-flag+.cc-flag{margin-left:0}
.cc-tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cc strong{font-size:14px;font-weight:700;line-height:1.3;color:var(--ink);overflow-wrap:break-word;margin-top:2px}
.cc-meta{font-size:12.5px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.cc.cancelled{background:#F2F3F5}
.cc.cancelled strong{text-decoration:line-through;color:var(--muted)}
.cc.offday{background:#F0F3F8}
.cc.exam{background:#FFF0F1}
@media (prefers-reduced-motion: reduce){.cc{transition:none}}
.daytabs{display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.daytabs.show{display:grid}
.daytabs button{display:flex;flex-direction:column;align-items:center;padding:7px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:12px;min-width:0}
.daytabs strong{font-size:18px;color:var(--ink);line-height:1.15}
.daytabs button[aria-pressed="true"]{background:var(--role);border-color:var(--role);color:#FFFFFF}
.daytabs button[aria-pressed="true"] strong{color:#FFFFFF}
.daytabs .is-today:not([aria-pressed="true"]){border-color:var(--today)}
.daytabs .mark{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:3px}
/* Panneaux, tableaux, indicateurs */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;align-items:start}
.panel,.page-panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px 18px;min-width:0}
.page-panel{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:860px}
.panel h2{margin:0 0 10px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--eyebrow)}
.panel p{margin:0 0 8px}
.big{font-weight:700;font-size:30px;line-height:1;margin:0 0 8px;font-variant-numeric:tabular-nums}
.big span{font-size:18px;color:var(--muted)}
.meter{height:7px;background:var(--role-bg);border-radius:4px;overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px 16px;min-width:0}
.kpi span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kpi b{display:block;font-size:28px;margin-top:6px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.kpi.need b{color:var(--warn)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{background:var(--head);color:var(--head-ink);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:11px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 20px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:15px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row-link{cursor:pointer}
.tbl tr.row-link:hover td{background:var(--surface-2)}
.tbl tr.row-link:hover .link{text-decoration:underline}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
.tbl select{min-height:34px;font-size:13px}
.hr-tbl th,.hr-tbl td{padding-left:12px;padding-right:12px}
.hr-tbl th:first-child,.hr-tbl td:first-child{padding-left:20px}
.hr-tbl th.on,.hr-tbl td.on{background:var(--role-bg)}
.hr-tbl tr.row-link:hover td.on{background:var(--role-bg)}
.hr-m{border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:5px 8px;margin:-5px -8px;border-radius:6px;cursor:pointer}
.hr-m:hover{background:var(--surface)}
.hr-m[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--role)}
.hr-tot td{font-weight:700;background:var(--head);border-top:1px solid var(--line)}
.hr-tot td.on{background:var(--role-bg)}
.bell{position:relative;width:40px;height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface);display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.bell:hover{background:var(--surface-2);color:var(--ink)}
.bell .ic{width:19px;height:19px}
.bell-n{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--bad);color:#FFFFFF;font-size:11.5px;font-weight:700;font-style:normal;line-height:19px;text-align:center}
.nf-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nf-row{display:flex;flex-direction:column;gap:6px;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.nf-row:hover{background:var(--surface-2)}
.nf-row.new{border-color:var(--role);box-shadow:inset 3px 0 0 var(--role)}
.nf-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

.nf-tx{font-size:14.5px;line-height:1.4}

.pr-btns{display:flex;flex-wrap:wrap;gap:8px}
.cp-box{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.link{background:none;border:0;padding:0;font-weight:700;color:var(--ink);text-align:left}
.link:hover{text-decoration:underline;color:var(--head-ink)}
.help{font-size:13px;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px 0;background:none;border:0;text-align:left;color:var(--ink)}
.lrow+.lrow{border-top:1px solid var(--line-2)}
button.lrow:hover .ti{text-decoration:underline}

.when{font-weight:700;font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}

.what{min-width:0;display:flex;flex-direction:column;gap:2px}
.what .ti{font-weight:700;font-size:14px}
.what .sub{color:var(--muted);font-size:13px}
.next{display:flex;flex-direction:column;gap:6px}
.next .nx-t{font-weight:700;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.next .nx-w{font-weight:600;color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.tl li:first-child{border-top:0}
.tl .d{font-weight:700;font-variant-numeric:tabular-nums}
.tl .d small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.tl .t{min-width:0}
.tl .t b{display:block;font-size:15px}
.tl .t span{color:var(--muted);font-size:13px}
.tl li.past{opacity:.55}
.empty{padding:34px 20px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:9px}
.empty h2{font-size:22px;margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:52ch;color:var(--muted)}
.steps{text-align:left;max-width:52ch;margin:0 auto 18px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty .row{justify-content:center}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;align-items:start}
.stackp{display:flex;flex-direction:column;gap:14px;min-width:0}
/* Tiroir */
.scrim{position:fixed;inset:0;background:rgba(20,33,50,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;overflow-y:auto;box-shadow:var(--shadow);animation:slide .18s ease-out;display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.dr-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:calc(20px + env(safe-area-inset-top,0px)) 24px 0}
.dr-tt{min-width:0}
.eyebrow{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--eyebrow);font-size:11px}
.dr-top h2{margin:6px 0 0;font-weight:700;font-size:22px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.dr-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.dr-body{padding:18px 24px 24px;display:flex;flex-direction:column;gap:16px;flex:1}
.dr-sec{display:flex;flex-direction:column;gap:8px}
.dr-sec h3,.dr-h3{margin:0;font-weight:700;font-size:16px}
.dr-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 24px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;z-index:2}
.dr-foot p{margin:0;flex:1 1 200px;font-size:14px}
.state{font-size:13px;color:var(--muted)}
.state.dirty{color:var(--warn);font-weight:700}
.sess-box{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.sess-box p{margin:0}
.sess-box .per-lg{font-weight:700;font-size:16px}
.sb-head{display:flex;flex-direction:column;gap:7px}
.sb-chips{display:flex;flex-wrap:wrap;gap:6px}
.sb-chips .chore-chip{margin-left:0}
.sb-facts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px}
.sb-facts dd{font-size:14px}
.sb-h3{margin:6px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.facts dd{margin:3px 0 0;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.wlist li{display:flex;gap:10px}
.wlist .d{font-weight:700;min-width:44px}
/* Présences */
.att-sum{display:flex;flex-wrap:wrap;gap:6px}
.att-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.att-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line-2)}
.att-list li:first-child{border-top:0}
.att-list .nm{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.att-list .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.att-btns{display:inline-flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.ab{font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:6px 9px;min-width:36px}
.ab:hover{color:var(--ink);border-color:var(--line-strong)}
.ab .abbr{display:none}
.ab-P[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.ab-A[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.ab-R[aria-pressed="true"],.ab-C[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#FFFFFF}
.ab-M[aria-pressed="true"],.ab-F[aria-pressed="true"]{background:var(--info);border-color:var(--info);color:#FFFFFF}
/* Formulaires */
form{display:flex;flex-direction:column;gap:12px;margin:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-2);font-weight:600;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:9px 10px;font-size:15px;font-weight:400;color:var(--ink);width:100%;min-width:0;min-height:40px}
.field textarea{min-height:76px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:9px;padding:8px 12px 12px;margin:0;min-width:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:13px;color:var(--ink-2);font-weight:600;padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-code{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
.slot{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.slot-times{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;cursor:pointer;display:inline-flex}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw-dot{display:block;width:28px;height:28px;border-radius:50%;background:var(--chip-ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong)}
.sw input:checked+.sw-dot{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible+.sw-dot{outline:2px solid var(--focus);outline-offset:3px}
.inline-add{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:8px}
.inline-add .field{flex:1 1 170px}
.form-err{color:var(--bad);font-size:14px;margin:0;font-weight:700}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line-2);font-size:14px}
.plist li:first-child{border-top:0}
.x{width:30px;height:30px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);font-size:18px;line-height:1;flex:none}
.x:hover{border-color:var(--line-strong);color:var(--bad)}
.confirm{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:9px;background:#FFF5F5;border:1px solid #F1C4C8}
.confirm p{margin:0;font-size:14px}
.sec-title{margin:0;font-size:16px;font-weight:700}
.access{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.access li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px}
/* Bande d’agrandissement (reprise de l’Encyclopédie de Sky-Helper) : ▶ agrandit, ◀ réduit */
.boardbox{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.boardbox>.week{flex:1;min-width:0;border:0;border-radius:0}
.expander{display:flex;align-items:center;justify-content:center;gap:8px;width:32px;flex:none;border:0;border-right:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);padding:0}
.expander:hover{background:var(--head);color:var(--ink)}
.exp-arrow{width:14px;height:14px;transition:transform .2s}
.expander[aria-expanded="true"] .exp-arrow{transform:rotate(180deg)}
.expander .lbl{display:none;font-size:13px;font-weight:700}
.tstart,.xtag{display:none}
.cc-title{display:flex;align-items:baseline;gap:6px;min-width:0}
.week.compact .cc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:3px 6px;padding:6px 9px 7px}
.week.compact .cc-tags,.week.compact .cc-meta,.week.compact .cc-foot,.week.compact .cc-note{display:none}
.week.compact .cc-top{grid-column:1/3;grid-row:1;justify-content:flex-start;flex-wrap:nowrap;gap:6px;min-width:0}
.week.compact .cc-tr{margin-left:0}
.week.compact .cc-time{font-size:11.5px}
.week.compact .cc-kind{padding:0 6px;font-size:10px;line-height:1.55}
.week.compact .cc-title{grid-column:1/-1;grid-row:2;min-width:0}
.week.compact .cc.offday strong{grid-column:1/-1;grid-row:2}
.week.compact .cc strong{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.week.compact .cc[data-st]::after{content:"";grid-column:3;grid-row:1;width:8px;height:8px;border-radius:50%}
.week.compact .cc[data-st="done"]::after{background:var(--ok)}
.week.compact .cc[data-st="todo"]::after,.week.compact .cc[data-st="partial"]::after{background:var(--warn)}
.week.compact .wk-cell{gap:4px;padding:5px}
.week.compact .wk-class{padding:8px 12px;font-size:15px}
.week.compact .cell-note{padding:5px 6px}
.week.compact .cell-add{padding:3px}
.cc.enter{animation:card-in .2s ease-out both}
@keyframes card-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.exp-arrow{transition:none}.cc.enter{animation:none}}
/* Statuts d’un cours (style Pronote) : étiquette en bas à droite, carte grisée */
.cc.has-badge{position:relative;background:#F2F3F5;--bar:#B8C0CC;--chip:#E3E6EB;--chip-ink:#5E6B7D;padding-bottom:34px}
.cc.has-badge strong{text-decoration:none}
.cc.cancelled strong{color:var(--ink-2)}
.cc-badge{position:absolute;right:0;bottom:0;padding:4px 10px;border-radius:7px 0 7px 0;font-size:12px;font-weight:700;line-height:1.3;color:#FFFFFF;white-space:nowrap}
.cc-badge.bad{background:#E5484D}
.cc-badge.info{background:#3B9BD9}
.cc-note{font-size:12.5px;font-weight:600;color:var(--info);line-height:1.35}
.week.compact .cc.has-badge{padding-bottom:7px}
.week.compact .cc.has-badge .cc-title{grid-column:1}
.week.compact .cc-badge{position:static;grid-column:2/4;grid-row:2;padding:1px 6px;border-radius:4px;font-size:10px}
.week.compact .cc.has-badge[data-st]::after{display:none}
/* Comptes et profils */
.av{width:34px;height:34px;border-radius:50%;background:#2C4F78;color:#FFFFFF;display:inline-grid;place-items:center;flex:none;font-size:12px;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:72px;height:72px;font-size:24px}
.person-btn{display:flex;align-items:center;gap:10px;width:100%;min-width:0;padding:6px;margin:-6px;border:0;border-radius:8px;background:none;color:inherit;text-align:left;font:inherit}
.person-btn:hover,.person-btn[aria-current="page"]{background:var(--side-hover)}
.pinfo{min-width:0}
.pinfo b,.pinfo small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-mini .person .pinfo{display:none}
.side-mini .person-btn{justify-content:center;margin:0}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-size:14px}
.who small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.acc-how .steps{margin:0;max-width:none;font-size:14px}
.prof-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.prof-id{flex:1 1 260px;min-width:0}
.panel.prof-head .prof-id h2{margin:0;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:0;text-transform:none;color:var(--ink)}
.prof-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 6px}
.prof-chips .role-chip{margin:0}
.pf-pick{flex:0 1 280px}
.pick-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pick-person,.pick-sel{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:left;color:var(--ink)}
.pick-person:hover{border-color:var(--line-strong);background:var(--surface-2)}
.pick-person b,.pick-sel b{display:block;font-size:14px}
.pick-person small,.pick-sel small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.pick-sel{background:#F2F6FB;border-color:#B9CBE0}
.pick-sel>span:not(.av){flex:1;min-width:0}
.acc-list{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.acc-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:14px}
.acc-list li:first-child{border-top:0}
.need-t{color:var(--warn)}
/* Classes : cartes */
.cl-list{container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cl-cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 64px minmax(0,1fr) minmax(0,.9fr) 124px 132px;align-items:center;column-gap:18px}
.cl-hd{padding:11px 22px;background:var(--head);border-bottom:1px solid var(--line);color:var(--head-ink);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.cl-hd .n{text-align:center}
.cl-row{padding:16px 22px;border-top:1px solid var(--line-2);cursor:pointer;transition:background-color .12s}
.cl-hd+.cl-row{border-top:0}
.cl-row:hover{background:var(--surface-2)}
.cl-row:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.cl-c{display:flex;align-items:center;gap:12px;min-width:0}
.cl-num{width:48px;height:48px;border-radius:12px;background:var(--role);color:#FFFFFF;display:grid;place-items:center;flex:none;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cl-name{display:flex;flex-direction:column;gap:3px;min-width:0}
.cl-name b{font-size:18px;line-height:1.2;color:var(--ink);white-space:nowrap}
.cl-name small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-prin{display:flex;align-items:center;gap:10px;min-width:0;cursor:default}
.cl-prin .av{width:36px;height:36px;font-size:12.5px}
.cl-prin .av.none{background:var(--off-bg);color:var(--off)}
.cl-prin select{flex:1 1 0;min-width:0;width:auto;min-height:36px;font-size:15px;font-weight:700;color:var(--ink);border:1px solid transparent;border-radius:8px;background-color:transparent;padding:0 20px 0 6px;margin-left:-6px;cursor:pointer;text-overflow:ellipsis}
.cl-prin select:hover,.cl-prin select:focus{border-color:var(--line-strong);background-color:var(--surface)}
.cl-prin b{font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-prin .none-t{color:var(--muted);font-weight:400}
.cl-n{text-align:center;font-size:24px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cl-n.zero{color:var(--muted)}
.cl-big{display:flex;flex-direction:column;gap:7px;min-width:0}
.cl-big b{font-size:24px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.cl-big .meter{margin:0;height:8px}
.cl-big.ok b{color:var(--ok)}.cl-big.warn b{color:var(--warn)}.cl-big.bad b{color:var(--bad)}
.cl-big .none{color:var(--muted);font-weight:400}
.cl-st .chip{font-size:13px;padding:5px 10px;border-radius:7px}
.cl-go{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.cl-go>.ic{width:18px;height:18px;color:var(--muted);flex:none}
.cl-row [data-l]::before{display:none}
/* largeur moyenne : l’avancement se retire et le bouton Horaire devient une icône */
@container (max-width:1180px){
  .cl-cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 64px minmax(0,1fr) 124px 44px}
  .cl-adv,.cl-go-t,.cl-go>.ic{display:none}
  .cl-go .btn{padding-inline:9px}
}
/* petit écran : chaque classe devient une carte */
@container (max-width:880px){
  .cl-hd{display:none}
  .cl-cols{grid-template-columns:1fr 1fr;grid-template-areas:"c c" "p p" "n s" "r a" "go go";row-gap:14px}
  .cl-c{grid-area:c}.cl-prin{grid-area:p;flex-wrap:wrap;row-gap:6px}.cl-n{grid-area:n;text-align:left}.cl-st{grid-area:s}.cl-rate{grid-area:r}.cl-adv{grid-area:a;display:flex}.cl-go{grid-area:go;justify-content:space-between}
  .cl-go-t,.cl-go>.ic{display:inline}
  .cl-go .btn{padding-inline:12px}
  .cl-row [data-l]::before{content:attr(data-l);display:block;flex-basis:100%;margin-bottom:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .cl-prin[data-l]::before{margin-bottom:0}
}
.cl-add{margin-bottom:0}
/* Examens : tableau de bord */
.xm-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.xm-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;color:var(--ink);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.xm-tile:hover{border-color:var(--line-strong)}
.xm-tile[aria-pressed="true"]{border-color:var(--role);box-shadow:inset 0 -3px 0 var(--role)}
.xm-tile .lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.xm-tile b{font-size:30px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.xm-tile b.ok{color:var(--ok)}.xm-tile b.warn{color:var(--warn)}.xm-tile b.bad{color:var(--bad)}
.xm-tile small{font-size:13px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Un texte réservé aux lecteurs d’écran ne doit pas sortir de la boîte d’un tableau qui défile (il élargissait la page Comptes) */
.tbl-wrap{position:relative}
/* Texte long sur grand écran, texte court sur téléphone (même bouton) */

  /* Petits textes : 12 px au moins */

<script>
(function(){
'use strict';

/* ---------- Outils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1])*60+(+m[2]):NaN;};
const fmtT=v=>{if(typeof v!=='number')v=toMin(v);if(isNaN(v))return '';const h=Math.floor(v/60),m=v%60;return m?`${h} h ${pad(m)}`:`${h} h`;};
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi'];
const WD=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const fMonth=new Intl.DateTimeFormat('fr-CA',{month:'long'});
const fMonthS=new Intl.DateTimeFormat('fr-CA',{month:'short'});
const dn=d=>d.getDate()===1?'1er':String(d.getDate());
const dayLabel=d=>`${WD[d.getDay()]} ${dn(d)} ${fMonth.format(d)}`;

const pl=(n,s,p)=>`${n} ${n>1?p:s}`;
const pct=(a,b)=>b?Math.round(a/b*100):null;
const collator=new Intl.Collator('fr-CA',{sensitivity:'base',numeric:true});
const sortByName=a=>[...a].sort((x,y)=>collator.compare(x.nom||'',y.nom||''));
/* Les élèves se rangent par numéro dans leur classe (puis par nom) */
const numOfEl=e=>e&&e.numero!=null&&e.numero!==''&&!isNaN(+e.numero)?+e.numero:1e9;
const sortEls=a=>[...a].sort((x,y)=>numOfEl(x)-numOfEl(y)||collator.compare(x.nom||'',y.nom||''));
const genId=p=>`${p}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
const slotId=()=>'s'+Math.random().toString(36).slice(2,7);
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const LBL={P:'Présent',A:'Absent',R:'Retard',M:'Motivé'};
const LBLS={P:['présent','présents'],A:['absent','absents'],R:['retard','retards'],M:['motivé','motivés']};

/* « Remplacement » était l’ancien nom du statut « Suppléant » */
const statOf=p=>p&&p.statut==='Remplacement'?'Suppléant':(p&&p.statut)||'Actif';

const ROLE_LBL={admin:'Administrateur',teacher:'Enseignant',student:'Élève'};
const IC={
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',

  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  teach:'<path d="M2 3h20M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3M7 21l5-5 5 5"/>',
  card:'<rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M14 10h4M14 14h4M5 16.5c.6-1.3 1.7-2 3-2s2.4.7 3 2"/>',
  clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  exam:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 14h6M9 18h4"/>',
  gear:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  spark:'<path d="M11 3l2 5.5L18.5 10.5 13 12.5 11 18l-2-5.5L3.5 10.5 9 8.5z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/>',

  left:'<path d="m15 18-6-6 6-6"/>',

/* ---------- État ---------- */
const PREF='calendrier-cours-prefs';
let prefs={};

const S={
  role:['admin','teacher','student'].includes(prefs.role)?prefs.role:'admin',

  conn:'loading', canAdmin:null, canWrite:null,
  me:{id:null,name:'',avatarUrl:''}, isOwner:false, myAcct:null, peers:[],
  loaded:{}, busy:false, confirmClear:false, termKey:'', termLoaded:false,
  data:{comptes:[],demandes:[],config:null,cours:[],enseignants:[],dossiers:{},groupes:[],eleves:[],examens:[],presences:{},presTerm:{},presOne:{},staffPres:{},absProfs:{},candidatures:[],remplacements:[],dispos:{},resultats:{},mesRes:{},mesPct:{},journal:[]},
  dr:null
};
let DB=null, unsubPres=null, unsubTerm=null, unsubMR=null, uidSeq=0;
function savePrefs(){try{localStorage.setItem(PREF,JSON.stringify({role:S.role,teacher:S.teacher,group:S.group,student:S.student,filtre:S.filtre,fmode:S.fmode,compact:S.compact,view:S.view,sideMini:S.sideMini,demoHidden:S.demoHidden,nvSeen:S.nvSeen,nfSeen:S.nfSeen}));}catch(e){}}

const byId=(arr,id)=>arr.find(x=>x.id===id);
const cfg=()=>Object.assign({nom:'',annee:'',debut:'',fin:'',conges:[],etapes:[],competences:[]},S.data.config||{});
const comps=()=>(cfg().competences||[]).slice().sort((a,b)=>(+a.code)-(+b.code));
const staff=()=>sortByName(S.data.enseignants);
const isTeacher=p=>!p.fonction||p.fonction==='Enseignant'||p.fonction==='Instructeur';
const teachers=()=>staff().filter(p=>isTeacher(p)&&p.statut!=='Inactif');
const groups=()=>sortByName(S.data.groupes);

/* ---------- Calcul des cours et des examens ---------- */
function offDay(ds){
  const c=cfg();
  if((c.debut&&ds<c.debut)||(c.fin&&ds>c.fin)) return 'Hors année scolaire';
  for(const k of c.conges||[]){ if(k&&k.du&&ds>=k.du&&ds<=(k.au||k.du)) return k.nom||'Congé'; }
  return null;
}
const activeSlots=c=>(c.creneaux||[]).filter(s=>!s.au||s.au>=todayISO());
/* L’horaire d’un jour est gardé en mémoire tant que les séances, le calendrier scolaire et les affectations ne changent pas.
   Le tableau rendu est figé : qui veut le trier ou le filtrer en fait une copie. */
let _so={c:null,g:null,a:null,m:new Map()};
function sessionsOn(ds){
  const D=S.data;
  if(_so.c!==D.cours||_so.g!==D.config||_so.a!==D.candidatures) _so={c:D.cours,g:D.config,a:D.candidatures,m:new Map()};
  let r=_so.m.get(ds);
  if(!r){r=Object.freeze(sessionsOnRaw(ds));_so.m.set(ds,r);}
  return r;
}
function sessionsOnRaw(ds){
  const d=parse(ds), j=(d.getDay()+6)%7+1;
  if(j>5||offDay(ds)) return [];
  const out=[];
  for(const c of S.data.cours){
    const ann=c.annulees||[];
    if(!((c.du&&ds<c.du)||(c.au&&ds>c.au))) for(const sl of c.creneaux||[]){
      if(+sl.jour!==j||(sl.du&&ds<sl.du)||(sl.au&&ds>sl.au)) continue;
      const a=toMin(sl.debut), b=toMin(sl.fin);
      if(isNaN(a)||isNaN(b)||b<=a) continue;
      const tag=`${ds}@${sl.id}`, cancelled=ann.includes(tag);
      out.push({kind:'cours',key:`${c.id}_${sl.id}_${ds}`,c,sl,date:ds,start:a,end:b,grp:c.groupe,tch:tchOf(c,`${c.id}_${sl.id}_${ds}`),salle:String(sl.salle||c.salle||'').trim(),cancelled,movedX:cancelled?(c.extras||[]).find(x=>x.de===tag)||null:null});
    }
    for(const x of c.extras||[]){
      if(x.date!==ds) continue;
      const a=toMin(x.debut), b=toMin(x.fin);
      if(isNaN(a)||isNaN(b)||b<=a) continue;
      out.push({kind:'cours',key:`${c.id}_${x.id}_${ds}`,c,sl:{id:x.id,jour:j,debut:x.debut,fin:x.fin,salle:x.salle||''},extra:x,date:ds,start:a,end:b,grp:c.groupe,tch:tchOf(c,`${c.id}_${x.id}_${ds}`),salle:String(x.salle||c.salle||'').trim(),cancelled:ann.includes(`${ds}@${x.id}`)});
    }
  }
  return out.sort((x,y)=>x.start-y.start||x.end-y.end);
}
/* On parle d’avant-midi, d’après-midi ou de toute la journée, jamais d’heures. */
function moment(a,b){if(a<12*60&&b>13*60)return 'Toute la journée';return a<12*60?'Avant-midi':'Après-midi';}
const momentOf=s=>moment(s.start,s.end);
const momentShort=s=>({'Avant-midi':'AM','Après-midi':'PM'})[momentOf(s)]||'Journée';
const momentIn=(a,b)=>({'Avant-midi':'en avant-midi','Après-midi':'en après-midi'})[moment(a,b)]||'toute la journée';
const codeOf=c=>c&&c.code?`<span class="cc-code">${esc(c.code)}</span> `:'';
function movedLabel(s){
  const x=s.movedX;if(!x)return '';
  if(x.date===s.date) return 'Déplacé '+momentIn(toMin(x.debut),toMin(x.fin));
  const d=parse(x.date);return `Déplacé au ${WD[d.getDay()].toLowerCase()} ${dn(d)}`;
}
function examItem(e){
  const c=byId(S.data.cours,e.cours), a=toMin(e.debut), b=toMin(e.fin);
  return {kind:'exam',key:'x_'+e.id,e,c,date:e.date,start:isNaN(a)?0:a,end:isNaN(b)?(isNaN(a)?0:a+75):b,grp:e.groupe||(c&&c.groupe)||'',tch:[c&&c.enseignant,e.surveillant].filter(Boolean),salle:String(e.salle||(c&&c.salle)||'').trim()};
}
function weekItems(){
  let out=[];const from=iso(S.week), to=iso(addDays(S.week,4));
  for(let i=0;i<5;i++) out=out.concat(sessionsOn(iso(addDays(S.week,i))));
  out=out.concat(S.data.examens.filter(e=>!e.seance&&e.date>=from&&e.date<=to).map(examItem));
  return out.sort((x,y)=>x.date.localeCompare(y.date)||x.start-y.start||(x.kind==='exam'?-1:1));
}
function isPast(s){const t=todayISO();return s.date<t||(s.date===t&&s.start<=nowMin());}
const presDoc=key=>S.data.presences[key]||S.data.presTerm[key];
function attInfo(s){
  if(s.cancelled) return {state:'cancelled',c:{},marked:0,total:0,past:isPast(s),due:false};
  const els=studentsOf(s.c.groupe), p=presDoc(s.key), st=(p&&p.statuts)||{};
  const c={P:0,A:0,R:0,M:0}; let marked=0;
  for(const e of els){const v=st[e.id];if(c[v]!=null){c[v]++;marked++;}}
  const past=isPast(s);
  /* une activité (Accueil, Graduation…) n’a des présences à prendre que si on a commencé à les prendre */
  const state=els.length&&marked>=els.length?'done':marked>0?'partial':past?(isActivity(s.c)?'none':'todo'):'future';
  return {state,c,marked,total:els.length,past,doc:p,due:past&&els.length>0&&(state==='todo'||state==='partial')};
}
function statusChip(s,mode){return (!s.cancelled&&profAbsent(s)?'<span class="chip bad">Enseignant absent</span>':'')+statusChip0(s,mode);}
function statusChip0(s,mode){

  if(a.state==='todo') return moved+'<span class="chip warn">Présences à faire</span>';
  return moved;
}
/* Numéro du cours dans l’horaire annuel : « 7.5 » devient « Cours 7.5 » */
function sessLabel(s){
  const l=s&&s.extra&&s.extra.label?String(s.extra.label).trim():'';
  if(!l||l.toLowerCase()===String(s.c&&s.c.titre||'').toLowerCase()) return '';
  /* « 8.1–8.2 » : deux cours ; « 16-6 » : un seul cours, numéroté avec un trait d’union */
  const r=/^(\d+(?:[.,-]\d+)*)\s*–\s*(\d+(?:[.,-]\d+)*)$/.exec(l)||/^(\d+(?:[.,]\d+)*)\s+-\s+(\d+(?:[.,]\d+)*)$/.exec(l);
  if(r) return `Cours ${r[1]} et ${r[2]}`;
  return /^\d+([.,-]\d+)*$/.test(l)?'Cours '+l:l;
}
function metaFor(s,mode){
  if(s.kind==='exam'){

    return [s.c?e.titre:'',mode==='admin'?'':gName(s.grp),s.salle?'Local '+s.salle:'',e.surveillant?'Surveillance : '+shortName(tName(e.surveillant)):''].filter(Boolean).join(' · ');
  }
  const c=s.c, id=sessLabel(s), ids=(s.tch||[]).filter(t=>t&&byId(S.data.enseignants,t)), who=ids.length?shortName(tName(ids[0]))+(ids.length>1?' +'+(ids.length-1):''):shortName(tName(c.enseignant));
  if(mode==='admin') return [who,s.salle?'Local '+s.salle:'',id].filter(Boolean).join(' · ');

/* Étiquettes d’une séance de l’horaire annuel (Pratique, Théorie, Examen, Ménage…), comme sur le site. */
const TAGCHIP={Pratique:'ok',Théorie:'info',Examen:'bad',Reprise:'bad',Simulation:'k2',Sport:'k2',Stage:'k5',Visite:'k4',Musée:'k4',Ménage:'warn','Ménage ?':'warn',Maison:'off',Congé:'off'};
const TAGTONE={Pratique:'k6',Théorie:'k0',Examen:'kx',Reprise:'kx',Simulation:'k2',Stage:'k5',Visite:'k4',Musée:'k4',Congé:'k7'};
const tagsOf=s=>(s.extra&&s.extra.tags)||(s.sl&&s.sl.type?withAct([],s.sl.type):[]);
/* Période et activité d’une séance, comme dans le formulaire du site de l’Académie */
const PERIODES=[{k:'am',label:'Avant-midi',debut:'08:00',fin:'11:00'},{k:'pm',label:'Après-midi',debut:'12:00',fin:'15:00'},{k:'jour',label:'Toute la journée',debut:'08:00',fin:'15:00'}];
const ACTIVITES=[{k:'theorie',label:'Théorie',tags:['Théorie']},{k:'pratique',label:'Pratique',tags:['Pratique']},{k:'examen',label:'Examen',tags:['Examen']},{k:'examen-t',label:'Examen théorique',tags:['Examen','Théorie']},{k:'examen-p',label:'Examen pratique',tags:['Examen','Pratique']},{k:'reprise',label:'Reprise',tags:['Reprise']},{k:'simulation',label:'Simulation',tags:['Simulation']},{k:'conge',label:'Congé / journée spéciale',tags:['Congé']},{k:'visite',label:'Visite',tags:['Visite']},{k:'stage',label:'Stage',tags:['Stage']},{k:'activite',label:'Activité',tags:[]}];
const ACT_TAGS=new Set(['Théorie','Pratique','Examen','Reprise','Simulation','Visite','Congé','Stage']);
const periodOf=(debut,fin)=>{const p=PERIODES.find(x=>x.debut===debut&&x.fin===fin);return p?p.k:'autre';};
function actOf(tags){const t=new Set(tags||[]);if(t.has('Examen')&&t.has('Théorie'))return 'examen-t';if(t.has('Examen')&&t.has('Pratique'))return 'examen-p';if(t.has('Examen'))return 'examen';if(t.has('Reprise'))return 'reprise';if(t.has('Théorie'))return 'theorie';if(t.has('Pratique'))return 'pratique';if(t.has('Simulation'))return 'simulation';if(t.has('Visite'))return 'visite';if(t.has('Congé'))return 'conge';if(t.has('Stage'))return 'stage';return 'activite';}
function withAct(tags,k){const a=ACTIVITES.find(x=>x.k===k);return (a?a.tags:[]).concat((tags||[]).filter(t=>!ACT_TAGS.has(t)));}
function periodSelect(id,debut,fin,attrs,custom){const p=custom?'autre':periodOf(debut,fin);return `<select id="${id}" ${attrs}>${PERIODES.map(x=>`<option value="${x.k}"${p===x.k?' selected':''}>${x.label}</option>`).join('')}<option value="autre"${p==='autre'?' selected':''}>${p==='autre'&&debut&&fin?`Heures précises (${fmtT(debut)} – ${fmtT(fin)})`:'Heures précises…'}</option></select>`;}
const actSelect=(id,k,attrs)=>`<select id="${id}" ${attrs}>${ACTIVITES.map(x=>`<option value="${x.k}"${k===x.k?' selected':''}>${x.label}</option>`).join('')}</select>`;
const CHORE_TAGS=new Set(['Ménage','Ménage ?']);
/* La corvée de ménage est pour toute la classe, toute la journée.
   Elle est notée dans la classe (groupes/<id>.menage : liste de dates) ; les anciennes étiquettes « Ménage »
   d’une séance de la classe ce jour-là comptent aussi. */
let choreMemo=new Map();
function choreDay(gid,date){
  if(!gid||!date) return '';
  const k=gid+'|'+date;if(choreMemo.has(k)) return choreMemo.get(k);
  let r='';
  const g=byId(S.data.groupes,gid);
  if(g&&Array.isArray(g.menage)&&g.menage.includes(date)) r='oui';
  else for(const x of sessionsOn(date)){
    if(x.grp!==gid||x.kind==='exam'||x.cancelled) continue;
    const t=tagsOf(x);if(t.includes('Ménage')){r='oui';break;}if(t.includes('Ménage ?'))r='maybe';
  }
  choreMemo.set(k,r);return r;
}
const choreOf=s=>!s||s.kind==='exam'||s.cancelled?'':choreDay(s.grp,s.date);
async function setChoreDay(gid,date,on){
  const g=byId(S.data.groupes,gid);if(!g||S.busy)return;
  const days=new Set(Array.isArray(g.menage)?g.menage:[]);
  if(on) days.add(date); else days.delete(date);
  const jobs=[()=>col('groupes').doc(gid).update({menage:[...days].sort()})];
  // en retirant la corvée, les anciennes étiquettes « Ménage » des séances de ce jour disparaissent aussi
  if(!on) for(const c of S.data.cours.filter(c=>c.groupe===gid)){
    if(!(c.extras||[]).some(x=>x.date===date&&(x.tags||[]).some(t=>CHORE_TAGS.has(t)))) continue;
    const doc=courseDoc(c);doc.extras.forEach(x=>{if(x.date===date)x.tags=(x.tags||[]).filter(t=>!CHORE_TAGS.has(t));});
    jobs.push(()=>putCours(c.id,doc));
  }
  S.busy=true;render();
  await write(async()=>{for(const j of jobs)await j();},on?'Corvée de ménage ajoutée pour la journée':'Corvée de ménage retirée');
  S.busy=false;render();
}

const sessTone=s=>{for(const t of tagsOf(s)) if(TAGTONE[t]) return TAGTONE[t];return tone(s.c);};

function classProgress(gid){
  const t=todayISO();let total=0,done=0;
  for(const c of S.data.cours.filter(c=>c.groupe===gid)) for(const x of datedOf(c)){
    if((c.annulees||[]).includes(`${x.date}@${x.id}`)||offDay(x.date)) continue;

  }
  return {total,done,pct:total?Math.round(done/total*100):null};
}

function courseLoad(c){
  const w=activeSlots(c).length, dated=datedOf(c), ann=c.annulees||[];

  const label=w&&!dated.length?`${w} / sem.`:dated.length?String(dated.length)+(w?` + ${w} / sem.`:''):'—';
  const hp=heuresOf(c), hours=hp?`<span class="chip ${h>=hp?'ok':h>=hp*0.8?'warn':'bad'}" title="Heures planifiées / heures prévues au programme">${h} / ${hp} h</span>`:dated.length?`${h} h`:'—';
  return {label,hours};
}

  const body=els.map(e=>{const s=stats[e.id], r=rateOf(s);
    const a=s?s.A+s.M:0, rt=s?s.R:0, cls=rateCls(r);
    return `<tr class="row-link" data-act="student" data-id="${esc(e.id)}"><td><span class="tb-who"><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span><span><button class="link" type="button" data-act="student" data-id="${esc(e.id)}">${esc(e.nom)}</button>${e.fonction?`<span class="role-chip">${esc(e.fonction)}</span>`:''}</span></span></td><td class="tb-cls"><span class="tb-who"><span class="cl-num sm" aria-hidden="true">${esc(String(gName(e.groupe)).replace(/^(Classe|Groupe)\s+/i,'').slice(0,4))}</span><span class="muted sm">${esc(gName(e.groupe))}</span></span></td><td class="tb-top">${r==null?'<span class="muted tb-empty">—</span>':`<div class="cl-big tb-rate ${cls}"><b>${r} %</b><div class="meter ${cls}" aria-hidden="true"><i style="width:${r}%"></i></div></div>`}</td><td class="num" data-l="Absences"><span class="tb-n ${a?'bad':'zero'}">${a}</span></td><td class="num" data-l="Retards"><span class="tb-n ${rt?'warn':'zero'}">${rt}</span></td><td>${e.telephone?esc(e.telephone):'<span class="muted tb-empty">—</span>'}</td></tr>`;}).join('');
  return tb+`<p class="summary"><span><b>${els.length}</b>${els.length>1?'élèves':'élève'}</span><span>Présences comptées depuis le ${esc(longDate(parse(from)))}</span>${S.termLoaded?'':'<span>Chargement des présences…</span>'}</p>
    <div class="tbl-wrap"><table class="tbl stack"><thead><tr><th>Élève</th><th>Classe</th><th>Présence</th><th class="num">Absences</th><th class="num">Retards</th><th>Téléphone</th></tr></thead><tbody>${body||'<tr><td colspan="6" class="muted">Aucun élève ne correspond à la recherche.</td></tr>'}</tbody></table></div>`;
}

/* ---------- Fiches en pleine page (élèves et personnel) ----------
   Une liste à gauche pour passer d’une personne à l’autre, « Précédent / Suivant » (ou ← →),
   et « Retour à la liste » (ou Échap) qui revient à l’endroit où l’on était. */
const studentList=()=>{
  const q=String(S.pg.q||'').trim().toLowerCase(), g=S.pg.g||'';
  let els=sortElsByClass(S.data.eleves);
  if(g) els=els.filter(e=>e.groupe===g);
  if(q) els=els.filter(e=>String(e.nom||'').toLowerCase().includes(q));
  return els;
};
function openFiche(page,id){
  const from=S.page===page?(S.pg.from||null):S.page;
  if(S.page!==page){
    S.page=page;S.pg={};
    if(page==='eleves'){const e=byId(S.data.eleves,id);if(e&&from==='classes')S.pg.g=e.groupe;}
    if(page==='eleves'||page==='classes')ensureTerm();
  }else if(!S.pg.fiche) S.pg.listY=window.scrollY;
  S.pg.fiche=id;S.pg.from=from;S.dr=null;
  render();window.scrollTo({top:0});
}
function closeFiche(){
  const from=S.pg.from, y=S.pg.listY||0;
  if(from&&from!==S.page){goPage(from);return;}
  S.pg.fiche=null;render();window.scrollTo({top:y});
}
function ficheStep(d){
  const list=S.page==='eleves'?studentList():S.page==='classes'?groups():S.page==='modules'?modList():staff(), i=list.findIndex(x=>x.id===S.pg.fiche), n=list[i+d];
  if(n){S.pg.fiche=n.id;render();window.scrollTo({top:0});const b=$(d<0?'#fi-prev':'#fi-next');if(b&&!b.disabled)b.focus({preventScroll:true});}
}
const ageOf=d=>{if(!d)return null;const b=parse(d),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a>=0&&a<120?a:null;};
const acctOfRef=id=>S.data.comptes.find(a=>a.ref===id&&!a.exemple)||S.data.comptes.find(a=>a.ref===id)||null;
function ficheShell(kind,list,cur,listItem,head,tabs,content){
  const i=list.findIndex(x=>x.id===cur.id), prev=list[i-1], next=list[i+1];
  const from=S.pg.from&&S.pg.from!==S.page?S.pg.from:null;
  const backLbl=from==='classes'?'Retour aux classes':kind==='eleves'?'Retour à la liste des élèves':kind==='classes'?'Retour aux classes':kind==='modules'?'Retour aux modules':'Retour à la liste du personnel';
  const filt=kind==='eleves'?`<div class="fl-tools"><input class="search" id="s-q" type="search" placeholder="Rechercher" aria-label="Rechercher un élève" autocomplete="off" value="${esc(S.pg.q||'')}"><select id="s-g" aria-label="Classe"><option value="">Toutes les classes</option>${groups().map(x=>`<option value="${esc(x.id)}"${S.pg.g===x.id?' selected':''}>${esc(x.nom)}</option>`).join('')}</select></div>`:'';
  const nav=`<div class="fiche-nav"><button class="btn sm" type="button" id="fi-back" data-act="fi-back">${icon('left')}${backLbl}</button><span class="grow"></span>
    ${i>=0?`<span class="muted sm">${i+1} sur ${list.length}</span>`:''}
    <button class="btn sm" type="button" id="fi-prev" data-act="fi-step" data-d="-1"${prev?` title="${esc(prev.nom)} (←)"`:' disabled'}>${icon('left')}<span class="fi-lbl">${prev?esc(prev.nom):'Précédent'}</span></button>
    <button class="btn sm" type="button" id="fi-next" data-act="fi-step" data-d="1"${next?` title="${esc(next.nom)} (→)"`:' disabled'}><span class="fi-lbl">${next?esc(next.nom):'Suivant'}</span>${icon('right')}</button></div>`;
  const tab=S.pg.tab&&tabs.some(t=>t[0]===S.pg.tab)?S.pg.tab:tabs[0][0];
  const tabBar=`<div class="seg fiche-tabs" role="group" aria-label="Sections de la fiche">${tabs.map(([k,l])=>`<button type="button" id="fi-tab-${k}" data-act="fi-tab" data-v="${k}" aria-pressed="${k===tab}">${l}</button>`).join('')}</div>`;
  return `<div class="fiche"><aside class="fiche-list" aria-label="${kind==='eleves'?'Élèves':kind==='classes'?'Classes':kind==='modules'?'Modules':'Personnel'}">${filt}<ul>${list.map(x=>`<li><button type="button" class="fl-item" id="fl-${esc(x.id)}" data-act="${kind==='eleves'?'student':kind==='classes'?'class':kind==='modules'?'module':'staff'}" data-id="${esc(x.id)}" aria-current="${x.id===cur.id}">${listItem(x)}</button></li>`).join('')||'<li class="muted sm" style="padding:12px">Aucun résultat.</li>'}</ul></aside>
    <div class="fiche-main">${nav}${head}${tabBar}<div class="fiche-body">${content(tab)}</div></div></div>`;
}
/* Compte de la personne, affiché dans l’en-tête de sa fiche */
function acctChip(id){
  const a=acctOfRef(id);
  if(!a) return '<span class="chip off" id="fi-acct-chip" title="La personne ne peut pas encore se connecter à son horaire.">Sans compte</span>';
  const p=a.exemple?null:profOf(a.id);
  if(!a.exemple) needProfiles([a.id]);
  const who=a.exemple?'compte d’exemple':((p&&p.name)||(siteMode()?'compte du site':'accès claude.ai'));
  return `<span class="chip ok" id="fi-acct-chip" title="${esc('Compte '+ROLE_LBL[a.role]+(a.maj?' · mis à jour le '+longDate(new Date(a.maj)):''))}">Compte ${esc(ROLE_LBL[a.role].toLowerCase())} · ${esc(who)}</span>`;
}
function acctBtn(id,role){
  const a=acctOfRef(id);
  return a?`<button class="btn sm" type="button" id="fi-acct-btn" data-act="ac-edit" data-id="${esc(a.id)}">Modifier le compte</button>`
    :`<button class="btn sm" type="button" id="fi-acct-btn" data-act="fi-acct" data-role="${role}" data-id="${esc(id)}"${dis()}>${icon('plus')}Créer son compte</button>`;
}

/* En-tête : identité, actions, puis quelques chiffres clés */
const ficheHead=(name,chips,actions,stats,av)=>`<section class="panel fiche-head"><div class="fh-top">${av||avHTML(name,'','lg')}<div class="prof-id"><h2 id="fi-name">${esc(name)}</h2>${chips?`<div class="prof-chips">${chips}</div>`:''}</div><div class="fiche-act">${actions}</div></div>
  <dl class="fh-stats">${stats.map(([k,v,cls])=>`<div><dt>${k}</dt><dd${cls?` class="${cls}"`:''}>${v}</dd></div>`).join('')}</dl></section>`;
const rows=items=>items.length?`<ul class="plist">${items.join('')}</ul>`:'';

function studentFiche(){
  const e=byId(S.data.eleves,S.pg.fiche);
  if(!e){S.pg.fiche=null;return studentsPage();}
  ensureTerm(yearStart());
  const list=studentList(), s=studentStats(yearStart(),todayISO())[e.id], r=rateOf(s), age=ageOf(e.naissance);
  const up=upcomingExams(x=>x.grp===e.groupe,6), nextEx=up[0];
  const item=x=>`<span class="fl-name">${esc(x.nom)}</span><span class="fl-sub">${esc(gName(x.groupe))}${x.numero?` · n° ${esc(x.numero)}`:''}</span>`;
  const chips=`<span class="chip">${esc(gName(e.groupe))}</span>${e.numero?`<span class="chip off">n° ${esc(e.numero)}</span>`:''}${e.fonction?`<span class="role-chip">${esc(e.fonction)}</span>`:''}${acctChip(e.id)}`;
  const actions=`<button class="btn sm primary" type="button" id="fi-edit" data-act="st-edit" data-id="${esc(e.id)}">Modifier le dossier</button>${e.groupe?`<button class="btn sm" type="button" data-act="see-group" data-id="${esc(e.groupe)}">Horaire de la classe</button>`:''}${acctBtn(e.id,'student')}`;
  const loaded=S.termLoaded, n=s?s.n:0;
  const stats=[
    ['Présence',!loaded?'…':n?`${r} %`:'—',n?(r>=95?'ok':r>=90?'warn':'bad'):''],
    ['Absences',!loaded?'…':String(s?s.A+s.M:0),s&&s.A?'bad':''],
    ['Retards',!loaded?'…':String(s?s.R:0),s&&s.R?'warn':''],
    ['Prochain examen',nextEx?esc(`${dn(parse(nextEx.date))} ${fMonthS.format(parse(nextEx.date))}`):'Aucun','']
  ];
  const head=ficheHead(e.nom,chips,actions,stats);
  const content=tab=>{
    if(tab==='presences'){
      if(!loaded) return '<section class="panel"><p class="help">Chargement des présences…</p></section>';
      const log=s?s.log.slice().sort((a,b)=>b.date.localeCompare(a.date)):[];
      const byC={};
      for(const p of Object.values(S.data.presTerm)){const v=p&&p.statuts&&p.statuts[e.id];if(!v||!LBL[v])continue;const x=byC[p.cours]||(byC[p.cours]={P:0,A:0,R:0,M:0,n:0});x[v]++;x.n++;}
      const per=Object.entries(byC).map(([cid,x])=>({c:byId(S.data.cours,cid),x})).sort((p,q)=>collator.compare(p.c?p.c.titre:'',q.c?q.c.titre:''));
      return `<div class="fiche-two"><section class="panel"><h2>Absences et retards</h2>${log.length?rows(log.map(x=>{const c=byId(S.data.cours,x.cours);return `<li><span>${esc(dayLabel(parse(x.date)))}<span class="muted sm"> · ${esc(c?c.titre:'Cours')}</span></span><span class="chip ${CHIP[x.v]}">${LBL[x.v]}</span></li>`;})):'<p class="help">Aucune absence ni aucun retard depuis la rentrée.</p>'}</section>
        <section class="panel"><h2>${W('Par module','Par cours')}</h2>${per.length?rows(per.map(({c,x})=>{const rr=pct(x.P+x.R,x.n);return `<li><span>${esc(c?c.titre:W('Module supprimé','Cours supprimé'))}</span><span class="chip ${rr>=95?'ok':rr>=90?'warn':'bad'}">${rr} %</span></li>`;})):`<p class="help">${W('Aucune séance notée','Aucun cours noté')} pour l’instant.</p>`}
        <p class="help" style="margin-top:10px">${n?`${pl(n,W('séance notée','cours noté'),W('séances notées','cours notés'))} depuis le ${esc(longDate(parse(yearStart())))}.`:''}</p></section></div>`;
    }
    if(tab==='examens') return studentExamsTab(e);
    return `<section class="panel"><dl class="facts facts3">
      <div><dt>Enseignant principal</dt><dd>${principalOf(e.groupe)?esc(tName(principalOf(e.groupe))):'<span class="muted">—</span>'}</dd></div>
      <div><dt>Date de naissance</dt><dd>${e.naissance?esc(longDate(parse(e.naissance)))+(age!=null?` <span class="muted">(${age} ans)</span>`:''):'<span class="muted">—</span>'}</dd></div>
      <div><dt>Contact d’urgence</dt><dd>${e.parent?esc(e.parent):'<span class="muted">—</span>'}</dd></div>
      <div><dt>Téléphone</dt><dd>${e.telephone?`<a href="tel:${esc(String(e.telephone).replace(/\s+/g,''))}">${esc(e.telephone)}</a>`:'<span class="muted">—</span>'}</dd></div>
      <div><dt>Courriel</dt><dd>${e.courriel?`<a href="mailto:${esc(e.courriel)}">${esc(e.courriel)}</a>`:'<span class="muted">—</span>'}</dd></div>
      <div class="wide"><dt>Suivi</dt><dd>${e.notes?`<span class="pre">${esc(e.notes)}</span>`:'<span class="muted">Aucune note.</span>'}</dd></div></dl></section>`;
  };
  return ficheShell('eleves',list,e,item,head,[['dossier','Dossier'],['presences','Présences'],['examens','Examens']],content);
}

function staffFiche(){

  if(!p){S.pg.fiche=null;return staffPage();}
  const list=staff(), z=S.data.dossiers[p.id]||{}, st=statOf(p), teach=isTeacher(p);
  const item=x=>{const pc=principalClasses(x.id);return `<span class="fl-name">${esc(x.nom)}</span><span class="fl-sub">${esc(x.fonction||'Enseignant')}${pc.length?` · principal ${esc(pc.map(g=>g.nom.replace(/^(Classe|Groupe)\s+/i,'')).join(', '))}`:''}</span>`;};
  const cs=S.data.cours.filter(c=>c.enseignant===p.id).sort((x,y)=>collator.compare(gName(x.groupe),gName(y.groupe))||collator.compare(x.titre,y.titre));
  const byG={};for(const c of cs)(byG[c.groupe]=byG[c.groupe]||[]).push(c);

  const chips=`<span class="chip">${esc(p.fonction||'Enseignant')}</span>${principalClasses(p.id).map(g=>`<span class="chip k0">Enseignant principal · ${esc(g.nom)}</span>`).join('')}<span class="chip ${STATUTS[st]||'off'}">${esc(st)}</span>${acctChip(p.id)}`;
  const actions=`<button class="btn sm primary" type="button" id="fi-edit" data-act="sf-edit" data-id="${esc(p.id)}">Modifier le dossier</button>${teach?`<button class="btn sm" type="button" data-act="see-teacher" data-id="${esc(p.id)}">Son horaire</button>`:''}${acctBtn(p.id,p.fonction&&!teach?'admin':'teacher')}`;
  const stats=teach?[['Modules',String(acad()?new Set(cs.map(modKey).filter(x=>x!=null)).size:cs.length),''],['Classes',String(Object.keys(byG).length),''],['Cette semaine',pl(wk.length,W('séance','cours'),W('séances','cours')),''],['Présences à prendre',String(late),late?'warn':'']]
    :[['Statut',esc(st),''],['Courriel',p.courriel?esc(p.courriel):'—','']];
  const head=ficheHead(p.nom,chips,actions,stats);
  const SCH={P:'ok',A:'bad',C:'warn',F:'info'};
  const tabs=[['dossier','Dossier']].concat(teach?[['cours',acad()?'Modules':'Cours'],['competences','Compétences et disponibilités']]:[],[['travail','Présences au travail']]);
  const content=tab=>{
    if(tab==='competences'){
      const mine=new Set((p.competences||[]).map(Number)), can=isAdmin()&&S.conn==='shared';
      return `<section class="panel"><h2>Compétences</h2><p class="help" style="margin-bottom:10px">Les modules que ${esc(p.nom)} peut donner. Les séances à pourvoir lui sont proposées selon cette liste.</p>
          ${comps().length?`<form data-form="sf-comp" data-id="${esc(p.id)}"><div class="ck-grid">${comps().map(k=>`<label class="ck"><input type="checkbox" name="comp" value="${esc(k.code)}"${mine.has(+k.code)?' checked':''}${can?'':' disabled'}><span><b>M${esc(k.code)}</b> ${esc(k.nom)}</span></label>`).join('')}</div>
          ${can?`<div class="row" style="margin-top:12px"><button class="btn primary" type="submit"${dis()}>Enregistrer les compétences</button><button class="btn sm ghost" type="button" data-act="sf-comp-all" data-v="1">Tout cocher</button><button class="btn sm ghost" type="button" data-act="sf-comp-all" data-v="">Tout décocher</button></div>`:''}</form>`:'<p class="help">Créez d’abord les modules du programme dans le menu Modules.</p>'}</section>
        <section class="panel dp-panel" style="margin-top:14px"><h2>Disponibilités</h2>${dispoCalHTML(p.id,can)}</section>`;
    }
    if(tab==='cours'){
      const og=S.pg.og||{}, nx=nextSession(x=>x.tch.includes(p.id)), surv=upcomingExams(x=>x.e&&x.e.surveillant===p.id,5);
      const myMods=acad()?comps().filter(k=>k.charge===p.id):[];
      const modsHTML=myMods.length?`<ul class="plist" id="sf-mods">${myMods.map(k=>`<li><button class="link" type="button" data-act="module" data-id="${esc(k.code)}"><span class="muted">M${esc(k.code)}</span> ${esc(k.nom)}</button><span class="muted sm">${pl(new Set(modCourses(k.code).map(c=>c.groupe)).size,'classe','classes')}${modTot(k)?' · '+modTot(k)+' h':''}</span></li>`).join('')}</ul>`:'';
      const lst=acad()?cs.filter(isActivity):cs, byL={};for(const c of lst)(byL[c.groupe]=byL[c.groupe]||[]).push(c);
      const groupsHTML=lst.length?`<ul class="cg-list">${Object.entries(byL).sort((x,y)=>collator.compare(gName(x[0]),gName(y[0]))).map(([g,arr])=>{const h=arr.reduce((t,c)=>t+heuresOf(c),0), open=!!og[g];
        return `<li><button type="button" class="cg-head" id="cg-${esc(g)}" data-act="fi-og" data-g="${esc(g)}" aria-expanded="${open}"><span><b>${esc(gName(g))}</b><span class="muted sm"> · ${acad()?pl(arr.length,'activité','activités'):pl(arr.length,'cours','cours')}${h?` · ${h} h prévues`:''}</span></span>${icon('right')}</button>
        ${open?`<ul class="plist cg-body">${arr.map(c=>`<li><button class="link" type="button" data-act="edit-course" data-id="${esc(c.id)}">${c.code?`<span class="muted">${esc(c.code)}</span> `:''}${esc(c.titre)}</button><span class="muted sm">${heuresOf(c)?heuresOf(c)+' h':''}</span></li>`).join('')}</ul>`:''}</li>`;}).join('')}</ul>`:acad()?'':'<p class="help">Aucun cours assigné.</p>';
      return `<div class="fiche-two"><section class="panel">${acad()?`<h2>Chargé de cours</h2>${modsHTML||'<p class="help" id="sf-nomods">Chargé de cours d’aucun module.</p>'}${groupsHTML?`<h3 class="fiche-h3">Activités par classe</h3>${groupsHTML}`:''}`:`<h2>Cours par classe</h2>${groupsHTML}`}</section>
        <section class="panel"><h2>À venir</h2><p class="help">${nx?`${W('Prochaine séance','Prochain cours')} : <b>${esc(nx.s.c.titre)}</b> (${esc(gName(nx.s.c.groupe))}), ${esc(dayLabel(parse(nx.s.date)).toLowerCase())}, ${momentIn(nx.s.start,nx.s.end).replace(/^en /,'')}.`:W('Aucune séance prévue prochainement.','Aucun cours prévu prochainement.')}</p>

    }
    const emb=z.embauche?parse(z.embauche):null, yrs=emb?Math.floor((Date.now()-emb.getTime())/(365.25*864e5)):null;
    return `<section class="panel"><dl class="facts facts3">

      <div><dt>Téléphone</dt><dd>${z.telephone?`<a href="tel:${esc(String(z.telephone).replace(/\s+/g,''))}">${esc(z.telephone)}</a>`:'<span class="muted">—</span>'}</dd></div>
      <div><dt>Date d’embauche</dt><dd>${emb?esc(longDate(emb))+(yrs!=null&&yrs>=1?` <span class="muted">(${pl(yrs,'an','ans')})</span>`:''):'<span class="muted">—</span>'}</dd></div>
      <div class="wide"><dt>Remarques</dt><dd>${z.notes?`<span class="pre">${esc(z.notes)}</span>`:'<span class="muted">Aucune remarque.</span>'}</dd></div></dl></section>`;
  };
  return ficheShell('personnel',list,p,item,head,tabs,content);
}

/* ---------- Pages : personnel ---------- */
function staffPage(){

/* ---------- Heures enseignées : par enseignant et par mois, pour la paie des instructeurs ----------
   Une séance compte une fois qu’elle a eu lieu (passée, non annulée), pour chaque enseignant qui y était attribué
   et qui n’était pas marqué absent ce jour-là. */
function taughtRows(){
  const out=[];
  for(const s of sessionsBetween(yearStart(),todayISO())){
    if(s.kind!=='cours'||s.cancelled||!isPast(s)) continue;
    const abs=S.data.absProfs[s.date]||[];
    for(const id of new Set(s.tch)) if(id&&byId(S.data.enseignants,id)&&!abs.includes(id)) out.push({t:id,s,h:sHours(s)});
  }
  return out;
}
const hrMonths=()=>{const out=[];let d=parse(yearStart());d=new Date(d.getFullYear(),d.getMonth(),1);const end=new Date();while(d<=end&&out.length<14){out.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d=new Date(d.getFullYear(),d.getMonth()+1,1);}return out;};
const hrDate=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1);
const hrMonthName=m=>`${fMonth.format(hrDate(m))} ${hrDate(m).getFullYear()}`;
const hrFmt=h=>String(Math.round(h*10)/10).replace('.',',');

/* Fichier pour la paie : un sommaire par enseignant, puis le détail séance par séance */
function hoursCSV(m){
  const rows=taughtRows().filter(r=>m==='all'||r.s.date.slice(0,7)===m);

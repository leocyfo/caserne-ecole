<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PompierNote · Académie des pompiers</title>
<meta name="description" content="Horaire, présences, examens et stock de l’Académie des pompiers.">
<meta name="author" content="PompierNote">
<link rel="icon" type="image/svg+xml" href="site/embleme.svg">
<link rel="apple-touch-icon" href="site/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap">
<style>
:root{
  /* PompierNote v2, style compact : menu marine étroit, fond gris très clair, cartes blanches serrées, un seul rouge. Thème clair seulement. */
  color-scheme:light;
  --side:#0E1A2B; --side-ink:#E9EEF5; --side-soft:#B9C4D3; --side-muted:#7F8DA3; --side-line:#1F2E44; --side-hover:#162539; --side-active:#1D2F4A;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --head:#F8FAFC; --head-ink:#52627A; --row-ink:#16294A;
  --ink:#0E1A2B; --ink-2:#334256; --muted:#596880; --line:#E3E8EF; --line-2:#EDF1F6; --line-strong:#CBD4E0; --role:#0E1A2B; --role-bg:#EDF1F6;
  --accent:#C62F2A; --accent-hover:#AD2722; --accent-ink:#FFFFFF; --eyebrow:#596880; --today:#C62F2A; --focus:#2563EB;
  --ok:#17784E; --ok-bg:#DDF5E8; --warn:#93580C; --warn-bg:#FFEDCC; --bad:#B42F3A; --bad-bg:#FDE3E4; --info:#245C9A; --info-bg:#DFEBFC; --off:#5A6676; --off-bg:#E7EAEE;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px; --r-sm:7px;
  --shadow-sm:0 1px 2px rgba(14,26,43,.05),0 1px 3px rgba(14,26,43,.07);
  --shadow:0 16px 48px rgba(14,26,43,.22);
}
*{box-sizing:border-box}
/* !important seulement là où une règle doit tout emporter (IFT1005 : sinon, mauvaise pratique) : « hidden », « moins d’animations » (réglage du système),
   le glisser-déposer (04-horaire) et l’impression (05-panneaux) */
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:0s!important;scroll-behavior:auto!important}}
/* Tailles de texte en rem : elles suivent la taille choisie dans le navigateur (100 % = 16 px) */
html{font-size:100%}
/* la page ne passe pas sous l’encoche d’un iPhone tenu à l’horizontale (marges env) */
body{margin:0;background:var(--bg);color:var(--ink);font:.84375rem/1.45 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Bouton d’ouverture d’une rangée qui contient d’autres boutons (voir xRow) : invisible ; au clavier, toute la rangée s’encadre */
.row-open{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;background:none}
.row-open:focus-visible{outline:none}
:is(.xm-row,.cl-row,.st-row):has(>.row-open:focus-visible){outline:3px solid var(--focus);outline-offset:-3px}
.k0{--card:#EDF4FE;--chip:#DCEAFD;--chip-ink:#275F9D;--bar:#7AA9E3}
.k1{--card:#FFF6E6;--chip:#FFEBC7;--chip-ink:#995D12;--bar:#E5A84B}
.k2{--card:#F5EFFE;--chip:#EADCFC;--chip-ink:#7043A5;--bar:#A982DB}
.k3{--card:#FDF0F6;--chip:#FBDCEC;--chip-ink:#A3326B;--bar:#DA7BA8}
.k4{--card:#F8F6E8;--chip:#F0EAC2;--chip-ink:#6F6311;--bar:#C2B04A}
.k5{--card:#EBF8F6;--chip:#D2F1EC;--chip-ink:#146C62;--bar:#4DB3A5}
.k6{--card:#EDF9F2;--chip:#D7F6E6;--chip-ink:#1C7951;--bar:#56B486}
.k7{--card:#F0F3F8;--chip:#E1E7F2;--chip-ink:#4B6185;--bar:#9AA8BD}
.kx{--card:#FFF0F1;--chip:#FFE0E1;--chip-ink:#B1353F;--bar:#E26A70}
.role-chip{display:inline-flex;align-items:center;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:.6875rem;font-weight:700;background:#FFF1E0;color:#995D12;vertical-align:1px}
/* capitaine : rouge foncé ; lieutenants : bleu marine (mêmes couleurs que leurs cartes) */
.role-chip.rc-cap{background:#9F2D35;color:#FFFFFF}
.role-chip.rc-lt{background:#1E3A5F;color:#FFFFFF}
.role-chip.rc-vert{background:#1F5F45;color:#FFFFFF}
.role-chip.rc-or{background:#8A6416;color:#FFFFFF}
.role-chip.rc-gris{background:#4B5563;color:#FFFFFF}
/* Petites classes utiles : liens, aide, textes discrets, couleurs de texte */
.link{background:none;border:0;padding:0;font-weight:700;color:var(--ink);text-align:left}
.link:hover{text-decoration:underline;color:var(--head-ink)}
.help{font-size:.8125rem;color:var(--muted);margin:0}
/* Lignes de texte faciles à lire : 75 caractères au plus (IFT1005, ch. 6) */
p.help,.notice p,.ann-b p,.panel>p:not(.empty,.hm-sum,.summary){max-width:75ch}
/* sigles (<abbr title>) : le sens paraît au survol ; pas de pointillé dans le menu et les titres */
abbr[title]{cursor:help}
.nav abbr,h1 abbr{text-decoration:none}
.muted{color:var(--muted)}
.sm{font-size:.8125rem}
.ok-t{color:var(--ok)}
.need-t{color:var(--warn);font-weight:700}
.bad-t{color:var(--bad);font-weight:700}
.warn-t{color:var(--warn)}
/* Texte long sur grand écran, texte court sur téléphone (même bouton) */
.t-short{display:none}
/* Coquille : menu marine à gauche, barre de titre blanche en haut, contenu sur fond gris très clair */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.app.side-mini{grid-template-columns:60px minmax(0,1fr)}
@media (prefers-reduced-motion: reduce){.app{transition:none}}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:0 10px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--side-line) transparent}
.brand{display:flex;align-items:center;gap:10px;padding:14px 4px 12px;color:#FFFFFF;font-weight:800;font-size:1.0625rem;letter-spacing:-.01em;line-height:1.2;min-width:0}
.brand{width:100%;border:0;background:none;text-align:left;font-family:inherit;cursor:pointer;border-radius:var(--r-sm)}
.brand:hover .bn{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.brand-t{display:block;min-width:0;overflow-wrap:anywhere}
.brand .bn{white-space:nowrap;font-size:1rem;letter-spacing:-.015em}
.brand .bn i{font-style:normal;color:#F3A19D}
.brand small{display:block;margin-top:1px;font-size:.71875rem;letter-spacing:0;color:var(--side-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-icon{width:38px;height:38px;display:grid;place-items:center;flex:none}
.brand-icon img{width:100%;height:100%;display:block}
.ws-label{display:inline-flex;align-self:flex-start;margin:0 4px 2px;padding:2px 8px;border-radius:999px;background:var(--side-hover);color:var(--side-soft);letter-spacing:.08em;font-size:.625rem;font-weight:700;text-transform:uppercase}
.nav{position:relative;z-index:1;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav-sec{padding:12px 10px 3px;color:var(--side-muted);font-size:.625rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.nav-sec:first-child{padding-top:8px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--side-soft);font-size:.84375rem;font-weight:500;text-align:left}
.nav button .ic{opacity:.85}
.nav button:hover{background:var(--side-hover);color:#FFFFFF}
.nav-todo{margin-left:auto;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.09);color:var(--side-soft);font-size:.6875rem;font-style:normal;font-weight:600;white-space:nowrap}
.side-mini .nav-todo{display:none}
.nav button[aria-current="page"] .nav-todo{background:rgba(0,0,0,.22);color:#FFFFFF}
.nav button[aria-current="page"]{background:none;color:#FFFFFF;font-weight:600}
.nav button[aria-current="page"] .ic{opacity:1;color:#FFFFFF}
/* Page ouverte : une bulle rouge est derrière son entrée et glisse jusqu’à la page choisie (placée par placeNavBulle).
   Menu réduit : la bulle a la taille et la forme du logo, derrière l’icône. */
.nav-bulle{position:absolute;top:0;left:0;opacity:0;pointer-events:none;will-change:transform;border-radius:var(--r-sm);background:var(--accent);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 4px 14px rgba(198,47,42,.38);transition:transform .38s cubic-bezier(.34,1.3,.5,1),width .3s ease,height .3s ease,border-radius .3s ease,opacity .2s}
.side-mini .nav-bulle{border-radius:8px 8px 14px 14px}
.nav-bulle.on{opacity:1}
/* Menu des paramètres : « Paramètres » en tête (retour au menu), puis les sections */
.nav .nav-back{margin-bottom:6px;padding-block:8px;border-bottom:1px solid var(--side-line);border-radius:var(--r-sm) var(--r-sm) 0 0;color:#FFFFFF;font-weight:700}
.nav .nav-back .ic{opacity:1}
.nav.nav-in button>*{animation:navIn .24s ease-out}
.nav.nav-back-in button>*,.nav.nav-back-in .nav-sec{animation:navBackIn .24s ease-out}
@keyframes navIn{from{opacity:0;transform:translateX(14px)}}
@keyframes navBackIn{from{opacity:0;transform:translateX(-14px)}}
@media (prefers-reduced-motion: reduce){.nav.nav-in button>*,.nav.nav-back-in button>*,.nav.nav-back-in .nav-sec{animation:none}}
.nav-bulle.still{transition:none}
@media (prefers-reduced-motion: reduce){.nav-bulle{transition:opacity .2s}}
.person{border-top:1px solid var(--side-line);display:flex;align-items:center;gap:10px;padding:10px 4px 12px;font-size:.75rem;color:var(--side-ink)}
.person b{display:block;font-size:.8125rem}
.person small{display:block;color:var(--side-muted);margin-top:2px;font-size:.75rem}
.content{min-width:0;padding:0 clamp(12px,1.8vw,24px) 40px;display:flex;flex-direction:column;gap:12px}
#main{display:flex;flex-direction:column;gap:14px;min-width:0}
#main:focus{outline:none}
/* « Aller au contenu » : invisible, il paraît au premier Tab (clavier, lecteur d’écran) et saute le menu */
.skip{position:absolute;left:12px;top:-60px;z-index:100;padding:8px 14px;border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm);text-decoration:none}
.skip:focus{top:12px}
/* Pied de page : le nom de l’école et ses coordonnées, discrets, en bas du contenu */
.site-foot{margin-top:auto;padding-top:18px;color:var(--muted);font-size:.75rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.site-foot:empty{display:none}
.site-foot a{color:inherit}
.site-foot a:hover{color:var(--ink)}
/* Menu rétractable */
.side-toggle{margin-top:auto;margin-bottom:4px;display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--side-muted);font-size:.78125rem;text-align:left}
.nav+.side-toggle{margin-top:auto;padding-top:9px}
.side-toggle:hover{background:var(--side-hover);color:#FFFFFF}
.side-toggle .ic{transition:transform .2s}
.side-mini .sidebar{padding:0 8px}
.side-mini .brand{justify-content:center;padding-inline:0}
.side-mini .brand-t,.side-mini .ws-label,.side-mini .person>div,.side-mini .nav-sec{display:none}
.side-mini .nav button,.side-mini .side-toggle{justify-content:center;padding-inline:0;position:relative}
.side-mini .nav button{padding-block:9px}
.side-mini .nav button>span,.side-mini .side-toggle>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.side-mini .side-toggle .ic{transform:rotate(180deg)}
.side-mini .person{justify-content:center;padding-inline:0}
@media (prefers-reduced-motion: reduce){.side-toggle .ic{transition:none}}
/* Bandeau et profils */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:8px 10px 8px 14px;box-shadow:var(--shadow-sm)}
.banner strong{display:block;font-size:.84375rem;color:var(--ink)}
.banner p{margin:1px 0 0;color:var(--muted);font-size:.78125rem}
.banner>div:first-child{min-width:0;flex:1 1 280px}
.roles{display:inline-flex;gap:3px;padding:3px;background:var(--role-bg);border-radius:10px}
.roles button{border:0;background:none;padding:5px 12px;border-radius:var(--r-sm);font-weight:600;font-size:.8125rem;color:var(--muted)}
.roles button:hover{color:var(--ink)}
.roles button[aria-pressed="true"]{background:var(--role);color:#FFFFFF;box-shadow:var(--shadow-sm)}
/* Bandeau de démonstration (profils + données d’exemple) : se replie, le choix est retenu */
.demo{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s ease,opacity .2s ease,margin .26s ease}
.demo-in{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:1px 1px 3px}
.demo.is-hidden{grid-template-rows:0fr;opacity:0;margin-bottom:-12px;visibility:hidden;transition:grid-template-rows .26s ease,opacity .2s ease,margin .26s ease,visibility 0s .26s}
.demo.is-hidden .demo-in{padding:0}
.demo-hide{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--muted);font-size:.78125rem;font-weight:600;flex:none}
.demo-hide:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.head-side{display:flex;flex-wrap:nowrap;align-items:center;gap:8px 10px}
.demo-show{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:.75rem;font-weight:600}
.demo-show:hover{color:var(--ink);border-color:var(--line-strong)}
.demo-hide .ic,.demo-show .ic{width:15px;height:15px}
@media (prefers-reduced-motion: reduce){.demo,.demo.is-hidden{transition:none}}
.notices{display:flex;flex-direction:column;gap:8px}
.notices:empty{display:none}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:.8125rem;box-shadow:var(--shadow-sm)}
.notice.warn{border-color:#F1D39C;background:#FFF8EA}
.notice p{margin:0;flex:1 1 280px;min-width:0}
.notice ul{margin:4px 0 0;padding-left:18px;flex-basis:100%}
/* Barre de titre : bande blanche en haut du contenu, titre à gauche, cloche et actions à droite */
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 calc(-1 * clamp(12px,1.8vw,24px));padding:10px clamp(12px,1.8vw,24px);background:var(--surface);border-bottom:1px solid var(--line);min-height:54px}
.page-heading h1{margin:0;font-size:1.125rem;font-weight:700;letter-spacing:-.015em;line-height:1.2;color:var(--ink);text-wrap:balance}
.page-heading p{margin:1px 0 0;color:var(--muted);font-size:.78125rem}
/* Titre (ou onglets), barre de la page, cloche : une ligne si tout y entre ; sinon libellés courts (hd-short) ;
   sinon la barre de la page passe sur une deuxième ligne (hd-two). fitHeading choisit. */
.ph-t{min-width:0}
.ph-row{display:flex;align-items:center;gap:6px 14px;flex-wrap:nowrap}
.pg-tabs button{padding:5px 11px}
/* Entrée qui réunit plusieurs pages : les onglets servent de titre ; le titre reste pour les lecteurs d’écran */
.has-tabs .ph-row h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ph-tools{flex:1 1 auto;min-width:0}
.ph-tools:empty{display:none}
.page-heading.with-tools{flex-wrap:nowrap;gap:8px 14px}
.with-tools .ph-t,.with-tools .head-side{flex:none}
.ph-tools>.ctl,.ph-tools>.toolbar{flex-wrap:nowrap;gap:8px;margin:0;padding:0;background:none;border:0;border-radius:0;box-shadow:none}
.ph-tools>.ctl>*:not(.grow),.ph-tools>.toolbar>*:not(.grow){flex:none}
.ph-tools .seg.sm button{padding:5px 11px}
.ph-tools .wk-range,.ph-tools .summary{white-space:nowrap}
.ph-tools .summary{font-size:.8125rem}
.ph-tools .summary b{font-size:.875rem}
.vm-seg button{display:inline-grid;place-items:center;padding:5px 8px}
.vm-seg .ic{width:16px;height:16px}
.hd-short .t-long,.hd-short .ds-t{display:none}
.hd-short .t-short{display:inline}
.hd-short .demo-show{padding:0 9px}
.hd-short .ph-tools .search{width:170px}
.page-heading.hd-two{flex-wrap:wrap}
.hd-two .ph-t{flex:1 1 auto}
.hd-two .ph-tools{order:3;flex-basis:100%}
.hd-two .ph-tools>.ctl,.hd-two .ph-tools>.toolbar{flex-wrap:wrap}
/* sur deux lignes, la barre de la page peut aussi se replier (onglets, résumés, recherche) pour ne jamais dépasser */
.hd-two .ph-tools>.toolbar>*:not(.grow){flex:0 1 auto;min-width:0}
.hd-two .ph-tools .summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Pastilles du menu : nombre de choses à faire, alerte */
.nav-n{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r);background:var(--accent);color:#FFFFFF;font-size:.71875rem;font-weight:700;font-style:normal;display:grid;place-items:center;flex:none}
.nav button[aria-current="page"] .nav-n{display:none}
.side-mini .nav-n{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;font-size:.625rem}
/* Menus latéraux à sections (Paramètres, Stock, Compta) : une pastille d’alerte */
.nav-todo.bad{background:var(--accent);color:#FFFFFF}
.nav button[aria-current="page"] .nav-todo.bad{background:#FFFFFF;color:var(--accent)}
/* Cloche et notifications */
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 1px 2px rgba(14,26,43,.05);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.bell:hover{background:var(--surface-2);color:var(--ink)}
.bell .ic{width:17px;height:17px}
.bell-n{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--bad);color:#FFFFFF;font-size:.65625rem;font-weight:700;font-style:normal;line-height:17px;text-align:center}
.nf-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nf-row{display:flex;flex-direction:column;gap:6px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.nf-row:hover{background:var(--surface-2)}
.nf-row.new{border-color:var(--role);box-shadow:inset 3px 0 0 var(--role)}
.nf-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nf-h small{font-size:.78125rem;color:var(--muted);white-space:nowrap}
.nf-tx{font-size:.90625rem;line-height:1.4}
/* Écran moyen : le menu passe en haut de la page */
@media (max-width:900px){
  /* le menu garde sa hauteur ; une page courte ne l’étire pas, le contenu prend le reste */
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .sidebar{position:relative;height:auto;padding:0 16px 12px}
  .brand{padding:16px 120px 12px 0}
  .ws-label,.person{display:none}
  .side-toggle{position:absolute;top:16px;right:16px;width:auto;margin:0;padding:8px 10px;border:1px solid var(--side-line)}
  .side-toggle .ic{transform:rotate(90deg)}
  .app.side-mini{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .side-mini .sidebar{padding:0 16px 4px}
  .side-mini .brand{justify-content:flex-start;padding:16px 0 12px}
  .side-mini .brand-t{display:block}
  .side-mini .nav{display:none}
  .side-mini .side-toggle{position:absolute;padding:8px 10px}
  .side-mini .side-toggle>span{position:static;width:auto;height:auto;overflow:visible;clip:auto}
  .side-mini .side-toggle .ic{transform:rotate(-90deg)}
  .sidebar .side-toggle.side-out{right:16px;padding:8px 10px}
  .sidebar .side-toggle.side-out>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .sidebar .side-out .ic,.side-mini .sidebar .side-out .ic{transform:none}

/* Boutons et champs */

select,.search{min-height:34px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 9px;font-size:.84375rem;color:var(--ink);min-width:0;max-width:100%}

.seg{display:inline-flex;gap:2px;padding:3px;background:var(--role-bg);border-radius:var(--r);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:var(--r-sm);font-size:.78125rem;font-weight:600;color:var(--muted)}

/* Barre d’outils */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.range{min-height:34px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 1px 2px rgba(14,26,43,.05);background:var(--surface);font-weight:700;font-size:.84375rem;color:var(--ink);white-space:nowrap}

/* Panneaux, tableaux, indicateurs */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;align-items:start}

.big{font-weight:700;font-size:1.625rem;line-height:1;margin:0 0 6px;font-variant-numeric:tabular-nums}

.meter{height:7px;background:var(--role-bg);border-radius:999px;overflow:hidden;margin-bottom:8px}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;min-width:0;box-shadow:var(--shadow-sm)}
.kpi span{display:block;font-size:.6875rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kpi b{display:block;font-size:1.4375rem;margin-top:3px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{display:block;color:var(--muted);font-size:.8125rem;margin-top:3px}
.kpi.need b{color:var(--warn)}
/* Un texte réservé aux lecteurs d’écran ne doit pas sortir de la boîte d’un tableau qui défile (il élargissait la page Comptes) */
.tbl-wrap{position:relative;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{background:var(--head);color:var(--head-ink);font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:.84375rem}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row-link{cursor:pointer}

.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
/* cellule vide d’un pied de tableau : un <td> (rien à annoncer) qui garde l’apparence des <th> voisins */
.tbl tfoot td.tf-empty{background:var(--head);border-bottom:1px solid var(--line);padding:8px 16px}
.tbl select{min-height:34px;font-size:.8125rem}
.hr-tbl th,.hr-tbl td{padding-left:12px;padding-right:12px}
.hr-tbl th:first-child,.hr-tbl td:first-child{padding-left:20px}
.hr-tbl th.on,.hr-tbl td.on{background:var(--role-bg)}
.hr-tbl tr.row-link:hover td.on{background:var(--role-bg)}
.hr-m{border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:5px 8px;margin:-5px -8px;border-radius:var(--r-sm);cursor:pointer}
.hr-m:hover{background:var(--surface)}
.hr-m[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--role)}
.hr-tot td{font-weight:700;background:var(--head);border-top:1px solid var(--line)}
.hr-tot td.on{background:var(--role-bg)}
#print-root{display:none}
@media print{body.printing{background:#fff}body.printing>*:not(#print-root){display:none!important}body.printing>#print-root{display:block}}
.pr-btns{display:flex;flex-wrap:wrap;gap:8px}
.list{display:flex;flex-direction:column}

.lrow+.lrow{border-top:1px solid var(--line-2)}
button.lrow:hover .ti{text-decoration:underline}

.steps{text-align:left;max-width:52ch;margin:0 auto 18px;padding-left:22px;display:flex;flex-direction:column;gap:6px}

/* Les grands blocs blancs ont la même ombre légère que les panneaux */
.boardbox,.cl-list,.xm-tile,.md-m,.fiche-list,.ctl{box-shadow:var(--shadow-sm)}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .tl li{grid-template-columns:minmax(0,1fr) auto}
  .tl .d{grid-column:1/-1}
  /* Une ligne de liste : le moment et l’état en haut, le titre sur toute la largeur dessous */
  .lrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .lrow>.when{grid-column:1;grid-row:1}
  .lrow>.chip{grid-column:2;grid-row:1;justify-self:end}
  .lrow>.chip+.chip{grid-column:1/-1;grid-row:3;justify-self:start}
  .lrow>.what{grid-column:1/-1;grid-row:2}
  /* Élèves, Personnel, Comptes : un tableau devient une liste, une personne par bloc ;
     l’essentiel en haut (nom, et à droite la présence, le statut ou le rôle), le reste dessous avec son libellé */
  .tbl-wrap:has(>.tbl.stack){overflow:visible}
  table.tbl.stack,.tbl.stack tbody{display:block;width:100%;min-width:0}
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{display:block;padding:0;border:0;font-size:.875rem;text-align:left}
  .tbl.stack td:first-child{flex:1 1 0;min-width:0}
  .tbl.stack tr::after{content:"";order:1;flex-basis:100%;margin-top:-6px}
  .tbl.stack td.tb-line{flex-basis:100%}
  .tbl.stack td.tb-top{order:1;flex:none;margin-left:auto}
  .tbl.stack td:not(:first-child):not(.tb-top){order:2;color:var(--ink-2)}
  .tbl.stack tfoot td.tf-empty{order:0;padding:8px 16px;font-size:.75rem}
  .tbl.stack td.tb-act{margin-left:auto}
  .tbl.stack td[data-l]::before{content:attr(data-l) " ";color:var(--muted)}
  .tbl.stack td:has(>.tb-empty){display:none}
  .tbl.stack .tb-n{font-size:.875rem}
  .tbl.stack .tb-cls .cl-num,.tbl.stack .tb-rate .meter{display:none}
  .tbl.stack .tb-rate{min-width:0}
}

/* Tiroir */
.scrim{position:fixed;inset:0;background:rgba(20,33,50,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;overflow-y:auto;box-shadow:var(--shadow);animation:slide .18s ease-out;display:flex;flex-direction:column;padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
/* Formes des fenêtres (DR_SHAPES dans 24-tiroir.js) : la largeur vient de --dw */
.drawer.sh-side{width:min(var(--dw,520px),100%)}
.drawer.sh-center,.drawer.sh-sheet,.drawer.sh-bottom,.drawer.sh-pop{left:0;right:0;margin:0 auto;border-radius:var(--r);box-shadow:0 18px 50px rgba(20,33,50,.28)}
.drawer.sh-center{top:max(24px,7vh);bottom:auto;width:min(var(--dw),calc(100% - 32px));max-height:calc(100% - max(24px,7vh) - 24px);animation:dr-in .16s ease-out}
.drawer.sh-sheet{top:24px;bottom:24px;width:min(var(--dw),calc(100% - 48px));animation:dr-rise .2s ease-out}
.drawer.sh-bottom{top:auto;bottom:0;width:min(var(--dw),calc(100% - 32px));max-height:min(72vh,680px);border-radius:var(--r) var(--r) 0 0;animation:dr-up .2s ease-out}
.drawer.sh-pop{right:auto;bottom:auto;margin:0;width:min(var(--dw),calc(100% - 24px));max-height:calc(100% - 24px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(20,33,50,.22);animation:dr-in .12s ease-out}

@keyframes dr-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dr-rise{from{opacity:.4;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes dr-up{from{opacity:.4;transform:translateY(40px)}to{opacity:1;transform:none}}

.inline-add{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:8px}
.inline-add .field{flex:1 1 170px}
.form-err{color:var(--bad);font-size:.875rem;margin:0;font-weight:700}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line-2);font-size:.875rem}
.plist li:first-child{border-top:0}
.x{width:30px;height:30px;border:1px solid transparent;border-radius:var(--r-sm);background:none;color:var(--muted);font-size:1.125rem;line-height:1;flex:none}
.x:hover{border-color:var(--line-strong);color:var(--bad)}
.confirm{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:var(--r);background:#FFF5F5;border:1px solid #F1C4C8}
.confirm p{margin:0;font-size:.875rem}
.sec-title{margin:0;font-size:1rem;font-weight:700}
.access{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:.875rem}
.access li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px}
/* Déplacer une séance ; choix entre plusieurs options */
.mv-route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.mv-arrow{font-size:1.25rem;color:var(--muted);font-weight:700}
.mv-box{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2);min-width:0}
.mv-box small{display:block;font-size:.6875rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mv-box b{display:block;font-size:.875rem;margin-top:2px}
.mv-box span{font-size:.8125rem;color:var(--ink-2)}
.choice{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.opt:has(input:checked){border-color:var(--role);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--role)}
.opt input{margin:3px 0 0;accent-color:var(--role)}
.opt b{display:block;font-size:.875rem}
.opt span{font-size:.8125rem;color:var(--muted)}
/* Cases à cocher en grille */
.ck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:4px 16px}
.ck{display:flex;align-items:flex-start;gap:9px;padding:6px 4px;font-size:.90625rem;color:var(--ink);cursor:pointer;border-radius:var(--r-sm)}
.ck:hover{background:var(--surface-2)}
.ck input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--role)}
.ck b{color:var(--muted);font-weight:700;margin-right:2px}
/* Choix en pastilles (ressources d’un module, matériel) */
.pk-set{border:0;padding:0;margin:0;min-width:0}
.pk-set legend{padding:0;margin-bottom:6px;font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.pk-set .help{margin-top:8px}
.pk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:6px}
.pk{position:relative;display:inline-flex}
.pk input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.pk span{display:inline-flex;align-items:baseline;gap:6px;min-height:36px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);font-size:.90625rem;font-weight:600;color:var(--ink);line-height:1.2}
.pk small{font-size:.75rem;font-weight:400;color:var(--muted)}
.pk.done span{background:var(--surface-2);color:var(--muted)}
.pk.done span::after{content:'✓';font-size:.75rem;color:var(--ok)}
.pk input:checked+span{border-color:var(--role);background:var(--role-bg);box-shadow:inset 0 0 0 1px var(--role);color:var(--ink)}
.pk input:focus-visible+span{outline:3px solid var(--focus);outline-offset:1px}
.pk input:disabled+span{opacity:.6}
@media (max-width:460px){.ab .full{display:none}.ab .abbr{display:inline}}
@media (max-width:760px){
  .drawer.sh-side,.drawer.sh-sheet{inset:0;width:100%;margin:0;border-radius:0;max-height:none}
  .drawer.sh-center,.drawer.sh-bottom,.drawer.sh-pop{top:auto;left:0;right:0;bottom:0;width:100%;max-height:92%;margin:0;border:0;border-radius:14px 14px 0 0;animation:dr-up .2s ease-out}
  .slot{grid-template-columns:1fr 1fr}
  .slot .icon-btn{justify-self:end}
  .grid2,.facts{grid-template-columns:1fr}
  .access li{grid-template-columns:1fr;gap:0}
  .att-list li{flex-wrap:wrap}
  /* Panneau latéral : marges de téléphone */
  .dr-top,.dr-body,.dr-foot{padding-left:16px;padding-right:16px}
  .dr-body>.dr-foot{margin-left:-16px;margin-right:-16px}
  /* Présences : boutons à la taille du doigt (44 px) */
  .ab{min-width:44px;min-height:44px;padding:0 6px;font-size:.9375rem}
  .att-btns{gap:5px}
  .dr-body [data-act=att-all],.dr-foot .btn{min-height:44px}
  #dr-close{width:44px;height:44px}
  .grid3{grid-template-columns:1fr}
}
/* Accueil : la journée en ligne du temps à gauche ; l’année, ce qui est à faire et les examens à droite */
.hm{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:14px;align-items:start}
.hm-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.hm .panel h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.9375rem}
.hm .t-head{margin-bottom:6px}
.hm .t-head h2{margin:0}
.hm-tl{padding:16px 18px}
.hm-next{margin:2px 0 8px}

/* Ligne du temps : l’heure | le point sur la ligne | la carte */
.tl-day{list-style:none;margin:0;padding:4px 0 0}
.tl-it,.tl-now{display:grid;grid-template-columns:62px 22px minmax(0,1fr);align-items:start}
.tl-h{padding-top:9px;text-align:right;font-weight:700;font-size:.84375rem;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.tl-h small{display:block;margin-top:2px;font-weight:500;font-size:.75rem;color:var(--muted)}
.tl-dot{position:relative;align-self:stretch}
.tl-dot::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--line-strong)}
.tl-day>li:first-child .tl-dot::before{top:14px}
.tl-day>li:last-child .tl-dot::before{bottom:auto;height:14px}
.tl-day>li:only-child .tl-dot::before{display:none}
.tl-dot::after{content:"";position:absolute;left:50%;top:9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--surface);border:3px solid var(--bar,var(--muted));box-sizing:border-box}
.tl-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;margin:0 0 10px 6px;padding:9px 12px 10px;border:1px solid var(--line);border-left:3px solid var(--bar,var(--line-strong));border-radius:var(--r-sm);background:var(--card,var(--surface));text-align:left;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.tl-card:hover{border-color:var(--line-strong);border-left-color:var(--bar,var(--line-strong));box-shadow:var(--shadow-sm)}
.tl-t{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.tl-t b{font-size:.90625rem;line-height:1.3}
.tl-t .chore-chip{margin-left:0}
.tl-m{grid-column:1;font-size:.78125rem;color:var(--ink-2);overflow-wrap:anywhere}
.tl-s{grid-column:2;grid-row:1/span 2;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tl-it.off .tl-card{background:var(--surface-2)}
.tl-it.off .tl-t b{text-decoration:line-through;color:var(--muted)}
/* « Maintenant » : un point rouge et un trait jusqu’au bord */
.tl-now{margin:0 0 10px}
.tl-now .tl-h{padding-top:0;color:var(--accent);font-size:.75rem}
.tl-now .tl-dot::after{top:2px;width:10px;height:10px;margin-left:-5px;border:0;background:var(--accent)}
.tl-nl{display:flex;align-items:center;gap:8px;margin-left:6px;font-size:.75rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;line-height:14px}
.tl-nl::after{content:"";flex:1;height:2px;background:var(--accent);opacity:.35;border-radius:2px}

/* Le résumé sous la journée */
.hm-sum{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:6px 0 0;padding-top:12px;border-top:1px solid var(--line-2);font-size:.8125rem;color:var(--muted)}
.hm-k{font-weight:600;font-size:.8125rem;color:var(--ink-2)}
.hm-k.warn-t{color:var(--warn)}

/* L’année : l’anneau d’avancement */
.hm-year{display:flex;align-items:center;gap:16px}
.ring{position:relative;flex:none;width:76px;height:76px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4}
.ring .rt{stroke:var(--line-2)}
.ring .rv{stroke:var(--accent);stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.hm-yt{min-width:0}
.hm .panel .hm-yt h2,.hm-yt h2{margin:0 0 4px}
.hm-yt p{margin:0;font-size:.8125rem;line-height:1.45}
.hm-yt p b{font-size:.875rem}

/* À faire : un point de couleur, le titre, le texte sur deux lignes */
.hm-n{padding:1px 8px;border-radius:999px;background:var(--role-bg);color:var(--ink-2);font-size:.75rem;font-weight:700}
.hm-todo,.hm-exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hm-td,.hm-ex{display:flex;align-items:flex-start;gap:10px;width:100%;padding:8px 6px;border:0;border-top:1px solid var(--line-2);background:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer;border-radius:0}
.hm-todo>li:first-child .hm-td,.hm-exs>li:first-child .hm-ex{border-top:0}
.hm-td:hover,.hm-ex:hover{background:var(--surface-2)}
.hm-td>span,.hm-ex>span:last-child{display:flex;flex-direction:column;gap:1px;min-width:0}
.hm-td b{font-size:.8125rem}
.hm-td small{font-size:.78125rem;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hm-dot{flex:none;width:8px;height:8px;margin-top:5px;border-radius:50%;background:var(--muted)}
.hm-dot.ok{background:var(--ok)}.hm-dot.warn{background:var(--warn)}.hm-dot.bad{background:var(--bad)}.hm-dot.info{background:var(--info)}
.hm-more{margin-top:6px}
/* Examens : la date dans une pastille, le module, la classe */
.hm-d{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:42px;height:42px;border-radius:var(--r-sm);background:var(--kx-bg,#FFF0F1);color:#B1353F;line-height:1}
.hm-d b{font-size:1rem}
.hm-d small{margin-top:2px;font-size:.65625rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.hm-ex b{font-size:.84375rem;line-height:1.3}
.hm-ex small{font-size:.78125rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.tl-card{transition:none}}
@media (max-width:980px){.hm{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .hm-tl{padding:14px}
  .tl-it,.tl-now{grid-template-columns:48px 18px minmax(0,1fr)}
  .tl-card{grid-template-columns:minmax(0,1fr)}
  .tl-s{grid-column:1;grid-row:auto;flex-direction:row;align-items:center;margin-top:4px}
}
/* Comptes et profils */
.av{width:34px;height:34px;border-radius:50%;background:#2C4F78;color:#FFFFFF;display:inline-grid;place-items:center;flex:none;font-size:.75rem;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:72px;height:72px;font-size:1.5rem}
.person-btn{display:flex;align-items:center;gap:10px;width:100%;min-width:0;padding:6px;margin:-6px;border:0;border-radius:var(--r-sm);background:none;color:inherit;text-align:left;font:inherit}
.person-btn:hover,.person-btn[aria-current="page"]{background:var(--side-hover)}
.pinfo{min-width:0}
.pinfo b,.pinfo small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-mini .person .pinfo{display:none}
.side-mini .person-btn{justify-content:center;margin:0}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-size:.875rem}
.who small{display:block;font-size:.78125rem;color:var(--muted);font-weight:400}
.acc-how .steps{margin:0;max-width:none;font-size:.875rem}
.prof-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.prof-id{flex:1 1 260px;min-width:0}
.panel.prof-head .prof-id h2{margin:0;font-size:1.375rem;font-weight:700;line-height:1.2;letter-spacing:0;text-transform:none;color:var(--ink)}
.prof-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 6px}
.prof-chips .role-chip{margin:0}
.pf-pick{flex:0 1 280px}
.pick-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.pick-person,.pick-sel{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);text-align:left;color:var(--ink)}
.pick-person:hover{border-color:var(--line-strong);background:var(--surface-2)}
.pick-person b,.pick-sel b{display:block;font-size:.875rem}
.pick-person small,.pick-sel small{display:block;font-size:.78125rem;color:var(--muted);font-weight:400}
.pick-sel{background:#F2F6FB;border-color:#B9CBE0}
.pick-sel>span:not(.av){flex:1;min-width:0}
.acc-list{display:flex;flex-direction:column;list-style:none;margin:0;padding:0}
.acc-list li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:.875rem}
.acc-list li:first-child{border-top:0}
/* Classes : cartes */
.cl-list{container-type:inline-size;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cl-cols{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 64px minmax(0,1fr) minmax(0,.9fr) 124px 132px;align-items:center;column-gap:18px}
.cl-hd{padding:8px 18px;background:var(--head);border-bottom:1px solid var(--line);color:var(--head-ink);font-size:.71875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.cl-hd .n{text-align:center}
.cl-row{padding:10px 18px;border-top:1px solid var(--line-2);cursor:pointer;transition:background-color .12s}
.cl-hd+.cl-row{border-top:0}
.cl-row:hover{background:var(--surface-2)}
.cl-row:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.cl-c{display:flex;align-items:center;gap:12px;min-width:0}
.cl-num{width:40px;height:40px;border-radius:var(--r);background:var(--role);color:#FFFFFF;display:grid;place-items:center;flex:none;font-size:1rem;font-weight:700;font-variant-numeric:tabular-nums}
.cl-name{display:flex;flex-direction:column;gap:3px;min-width:0}
.cl-name b{font-size:.96875rem;line-height:1.2;color:var(--ink);white-space:nowrap}
.cl-name small{font-size:.8125rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-prin{display:flex;align-items:center;gap:10px;min-width:0;cursor:default}
.cl-prin .av{width:30px;height:30px;font-size:.75rem}
.cl-prin .av.none{background:var(--off-bg);color:var(--off)}
.cl-prin select{flex:1 1 0;min-width:0;width:auto;min-height:36px;font-size:.9375rem;font-weight:700;color:var(--ink);border:1px solid transparent;border-radius:var(--r-sm);background-color:transparent;padding:0 20px 0 6px;margin-left:-6px;cursor:pointer;text-overflow:ellipsis}
.cl-prin select:hover,.cl-prin select:focus{border-color:var(--line-strong);background-color:var(--surface)}
.cl-prin b{font-size:.9375rem;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-prin .none-t{color:var(--muted);font-weight:400}
.cl-n{text-align:center;font-size:1.25rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cl-n.zero{color:var(--muted)}
.cl-big{display:flex;flex-direction:column;gap:7px;min-width:0}
.cl-big b{font-size:1.25rem;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.cl-big .meter{margin:0;height:8px}
.cl-big.ok b{color:var(--ok)}.cl-big.warn b{color:var(--warn)}.cl-big.bad b{color:var(--bad)}
.cl-big .none{color:var(--muted);font-weight:400}
.cl-st .chip{font-size:.8125rem;padding:5px 10px;border-radius:var(--r-sm)}
.cl-go{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.cl-go>.ic{width:18px;height:18px;color:var(--muted);flex:none}
.cl-row [data-l]::before{display:none}
.cl-basis{font-size:.75rem;color:var(--muted);white-space:nowrap}
/* largeur moyenne : l’avancement se retire et le bouton Horaire devient une icône */
@container (max-width:1180px){
  .cl-cols{grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 64px minmax(0,1fr) 124px 44px}
  .cl-adv,.cl-go-t,.cl-go>.ic{display:none}
  .cl-go .btn{padding-inline:9px}
}
/* petit écran : chaque classe devient une carte */
@container (max-width:880px){
  .cl-hd{display:none}
  .cl-cols{grid-template-columns:1fr 1fr;grid-template-areas:"c c" "p p" "n s" "r a" "go go";row-gap:14px}
  .cl-c{grid-area:c}.cl-prin{grid-area:p;flex-wrap:wrap;row-gap:6px}.cl-n{grid-area:n;text-align:left}.cl-st{grid-area:s}.cl-rate{grid-area:r}.cl-adv{grid-area:a;display:flex}.cl-go{grid-area:go;justify-content:space-between}
  .cl-go-t,.cl-go>.ic{display:inline}
  .cl-go .btn{padding-inline:12px}
  /* libellés en petit devant la valeur, comme les cartes de l’affichage Cartes */
  .cl-row [data-l]::before{content:attr(data-l);display:inline;font-size:.78125rem;font-weight:400;color:var(--muted)}
  .cl-prin[data-l]::before{content:"Principal"}
  .cl-st[data-l]::before{display:none}
  .cl-n{display:flex;align-items:baseline;gap:5px;font-size:.9375rem}
  .cl-big{flex-flow:row wrap;align-items:baseline;gap:4px 5px}
  .cl-big b{font-size:.9375rem}
  .cl-big[data-l]::before{flex:none}
  .cl-big .meter{flex-basis:100%;height:5px}
  .cl-basis{flex-basis:100%;font-size:.75rem}
}
.cl-add{margin-bottom:0}
/* Examens : tableau de bord */
.xm-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.xm-tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;color:var(--ink);cursor:pointer;transition:border-color .12s,box-shadow .12s}
.xm-tile:hover{border-color:var(--line-strong)}
.xm-tile[aria-pressed="true"]{border-color:var(--role);box-shadow:inset 0 -3px 0 var(--role)}
.xm-tile .lbl{font-size:.71875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.xm-tile b{font-size:1.5rem;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.xm-tile b.ok{color:var(--ok)}.xm-tile b.warn{color:var(--warn)}.xm-tile b.bad{color:var(--bad)}
.xm-tile small{font-size:.78125rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xm-h{margin:18px 0 10px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--eyebrow)}
.xm-cols{display:grid;align-items:center;column-gap:18px}
.xm-up{grid-template-columns:44px minmax(0,2.4fr) 58px minmax(0,1fr) 130px}
.xm-todo{grid-template-columns:44px minmax(0,2.4fr) 58px minmax(0,1.1fr) 170px}
.xm-done{grid-template-columns:44px minmax(0,2.4fr) 58px minmax(0,1.1fr) 130px}
.xm-me{grid-template-columns:44px minmax(0,2.4fr) minmax(0,1fr) 150px}
.xm-hd{padding:8px 18px;background:var(--head);border-bottom:1px solid var(--line);color:var(--head-ink);font-size:.71875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.xm-hd .r{text-align:right}
.xm-row{padding:8px 18px;border-top:1px solid var(--line-2)}
.xm-hd+.xm-row{border-top:0}
.xm-row.go{cursor:pointer;transition:background-color .12s}
.xm-row.go:hover{background:var(--surface-2)}

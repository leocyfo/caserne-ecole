/* ---------- Pages : examens ---------- */
/* Résultats : réussi, échec, absent (à reprendre) et réussi en reprise */
const RES={reussi:['ok','Réussi'],echec:['bad','Échec'],absent:['warn','Absent'],reprise:['info','Réussi en reprise'],echecf:['bad','Échec du module']};
const resOk=v=>v==='reussi'||v==='reprise', resKo=v=>v==='echec'||v==='absent';
/* Notes en % : facultatives. resultats/<examen>.pct = { élève: note } ; une note inscrit le résultat (réussi à partir du seuil). */
const seuil=()=>{const n=+cfg().seuil;return n>=1&&n<=100?Math.round(n):60;};
const noteTxt=n=>n==null?'':`${String(Math.round(n*10)/10).replace('.',',')} %`;
function examPctOf(x){
  const d=S.data.resultats[resKeyOf(x)], p=Object.assign({},d&&d.pct), mine=(S.data.mesPct||{})[resKeyOf(x)];
  if(mine!=null&&S.student&&p[S.student]==null) p[S.student]=mine;
  return p;
}
const sxId=key=>'sx-'+String(key).replace(/[^A-Za-z0-9_-]/g,'-');
const resKeyOf=x=>x.fromSess?sxId(x.key):x.e.id;
const resElId=(el,id)=>(String(el)+'__'+String(id)).replace(/[^A-Za-z0-9_-]/g,'-');
/* Résultats d’un examen. Les anciens résultats, rangés dans la fiche d’examen, restent lus tant qu’on ne les a pas réenregistrés. */
function examResOf(x){
  const d=S.data.resultats[resKeyOf(x)];
  let r=d&&d.resultats;
  if(!r){if(x.fromSess){const old=S.data.examens.find(q=>q.seance===x.key);r=old&&old.resultats;}else r=x.e&&x.e.resultats;}
  r=r||{};
  const mine=S.data.mesRes[resKeyOf(x)];
  return mine&&S.student&&!r[S.student]?Object.assign({},r,{[S.student]:mine}):r;
}
/* Enregistre les résultats d’un examen, et le résultat de chaque élève touché dans sa propre fiche */
/* pct : les notes en % par élève ; reps : l’issue des reprises. Sans ces paramètres, ce qui est déjà inscrit est gardé.
   Une reprise n’est gardée que tant que le résultat de l’élève en vient (réussi en reprise, ou échec du module). */
async function writeResults(x,res,msg,pct,reps){
  const id=resKeyOf(x), prev=examResOf(x), cur=S.data.resultats[id]||null, p0=(cur&&cur.pct)||{}, p1={}, r0=reps||(cur&&cur.reprises)||{}, r1={}, now=new Date().toISOString(), ex=!!(cur&&cur.exemple);
  for(const el of Object.keys(res)){
    const n=pct?pct[el]:p0[el];if(n!=null&&n!==''&&!isNaN(+n)&&res[el]!=='absent') p1[el]=Math.max(0,Math.min(100,+n));
    if(r0[el]&&(res[el]==='reprise'||res[el]==='echecf')) r1[el]=r0[el];
  }
  const doc={examen:x.fromSess?'':x.e.id,seance:x.fromSess?x.key:'',cours:x.c?x.c.id:'',groupe:x.grp||'',titre:(x.e&&x.e.titre)||'Examen',date:x.date,resultats:res,pct:p1,reprises:r1,maj:now};
  if(ex) doc.exemple=true;
  const fns=[()=>col('resultats').doc(id).set(doc)];
  for(const el of new Set([...Object.keys(prev),...Object.keys(res)])){
    if(prev[el]===res[el]&&p0[el]===p1[el]&&cur) continue;
    const rid=resElId(el,id);
    fns.push(res[el]?()=>col('resultats-eleves').doc(rid).set(Object.assign({eleve:el,examen:id,v:res[el],date:x.date,maj:now},p1[el]!=null?{pct:p1[el]}:{},ex?{exemple:true}:{})):()=>col('resultats-eleves').doc(rid).delete());
  }
  if(x.fromSess){const old=S.data.examens.find(q=>q.seance===x.key);if(old)fns.push(()=>col('examens').doc(old.id).delete());}
  else if(x.e&&x.e.resultats&&Object.keys(x.e.resultats).length&&byId(S.data.examens,x.e.id)) fns.push(()=>col('examens').doc(x.e.id).update({resultats:{}}));
  return write(async()=>{for(const f of fns) await f();},msg);
}
const elNum=e=>e&&e.numero!=null&&e.numero!==''&&!isNaN(+e.numero)?+e.numero:1e9;
const byElNum=(a,b)=>elNum(a)-elNum(b)||collator.compare(a.nom||'',b.nom||'');
function canEditExam(e){
  if(S.role==='admin') return S.canAdmin!==false;
  if(S.role==='teacher'){if(!e)return true;const c=byId(S.data.cours,e.cours);return (c&&c.enseignant===S.teacher)||e.surveillant===S.teacher;}
  return false;
}
const canEditItem=x=>x.fromSess?(S.role==='admin'?S.canAdmin!==false:S.role==='teacher'&&(x.tch||[]).includes(S.teacher)):canEditExam(x.e);
/* Tous les examens de l’année avec leurs résultats : fiche d’examen, ou résultats rattachés à une séance « Examen » de l’horaire */
function examBoard(filter){
  const items=allExamItems().filter(filter).map(x=>{
    const res=examResOf(x), doc=S.data.resultats[resKeyOf(x)]||null, els=studentsOf(x.grp);
    let ok=0,ko=0,kf=0,got=0;for(const e of els){const v=res[e.id];if(!v)continue;got++;if(resOk(v))ok++;else if(resKo(v))ko++;else if(v==='echecf')kf++;}
    const pct=examPctOf(x), ps=els.map(e=>pct[e.id]).filter(n=>n!=null);
    return Object.assign(x,{doc,res,els,ok,ko,kf,got,pct,avg:ps.length?Math.round(ps.reduce((a,b)=>a+ +b,0)/ps.length):null,past:isPast(x)});
  });
  const asc=(a,b)=>a.date.localeCompare(b.date)||a.start-b.start, desc=(a,b)=>-asc(a,b);
  const up=items.filter(x=>!x.past&&(!x.rep||x.els.length)).sort(asc), graded=items.filter(x=>x.past&&!x.rep&&x.els.length);
  const todo=graded.filter(x=>x.got<x.els.length).sort(desc), done=graded.filter(x=>x.got).sort(desc);
  const reps=[];for(const x of graded) for(const e of x.els) if(resKo(x.res[e.id])) reps.push({x,e,v:x.res[e.id]});
  reps.sort((a,b)=>collator.compare(gName(a.x.grp),gName(b.x.grp))||asc(a.x,b.x)||byElNum(a.e,b.e));
  let ok=0,got=0;for(const x of done){ok+=x.ok;got+=x.ok+x.ko+x.kf;}
  return {items,up,todo,done,reps,rate:got?Math.round(ok/got*100):null,got};
}
/* Prochaine journée de reprise de chaque classe */
function nextReprises(){const t=todayISO(),m={};for(const x of allExamItems().filter(x=>x.rep&&!isPast(x)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start)) if(!m[x.grp]) m[x.grp]=x;return m;}
const passCls=r=>r==null?'':r>=90?'ok':r>=75?'warn':'bad';
const xNum=g=>String(gName(g)).replace(/^(Classe|Groupe)\s+/i,'').slice(0,4);

const xTitle=x=>x.rep?(x.c&&modKey(x.c)!=null?`Reprise · ${codeOf(x.c)}${esc(x.c.titre)}`:esc(x.c&&!/^reprise$/i.test(String(x.c.titre).trim())?x.c.titre:'Journée de reprise')):`${x.c?codeOf(x.c):''}${esc(x.c?x.c.titre:x.e.titre||'Examen')}`;
const xSub=x=>esc([x.c&&!x.rep&&x.e.titre&&x.e.titre!=='Examen'?x.e.titre:'',x.salle?'Local '+x.salle:'',x.e.surveillant?'Surveillance : '+shortName(tName(x.e.surveillant)):''].filter(Boolean).join(' · '));
const xWhen=x=>{const k=daysBetween(todayISO(),x.date);return `<span class="chip ${x.rep?'info':k<=2?'exam':'off'}">${k<=0?'Aujourd’hui':k===1?'Demain':k<14?'Dans '+k+' jours':'Dans '+Math.round(k/7)+' semaines'}</span>`;};
const xCls=x=>`<span class="cl-num sm" title="${esc(gName(x.grp))}">${esc(xNum(x.grp))}</span>`;
const xRow=(cls,act,cells,label)=>`<article class="xm-row xm-cols ${cls}${act?' go':''}"${act?` ${act} tabindex="0" role="button" aria-label="${esc(label)}"`:''}>${cells}</article>`;
const xList=(cls,head,rows)=>`<div class="cl-list xm-list"><div class="xm-hd xm-cols ${cls}" aria-hidden="true">${head.map(h=>`<span${h[1]?` class="${h[1]}"`:''}>${h[0]}</span>`).join('')}</div>${rows}</div>`;

/* Ouvrir un examen : la fiche pour un examen planifié, sinon les résultats de la séance (ou la séance si elle n’a pas encore eu lieu) */
const xOpen=x=>!x.fromSess?`data-act="exam" data-id="${esc(x.e.id)}"`:x.past&&!x.rep&&x.els&&x.els.length?`data-act="x-open" data-key="${esc(x.key)}"`:examAct(x);

function examsPage(){
  const st=S.pg, g=st.g||'';
  if(S.role==='student') return studentExams();
  const view=st.xv==='grille'?'grille':'board';
  const vseg=`<div class="seg" role="group" aria-label="Affichage"><button type="button" id="xv-board" data-act="pg-set" data-k="xv" data-v="board" aria-pressed="${view==='board'}">Tableau de bord</button><button type="button" id="xv-grille" data-act="pg-set" data-k="xv" data-v="grille" aria-pressed="${view==='grille'}">Grille des résultats</button></div>`;
  if(view==='grille'){
    const mineOnly=S.role==='teacher'?x=>x.tch.includes(S.teacher):null;
    const gs=groups().filter(y=>studentsOf(y.id).length&&(!mineOnly||allExamItems().some(x=>x.grp===y.id&&mineOnly(x))));
    const gid=gs.some(y=>y.id===g)?g:(gs[0]||{}).id;
    const gsel=gs.length?`<select id="x-g" aria-label="Classe">${gs.map(y=>`<option value="${esc(y.id)}"${gid===y.id?' selected':''}>${esc(y.nom)}</option>`).join('')}</select>`:'';
    const tbG=`<div class="toolbar">${vseg}${gsel}<span class="grow"></span>${S.role==='teacher'?identitySelect():''}</div>`;
    return tbG+(gid?`<section class="panel xg-panel">${resultsGrid(gid,mineOnly)}</section>`:emptyBox('Aucune classe avec des élèves','La grille apparaîtra dès qu’une classe aura des élèves et des examens passés.'));
  }
  const filter=S.role==='teacher'?x=>x.tch.includes(S.teacher):g?x=>x.grp===g:()=>true;
  const B=examBoard(filter), tab=['up','todo','reps','done'].includes(st.xt)?st.xt:'up', nr=nextReprises();
  const sel=S.role==='admin'?`<select id="x-g" aria-label="Classe"><option value="">Toutes les classes</option>${groups().map(x=>`<option value="${esc(x.id)}"${g===x.id?' selected':''}>${esc(x.nom)}</option>`).join('')}</select>`:identitySelect();
  const can=canEditExam(null)&&S.conn==='shared';
  const tb=`<div class="toolbar">${vseg}${sel}<span class="grow"></span>${can?`<button class="btn primary" type="button" data-act="new-exam">${icon('plus')}Planifier un examen</button>`:''}</div>`;
  const nx=B.up.find(x=>!x.rep), nStud=new Set(B.reps.map(r=>r.e.id)).size;
  const tile=(k,lbl,val,cls,sub)=>`<button type="button" class="xm-tile" id="xt-${k}" data-act="pg-set" data-k="xt" data-v="${k}" aria-pressed="${tab===k}"><span class="lbl">${lbl}</span><b class="${cls}">${val}</b><small>${sub}</small></button>`;
  const tiles=`<div class="xm-tiles" role="group" aria-label="Tableau des examens">
    ${tile('up','À venir',B.up.filter(x=>!x.rep).length,'',nx?'Prochain : '+esc(WD[parse(nx.date).getDay()].slice(0,3).toLowerCase()+'. '+dn(parse(nx.date))+' '+fMonthS.format(parse(nx.date))):'Aucun examen prévu')}
    ${tile('todo','Résultats à entrer',B.todo.length,B.todo.length?'warn':'',B.todo.length?(B.todo.length>1?'examens passés':'examen passé'):'Tout est à jour')}
    ${tile('reps','Reprises à faire',B.reps.length,B.reps.length?'bad':'',B.reps.length?pl(nStud,'élève','élèves'):'Aucune reprise')}
    ${tile('done','Taux de réussite',B.rate==null?'—':B.rate+' %',passCls(B.rate),B.got?pl(B.got,'résultat','résultats'):'Aucun résultat')}
  </div>`;
  let body='';
  if(tab==='up'){
    const lim=+st.lim||25, list=B.up.slice(0,lim), RSu=repSessions();
    body=list.length?xList('xm-up',[['Date'],['Examen'],['Classe'],['Moment'],['','r']],list.map(x=>{const k=daysBetween(todayISO(),x.date);
      const rs=x.rep?RSu.find(y=>y.key===x.key):null, nq=rs?B.reps.filter(q=>{const dq=repDayFor(q.x,RSu);return dq&&dq.key===rs.key;}).length:0;
      const sub=x.rep?(rs&&rs.mods.length?`${rs.mods.map(m=>'M'+m).join(', ')}${nq?' · '+pl(nq,'reprise à faire','reprises à faire'):''}`:'Modules à reprendre : à choisir'):xSub(x);
      return xRow('xm-up'+(x.rep?' is-rep':''),xOpen(x),`${xDate(x,x.rep?'rep':k<=2?'hot':'')}<div class="xm-t"><b>${xTitle(x)}</b>${sub?`<small>${sub}</small>`:''}</div>${xCls(x)}<span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end">${x.rep?'<span class="chip info">Reprise</span>':xWhen(x)}</div>`,xLabel(x));}).join(''))
      +(B.up.length>lim?`<div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="pg-set" data-k="lim" data-v="${lim+25}">Afficher plus (${B.up.length-lim})</button></div>`:'')
      :`<section class="panel"><p class="help">Aucun examen à venir.</p></section>`;
  }else if(tab==='todo'){
    body=B.todo.length?xList('xm-todo',[['Date'],['Examen'],['Classe'],['Résultats entrés'],['','r']],B.todo.map(x=>{const p=Math.round(x.got/x.els.length*100);
      return xRow('xm-todo',xOpen(x),`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b><small>${esc(dayLabel(parse(x.date)))} · ${esc(momentOf(x))}</small></div>${xCls(x)}<div class="cl-big xm-p"><b>${x.got} / ${x.els.length}</b><div class="meter" aria-hidden="true"><i style="width:${p}%"></i></div></div><div class="xm-end">${canEditItem(x)?'<span class="btn sm">Entrer les résultats</span>':'<span class="chip warn">À entrer</span>'}</div>`,'Entrer les résultats : '+xLabel(x));}).join(''))
      :`<div class="cl-list"><p class="miss-ok"><span class="chip ok">À jour</span>Tous les résultats des examens passés sont entrés.</p></div>`;
  }else if(tab==='reps'){
    body=repsTab(B,S.role==='admin'?g:'');
  }else{
    body=B.done.length?xList('xm-done',[['Date'],['Examen'],['Classe'],['Réussite'],['','r']],B.done.map(x=>{const t=x.ok+x.ko+x.kf, r=t?Math.round(x.ok/t*100):null, c=passCls(r);
      return xRow('xm-done',xOpen(x),`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b><small>${esc(dayLabel(parse(x.date)))}${x.avg!=null?` · moyenne ${x.avg} %`:''}</small></div>${xCls(x)}<div class="cl-big xm-p ${c}"><b>${x.ok} / ${t}</b><div class="meter ${c}" aria-hidden="true"><i style="width:${r||0}%"></i></div></div><div class="xm-end">${x.ko?`<span class="chip bad">${pl(x.ko,'à reprendre','à reprendre')}</span>`:x.kf?`<span class="chip bad">${pl(x.kf,'échec de module','échecs de module')}</span>`:'<span class="chip ok">Tous réussis</span>'}</div>`,xLabel(x));}).join(''))
      :`<section class="panel"><p class="help">Aucun résultat pour l’instant.</p></section>`;
  }
  return tb+tiles+body;

/* Élève : ses prochains examens, ses résultats et ses reprises */
function studentExams(){
  const sid=S.student, me=!!sid, B=examBoard(x=>x.grp===S.group), nr=nextReprises();
  const mine=B.items.filter(x=>x.past&&!x.rep&&x.res[sid]).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  const todo=mine.filter(x=>resKo(x.res[sid])), n=nr[S.group];
  const up=B.items.filter(x=>!x.past).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start).slice(0,6);
  const tb=`<div class="toolbar">${identitySelect()}<span class="grow"></span>${me&&mine.length?`<button class="btn" type="button" id="pr-releve" data-act="pr-releve" data-id="${esc(sid)}">${icon('print')}Imprimer mon relevé</button>`:''}</div>`;
  const note=me?repNotice({id:sid},B.items):'';
  const upH=up.length?xList('xm-me',[['Date'],['Examen'],['Moment'],['','r']],up.map(x=>{const k=daysBetween(todayISO(),x.date);return xRow('xm-me',examAct(x),`${xDate(x,x.rep?'rep':k<=2?'hot':'')}<div class="xm-t"><b>${xTitle(x)}</b>${xSub(x)?`<small>${xSub(x)}</small>`:''}</div><span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end">${x.rep?'<span class="chip info">Reprise</span>':xWhen(x)}</div>`,xLabel(x));}).join('')):`<section class="panel"><p class="help">Les examens de votre classe apparaîtront ici dès qu’ils seront planifiés.</p></section>`;
  const resH=!me?'':mine.length?xList('xm-me',[['Date'],['Examen'],['Moment'],['Résultat','r']],mine.map(x=>{const v=x.res[sid];return xRow('xm-me','',`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b></div><span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end"><span class="chip ${RES[v][0]}">${RES[v][1]}${x.pct[sid]!=null?' · '+esc(noteTxt(x.pct[sid])):''}</span></div>`,'');}).join('')):`<section class="panel"><p class="help">Aucun résultat pour l’instant.</p></section>`;
  return tb+note+`<h2 class="xm-h">Prochains examens</h2>${upH}${me?`<h2 class="xm-h">Mes résultats</h2>${resH}`:''}`;

/* Ouvre les résultats d’une séance « Examen » de l’horaire */
function openSessExam(key){
  const x=allExamItems().find(k=>k.key===key);if(!x)return;
  if(!x.fromSess) return openExam(x.e.id);
  openDrawer({kind:'exam',id:null,sess:key,draft:{resultats:Object.assign({},examResOf(x)),pct:Object.assign({},examPctOf(x)),groupe:x.grp},err:'',warn:null,confirmDel:false});
}

/* Grille des résultats d’une classe : une ligne par élève, une colonne par examen passé (le plus récent à gauche) */
const GRID={reussi:['ok','✓'],echec:['bad','✗'],absent:['warn','Abs'],reprise:['info','✓R'],echecf:['fail','ÉM']};
function resultsGrid(gid,filter){
  const B=examBoard(x=>x.grp===gid&&(!filter||filter(x)));
  const xs=B.items.filter(x=>x.past&&!x.rep).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  const els=studentsOf(gid).slice().sort(byElNum);
  if(!els.length) return '<p class="help">Aucun élève dans cette classe.</p>';
  if(!xs.length) return '<p class="help">Aucun examen passé pour l’instant : la grille se remplira au fil des examens.</p>';
  const code=x=>x.c&&x.c.code?x.c.code:'Exam.';
  const sub=x=>{const t=String(x.e.titre||'');return x.fromSess?t.replace(/^Examen\s*/,''):t;};
  const name=x=>x.c?(x.c.code?x.c.code+' ':'')+x.c.titre:(x.e.titre||'Examen');
  const head=xs.map(x=>{const d=parse(x.date),todo=x.got<x.els.length;
    return `<th scope="col" class="xg-h${todo?' todo':''}"><button type="button" ${xOpen(x)} title="${esc(`${name(x)}${sub(x)?' · '+sub(x):''} · ${dayLabel(d)}${todo?' · résultats à entrer':''}`)}"><b>${esc(code(x))}</b><small>${esc(sub(x))||'&nbsp;'}</small><small>${dn(d)} ${esc(fMonthS.format(d).replace('.',''))}</small></button></th>`;}).join('');
  const rows=els.map(e=>{let ok=0,ko=0,kf=0;
    const cells=xs.map(x=>{const v=x.res[e.id], g=GRID[v];if(resOk(v))ok++;else if(resKo(v))ko++;else if(v==='echecf')kf++;
      return `<td><button type="button" class="xg-c ${g?g[0]:'none'}" ${xOpen(x)} aria-label="${esc(`${e.nom} · ${name(x)} · ${v?RES[v][1]:'sans résultat'}`)}" title="${esc(v?RES[v][1]+(x.pct[e.id]!=null?' · '+noteTxt(x.pct[e.id]):''):'Sans résultat')}">${g&&x.pct[e.id]!=null?Math.round(x.pct[e.id]):g?g[1]:'·'}</button></td>`;}).join('');
    const t=ok+ko+kf, r=t?Math.round(ok/t*100):null;
    return `<tr><th scope="row" class="xg-n"><button type="button" class="xg-who" data-act="student" data-id="${esc(e.id)}"><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span>${esc(e.nom)}</button></th><td class="xg-r ${passCls(r)}">${r==null?'—':r+' %'}${ko?`<small>${pl(ko,'à reprendre','à reprendre')}</small>`:''}${kf?`<small>${pl(kf,'échec de module','échecs de module')}</small>`:''}</td>${cells}</tr>`;}).join('');
  const foot=xs.map(x=>{const t=x.ok+x.ko+x.kf;return `<td class="xg-f">${t?`${x.ok}/${t}`:'—'}</td>`;}).join('');
  const legend=`<div class="xg-legend">${Object.entries(GRID).map(([k,[c,l]])=>`<span><i class="xg-c ${c}" aria-hidden="true">${l}</i>${RES[k][1]}</span>`).join('')}<span><i class="xg-c none" aria-hidden="true">·</i>Sans résultat</span></div>`;
  return legend+`<div class="xg-wrap"><table class="xg"><thead><tr><th scope="col" class="xg-n">Élève</th><th scope="col" class="xg-r">Réussite</th>${head}</tr></thead><tbody>${rows}</tbody><tfoot><tr><th scope="row" class="xg-n">Réussis</th><td class="xg-r"></td>${foot}</tr></tfoot></table></div>`;
}
/* Onglet Examens d’une fiche d’élève : ses résultats, ses reprises et ses prochains examens */
function studentExamsTab(e){
  const B=examBoard(x=>x.grp===e.groupe), nr=nextReprises(), n=nr[e.groupe];
  const mine=B.items.filter(x=>x.past&&!x.rep&&x.res[e.id]).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  const pend=mine.filter(x=>resKo(x.res[e.id])), ok=mine.filter(x=>resOk(x.res[e.id])).length, t=ok+pend.length+mine.filter(x=>resFail(x.res[e.id])).length, rate=t?Math.round(ok/t*100):null;
  const bar=`<div class="st-bar"><p class="summary"><span><b>${mine.length}</b>${mine.length>1?'résultats':'résultat'}</span><span><b class="${passCls(rate)}">${rate==null?'—':rate+' %'}</b>de réussite</span><span class="${pend.length?'need':''}"><b>${pend.length}</b>à reprendre</span></p><span class="grow"></span>${mine.length?`<button class="btn sm" type="button" id="pr-releve" data-act="pr-releve" data-id="${esc(e.id)}">${icon('print')}Imprimer le relevé</button>`:''}</div>`;
  const note=repNotice(e,B.items);
  const res=mine.length?xList('xm-sres',[['Date'],['Examen'],['Résultat'],['','r']],mine.map(x=>{const v=x.res[e.id], can=canEditItem(x);
    return xRow('xm-sres',can?xOpen(x):'',`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b>${xSub(x)?`<small>${xSub(x)}</small>`:''}</div><div><span class="chip ${RES[v][0]}">${RES[v][1]}${x.pct[e.id]!=null?' · '+esc(noteTxt(x.pct[e.id])):''}</span></div><div class="xm-end">${resKo(v)&&can?`<button class="btn sm" type="button" data-act="x-rep" data-key="${esc(x.key)}" data-el="${esc(e.id)}"${dis()}>Réussi en reprise</button>`:''}</div>`,xLabel(x));}).join('')):'<section class="panel"><p class="help">Aucun résultat inscrit.</p></section>';
  const up=B.up.slice(0,5);
  const upH=up.length?xList('xm-me',[['Date'],['Examen'],['Moment'],['','r']],up.map(x=>{const k=daysBetween(todayISO(),x.date);return xRow('xm-me',examAct(x),`${xDate(x,x.rep?'rep':k<=2?'hot':'')}<div class="xm-t"><b>${xTitle(x)}</b>${xSub(x)?`<small>${xSub(x)}</small>`:''}</div><span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end">${x.rep?'<span class="chip info">Reprise</span>':xWhen(x)}</div>`,xLabel(x));}).join('')):'<section class="panel"><p class="help">Aucun examen prévu.</p></section>';
  return bar+note+`<h2 class="xm-h">Résultats</h2>${res}<h2 class="xm-h">À venir</h2>${upH}`;

/* Onglet Examens d’une fiche de classe : réussite, grille des résultats et prochains examens */
function classExamsTab(g){
  const B=examBoard(x=>x.grp===g.id);
  const bar=`<div class="st-bar"><p class="summary"><span><b class="${passCls(B.rate)}">${B.rate==null?'—':B.rate+' %'}</b>de réussite</span><span class="${B.todo.length?'need':''}"><b>${B.todo.length}</b>${B.todo.length>1?'examens à compléter':'examen à compléter'}</span><span class="${B.reps.length?'need':''}"><b>${B.reps.length}</b>${B.reps.length>1?'reprises à faire':'reprise à faire'}</span></p></div>`;

/* ---------- Affectation des enseignants : requis, candidatures, remplacements, disponibilités ----------
   candidatures/<séance__enseignant> : { seance, cours, groupe, date, debut, fin, enseignant, statut }
     statut : attente (a postulé) · approuve · refuse · retire (retiré de ce cours par l’administration)
   remplacements/<séance__enseignant> : l’enseignant attribué demande à être remplacé ({ motif })
   disponibilites/<enseignant> : { jours : { '2026-10-13' : 'J' | 'AM' | 'PM' } }
   Le titulaire du module (cours.enseignant) donne tous ses cours, sauf ceux dont on l’a retiré. */
const candId=(key,tid)=>(String(key)+'__'+String(tid)).replace(/[^A-Za-z0-9_-]/g,'-');
let _aff=null;
function affIdx(){
  const a=S.data.candidatures, r=S.data.remplacements;
  if(_aff&&_aff.a===a&&_aff.r===r) return _aff;
  const by={}, rp={};
  for(const d of a)(by[d.seance]||(by[d.seance]=[])).push(d);
  for(const d of r) rp[d.seance+'|'+d.enseignant]=d;
  return _aff={a,r,by,rp};
}
/* Module du programme (menu Modules) d’un cours, d’après son sigle « M7 » */
const modKey=c=>{const m=/^M?(\d+)$/i.exec(String(c&&c.code||'').trim());return m?+m[1]:null;};
const modOf=c=>{const k=modKey(c);return k==null?null:comps().find(x=>+x.code===k)||null;};
/* Enseignants requis : ceux du cours du module que la séance donne (le plus grand s’il y en a plusieurs).
   Pour un examen, une reprise ou une activité : la valeur réglée sur la séance, sinon 1 (0 pour une activité). */
const reqOf=s=>{const x=s.extra||s.sl||{}, m=modOf(s.c), ks=m?xCours(m,x):[];if(ks.length)return Math.max(...ks.map(cReq));if(x.requis!=null&&x.requis!=='')return Math.max(0,+x.requis||0);if(isActivity(s.c))return 0;return m&&+m.requis>0?+m.requis:1;};
const linkedX=s=>!!(s&&s.extra&&acad()&&xCours(modOf(s.c),s.extra).length);
function tchOf(c,key){
  const cs=affIdx().by[key];if(!cs) return [c.enseignant];
  const out=[];
  if(c.enseignant&&!cs.some(d=>d.enseignant===c.enseignant&&d.statut==='retire')) out.push(c.enseignant);

}
function staffing(s){
  const I=affIdx(), cs=I.by[s.key]||[], st={}, known=id=>!!byId(S.data.enseignants,id);
  for(const d of cs) st[d.enseignant]=d.statut;
  const assigned=s.tch.filter(id=>id&&known(id));

  const requis=reqOf(s), firm=assigned.length-remp.length, clash=isPast(s)?[]:assigned.filter(t=>busyAt(t,s));

}

/* Le même module donné à deux classes au même moment n’est pas un conflit : l’enseignant a les deux classes ensemble */

/* ---------- Enseignant : mes cours (à pourvoir, en attente, attribués, donnés) ---------- */
function teacherBoard(tid){
  const t=byId(S.data.enseignants,tid)||{}, I=affIdx(), open=[], wait=[], mine=[];let noDispo=0;
  for(const s of upcomingSessions(150)){
    const st=staffing(s), my=st.st[tid];
    if(st.assigned.includes(tid)){mine.push({s,st,remp:I.rp[s.key+'|'+tid]||null});continue;}
    if(my==='attente'||my==='refuse'){wait.push({s,st,v:my});continue;}
    if(my==='retire'||st.open<=0||!hasComp(t,s.c)||onLeave(t)) continue;
    if(!dispoCovers(dispoOf(tid,s.date),s)){noDispo++;continue;}
    if(busyAt(tid,s)) continue;
    open.push({s,st});
  }
  const past=sessionsBetween(yearStart(),todayISO()).filter(s=>s.kind==='cours'&&!s.cancelled&&isPast(s)&&s.tch.includes(tid)).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  return {t,open,wait,mine,past,noDispo};
}

function dispoDraft(tid){

}
function dispoMonthDays(ym){

  for(let d=new Date(Y,M-1,1);d.getMonth()===M-1;d=addDays(d,1)){const j=(d.getDay()+6)%7;if(j<5)out.push({d,ds:iso(d),j});}
  return out;
}

/* ---------- Administration : modules du programme ----------
   Le catalogue est dans config/ecole.competences : { code, nom, heuresT, heuresP, heures, charge, cours[], examens[] }.
   · COURS du module : { id, num, type, requis } — ce qui compose le module, pareil pour toutes les classes.
   · EXAMENS du module : { id, type (t : théorique, p : pratique), nom }.
   · SÉANCE : un cours ou un examen donné à une classe, à une date. Chaque classe a son document cours/<id> (sigle M7) ;
     ses séances pointent vers les cours (x.cours) ou les examens (x.examens) du module.
   · CHARGÉ DE COURS (charge) : l’enseignant du module ; il donne ses séances à toutes les classes. */
const modList=()=>comps().map(k=>({id:String(k.code),nom:k.nom,k}));
const modCourses=code=>S.data.cours.filter(c=>modKey(c)===+code);
const modT=k=>k.heuresT!=null&&k.heuresT!==''?+k.heuresT:null;
const modP=k=>k.heuresP!=null&&k.heuresP!==''?+k.heuresP:null;
const modTot=k=>modT(k)!=null||modP(k)!=null?(modT(k)||0)+(modP(k)||0):(+k.heures||0);
const hTxt=v=>v==null?'<span class="muted">—</span>':v+' h';
const COURS_TYPES=['theorie','pratique','simulation','visite','stage','activite'];
const actLabel=k=>(ACTIVITES.find(a=>a.k===k)||{}).label||'';
const EXAM_T={t:'Théorique',p:'Pratique'};
const examActOf=e=>e.type==='t'?'examen-t':e.type==='p'?'examen-p':'examen';
const mCours=k=>(k&&Array.isArray(k.cours)?k.cours:[]).slice().sort((a,b)=>collator.compare(String(a.num),String(b.num)));
const mExams=k=>(k&&Array.isArray(k.examens)?k.examens:[]);
const xCours=(k,x)=>k&&x&&Array.isArray(x.cours)?x.cours.map(id=>(k.cours||[]).find(c=>c.id===id)).filter(Boolean):[];
const xExams=(k,x)=>k&&x&&Array.isArray(x.examens)?x.examens.map(id=>(k.examens||[]).find(e=>e.id===id)).filter(Boolean):[];
const cReq=c=>c.requis==null||c.requis===''?1:Math.max(0,Math.min(9,+c.requis||0));
const autoLabel=a=>a.length===2?a.join('–'):a.join(', ');
const chargeName=k=>k&&k.charge&&byId(S.data.enseignants,k.charge)?tName(k.charge):'';
/* Dans quelles classes chaque cours et chaque examen du module est à l’horaire */
function modUse(code){
  const use={};
  for(const c of modCourses(code)) for(const x of datedOf(c)) for(const id of (x.cours||[]).concat(x.examens||[])) (use[id]||(use[id]=new Set())).add(c.groupe);
  return {use,n:id=>use[id]?use[id].size:0};
}
function chargeSelect(id,cur,k){
  const ts=teachers(), curT=cur?byId(S.data.enseignants,cur):null;
  const opt=t=>`<option value="${esc(t.id)}"${cur===t.id?' selected':''}>${esc(t.nom)}${k&&!(t.competences||[]).some(x=>+x===+k.code)?' (hors compétences)':''}</option>`;
  return `<select id="${id}"><option value="">À choisir plus tard</option>${ts.map(opt).join('')}${curT&&!ts.includes(curT)?opt(curT):''}</select>`;
}
/* Heures planifiées du module pour une classe, par type ; la reprise ne compte pas */
function modHours(c){
  let T=0,P=0,O=0,ex=0;const rep=[], ann=(c&&c.annulees)||[];
  for(const x of datedOf(c)){
    if(ann.includes(`${x.date}@${x.id}`)) continue;
    const m=sessMinutes(x), tg=x.tags||[];
    if(tg.includes('Reprise')&&!tg.includes('Examen')){rep.push(x.date);continue;}
    if(tg.includes('Examen')) ex++;
    if(tg.includes('Théorie')) T+=m; else if(tg.includes('Pratique')) P+=m; else O+=m;
  }
  return {T:Math.round(T/60),P:Math.round(P/60),O:Math.round(O/60),ex,rep:rep.sort()};
}

/* Enregistre le catalogue des modules, puis accorde le nom et les heures des cours des classes */
async function saveModule(code,vals,isNew){
  const c=configDoc(), i=c.competences.findIndex(x=>+x.code===+code);
  if(isNew&&i>=0){toast(`Le module M${code} existe déjà.`,'bad');return false;}
  const tot=vals.heuresT!=null||vals.heuresP!=null?(vals.heuresT||0)+(vals.heuresP||0):(i>=0?+c.competences[i].heures||0:0);
  const k=Object.assign({cours:[],examens:[]},i>=0?c.competences[i]:{code:+code},{nom:vals.nom,heuresT:vals.heuresT,heuresP:vals.heuresP,heures:tot,charge:vals.charge||''});
  delete k.requis;
  if(i>=0)c.competences[i]=k;else c.competences.push(k);
  c.competences.sort((a,b)=>a.code-b.code);
  if(!await saveConfig(c,isNew?`Module M${code} créé`:'Module enregistré')) return false;
  const stale=modCourses(code).filter(x=>x.titre!==k.nom||(+x.heures||0)!==tot);
  if(stale.length) await runAll(stale.map(x=>()=>col('cours').doc(x.id).update({titre:k.nom,heures:tot||null})),'');
  return true;
}
/* Modifie la structure d’un module (ses cours, ses examens) : fn reçoit la copie du module et la change */
async function editModule(code,fn,msg){
  if(S.busy) return false;
  const c=configDoc(), k=c.competences.find(x=>String(x.code)===String(code));if(!k) return false;
  k.cours=(k.cours||[]).map(x=>Object.assign({},x));k.examens=(k.examens||[]).map(x=>Object.assign({},x));
  const r=fn(k);if(r===false) return false;

}
/* Après un changement de type dans le module : les séances de toutes les classes suivent */

/* Ajoute une séance à une classe : un ou plusieurs cours (ou examens) du module, ou une activité sans module.
   o.items : 'c:<id>' (cours), 'e:<id>' (examen), 'rep' (reprise). Renvoie un message d’erreur, ou '' */
async function addCourseDay(o){

  const x={id:'a'+date.replace(/-/g,'')+per.k+Math.random().toString(36).slice(2,5),date,debut:per.debut,fin:per.fin,tags:[],label:titre,minutes:per.k==='jour'?360:180};
  if(!mk) x.tags=withAct([],o.type||'activite');
  else if(es.length||ks.length){
    x.tags=withAct([],es.length?examActOf(es[0]):ks[0].type);
    x.label=autoLabel(ks.map(c=>c.num).concat(es.map(e=>e.nom)));

/* ---------- Journées de reprise ----------
   Une journée de reprise est une séance « Reprise » à l’horaire d’une classe. On la crée d’abord, puis on y ajoute des
   modules (x.modules). Chaque élève qui a échoué ou manqué un examen d’un de ces modules le reprend ce jour-là :
   une reprise par examen échoué. Réussie : le résultat devient « réussi en reprise ». Ratée : « échec du module ».
   La liste des reprises se déduit des résultats ; resultats/<examen>.reprises = { élève : { date, v, de, pct } }
   garde la date et l’issue de chaque reprise (de : le premier résultat, pour pouvoir annuler). */
const resFail=v=>v==='echecf';
function repSessions(){
  const out=[];
  for(const c of S.data.cours) for(const x of datedOf(c)){
    const tg=x.tags||[];if(!tg.includes('Reprise')||tg.includes('Examen')) continue;
    if((c.annulees||[]).includes(`${x.date}@${x.id}`)||offDay(x.date)) continue;
    const own=modKey(c), mods=[...new Set((own!=null?[own]:[]).concat((x.modules||[]).map(Number).filter(n=>n>0)))].sort((a,b)=>a-b);
    out.push({c,x,own,date:x.date,grp:c.groupe,mods,key:`${c.id}_${x.id}_${x.date}`});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date)||collator.compare(gName(a.grp),gName(b.grp)));
}
/* La journée où se reprend un examen échoué : la première journée de reprise de la classe, après l’examen et pas encore passée, qui a son module */
function repDayFor(x,RS){
  const mk=x.c?modKey(x.c):null, t=todayISO();
  return mk==null?null:(RS||repSessions()).find(r=>r.grp===x.grp&&r.date>=t&&r.date>x.date&&r.mods.includes(mk))||null;
}
const modLbl=code=>{const k=comps().find(m=>+m.code===+code);return k?`M${k.code} ${k.nom}`:'M'+code;};
/* Modules échoués par un élève : une reprise ratée suffit */
function failedModules(e,items){
  const out=new Map();
  for(const x of items) if(resFail(x.res[e.id])&&x.c) out.set(modKey(x.c)!=null?'M'+modKey(x.c):x.c.id,(x.c.code?x.c.code+' ':'')+x.c.titre);
  return [...out.values()];
}
/* Ce qu’un élève doit reprendre, avec la date de chaque reprise quand elle est fixée */
function repNotice(e,items,RS){
  const pend=items.filter(x=>x.past&&!x.rep&&resKo(x.res[e.id])), fail=failedModules(e,items);
  const one=x=>{const d=repDayFor(x,RS);return `${esc((x.c&&x.c.code?x.c.code+' ':'')+(x.c?x.c.titre:'Examen'))}${x.e&&x.e.titre&&x.e.titre!=='Examen'?' ('+esc(x.e.titre)+')':''} : ${d?'reprise le '+esc(dayLabel(parse(d.date)).toLowerCase()):'date de reprise à venir'}`;};
  return (pend.length?`<div class="notice warn" id="rp-note"><p><b>${pl(pend.length,'reprise à faire','reprises à faire')}</b></p><ul>${pend.map(x=>`<li>${one(x)}</li>`).join('')}</ul></div>`:'')
    +(fail.length?`<div class="notice bad" id="rp-fail"><p><b>${fail.length>1?'Modules échoués':'Module échoué'}</b> : ${esc(fail.join(', '))}. La reprise n’a pas été réussie.</p></div>`:'');

/* Inscrit l’issue d’une reprise : réussie → « réussi en reprise » ; ratée → « échec du module » ; ok === null : on annule */
async function setRetake(key,el,ok,date,pct){
  const x=allExamItems().find(k=>k.key===key);if(!x||S.busy) return false;
  const cur=S.data.resultats[resKeyOf(x)]||{}, reps=Object.assign({},cur.reprises), res=Object.assign({},examResOf(x)), was=res[el], t=todayISO();
  if(ok===null){const r=reps[el];if(!r) return false;res[el]=r.de||'echec';delete reps[el];}
  else{

  }

/* Ajoute ou retire un module d’une journée de reprise, pour toutes les classes qui ont cette journée */
async function repModules(date,code,add){

    if(r.own===+code) continue;
    const doc=courseDoc(r.c), x=doc.extras.find(e=>e.id===r.x.id);if(!x) continue;
    const set=new Set((x.modules||[]).map(Number));if(add)set.add(+code);else set.delete(+code);
    x.modules=[...set].sort((a,b)=>a-b);
    jobs.push(()=>putCours(r.c.id,doc));
  }
  if(!jobs.length) return false;
  const lbl=dayLabel(parse(date)).toLowerCase(), ok=await runAll(jobs,add?`M${code} ajouté à la reprise du ${lbl}`:`M${code} retiré de la reprise du ${lbl}`);
  if(ok) logEv('horaire',add?`a ajouté le module M${code} à la journée de reprise`:`a retiré le module M${code} de la journée de reprise`,lbl);
  return ok;
}

/* ---------- Import : liste d’élèves, copie de l’horaire d’une classe ----------
   Liste d’élèves collée ou lue d’un fichier, une ligne par élève. Colonnes séparées par une tabulation (cellules copiées
   d’Excel), un point-virgule ou une virgule : numéro, nom (ou prénom et nom), courriel, téléphone.
   Une première ligne de titres est reconnue ; sans titres, on devine chaque case. */
function csvCells(line,sep){
  const out=[];let cur='', q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"'&&!cur) q=true;
    else if(ch===sep){out.push(cur);cur='';}
    else cur+=ch;}
  out.push(cur);
  return out.map(c=>c.replace(/\s+/g,' ').trim());
}
function parseStudents(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(0,400);
  if(!lines.length) return [];
  const count=ch=>lines.slice(0,10).reduce((n,l)=>n+l.split(ch).length-1,0), sep=count('\t')?'\t':count(';')?';':count(',')?',':null;
  let rows=lines.map(l=>sep?csvCells(l,sep):[l.replace(/\s+/g,' ').trim()]), map=null;
  const H={numero:/^(n[°ºo]\.?|no\.?|num[ée]ro|#|matricule)$/i,prenom:/^pr[ée]nom$/i,nom:/^(nom|nom de famille|[ée]l[èe]ve|nom complet)$/i,courriel:/^(courriel|e-?mail|adresse courriel)$/i,telephone:/^(t[ée]l[ée]phone|t[ée]l\.?|cellulaire)$/i};
  const head=rows[0].map(c=>Object.keys(H).find(k=>H[k].test(c))||'');
  if(head.includes('nom')||head.includes('prenom')){map=head;rows=rows.slice(1);}
  return rows.map(r=>{
    const o={nom:'',numero:null,courriel:'',telephone:''}, names=[];let pre='';
    r.forEach((c,i)=>{
      if(!c) return;
      const k=map?map[i]:/^\d{1,3}$/.test(c)&&o.numero==null?'numero':/@/.test(c)?'courriel':/^[\d\s().+-]{7,}$/.test(c)?'telephone':'nom';
      if(k==='numero'){const n=parseInt(c,10);if(n>0)o.numero=n;}
      else if(k==='prenom') pre=c;
      else if(k==='nom') names.push(c);
      else if(k==='courriel') o.courriel=c;
      else if(k==='telephone') o.telephone=c;
    });
    o.nom=(pre?pre+' ':'')+names.join(' ');
    return o;
  }).filter(o=>o.nom.trim());
}
/* Lit un fichier texte ; un CSV enregistré par Excel sous Windows n’est pas en UTF-8 : on le relit alors en Windows-1252 */
function readTextFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(r.error);
    r.onload=()=>{const t=String(r.result||'');if(!t.includes(String.fromCharCode(0xFFFD))){res(t);return;}const r2=new FileReader();r2.onerror=()=>res(t);r2.onload=()=>res(String(r2.result||''));r2.readAsText(file,'windows-1252');};
    r.readAsText(file);
  });
}
/* Copie de l’horaire d’une classe vers une autre : la première journée de classe de la source tombe à la date choisie,
   et les journées suivantes se suivent dans le même ordre, en sautant les fins de semaine et les congés.
   Les séances annulées, les présences et les résultats ne sont pas copiés. */
function copyPlan(src,dst,start){
  const items=[], schoolDay=ds=>{const j=parse(ds).getDay();return j!==0&&j!==6&&!offDay(ds);};
  for(const c of S.data.cours.filter(c=>c.groupe===src)) for(const x of datedOf(c)) if(!(c.annulees||[]).includes(`${x.date}@${x.id}`)&&schoolDay(x.date)) items.push({c,x});
  if(!items.length||!start) return {n:0,items:[]};
  items.sort((a,b)=>a.x.date.localeCompare(b.x.date)||String(a.x.debut).localeCompare(String(b.x.debut)));
  const first=items[0].x.date, last=items[items.length-1].x.date, from=[], to=[];
  for(let d=parse(first),n=0;iso(d)<=last&&n<800;d=addDays(d,1),n++) if(schoolDay(iso(d))) from.push(iso(d));
  for(let d=parse(start),n=0;to.length<from.length&&n<800;d=addDays(d,1),n++) if(schoolDay(iso(d))) to.push(iso(d));
  const map=new Map(from.map((ds,i)=>[ds,to[i]||'']));
  let out=0, clash=0;const keep=[];
  for(const it of items){
    const nd=map.get(it.x.date);
    if(!nd){out++;continue;}
    const a=toMin(it.x.debut), b=toMin(it.x.fin);
    if(sessionsOn(nd).some(s=>s.grp===dst&&!s.cancelled&&s.start<b&&a<s.end)){clash++;continue;}
    keep.push(Object.assign({nd},it));
  }
  return {n:keep.length,items:keep,out,clash,first,last,from:keep.length?keep[0].nd:'',to:keep.length?keep[keep.length-1].nd:''};
}
async function copySchedule(src,dst,start){
  const P=copyPlan(src,dst,start);if(!P.n) return false;
  const bySrc=new Map();for(const it of P.items){if(!bySrc.has(it.c.id))bySrc.set(it.c.id,{c:it.c,xs:[]});bySrc.get(it.c.id).xs.push(it);}
  const jobs=[];
  for(const {c,xs} of bySrc.values()){
    const mk=modKey(c), t0=mk!=null?S.data.cours.find(o=>o.groupe===dst&&modKey(o)===mk):S.data.cours.find(o=>o.groupe===dst&&modKey(o)==null&&String(o.titre||'').trim().toLowerCase()===String(c.titre||'').trim().toLowerCase());
    const doc=t0?courseDoc(t0):{titre:c.titre,code:c.code||'',couleur:+c.couleur||0,groupe:dst,enseignant:mk!=null?'':principalOf(dst),salle:c.salle||'',du:'',au:'',heures:c.heures||null,creneaux:[],annulees:[],extras:[]};
    const used=new Set(doc.extras.map(x=>x.id));
    for(const {x,nd} of xs){
      let id='a'+nd.replace(/-/g,'')+(toMin(x.debut)<720?'am':'pm');while(used.has(id)) id+=Math.random().toString(36).slice(2,4);
      used.add(id);
      const o={id,date:nd,debut:x.debut,fin:x.fin,tags:(x.tags||[]).filter(t=>!CHORE_TAGS.has(t)),label:x.label||''};
      for(const k of ['minutes','cours','examens','requis','salle']) if(x[k]!=null&&x[k]!=='') o[k]=JSON.parse(JSON.stringify(x[k]));
      doc.extras.push(o);
    }
    const id=t0?t0.id:genId('c');
    jobs.push(()=>putCours(id,doc));
  }
  const ok=await runAll(jobs,`${pl(P.n,'séance copiée','séances copiées')} vers ${gName(dst)}`);
  if(ok) logEv('horaire',`a copié l’horaire de ${gName(src)} vers ${gName(dst)}`,`${pl(P.n,'séance','séances')}, à partir du ${longDate(parse(P.from))}`);
  return ok;
}

function copyPanel(g){
  const st=S.pg, others=groups().filter(x=>x.id!==g.id&&S.data.cours.some(c=>c.groupe===x.id&&datedOf(c).length)), src=others.some(x=>x.id===st.cps)?st.cps:'', P=src&&st.cpd?copyPlan(src,g.id,st.cpd):null;
  const d=ds=>longDate(parse(ds));
  const info=!others.length?'Aucune autre classe n’a d’horaire à copier.':!P?'Choisissez la classe à copier et la première journée de classe.'
    :!P.n?'Aucune séance ne peut être copiée à partir de cette date.'

/* ---------- Historique : qui a fait quoi, et quand ----------
   journal/<AAAA-MM> : un document par mois, où chaque action est une entrée de « ev » (la base ne grossit pas d’un
   document par clic ; au-delà de 600 entrées le mois continue dans AAAA-MM-2). Entrée : { le, par, role, cat, txt, obj,
   seance, date, groupe } — cat : horaire | aff | module. L’écriture ne bloque ni ne fait échouer l’action elle-même. */
const sObj=s=>`${s.c.code?s.c.code+' ':''}${s.c.titre} · ${gName(s.grp)}, ${dayLabel(parse(s.date)).toLowerCase()}`;
async function logEv(cat,txt,obj,s){
  if(!DB) return;
  try{
    const now=new Date(), ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
    const cur=(S.data.journal||[]).filter(d=>d.id===ym||d.id.startsWith(ym+'-')).sort((a,b)=>collator.compare(a.id,b.id)).pop();
    const id=!cur?ym:Object.keys(cur.ev||{}).length>=600?ym+'-'+((+(cur.id.split('-')[2]||1))+1):cur.id;
    const ev={le:now.toISOString(),par:whoAmI(),role:S.role,cat,txt,obj:obj||''};
    if(s){ev.seance=s.key;ev.date=s.date;ev.groupe=s.grp||'';}
    const body={ev:{[now.getTime().toString(36)+Math.random().toString(36).slice(2,5)]:ev}}, ref=col('journal').doc(id);
    try{await ref.update(body);}
    catch(e){
      /* le document du mois n’existe pas encore : on le crée (jamais d’écrasement d’un mois existant) */
      if(!e||e.code!=='invalid_argument') return;
      const snap=await ref.get();if(!snap.exists) await ref.set(body);
    }
  }catch(e){}
}
function ensureJournal(){
  if(!DB||S.jrSub) return;S.jrSub=true;
  try{col('journal').onSnapshot(q=>{S.data.journal=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.jrLoaded=true;schedule();},()=>{S.jrLoaded=true;schedule();});}
  catch(e){S.jrLoaded=true;}
}
const JR_CAT={horaire:['info','Horaire'],aff:['warn','Affectations'],module:['k5','Modules']};
function historyPage(){
  ensureJournal();
  const st=S.pg, f=JR_CAT[st.jc]?st.jc:'', q=String(st.jq||'').trim().toLowerCase(), lim=+st.jl||60, all=[];
  for(const d of S.data.journal||[]) for(const [id,e] of Object.entries(d.ev||{})) if(e&&e.le&&JR_CAT[e.cat]) all.push(Object.assign({id},e));
  all.sort((a,b)=>b.le.localeCompare(a.le));
  const cnt={horaire:0,aff:0,module:0};for(const e of all) cnt[e.cat]++;
  const list=all.filter(e=>(!f||e.cat===f)&&(!q||`${e.par} ${e.txt} ${e.obj}`.toLowerCase().includes(q)));
  const seg=`<div class="seg" role="group" aria-label="Filtrer">${[['','Tout',all.length],['horaire','Horaire',cnt.horaire],['aff','Affectations',cnt.aff],['module','Modules',cnt.module]].map(([k,l,n])=>`<button type="button" id="jr-f-${k||'all'}" data-act="pg-set" data-k="jc" data-v="${k}" aria-pressed="${f===k}">${l} · ${n}</button>`).join('')}</div>`;
  const tb=`<div class="toolbar">${seg}<span class="grow"></span><input class="search" id="jr-q" type="search" placeholder="Rechercher une personne, un module…" aria-label="Rechercher dans l’historique" autocomplete="off" value="${esc(st.jq||'')}"></div>`;
  if(!S.jrLoaded) return tb+'<section class="panel"><p class="help">Chargement de l’historique…</p></section>';
  if(!all.length) return tb+emptyBox('Rien dans l’historique pour l’instant','Les séances annulées, déplacées, ajoutées ou supprimées, les candidatures et les attributions s’inscrivent ici, avec le nom de la personne et l’heure.');
  if(!list.length) return tb+'<section class="panel"><p class="help">Aucune action ne correspond.</p></section>';
  const rows=list.slice(0,lim).map(e=>{const d=new Date(e.le), s=e.seance&&e.date?findSess(e.date,e.seance):null;
    return xRow('xm-jr',s?`data-act="sess-at" ${sAt(s)}`:'',`<span class="jr-w"><b>${dn(d)} ${esc(fMonthS.format(d))}</b><small>${pad(d.getHours())} h ${pad(d.getMinutes())}</small></span><div class="xm-t"><b>${esc(e.par||'Quelqu’un')} ${esc(e.txt)}</b>${e.obj?`<small>${esc(e.obj)}</small>`:''}</div><div class="xm-end"><span class="chip ${JR_CAT[e.cat][0]}">${JR_CAT[e.cat][1]}</span></div>`,`${e.par} ${e.txt} ${e.obj}`);}).join('');
  return tb+xList('xm-jr',[['Quand'],['Action'],['','r']],rows)+(list.length>lim?`<div class="row" style="margin-top:12px"><button class="btn" type="button" id="jr-more" data-act="pg-set" data-k="jl" data-v="${lim+60}">Afficher plus (${list.length-lim})</button></div>`:'');
}

/* ---------- Notifications (la cloche) ----------
   Rien de plus n’est enregistré : la liste se déduit de ce que la personne peut déjà lire — ses candidatures,
   les demandes de remplacement, les séances annulées. Ce qui a été vu est noté dans le navigateur.
   Le courriel viendra avec la connexion Firebase (il faut un serveur pour l’envoyer). */
const whoAmI=()=>(S.me&&S.me.name)||'';
const ago=t=>{if(!t)return '';const m=Math.round((Date.now()-new Date(t).getTime())/60000);if(isNaN(m))return '';if(m<1)return 'à l’instant';if(m<60)return `il y a ${m} min`;const h=Math.round(m/60);if(h<24)return `il y a ${h} h`;const d=Math.round(h/24);return d===1?'hier':d<14?`il y a ${d} jours`:shortDate(new Date(t));};
let _nf=null;
function notifs(){
  const D=S.data, who=S.role==='teacher'?S.teacher:S.role==='student'?S.group:'', day=todayISO(), k=S.role+'|'+who+'|'+day;
  if(_nf&&_nf.c===D.cours&&_nf.a===D.candidatures&&_nf.r===D.remplacements&&_nf.g===D.config&&_nf.k===k) return _nf.out;
  const out=[], recent=iso(addDays(new Date(),-7));
  const info=(date,key)=>{const s=findSess(date,key);return s?{s,txt:`${s.c.code?s.c.code+' ':''}${s.c.titre} · ${gName(s.grp)}, ${dayLabel(parse(s.date)).toLowerCase()}`}:null;};
  /* séances annulées à venir : pour l’enseignant qui les donnait, ou pour la classe */
  const cancelled=(match,pre)=>{
    for(const c of D.cours) for(const tag of c.annulees||[]){
      const [date,sid]=String(tag).split('@');if(!sid||date<day) continue;
      const x=info(date,`${c.id}_${sid}_${date}`);if(!x||!x.s.cancelled||x.s.movedX||!match(x.s)) continue;
      const a=(c.annule||{})[tag]||{};
      out.push({id:`a:${pre}:${x.s.key}`,t:a.le||'',tone:'bad',title:W('Séance annulée','Cours annulé'),text:x.txt+'.',go:{k:'sess',key:x.s.key,date}});
    }
  };
  if(S.role==='teacher'&&who){
    for(const d of D.candidatures){
      if(d.enseignant!==who||d.date<recent) continue;
      const T={approuve:d.par==='admin'?['ok','Séance attribuée','Vous donnez ']:['ok','Candidature approuvée','Vous donnez '],refuse:['bad','Candidature refusée','Pour '],retire:['warn','Séance retirée','Vous ne donnez plus ']}[d.statut], x=T&&info(d.date,d.seance);
      if(x) out.push({id:`c:${d.id}:${d.statut}`,t:d.maj||'',tone:T[0],title:T[1],text:T[2]+x.txt+'.',go:{k:'mes',tab:d.statut==='approuve'?'mine':'open'}});
    }
    cancelled(s=>(s.tch||[]).includes(who),'t:'+who);
  }else if(S.role==='student'&&who) cancelled(s=>s.grp===who,'g:'+who);
  else if(S.role==='admin'){
    for(const d of D.remplacements){
      if(d.date<day) continue;const x=info(d.date,d.seance);
      if(x&&!x.s.cancelled&&(x.s.tch||[]).includes(d.enseignant)) out.push({id:`r:${d.id}`,t:d.maj||'',tone:'warn',title:'Remplacement demandé',text:`${tName(d.enseignant)} · ${x.txt}.${d.motif?' Raison : '+d.motif:''}`,go:{k:'aff',tab:'remp'}});
    }
    for(const d of D.candidatures){
      if(d.statut!=='attente'||d.date<day) continue;const x=info(d.date,d.seance);
      if(x&&!x.s.cancelled&&byId(D.enseignants,d.enseignant)) out.push({id:`c:${d.id}:attente`,t:d.maj||'',tone:'info',title:'Nouvelle candidature',text:`${tName(d.enseignant)} · ${x.txt}.`,go:{k:'aff',tab:'cand'}});
    }
  }
  out.sort((a,b)=>(b.t||'').localeCompare(a.t||''));
  _nf={c:D.cours,a:D.candidatures,r:D.remplacements,g:D.config,k,out};
  return out;
}
const nfNew=()=>{const seen=new Set(S.nfSeen||[]);return notifs().filter(n=>!seen.has(n.id));};
function bellHTML(){
  if(S.conn!=='shared'||!allLoaded()) return '';
  const n=nfNew().length;
  return `<button type="button" class="bell" id="nf-bell" data-act="nf-open" aria-label="${n?pl(n,'nouvelle notification','nouvelles notifications'):'Notifications'}" title="Notifications">${icon('bell')}${n?`<i class="bell-n" id="nf-n">${n>9?'9+':n}</i>`:''}</button>`;
}
function notifDrawer(){
  const d=S.dr, list=notifs(), fresh=new Set(d.fresh||[]), n=list.filter(x=>fresh.has(x.id)).length;
  const empty=S.role==='admin'?'Les demandes de remplacement et les nouvelles candidatures apparaîtront ici.':S.role==='teacher'?'Vos candidatures approuvées ou refusées et vos séances annulées apparaîtront ici.':'Les séances annulées de votre classe apparaîtront ici.';

  return dTop('Notifications',!list.length?'Rien pour l’instant':n?pl(n,'nouvelle','nouvelles'):'Tout est vu','')
    +`<div class="dr-body">${list.length?`<ul class="nf-list">${rows}</ul>`:`<p class="help">${empty}</p>`}</div>`;
}

const prSlug=v=>String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'feuille';
function prHead(title,sub){const c=cfg();return `<header class="pr-head"><div><h1>${esc(title)}</h1><p>${sub}</p></div><div class="pr-org"><b>${esc(c.nom||'')}</b><br>${esc(c.annee||'')}</div></header>`;}
const prWeekLbl=mon=>{const a=mon, b=addDays(mon,4);return a.getMonth()===b.getMonth()?`${dn(a)} au ${dn(b)} ${fMonth.format(b)} ${b.getFullYear()}`:`${dn(a)} ${fMonth.format(a)} au ${dn(b)} ${fMonth.format(b)} ${b.getFullYear()}`;};
/* Tout ce qui est à l’horaire d’une semaine (du lundi au vendredi) */
function weekItemsOf(mon){
  let out=[];for(let i=0;i<5;i++) out=out.concat(sessionsOn(iso(addDays(mon,i))));
  const a=iso(mon), b=iso(addDays(mon,4));
  return out.concat(S.data.examens.filter(e=>!e.seance&&e.date>=a&&e.date<=b).map(examItem));
}
function prSess(s,who){
  const where=who==='g'?(s.tch||[]).filter(id=>id&&byId(S.data.enseignants,id)).map(id=>shortName(tName(id))).join(', '):gName(s.grp);
  if(s.kind==='exam') return `<div class="pr-s ex"><b>${esc(s.c?(s.c.code?s.c.code+' ':'')+s.c.titre:(s.e.titre||'Examen'))}</b><span>${esc(s.c?(s.e.titre||'Examen'):'Examen')}</span><span>${esc([where,s.salle?'Local '+s.salle:''].filter(Boolean).join(' · '))}</span></div>`;
  const tg=tagsOf(s);
  return `<div class="pr-s${s.cancelled?' off':''}${tg.includes('Examen')?' ex':''}"><b>${esc((s.c.code?s.c.code+' ':'')+s.c.titre)}</b><span>${esc([sessLabel(s),cardKind(tg).kind].filter(Boolean).join(' · '))}</span><span>${esc([where,s.salle?'Local '+s.salle:'',ressNames(ressOf(s))].filter(Boolean).join(' · '))}</span>${s.cancelled?`<i>${W('Séance annulée','Cours annulé')}</i>`:''}</div>`;
}
/* Une page : les cinq jours en colonnes, l’avant-midi et l’après-midi en lignes ; une journée complète occupe les deux */
function prWeekPage(title,sub,items,mon,who,gid){
  const days=[0,1,2,3,4].map(i=>{const d=addDays(mon,i), ds=iso(d), list=items.filter(s=>s.date===ds).sort((a,b)=>a.start-b.start), part=k=>list.filter(s=>moment(s.start,s.end)===k);
    return {d,off:offDay(ds),full:part('Toute la journée'),am:part('Avant-midi'),pm:part('Après-midi'),chore:gid?choreDay(gid,ds):''};});
  const lines=a=>a.map(s=>prSess(s,who)).join('')||'<span class="pr-none">—</span>';
  const span=x=>x.off||(x.full.length&&!x.am.length&&!x.pm.length);
  const head=days.map(x=>`<th>${esc(WD[x.d.getDay()])} ${dn(x.d)} ${esc(fMonthS.format(x.d))}${x.chore?`<small>Corvée de ménage${x.chore==='maybe'?' ?':''}</small>`:''}</th>`).join('');
  const am=days.map(x=>x.off?`<td rowspan="2" class="pr-off">${esc(x.off)}</td>`:span(x)?`<td rowspan="2">${lines(x.full)}</td>`:`<td>${lines(x.full.concat(x.am))}</td>`).join('');
  const pm=days.map(x=>span(x)?'':`<td>${lines(x.full.concat(x.pm))}</td>`).join('');
  return `<section class="pr-page">${prHead(title,sub)}<table class="pr-t pr-wk"><thead><tr><th class="pr-m"></th>${head}</tr></thead><tbody><tr><th class="pr-m">Avant-midi</th>${am}</tr><tr><th class="pr-m">Après-midi</th>${pm}</tr></tbody></table></section>`;
}
/* Pour qui on imprime : la classe ou l’enseignant choisi, sinon toutes les classes ; un enseignant ou un élève imprime le sien */
function printTargets(d){
  if(S.role==='student') return S.group?[{k:'g',id:S.group}]:[];
  if(S.role==='teacher') return S.teacher?[{k:'t',id:S.teacher}]:[];
  if(d.t) return [{k:'t',id:d.t}];
  return (d.g?[d.g]:groups().map(g=>g.id)).map(id=>({k:'g',id}));
}
function weekSheet(d){
  const mon=parse(d.week), items=weekItemsOf(mon), wk='Semaine du '+esc(prWeekLbl(mon));

    ?prWeekPage('Horaire · '+gName(t.id),wk+(principalOf(t.id)?' · Enseignant principal : '+esc(tName(principalOf(t.id))):''),items.filter(s=>s.grp===t.id),mon,'g',t.id)

/* Feuille de présences : une page par classe, les élèves en lignes, les séances de la semaine en colonnes.
   Les présences déjà prises y sont inscrites ; le reste est à cocher à la main. */
function attSheet(d){
  const mon=parse(d.week), tid=S.role==='teacher'?S.teacher:(d.t||''), wk='Semaine du '+esc(prWeekLbl(mon));
  const items=weekItemsOf(mon).filter(s=>s.kind==='cours'&&!s.cancelled&&!isActivity(s.c)&&(!tid||(s.tch||[]).includes(tid)));
  const gs=tid?groups().map(g=>g.id).filter(id=>items.some(s=>s.grp===id)):(d.g?[d.g]:groups().map(g=>g.id));
  return gs.map(gid=>{
    const ss=items.filter(s=>s.grp===gid).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start), els=studentsOf(gid);
    if(!ss.length||!els.length) return '';
    const th=ss.map(s=>{const dd=parse(s.date);return `<th class="c"><b>${esc(WD[dd.getDay()].slice(0,3))} ${dn(dd)}</b>${esc(momentShort(s))}<br>${esc((s.c.code||s.c.titre)+(sessLabel(s)?' '+sessLabel(s).replace(/^Cours /,''):''))}</th>`;}).join('');
    const rows=els.map(e=>`<tr><td class="n">${e.numero!=null&&e.numero!==''?esc(e.numero):''}</td><td class="nm">${esc(e.nom)}</td>${ss.map(s=>{const p=presDoc(s.key), v=p&&p.statuts&&p.statuts[e.id];return `<td class="c">${v&&LBL[v]?v:''}</td>`;}).join('')}<td></td></tr>`).join('');
    return `<section class="pr-page">${prHead('Feuille de présences · '+gName(gid),wk+(tid?' · '+esc(tName(tid)):''))}<table class="pr-t pr-att"><thead><tr><th class="n">N°</th><th class="nm">Élève</th>${th}<th>Remarques</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="pr-foot"><span>P : présent · A : absent · R : retard · M : absence motivée</span><span>Signature de l’enseignant : ______________________________</span></div></section>`;
  }).join('');
}
/* Relevé de résultats d’un élève */
function transcriptHTML(e){
  const B=examBoard(x=>x.grp===e.groupe), mine=B.items.filter(x=>x.past&&!x.rep&&x.res[e.id]).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);
  const ok=mine.filter(x=>resOk(x.res[e.id])).length, ko=mine.filter(x=>resKo(x.res[e.id])).length, kf=mine.filter(x=>resFail(x.res[e.id])).length, rate=ok+ko+kf?Math.round(ok/(ok+ko+kf)*100):null;
  const rows=mine.map(x=>{const dd=parse(x.date);return `<tr><td>${esc(shortDate(dd))} ${dd.getFullYear()}</td><td>${esc(x.c?(x.c.code?x.c.code+' ':'')+x.c.titre:'')}</td><td>${esc((x.e&&x.e.titre)||'Examen')}</td><td>${x.pct[e.id]!=null?esc(noteTxt(x.pct[e.id])):''}</td><td><b>${esc(RES[x.res[e.id]][1])}</b></td></tr>`;}).join('');
  return `<section class="pr-page">${prHead('Relevé de résultats',esc(e.nom)+(e.numero!=null&&e.numero!==''?' · n° '+esc(e.numero):'')+' · '+esc(gName(e.groupe)))}
    ${mine.length?`<table class="pr-t pr-res"><thead><tr><th style="width:17%">Date</th><th>Module</th><th style="width:20%">Examen</th><th style="width:11%">Note</th><th style="width:21%">Résultat</th></tr></thead><tbody>${rows}</tbody></table>`:'<p>Aucun résultat inscrit pour l’instant.</p>'}
    <p class="pr-sum">${pl(mine.length,'examen','examens')} · ${ok} ${ok>1?'réussis':'réussi'}${ko?` · ${ko} à reprendre`:''}${kf?` · ${pl(kf,'échec de module','échecs de module')}`:''}${rate!=null?` · ${rate} % de réussite`:''}</p>
    <div class="pr-sign"><span>Remis le ${esc(longDate(new Date()))}</span><span>Signature : ______________________________</span></div></section>`;
}
async function printDoc(title,body,land,file){
  const root=$('#print-root'), css=prCSS(land), t0=document.title;
  let shown=false, done=false;
  const clean=()=>{if(done)return;done=true;window.removeEventListener('afterprint',clean);document.title=t0;document.body.classList.remove('printing');root.innerHTML='';};
  const on=()=>{shown=true;};
  root.innerHTML=`<style>${css}</style><div class="pr-doc">${body}</div>`;
  document.body.classList.add('printing');document.title=title;
  window.addEventListener('beforeprint',on);window.addEventListener('afterprint',clean);
  try{window.print();}catch(e){}
  await new Promise(r=>setTimeout(r,350));
  window.removeEventListener('beforeprint',on);
  if(shown){setTimeout(clean,120000);return true;}
  clean();
  /* la fenêtre d’impression ne s’est pas ouverte : la feuille part en fichier */
  const ok=await saveFile(file+'.html',`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}body{margin:0}</style></head><body><div class="pr-doc">${body}</div></body></html>`);
  if(ok) toast('Ouvrez ce fichier, puis imprimez-le (Ctrl+P).');
  return ok;
}

const NV_TYPES={new:['ok','Nouveau'],up:['info','Amélioration'],fix:['warn','Correction']};
/* Ce qui a été vu : la clé du dernier push ouvert (date + numéro du push, car il y a souvent plusieurs pushes le même jour).
   Une ancienne valeur enregistrée est une date seule : tout ce jour-là compte comme vu. */
const nvKey=i=>NOUVEAUTES[i].date+'#'+String(NOUVEAUTES.length-i).padStart(3,'0');
const nvSeenKey=()=>{const s=S.nvSeen||'';return s&&!s.includes('#')?s+'#999':s;};
const nvLatest=()=>nvKey(0);
const nvUnseen=()=>NOUVEAUTES.reduce((n,v,i)=>n+(nvKey(i)>nvSeenKey()?v.items.length:0),0);
function newsPage(){
  const st=S.pg, f=NV_TYPES[st.nf]?st.nf:'', all=!!st.nall, byDate=st.nv==='date', N=NOUVEAUTES.length;
  if(st.since==null) st.since=nvSeenKey();
  // la pastille du menu disparaît dès qu’on a ouvert la page
  if(S.nvSeen!==nvLatest()){S.nvSeen=nvLatest();savePrefs();schedule();}
  const cnt={new:0,up:0,fix:0};let tot=0;for(const v of NOUVEAUTES)for(const it of v.items){cnt[it[0]]++;tot++;}
  const view=`<div class="seg" role="group" aria-label="Regrouper les changements">${[['','push','Par push'],['date','date','Par date']].map(([k,id,l])=>`<button type="button" id="nv-v-${id}" data-act="pg-set" data-k="nv" data-v="${k}" aria-pressed="${byDate===(k==='date')}">${l}</button>`).join('')}</div>`;
  const seg=`<div class="seg" role="group" aria-label="Filtrer">${[['','Tout',tot],['new','Nouvelles fonctions',cnt.new],['up','Améliorations',cnt.up],['fix','Corrections',cnt.fix]].map(([k,l,n])=>`<button type="button" id="nv-f-${k||'all'}" data-act="pg-set" data-k="nf" data-v="${k}" aria-pressed="${f===k}">${l} · ${n}</button>`).join('')}</div>`;
  const pages=new Set(NAV.admin.map(n=>n[0]));
  const row=([t,titre,texte,page])=>`<article class="nv-row"><span class="chip ${NV_TYPES[t][0]}">${NV_TYPES[t][1]}</span><div class="xm-t"><b>${esc(titre)}</b><small>${esc(texte)}</small></div><div class="xm-end">${page&&pages.has(page)&&page!=='nouveautes'?`<button class="btn sm" type="button" data-act="nav" data-page="${page}">Ouvrir</button>`:''}</div></article>`;
  /* Un bloc par push, ou un bloc par jour (les pushes du même jour réunis) */
  let groups;
  if(byDate){
    const m=new Map();
    NOUVEAUTES.forEach((v,i)=>{const g=m.get(v.date)||{date:v.date,items:[],n:0,fresh:false};g.items=g.items.concat(v.items);g.n++;if(nvKey(i)>st.since)g.fresh=true;m.set(v.date,g);});
    groups=[...m.values()];
  }else groups=NOUVEAUTES.map((v,i)=>({p:v,num:N-i,date:v.date,items:v.items,fresh:nvKey(i)>st.since}));
  /* avec un filtre, on garde seulement les blocs qui ont ce type de changement, puis on en montre les premiers */
  const vis=groups.map(g=>Object.assign({},g,{its:g.items.filter(it=>!f||it[0]===f)})).filter(g=>g.its.length);
  const lim=byDate?2:5, shown=all?vis:vis.slice(0,lim);
  const blocks=shown.map(g=>{
    const items=g.its;
    const d=parse(g.date), day=`${dayLabel(d)} ${d.getFullYear()}`, fresh=g.fresh?'<span class="chip exam">Depuis votre dernière visite</span>':'', n=`<span class="nv-n">${pl(items.length,'changement','changements')}</span>`;
    const link=g.p?(g.p.id?`<a href="${NV_REPO}/commit/${esc(g.p.id)}" target="_blank" rel="noopener" title="Voir ce push sur GitHub">${esc(g.p.id)}</a>`:`<a href="${NV_REPO}/commits/main" target="_blank" rel="noopener" title="Voir les pushes sur GitHub">le plus récent</a>`):'';
    const head=g.p?`<div class="xm-hd nv-hd nv-push"><span class="cl-num sm nv-num" title="Push n° ${g.num}">${g.num}</span><div class="nv-pt"><b>${esc(g.p.push)}</b><small>${esc(day)} · push ${link}</small></div>${fresh}${n}</div>`
      :`<div class="xm-hd nv-hd"><span>${esc(day)}</span>${g.n>1?`<span class="nv-k">${g.n} pushes</span>`:''}${fresh}${n}</div>`;
    return `<section class="cl-list nv-list" id="nv-${g.p?'p'+g.num:g.date}">${head}${items.map(row).join('')}</section>`;
  }).join('');
  const more=!all&&vis.length>lim?`<div class="row" style="margin-top:4px"><button class="btn" type="button" id="nv-more" data-act="pg-set" data-k="nall" data-v="1">${byDate?'Voir les jours précédents':`Voir les ${vis.length-lim} pushes précédents`}</button></div>`:'';
  return `<div class="toolbar">${view}${seg}</div>`+(blocks||'<section class="panel"><p class="help">Rien de ce type dans les dernières mises à jour.</p></section>')+more;
}

function keyDates(){
  const c=cfg(), out=[];
  if(c.debut) out.push({date:c.debut,label:'Premier jour de classe',chip:['ok','Rentrée']});
  for(const e of c.etapes||[]){if(e.du)out.push({date:e.du,label:'Début : '+(e.nom||'Étape'),chip:['info','Étape']});if(e.au)out.push({date:e.au,label:'Fin : '+(e.nom||'Étape'),chip:['info','Étape']});}
  for(const k of c.conges||[]) if(k.du) out.push({date:k.du,end:k.au&&k.au!==k.du?k.au:'',label:k.nom||'Congé',chip:['warn','Congé']});
  if(c.fin) out.push({date:c.fin,label:'Dernier jour de classe',chip:['ok','Fin']});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

function needProfiles(ids){
  if(!USER) return;
  const miss=[...new Set(ids)].filter(id=>id&&!PROF[id]&&!profAsk.has(id));
  if(!miss.length) return;
  miss.forEach(id=>profAsk.add(id));
  USER.profiles(miss).then(m=>{for(const [id,p] of Object.entries(m||{}))PROF[id]=p;schedule();}).catch(()=>{});
}
const initials=n=>String(n||'').trim().split(/\s+/).map(w=>(w.match(/\p{L}/u)||[''])[0]).filter(Boolean).slice(0,2).join('').toUpperCase()||'?';
const AV_COLORS=['#2C4F78','#7043A5','#146C62','#995D12','#A3326B','#1C7951'];
function avHTML(name,url,cls){
  if(url) return `<span class="av${cls?' '+cls:''}"><img src="${esc(url)}" alt=""></span>`;
  let h=0;for(const ch of String(name||''))h=(h*31+ch.charCodeAt(0))>>>0;
  return `<span class="av${cls?' '+cls:''}" style="background:${AV_COLORS[h%AV_COLORS.length]}" aria-hidden="true">${esc(initials(name))}</span>`;
}
const myAcct=()=>S.myAcct&&ROLES.includes(S.myAcct.role)?S.myAcct:null;
/* Un compte enseignant ou élève fixe le profil affiché ; le propriétaire et l’administration gardent le choix. */
const locked=()=>{const a=myAcct();return !!a&&a.role!=='admin'&&!S.isOwner;};
const acctForRole=()=>{const a=myAcct();return a&&a.role===S.role?a:null;};
const acctRec=a=>a.role==='student'?(byId(S.data.eleves,a.ref)||a.fiche||{}):(a.ref?(byId(S.data.enseignants,a.ref)||a.fiche||{}):(a.fiche||{}));
/* La personne affichée dans le menu et dans « Mon profil » : son compte, sinon l’aperçu choisi. */
function subject(){
  const a=acctForRole(), r=S.role;
  if(r==='teacher'){const id=a?a.ref:S.teacher, rec=byId(S.data.enseignants,id)||(a&&a.fiche)||null;return {a,id,rec,name:(rec&&rec.nom)||(a&&S.me.name)||'Enseignant'};}
  if(r==='student'){const id=a?a.ref:S.student, rec=byId(S.data.eleves,id)||(a&&a.fiche)||null;return {a,id,rec,name:(rec&&rec.nom)||(a&&S.me.name)||'Élève'};}
  const id=a?a.ref:'', rec=id?(byId(S.data.enseignants,id)||a.fiche||null):null;
  return {a,id,rec,name:(rec&&rec.nom)||S.me.name||'Administration'};
}
function ficheOf(role,ref,rec,dz){
  if(!ref) return {};
  if(role==='student'){const e=rec||byId(S.data.eleves,ref)||{};return {nom:e.nom||'',groupe:e.groupe||'',numero:e.numero==null?null:e.numero,fonction:e.fonction||'',naissance:e.naissance||'',parent:e.parent||'',courriel:e.courriel||'',telephone:e.telephone||''};}
  const p=rec||byId(S.data.enseignants,ref)||{}, z=dz||S.data.dossiers[ref]||{};
  return {nom:p.nom||'',fonction:p.fonction||'',statut:p.statut||'',courriel:p.courriel||'',telephone:z.telephone||''};
}

async function syncFiches(ref,rec,dz){
  for(const a of S.data.comptes.filter(x=>x.ref===ref)){
    try{await col('comptes').doc(a.id).update({fiche:ficheOf(a.role,ref,rec,dz),maj:new Date().toISOString()});}catch(e){}

}

/* Rôle et fiche proposés pour une demande : la fiche d’élève ou du personnel qui porte le même nom */
function guessAcct(x){
  const s=guessRef('student',x);if(s)return {role:'student',ref:s};
  const t=guessRef('teacher',x);if(t){const p=byId(S.data.enseignants,t);return {role:p&&!isTeacher(p)?'admin':'teacher',ref:t};}
  return {role:'student',ref:''};
}
function guessRef(role,x){
  const same=(a,b)=>collator.compare(String(a||'').trim(),String(b||'').trim())===0;
  if(role==='student'){const e=S.data.eleves.find(e=>same(e.nom,x.nom));return e?e.id:'';}
  const p=S.data.enseignants.find(p=>same(p.nom,x.nom));return p?p.id:'';
}

async function saveAccount(){
  const d=S.dr, f=d.draft;if(S.busy)return;
  if(!f.uid){d.err='Choisissez la personne à relier.';renderDrawer();return;}
  if(f.role!=='admin'&&!f.ref){d.err=f.role==='student'?'Choisissez la fiche de l’élève.':'Choisissez la fiche de l’enseignant.';renderDrawer();return;}
  const o=byId(S.data.comptes,f.uid);
  if(o&&o.id!==d.id&&!d.over){d.over=true;d.err=`Cette personne a déjà un compte (${ROLE_LBL[o.role]}). Enregistrez de nouveau pour le remplacer.`;renderDrawer();return;}
  const doc={role:f.role,ref:f.ref||'',fiche:ficheOf(f.role,f.ref),maj:new Date().toISOString()};
  S.busy=true;d.err='';renderDrawer();
  const ok=await write(async()=>{await col('comptes').doc(f.uid).set(doc);if(d.id&&d.id!==f.uid)await col('comptes').doc(d.id).delete();if(d.demande&&d.demande.id===f.uid)await col('demandes').doc(f.uid).update({statut:'approuvée',traitee:new Date().toISOString()});},d.demande?'Demande approuvée':d.id?'Compte enregistré':'Compte créé');
  S.busy=false;if(ok&&S.dr===d)S.dr=null;render();
}

  if(a&&el.contains(a)&&a.id){fid=a.id;try{sel=[a.selectionStart,a.selectionEnd];}catch(e){sel=null;}}
  if(same) el.querySelectorAll('input[id],textarea[id]').forEach(i=>{if(!i.dataset.f&&i.type!=='radio'&&i.type!=='checkbox')vals[i.id]=i.value;});
  const st=el.scrollTop;
  el.innerHTML=html;el._h=html;el._k=key;
  for(const [id,v] of Object.entries(vals)){const i=document.getElementById(id);if(i&&el.contains(i))i.value=v;}
  if(same) el.scrollTop=st;
  if(fid){const f=document.getElementById(fid);if(f&&el.contains(f)){f.focus({preventScroll:true});if(sel&&sel[0]!=null){try{f.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
}

function measureCards(el){
  const cards=new Map();

function glide(el,b,keepH){
  const w=el.querySelector('.week');
  if(w&&b.h!=null&&!keepH){
    const h=w.getBoundingClientRect().height;
    if(Math.abs(h-b.h)>2){
      w.style.height=b.h+'px';w.style.overflow='hidden';w.getBoundingClientRect();
      w.style.transition='height 240ms ease-out';w.style.height=h+'px';
      const done=()=>{w.style.height='';w.style.overflow='';w.style.transition='';};
      w.addEventListener('transitionend',done,{once:true});setTimeout(done,340);
    }
  }
  el.querySelectorAll('.cc[data-key]').forEach(n=>{
    const r0=b.cards.get(n.dataset.key);
    if(!r0){n.classList.add('enter');return;}
    const r=n.getBoundingClientRect(), dx=r0.left-r.left, dy=r0.top-r.top;
    if(Math.abs(dx)<1&&Math.abs(dy)<1) return;

    n.style.transition='transform 240ms ease-out';n.style.transform='';
    const clear=()=>{n.style.transition='';};
    n.addEventListener('transitionend',clear,{once:true});setTimeout(clear,340);
  });
}

function conflicts(f,selfId){
  const out=[];
  for(const sl of f.creneaux){
    const a=toMin(sl.debut),b=toMin(sl.fin);if(isNaN(a)||isNaN(b))continue;
    for(const c of S.data.cours){
      if(c.id===selfId)continue;
      const sameG=f.groupe&&c.groupe===f.groupe, sameT=f.enseignant&&c.enseignant===f.enseignant;
      if(!sameG&&!sameT)continue;
      for(const s2 of activeSlots(c)){
        if(+s2.jour!==+sl.jour)continue;
        const x=toMin(s2.debut),y=toMin(s2.fin);
        if(a<y&&x<b) out.push(`${DAYS[sl.jour-1]} ${momentIn(a,b)} : ${sameG?`${gName(f.groupe)} a déjà ${c.titre}`:`${tName(f.enseignant)} donne déjà ${c.titre} (${gName(c.groupe)})`}`);
      }
    }
  }
  return [...new Set(out)];
}

  const doc={titre:f.titre.trim(),code:f.code.trim().toUpperCase(),couleur:+f.couleur||0,groupe:f.groupe,enseignant:f.enseignant,salle:f.salle.trim(),du:f.du,au:f.au,heures:f.heures===''||f.heures==null?null:Math.max(0,Math.round(+f.heures))||null,

  S.busy=false;
  if(ok&&S.dr===d) S.dr=null;
  render();
}

function commonPeriod(){

}
function periodOptions(extra){

const courseDoc=c=>{const o=JSON.parse(JSON.stringify(c));delete o.id;delete o.ens0;delete o.seances;o.annulees=o.annulees||[];o.extras=o.extras||[];o.creneaux=o.creneaux||[];return o;};
/* ---------- Séances : chaque séance d’une classe s’enregistre à part, dans cours/<id>.seances = { idSéance: {…} }.
   Deux personnes peuvent ainsi modifier deux séances du même module sans s’écraser.
   L’ancien tableau « extras » reste lu ; en mémoire, c.extras est toujours la liste des séances du cours. ---------- */
let RAWC=[];
function normCours(raw){
  const ch=new Map(comps().filter(k=>k.charge).map(k=>[+k.code,k.charge]));
  return raw.map(r=>{
    const c=Object.assign({},r), m=new Map();
    for(const x of r.extras||[]) if(x&&x.id) m.set(x.id,x);
    for(const [id,v] of Object.entries(r.seances||{})){
      if(!v){m.delete(id);continue;}
      const o=Object.assign({},m.get(id),v,{id});
      for(const k of Object.keys(o)) if(o[k]===null) delete o[k];
      m.set(id,o);
    }
    c.extras=[...m.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.debut).localeCompare(String(b.debut)));
    delete c.seances;
    /* Le chargé de cours du module donne ses séances à toutes les classes */
    const t=ch.get(modKey(r));
    if(t){c.ens0=r.enseignant||'';c.enseignant=t;}
    return c;
  });
}
/* Écrit seulement ce qui a changé dans cours/<id> : une séance ajoutée, modifiée ou retirée part seule */
const xBody=(x,old)=>{const o=Object.assign({},x);delete o.id;if(old)for(const k of Object.keys(old))if(k!=='id'&&!(k in o))o[k]=null;return o;};
function putCours(id,doc){
  const c0=byId(S.data.cours,id), same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  if(!c0){const o=Object.assign({},doc);delete o.id;delete o.ens0;o.seances={};for(const x of doc.extras||[])o.seances[x.id]=xBody(x);delete o.extras;return col('cours').doc(id).set(o);}
  const p={}, a=new Map((c0.extras||[]).map(x=>[x.id,x])), b=new Map((doc.extras||[]).map(x=>[x.id,x])), sx={};
  for(const k of Object.keys(doc)) if(k!=='extras'&&k!=='seances'&&k!=='id'&&k!=='ens0'&&!same(doc[k],c0[k])) p[k]=doc[k];
  for(const [xid,x] of b) if(!a.has(xid)||!same(a.get(xid),x)) sx[xid]=xBody(x,a.get(xid));
  for(const xid of a.keys()) if(!b.has(xid)) sx[xid]=null;
  if(Object.keys(sx).length) p.seances=sx;
  return Object.keys(p).length?col('cours').doc(id).update(p):Promise.resolve();
}
function moveSlotWeekly(cr,sid,jour,debut,fin,eff){
  const i=cr.findIndex(s=>s.id===sid);if(i<0)return cr;
  const s=cr[i];
  if(s.du&&s.du>=eff){cr[i]=Object.assign({},s,{jour,debut,fin});return cr;}
  const end=iso(addDays(parse(eff),-1));
  cr[i]=Object.assign({},s,{au:end});
  const n={id:slotId(),jour,debut,fin,salle:s.salle||'',du:eff};if(s.au)n.au=s.au;
  cr.push(n);
  return cr;
}
function moveOnce(doc,s,date,debut,fin){
  if(s.extra){
    const x=doc.extras.find(e=>e.id===s.extra.id);if(!x)return;
    if(x.de){const [od,osid]=x.de.split('@'),orig=doc.creneaux.find(e=>e.id===osid);
      if(orig&&od===date&&orig.debut===debut&&orig.fin===fin){doc.extras=doc.extras.filter(e=>e.id!==x.id);doc.annulees=doc.annulees.filter(t=>t!==x.de);return;}}
    Object.assign(x,{date,debut,fin});return;
  }
  const tag=`${s.date}@${s.sl.id}`;
  if(!doc.annulees.includes(tag)) doc.annulees.push(tag);
  doc.extras.push({id:'x'+Math.random().toString(36).slice(2,8),date,debut,fin,salle:s.sl.salle||'',de:tag});
}
async function applyMove(){
  const d=S.dr;if(!d||S.busy)return;

  if(!s||(d.swapKey&&!t))return;
  const [deb,fin]=d.time.split('-');
  if(!t&&d.toDate===s.date&&deb===s.sl.debut&&fin===s.sl.fin){d.err='Choisissez un autre jour ou une autre heure.';renderDrawer();return;}
  const docs=new Map(), get=c=>{if(!docs.has(c.id))docs.set(c.id,courseDoc(c));return docs.get(c.id);};
  const prev=new Map();
  for(const c of [s.c,t&&t.c].filter(Boolean)) prev.set(c.id,courseDoc(c));
  const weekly=d.scope==='weekly'&&!s.extra&&(!t||!t.extra);
  const jourOf=ds=>(parse(ds).getDay()+6)%7+1, eff=iso(monday(parse(s.date)));
  if(t){
    if(weekly){
      const ds=get(s.c);ds.creneaux=moveSlotWeekly(ds.creneaux,s.sl.id,jourOf(t.date),t.sl.debut,t.sl.fin,eff);
      const dt=get(t.c);dt.creneaux=moveSlotWeekly(dt.creneaux,t.sl.id,jourOf(s.date),s.sl.debut,s.sl.fin,eff);
    }else{
      moveOnce(get(s.c),s,t.date,t.sl.debut,t.sl.fin);
      moveOnce(get(t.c),t,s.date,s.sl.debut,s.sl.fin);
    }
  }else if(weekly){const dc=get(s.c);dc.creneaux=moveSlotWeekly(dc.creneaux,s.sl.id,jourOf(d.toDate),deb,fin,eff);}
  else moveOnce(get(s.c),s,d.toDate,deb,fin);
  S.busy=true;renderDrawer();
  const ok=await write(async()=>{for(const [id,doc] of docs) await putCours(id,doc);});
  S.busy=false;
  if(ok){
    if(S.dr===d) S.dr=null;
    const what=t?`${sObj(s)} ⇄ ${sObj(t)}`:`${sObj(s)} → ${dayLabel(parse(d.toDate)).toLowerCase()}, ${momentIn(toMin(deb),toMin(fin)).replace(/^en /,'')}`;
    logEv('horaire',t?W('a échangé deux séances','a échangé deux cours'):W('a déplacé la séance','a déplacé le cours'),what);
    toast(t?W('Séances échangées','Cours échangés'):W('Séance déplacée','Cours déplacé'),null,{label:'Annuler',fn:async()=>{if(await write(async()=>{for(const [id,doc] of prev) await putCours(id,doc);},'Changement annulé'))logEv('horaire','a annulé son changement',what);}});
  }
  render();
}

async function saveExam(force){
  const d=S.dr, f=d.draft;if(S.busy)return;
  const err=m=>{d.err=m;renderDrawer();};
  if(d.sess){
    const x=allExamItems().find(k=>k.key===d.sess);if(!x) return err('Cet examen n’existe plus.');
    const res={};
    for(const el of studentsOf(x.grp)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
    S.busy=true;d.err='';renderDrawer();
    const ok=await writeResults(x,res,'Résultats enregistrés',f.pct||{});
    S.busy=false;if(ok&&S.dr===d)S.dr=null;render();return;
  }
  if(S.role==='teacher'&&!f.cours) return err('Choisissez le cours visé par l’examen.');
  if(!f.groupe) return err('Choisissez la classe qui passe l’examen.');
  if(!f.date) return err('Indiquez la date de l’examen.');
  const j=parse(f.date).getDay();
  if(j===0||j===6) return err('L’examen tombe une fin de semaine.');
  const off=offDay(f.date);
  if(off) return err(`Le ${dn(parse(f.date))} ${fMonth.format(parse(f.date))} n’est pas un jour de classe (${off}).`);
  const a=toMin(f.debut),b=toMin(f.fin);
  if(isNaN(a)||isNaN(b)) return err('Indiquez l’heure de début et de fin.');
  if(b<=a) return err('L’examen se termine avant de commencer.');
  if(!force){
    const w=S.data.examens.filter(x=>!x.seance&&x.id!==d.id&&x.date===f.date&&x.groupe===f.groupe&&toMin(x.debut)<b&&a<toMin(x.fin)).map(x=>`${gName(f.groupe)} a déjà « ${x.titre||'un examen'} » ${momentIn(toMin(x.debut),toMin(x.fin))}.`);
    if(w.length){d.warn=w;d.err='';renderDrawer();return;}
  }
  const res={};for(const el of studentsOf(f.groupe)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
  const doc={cours:f.cours,groupe:f.groupe,titre:f.titre.trim()||'Examen',date:f.date,debut:f.debut,fin:f.fin,salle:f.salle.trim(),surveillant:f.surveillant,notes:f.notes.trim(),maj:new Date().toISOString()};
  const id=d.id||genId('x');
  S.busy=true;d.err='';renderDrawer();
  const prevX=d.id?byId(S.data.examens,d.id):null;
  if(prevX&&prevX.exemple) doc.exemple=true;
  let ok=await write(()=>col('examens').doc(id).set(doc),d.id?'Examen enregistré':'Examen planifié');
  if(ok&&(Object.keys(res).length||Object.keys(examResOf(examItem(Object.assign({id},prevX||doc)))).length)) ok=await writeResults(examItem(Object.assign({},prevX||{},doc,{id})),res,'',f.pct||{});
  S.busy=false;
  if(ok&&S.dr===d) S.dr=null;
  render();
}

}

/* ---------- Fiches en pleine page (élèves et personnel) ----------
   Une liste à gauche pour passer d’une personne à l’autre, « Précédent / Suivant » (ou ← →),
   et « Retour à la liste » (ou Échap) qui revient à l’endroit où l’on était. */
const studentList=()=>{
  const q=String(S.pg.q||'').trim().toLowerCase(), g=S.pg.g||'';
  let els=sortElsByClass(S.data.eleves);
  if(g) els=els.filter(e=>e.groupe===g);
  if(q) els=els.filter(e=>String(e.nom||'').toLowerCase().includes(q));
  return els;
};
function openFiche(page,id){
  const from=S.page===page?(S.pg.from||null):S.page;
  if(S.page!==page){
    S.page=page;S.pg={};
    if(page==='eleves'){const e=byId(S.data.eleves,id);if(e&&from==='classes')S.pg.g=e.groupe;}
    if(page==='eleves'||page==='classes')ensureTerm();
  }else if(!S.pg.fiche) S.pg.listY=window.scrollY;
  S.pg.fiche=id;S.pg.from=from;S.dr=null;
  render();window.scrollTo({top:0});
}
function closeFiche(){
  const from=S.pg.from, y=S.pg.listY||0;
  if(from&&from!==S.page){goPage(from);return;}
  S.pg.fiche=null;render();window.scrollTo({top:y});
}
function ficheStep(d){
  const list=S.page==='eleves'?studentList():S.page==='classes'?groups():S.page==='modules'?modList():staff(), i=list.findIndex(x=>x.id===S.pg.fiche), n=list[i+d];
  if(n){S.pg.fiche=n.id;render();window.scrollTo({top:0});const b=$(d<0?'#fi-prev':'#fi-next');if(b&&!b.disabled)b.focus({preventScroll:true});}
}
const ageOf=d=>{if(!d)return null;const b=parse(d),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))a--;return a>=0&&a<120?a:null;};
const acctOfRef=id=>S.data.comptes.find(a=>a.ref===id&&!a.exemple)||S.data.comptes.find(a=>a.ref===id)||null;
function ficheShell(kind,list,cur,listItem,head,tabs,content){
  const i=list.findIndex(x=>x.id===cur.id), prev=list[i-1], next=list[i+1];
  const from=S.pg.from&&S.pg.from!==S.page?S.pg.from:null;
  const backLbl=from==='classes'?'Retour aux classes':kind==='eleves'?'Retour à la liste des élèves':kind==='classes'?'Retour aux classes':kind==='modules'?'Retour aux modules':'Retour à la liste du personnel';
  const filt=kind==='eleves'?`<div class="fl-tools"><input class="search" id="s-q" type="search" placeholder="Rechercher" aria-label="Rechercher un élève" autocomplete="off" value="${esc(S.pg.q||'')}"><select id="s-g" aria-label="Classe"><option value="">Toutes les classes</option>${groups().map(x=>`<option value="${esc(x.id)}"${S.pg.g===x.id?' selected':''}>${esc(x.nom)}</option>`).join('')}</select></div>`:'';
  const nav=`<div class="fiche-nav"><button class="btn sm" type="button" id="fi-back" data-act="fi-back">${icon('left')}${backLbl}</button><span class="grow"></span>
    ${i>=0?`<span class="muted sm">${i+1} sur ${list.length}</span>`:''}
    <button class="btn sm" type="button" id="fi-prev" data-act="fi-step" data-d="-1"${prev?` title="${esc(prev.nom)} (←)"`:' disabled'}>${icon('left')}<span class="fi-lbl">${prev?esc(prev.nom):'Précédent'}</span></button>
    <button class="btn sm" type="button" id="fi-next" data-act="fi-step" data-d="1"${next?` title="${esc(next.nom)} (→)"`:' disabled'}><span class="fi-lbl">${next?esc(next.nom):'Suivant'}</span>${icon('right')}</button></div>`;
  const tab=S.pg.tab&&tabs.some(t=>t[0]===S.pg.tab)?S.pg.tab:tabs[0][0];
  const tabBar=`<div class="seg fiche-tabs" role="group" aria-label="Sections de la fiche">${tabs.map(([k,l])=>`<button type="button" id="fi-tab-${k}" data-act="fi-tab" data-v="${k}" aria-pressed="${k===tab}">${l}</button>`).join('')}</div>`;
  return `<div class="fiche"><aside class="fiche-list" aria-label="${kind==='eleves'?'Élèves':kind==='classes'?'Classes':kind==='modules'?'Modules':'Personnel'}">${filt}<ul>${list.map(x=>`<li><button type="button" class="fl-item" id="fl-${esc(x.id)}" data-act="${kind==='eleves'?'student':kind==='classes'?'class':kind==='modules'?'module':'staff'}" data-id="${esc(x.id)}" aria-current="${x.id===cur.id}">${listItem(x)}</button></li>`).join('')||'<li class="muted sm" style="padding:12px">Aucun résultat.</li>'}</ul></aside>
    <div class="fiche-main">${nav}${head}${tabBar}<div class="fiche-body">${content(tab)}</div></div></div>`;
}
/* Compte de la personne, affiché dans l’en-tête de sa fiche */
function acctChip(id){
  const a=acctOfRef(id);
  if(!a) return '<span class="chip off" id="fi-acct-chip" title="La personne ne peut pas encore se connecter à son horaire.">Sans compte</span>';
  const p=a.exemple?null:profOf(a.id);
  if(!a.exemple) needProfiles([a.id]);
  const who=a.exemple?'compte d’exemple':((p&&p.name)||(siteMode()?'compte du site':'accès claude.ai'));
  return `<span class="chip ok" id="fi-acct-chip" title="${esc('Compte '+ROLE_LBL[a.role]+(a.maj?' · mis à jour le '+longDate(new Date(a.maj)):''))}">Compte ${esc(ROLE_LBL[a.role].toLowerCase())} · ${esc(who)}</span>`;
}
function acctBtn(id,role){
  const a=acctOfRef(id);
  return a?`<button class="btn sm" type="button" id="fi-acct-btn" data-act="ac-edit" data-id="${esc(a.id)}">Modifier le compte</button>`
    :`<button class="btn sm" type="button" id="fi-acct-btn" data-act="fi-acct" data-role="${role}" data-id="${esc(id)}"${dis()}>${icon('plus')}Créer son compte</button>`;
}

/* En-tête : identité, actions, puis quelques chiffres clés */
const ficheHead=(name,chips,actions,stats,av)=>`<section class="panel fiche-head"><div class="fh-top">${av||avHTML(name,'','lg')}<div class="prof-id"><h2 id="fi-name">${esc(name)}</h2>${chips?`<div class="prof-chips">${chips}</div>`:''}</div><div class="fiche-act">${actions}</div></div>
  <dl class="fh-stats">${stats.map(([k,v,cls])=>`<div><dt>${k}</dt><dd${cls?` class="${cls}"`:''}>${v}</dd></div>`).join('')}</dl></section>`;
const rows=items=>items.length?`<ul class="plist">${items.join('')}</ul>`:'';

function studentFiche(){
  const e=byId(S.data.eleves,S.pg.fiche);
  if(!e){S.pg.fiche=null;return studentsPage();}
  ensureTerm(yearStart());
  const list=studentList(), s=studentStats(yearStart(),todayISO())[e.id], r=rateOf(s), age=ageOf(e.naissance);
  const up=upcomingExams(x=>x.grp===e.groupe,6), nextEx=up[0];
  const item=x=>`<span class="fl-name">${esc(x.nom)}</span><span class="fl-sub">${esc(gName(x.groupe))}${x.numero?` · n° ${esc(x.numero)}`:''}</span>`;
  const chips=`<span class="chip">${esc(gName(e.groupe))}</span>${e.numero?`<span class="chip off">n° ${esc(e.numero)}</span>`:''}${e.fonction?`<span class="role-chip">${esc(e.fonction)}</span>`:''}${acctChip(e.id)}`;
  const actions=`<button class="btn sm primary" type="button" id="fi-edit" data-act="st-edit" data-id="${esc(e.id)}">Modifier le dossier</button>${e.groupe?`<button class="btn sm" type="button" data-act="see-group" data-id="${esc(e.groupe)}">Horaire de la classe</button>`:''}${acctBtn(e.id,'student')}`;
  const loaded=S.termLoaded, n=s?s.n:0;
  const stats=[
    ['Présence',!loaded?'…':n?`${r} %`:'—',n?(r>=95?'ok':r>=90?'warn':'bad'):''],
    ['Absences',!loaded?'…':String(s?s.A+s.M:0),s&&s.A?'bad':''],
    ['Retards',!loaded?'…':String(s?s.R:0),s&&s.R?'warn':''],
    ['Prochain examen',nextEx?esc(`${dn(parse(nextEx.date))} ${fMonthS.format(parse(nextEx.date))}`):'Aucun','']
  ];
  const head=ficheHead(e.nom,chips,actions,stats);
  const content=tab=>{
    if(tab==='presences'){
      if(!loaded) return '<section class="panel"><p class="help">Chargement des présences…</p></section>';
      const log=s?s.log.slice().sort((a,b)=>b.date.localeCompare(a.date)):[];
      const byC={};
      for(const p of Object.values(S.data.presTerm)){const v=p&&p.statuts&&p.statuts[e.id];if(!v||!LBL[v])continue;const x=byC[p.cours]||(byC[p.cours]={P:0,A:0,R:0,M:0,n:0});x[v]++;x.n++;}
      const per=Object.entries(byC).map(([cid,x])=>({c:byId(S.data.cours,cid),x})).sort((p,q)=>collator.compare(p.c?p.c.titre:'',q.c?q.c.titre:''));
      return `<div class="fiche-two"><section class="panel"><h2>Absences et retards</h2>${log.length?rows(log.map(x=>{const c=byId(S.data.cours,x.cours);return `<li><span>${esc(dayLabel(parse(x.date)))}<span class="muted sm"> · ${esc(c?c.titre:'Cours')}</span></span><span class="chip ${CHIP[x.v]}">${LBL[x.v]}</span></li>`;})):'<p class="help">Aucune absence ni aucun retard depuis la rentrée.</p>'}</section>
        <section class="panel"><h2>${W('Par module','Par cours')}</h2>${per.length?rows(per.map(({c,x})=>{const rr=pct(x.P+x.R,x.n);return `<li><span>${esc(c?c.titre:W('Module supprimé','Cours supprimé'))}</span><span class="chip ${rr>=95?'ok':rr>=90?'warn':'bad'}">${rr} %</span></li>`;})):`<p class="help">${W('Aucune séance notée','Aucun cours noté')} pour l’instant.</p>`}
        <p class="help" style="margin-top:10px">${n?`${pl(n,W('séance notée','cours noté'),W('séances notées','cours notés'))} depuis le ${esc(longDate(parse(yearStart())))}.`:''}</p></section></div>`;
    }
    if(tab==='examens') return studentExamsTab(e);
    if(tab==='equipement') return skStudentTab(e);
    return `<section class="panel"><dl class="facts facts3">
      <div><dt>Enseignant principal</dt><dd>${principalOf(e.groupe)?esc(tName(principalOf(e.groupe))):'<span class="muted">—</span>'}</dd></div>
      <div><dt>Date de naissance</dt><dd>${e.naissance?esc(longDate(parse(e.naissance)))+(age!=null?` <span class="muted">(${age} ans)</span>`:''):'<span class="muted">—</span>'}</dd></div>
      <div><dt>Contact d’urgence</dt><dd>${e.parent?esc(e.parent):'<span class="muted">—</span>'}</dd></div>
      <div><dt>Téléphone</dt><dd>${e.telephone?`<a href="tel:${esc(String(e.telephone).replace(/\s+/g,''))}">${esc(e.telephone)}</a>`:'<span class="muted">—</span>'}</dd></div>
      <div><dt>Courriel</dt><dd>${e.courriel?`<a href="mailto:${esc(e.courriel)}">${esc(e.courriel)}</a>`:'<span class="muted">—</span>'}</dd></div>
      <div class="wide"><dt>Suivi</dt><dd>${e.notes?`<span class="pre">${esc(e.notes)}</span>`:'<span class="muted">Aucune note.</span>'}</dd></div></dl></section>`;
  };
  return ficheShell('eleves',list,e,item,head,[['dossier','Dossier'],['presences','Présences'],['examens','Examens'],['equipement','Équipement']],content);
}

function staffFiche(){
  const p=byId(S.data.enseignants,S.pg.fiche);
  if(!p){S.pg.fiche=null;return staffPage();}
  const list=staff(), z=S.data.dossiers[p.id]||{}, st=statOf(p), teach=isTeacher(p);
  const item=x=>{const pc=principalClasses(x.id);return `<span class="fl-name">${esc(x.nom)}</span><span class="fl-sub">${esc(x.fonction||'Enseignant')}${pc.length?` · principal ${esc(pc.map(g=>g.nom.replace(/^(Classe|Groupe)\s+/i,'')).join(', '))}`:''}</span>`;};
  const cs=S.data.cours.filter(c=>c.enseignant===p.id).sort((x,y)=>collator.compare(gName(x.groupe),gName(y.groupe))||collator.compare(x.titre,y.titre));
  const byG={};for(const c of cs)(byG[c.groupe]=byG[c.groupe]||[]).push(c);

  const chips=`<span class="chip">${esc(p.fonction||'Enseignant')}</span>${principalClasses(p.id).map(g=>`<span class="chip k0">Enseignant principal · ${esc(g.nom)}</span>`).join('')}<span class="chip ${STATUTS[st]||'off'}">${esc(st)}</span>${acctChip(p.id)}`;
  const actions=`<button class="btn sm primary" type="button" id="fi-edit" data-act="sf-edit" data-id="${esc(p.id)}">Modifier le dossier</button>${teach?`<button class="btn sm" type="button" data-act="see-teacher" data-id="${esc(p.id)}">Son horaire</button>`:''}${acctBtn(p.id,p.fonction&&!teach?'admin':'teacher')}`;
  const stats=teach?[['Modules',String(acad()?new Set(cs.map(modKey).filter(x=>x!=null)).size:cs.length),''],['Classes',String(Object.keys(byG).length),''],['Cette semaine',pl(wk.length,W('séance','cours'),W('séances','cours')),''],['Présences à prendre',String(late),late?'warn':'']]
    :[['Statut',esc(st),''],['Courriel',p.courriel?esc(p.courriel):'—','']];
  const head=ficheHead(p.nom,chips,actions,stats);
  const SCH={P:'ok',A:'bad',C:'warn',F:'info'};
  const tabs=[['dossier','Dossier']].concat(teach?[['cours',acad()?'Modules':'Cours'],['competences','Compétences et disponibilités']]:[],[['travail','Présences au travail']]);
  const content=tab=>{
    if(tab==='competences'){
      const mine=new Set((p.competences||[]).map(Number)), can=isAdmin()&&S.conn==='shared';
      return `<section class="panel"><h2>Compétences</h2><p class="help" style="margin-bottom:10px">Les modules que ${esc(p.nom)} peut donner. Les séances à pourvoir lui sont proposées selon cette liste.</p>
          ${comps().length?`<form data-form="sf-comp" data-id="${esc(p.id)}"><div class="ck-grid">${comps().map(k=>`<label class="ck"><input type="checkbox" name="comp" value="${esc(k.code)}"${mine.has(+k.code)?' checked':''}${can?'':' disabled'}><span><b>M${esc(k.code)}</b> ${esc(k.nom)}</span></label>`).join('')}</div>
          ${can?`<div class="row" style="margin-top:12px"><button class="btn primary" type="submit"${dis()}>Enregistrer les compétences</button><button class="btn sm ghost" type="button" data-act="sf-comp-all" data-v="1">Tout cocher</button><button class="btn sm ghost" type="button" data-act="sf-comp-all" data-v="">Tout décocher</button></div>`:''}</form>`:'<p class="help">Créez d’abord les modules du programme dans le menu Modules.</p>'}</section>
        <section class="panel dp-panel" style="margin-top:14px"><h2>Disponibilités</h2>${dispoCalHTML(p.id,can)}</section>`;
    }
    if(tab==='cours'){
      const og=S.pg.og||{}, nx=nextSession(x=>x.tch.includes(p.id)), surv=upcomingExams(x=>x.e&&x.e.surveillant===p.id,5);
      const myMods=acad()?comps().filter(k=>k.charge===p.id):[];
      const modsHTML=myMods.length?`<ul class="plist" id="sf-mods">${myMods.map(k=>`<li><button class="link" type="button" data-act="module" data-id="${esc(k.code)}"><span class="muted">M${esc(k.code)}</span> ${esc(k.nom)}</button><span class="muted sm">${pl(new Set(modCourses(k.code).map(c=>c.groupe)).size,'classe','classes')}${modTot(k)?' · '+modTot(k)+' h':''}</span></li>`).join('')}</ul>`:'';
      const lst=acad()?cs.filter(isActivity):cs, byL={};for(const c of lst)(byL[c.groupe]=byL[c.groupe]||[]).push(c);
      const groupsHTML=lst.length?`<ul class="cg-list">${Object.entries(byL).sort((x,y)=>collator.compare(gName(x[0]),gName(y[0]))).map(([g,arr])=>{const h=arr.reduce((t,c)=>t+heuresOf(c),0), open=!!og[g];
        return `<li><button type="button" class="cg-head" id="cg-${esc(g)}" data-act="fi-og" data-g="${esc(g)}" aria-expanded="${open}"><span><b>${esc(gName(g))}</b><span class="muted sm"> · ${acad()?pl(arr.length,'activité','activités'):pl(arr.length,'cours','cours')}${h?` · ${h} h prévues`:''}</span></span>${icon('right')}</button>
        ${open?`<ul class="plist cg-body">${arr.map(c=>`<li><button class="link" type="button" data-act="edit-course" data-id="${esc(c.id)}">${c.code?`<span class="muted">${esc(c.code)}</span> `:''}${esc(c.titre)}</button><span class="muted sm">${heuresOf(c)?heuresOf(c)+' h':''}</span></li>`).join('')}</ul>`:''}</li>`;}).join('')}</ul>`:acad()?'':'<p class="help">Aucun cours assigné.</p>';
      return `<div class="fiche-two"><section class="panel">${acad()?`<h2>Chargé de cours</h2>${modsHTML||'<p class="help" id="sf-nomods">Chargé de cours d’aucun module.</p>'}${groupsHTML?`<h3 class="fiche-h3">Activités par classe</h3>${groupsHTML}`:''}`:`<h2>Cours par classe</h2>${groupsHTML}`}</section>
        <section class="panel"><h2>À venir</h2><p class="help">${nx?`${W('Prochaine séance','Prochain cours')} : <b>${esc(nx.s.c.titre)}</b> (${esc(gName(nx.s.c.groupe))}), ${esc(dayLabel(parse(nx.s.date)).toLowerCase())}, ${momentIn(nx.s.start,nx.s.end).replace(/^en /,'')}.`:W('Aucune séance prévue prochainement.','Aucun cours prévu prochainement.')}</p>

    }
    const emb=z.embauche?parse(z.embauche):null, yrs=emb?Math.floor((Date.now()-emb.getTime())/(365.25*864e5)):null;
    return `<section class="panel"><dl class="facts facts3">
      <div><dt>Courriel</dt><dd>${p.courriel?`<a href="mailto:${esc(p.courriel)}">${esc(p.courriel)}</a>`:'<span class="muted">—</span>'}</dd></div>
      <div><dt>Téléphone</dt><dd>${z.telephone?`<a href="tel:${esc(String(z.telephone).replace(/\s+/g,''))}">${esc(z.telephone)}</a>`:'<span class="muted">—</span>'}</dd></div>
      <div><dt>Date d’embauche</dt><dd>${emb?esc(longDate(emb))+(yrs!=null&&yrs>=1?` <span class="muted">(${pl(yrs,'an','ans')})</span>`:''):'<span class="muted">—</span>'}</dd></div>
      <div class="wide"><dt>Remarques</dt><dd>${z.notes?`<span class="pre">${esc(z.notes)}</span>`:'<span class="muted">Aucune remarque.</span>'}</dd></div></dl></section>`;
  };
  return ficheShell('personnel',list,p,item,head,tabs,content);
}

/* ---------- Heures enseignées : par enseignant et par mois, pour la paie des instructeurs ----------
   Une séance compte une fois qu’elle a eu lieu (passée, non annulée), pour chaque enseignant qui y était attribué
   et qui n’était pas marqué absent ce jour-là. */
function taughtRows(){
  const out=[];
  for(const s of sessionsBetween(yearStart(),todayISO())){
    if(s.kind!=='cours'||s.cancelled||!isPast(s)) continue;
    const abs=S.data.absProfs[s.date]||[];
    for(const id of new Set(s.tch)) if(id&&byId(S.data.enseignants,id)&&!abs.includes(id)) out.push({t:id,s,h:sHours(s)});
  }
  return out;
}
const hrMonths=()=>{const out=[];let d=parse(yearStart());d=new Date(d.getFullYear(),d.getMonth(),1);const end=new Date();while(d<=end&&out.length<14){out.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d=new Date(d.getFullYear(),d.getMonth()+1,1);}return out;};
const hrDate=m=>new Date(+m.slice(0,4),+m.slice(5)-1,1);
const hrMonthName=m=>`${fMonth.format(hrDate(m))} ${hrDate(m).getFullYear()}`;
const hrFmt=h=>String(Math.round(h*10)/10).replace('.',',');
function hoursPage(segP){
  const rows=taughtRows(), ms=hrMonths(), cur=S.pg.hm==='all'||ms.includes(S.pg.hm)?S.pg.hm:ms[ms.length-1], by={}, totM={};let tot=0;
  for(const r of rows){const m=r.s.date.slice(0,7), o=by[r.t]||(by[r.t]={tot:0});o[m]=(o[m]||0)+r.h;o.tot+=r.h;totM[m]=(totM[m]||0)+r.h;tot+=r.h;}
  const ts=staff().filter(p=>by[p.id]||(isTeacher(p)&&p.statut!=='Inactif')), all=cur==='all', sel=all?tot:(totM[cur]||0);

  const tb=`<div class="toolbar">${segP}<p class="summary" style="margin:0"><span><b id="hr-sum">${hrFmt(sel)}</b>${sel>=2?'heures':'heure'} ${all?'depuis la rentrée':'en '+esc(hrMonthName(cur))}</span></p><span class="grow"></span><button class="btn primary" type="button" id="hr-export" data-act="hr-export" data-m="${esc(cur)}"${sel?'':' disabled'}>${icon('down')}Exporter ${all?'l’année':esc(fMonth.format(hrDate(cur)))}</button></div>`;

  const th=m=>`<th class="num${m===cur?' on':''}"><button type="button" class="hr-m" id="hm-${m}" data-act="pg-set" data-k="hm" data-v="${m}" aria-pressed="${m===cur}" title="${esc('Choisir '+hrMonthName(m)+' pour l’export')}">${esc(fMonthS.format(hrDate(m)))}</button></th>`;
  const body=ts.map(p=>{const o=by[p.id]||{tot:0};
    return `<tr class="row-link" data-act="staff" data-id="${esc(p.id)}"><td><span class="tb-who">${avHTML(p.nom,'')}<span><button class="link" type="button" data-act="staff" data-id="${esc(p.id)}">${esc(p.nom)}</button><small class="tb-sub">${esc(p.fonction||'Enseignant')}</small></span></span></td>${ms.map(m=>cell(o[m],m)).join('')}<td class="num${all?' on':''}"><b>${o.tot?hrFmt(o.tot):'—'}</b></td></tr>`;}).join('');
  const foot=`<tr class="hr-tot"><td>Total</td>${ms.map(m=>cell(totM[m],m)).join('')}<td class="num${all?' on':''}"><b>${tot?hrFmt(tot):'—'}</b></td></tr>`;
  return tb+`<div class="tbl-wrap"><table class="tbl hr-tbl" id="hr-tbl"><thead><tr><th>Enseignant</th>${ms.map(th).join('')}<th class="num${all?' on':''}"><button type="button" class="hr-m" id="hm-all" data-act="pg-set" data-k="hm" data-v="all" aria-pressed="${all}" title="Choisir toute l’année pour l’export">Total</button></th></tr></thead><tbody>${body}${foot}</tbody></table></div>

}
/* Fichier pour la paie : un sommaire par enseignant, puis le détail séance par séance */
function hoursCSV(m){
  const rows=taughtRows().filter(r=>m==='all'||r.s.date.slice(0,7)===m);
  if(!rows.length){toast('Aucune heure à exporter pour cette période.','bad');return null;}
  const T=id=>byId(S.data.enseignants,id)||{}, fn=id=>T(id).fonction||'Enseignant';
  rows.sort((a,b)=>collator.compare(T(a.t).nom||'',T(b.t).nom||'')||a.s.date.localeCompare(b.s.date)||a.s.start-b.s.start);
  const sum=new Map();for(const r of rows){const o=sum.get(r.t)||{n:0,h:0};o.n++;o.h+=r.h;sum.set(r.t,o);}
  const L=[['Enseignant','Fonction',W('Séances','Cours'),'Heures']];
  for(const [id,o] of sum) L.push([T(id).nom,fn(id),o.n,hrFmt(o.h)]);
  L.push([],['Enseignant','Fonction','Date','Classe',W('Module','Cours'),W('Séance','Détail'),'Type','Moment','Heures']);
  for(const r of rows){const s=r.s;L.push([T(r.t).nom,fn(r.t),s.date,gName(s.grp),(s.c.code?s.c.code+' ':'')+s.c.titre,sessLabel(s),cardKind(tagsOf(s)).kind||'',momentOf(s),hrFmt(r.h)]);}
  return {name:`heures-${m==='all'?(String(cfg().annee||'').replace(/[^0-9A-Za-z]+/g,'-').replace(/^-|-$/g,'')||'annee'):m}.csv`,text:csvText(L)};
}

/* Présences d’une classe sur une période : cours passés, complétés, à rattraper, et totaux des élèves */
function classAtt(gid,from,to,stats,sess){
  const els=studentsOf(gid), mine=sess.filter(s=>s.grp===gid);
  let done=0;const missing=[];for(const s of mine){const a=attInfo(s);if(a.state==='done')done++;else if(a.due)missing.push(s);}
  let P=0,A=0,R=0,M=0,N=0;for(const e of els){const s=stats[e.id];if(s){P+=s.P;A+=s.A;R+=s.R;M+=s.M;N+=s.n;}}
  return {els,past:mine.length,done,missing:missing.sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start),P,A,R,M,N,rate:N?Math.round((P+R)/N*100):null};
}

/* ---------- Pages : examens ---------- */
/* Résultats : réussi, échec, absent (à reprendre) et réussi en reprise */
const RES={reussi:['ok','Réussi'],echec:['bad','Échec'],absent:['warn','Absent'],reprise:['info','Réussi en reprise'],echecf:['bad','Échec du module']};
const resOk=v=>v==='reussi'||v==='reprise', resKo=v=>v==='echec'||v==='absent';
/* Notes en % : facultatives. resultats/<examen>.pct = { élève: note } ; une note inscrit le résultat (réussi à partir du seuil). */
const seuil=()=>{const n=+cfg().seuil;return n>=1&&n<=100?Math.round(n):60;};
const noteTxt=n=>n==null?'':`${String(Math.round(n*10)/10).replace('.',',')} %`;
function examPctOf(x){
  if(S.role==='student'&&cfg().notesEleves===false) return {};
  const d=S.data.resultats[resKeyOf(x)], p=Object.assign({},d&&d.pct), mine=(S.data.mesPct||{})[resKeyOf(x)];
  if(mine!=null&&S.student&&p[S.student]==null) p[S.student]=mine;
  return p;
}
const sxId=key=>'sx-'+String(key).replace(/[^A-Za-z0-9_-]/g,'-');
const resKeyOf=x=>x.fromSess?sxId(x.key):x.e.id;
const resElId=(el,id)=>(String(el)+'__'+String(id)).replace(/[^A-Za-z0-9_-]/g,'-');
/* Résultats d’un examen. Les anciens résultats, rangés dans la fiche d’examen, restent lus tant qu’on ne les a pas réenregistrés. */
function examResOf(x){
  const d=S.data.resultats[resKeyOf(x)];
  let r=d&&d.resultats;
  if(!r){if(x.fromSess){const old=S.data.examens.find(q=>q.seance===x.key);r=old&&old.resultats;}else r=x.e&&x.e.resultats;}
  r=r||{};
  const mine=S.data.mesRes[resKeyOf(x)];
  return mine&&S.student&&!r[S.student]?Object.assign({},r,{[S.student]:mine}):r;
}
/* Enregistre les résultats d’un examen, et le résultat de chaque élève touché dans sa propre fiche */
/* pct : les notes en % par élève ; reps : l’issue des reprises. Sans ces paramètres, ce qui est déjà inscrit est gardé.
   Une reprise n’est gardée que tant que le résultat de l’élève en vient (réussi en reprise, ou échec du module). */
async function writeResults(x,res,msg,pct,reps){
  const id=resKeyOf(x), prev=examResOf(x), cur=S.data.resultats[id]||null, p0=(cur&&cur.pct)||{}, p1={}, r0=reps||(cur&&cur.reprises)||{}, r1={}, now=new Date().toISOString(), ex=!!(cur&&cur.exemple);
  for(const el of Object.keys(res)){
    const n=pct?pct[el]:p0[el];if(n!=null&&n!==''&&!isNaN(+n)&&res[el]!=='absent') p1[el]=Math.max(0,Math.min(100,+n));
    if(r0[el]&&(res[el]==='reprise'||res[el]==='echecf')) r1[el]=r0[el];
  }
  const doc={examen:x.fromSess?'':x.e.id,seance:x.fromSess?x.key:'',cours:x.c?x.c.id:'',groupe:x.grp||'',titre:(x.e&&x.e.titre)||'Examen',date:x.date,resultats:res,pct:p1,reprises:r1,maj:now};
  if(ex) doc.exemple=true;
  const fns=[()=>col('resultats').doc(id).set(doc)];
  for(const el of new Set([...Object.keys(prev),...Object.keys(res)])){
    if(prev[el]===res[el]&&p0[el]===p1[el]&&cur) continue;
    const rid=resElId(el,id);
    fns.push(res[el]?()=>col('resultats-eleves').doc(rid).set(Object.assign({eleve:el,examen:id,v:res[el],date:x.date,maj:now},p1[el]!=null?{pct:p1[el]}:{},ex?{exemple:true}:{})):()=>col('resultats-eleves').doc(rid).delete());
  }
  if(x.fromSess){const old=S.data.examens.find(q=>q.seance===x.key);if(old)fns.push(()=>col('examens').doc(old.id).delete());}
  else if(x.e&&x.e.resultats&&Object.keys(x.e.resultats).length&&byId(S.data.examens,x.e.id)) fns.push(()=>col('examens').doc(x.e.id).update({resultats:{}}));
  return write(async()=>{for(const f of fns) await f();},msg);
}
const elNum=e=>e&&e.numero!=null&&e.numero!==''&&!isNaN(+e.numero)?+e.numero:1e9;
const byElNum=(a,b)=>elNum(a)-elNum(b)||collator.compare(a.nom||'',b.nom||'');
function canEditExam(e){
  if(S.role==='admin') return S.canAdmin!==false;
  if(S.role==='teacher'){if(!permOn('notes'))return false;if(!e)return true;const c=byId(S.data.cours,e.cours);return (c&&c.enseignant===S.teacher)||e.surveillant===S.teacher;}
  return false;
}
const canEditItem=x=>x.fromSess?(S.role==='admin'?S.canAdmin!==false:S.role==='teacher'&&permOn('notes')&&(x.tch||[]).includes(S.teacher)):canEditExam(x.e);
/* Tous les examens de l’année avec leurs résultats : fiche d’examen, ou résultats rattachés à une séance « Examen » de l’horaire */
function examBoard(filter){
  const items=allExamItems().filter(filter).map(x=>{
    const res=examResOf(x), doc=S.data.resultats[resKeyOf(x)]||null, els=studentsOf(x.grp);
    let ok=0,ko=0,kf=0,got=0;for(const e of els){const v=res[e.id];if(!v)continue;got++;if(resOk(v))ok++;else if(resKo(v))ko++;else if(v==='echecf')kf++;}
    const pct=examPctOf(x), ps=els.map(e=>pct[e.id]).filter(n=>n!=null);
    return Object.assign(x,{doc,res,els,ok,ko,kf,got,pct,avg:ps.length?Math.round(ps.reduce((a,b)=>a+ +b,0)/ps.length):null,past:isPast(x)});
  });
  const asc=(a,b)=>a.date.localeCompare(b.date)||a.start-b.start, desc=(a,b)=>-asc(a,b);
  const up=items.filter(x=>!x.past&&(!x.rep||x.els.length)).sort(asc), graded=items.filter(x=>x.past&&!x.rep&&x.els.length);
  const todo=graded.filter(x=>x.got<x.els.length).sort(desc), done=graded.filter(x=>x.got).sort(desc);
  const reps=[];for(const x of graded) for(const e of x.els) if(resKo(x.res[e.id])) reps.push({x,e,v:x.res[e.id]});
  reps.sort((a,b)=>collator.compare(gName(a.x.grp),gName(b.x.grp))||asc(a.x,b.x)||byElNum(a.e,b.e));
  let ok=0,got=0;for(const x of done){ok+=x.ok;got+=x.ok+x.ko+x.kf;}
  return {items,up,todo,done,reps,rate:got?Math.round(ok/got*100):null,got};
}
/* Prochaine journée de reprise de chaque classe */
function nextReprises(){const t=todayISO(),m={};for(const x of allExamItems().filter(x=>x.rep&&!isPast(x)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start)) if(!m[x.grp]) m[x.grp]=x;return m;}
const passCls=r=>r==null?'':r>=90?'ok':r>=75?'warn':'bad';
const xNum=g=>String(gName(g)).replace(/^(Classe|Groupe)\s+/i,'').slice(0,4);
const xDate=(x,cls)=>{const d=parse(x.date);return `<span class="xm-d${cls?' '+cls:''}" aria-hidden="true"><small>${WD[d.getDay()].slice(0,3)}</small><b>${d.getDate()}</b><small>${fMonthS.format(d).replace('.','')}</small></span>`;};
const xTitle=x=>x.rep?(x.c&&modKey(x.c)!=null?`Reprise · ${codeOf(x.c)}${esc(x.c.titre)}`:esc(x.c&&!/^reprise$/i.test(String(x.c.titre).trim())?x.c.titre:'Journée de reprise')):`${x.c?codeOf(x.c):''}${esc(x.c?x.c.titre:x.e.titre||'Examen')}`;
const xSub=x=>esc([x.c&&!x.rep&&x.e.titre&&x.e.titre!=='Examen'?x.e.titre:'',x.salle?'Local '+x.salle:'',x.e.surveillant?'Surveillance : '+shortName(tName(x.e.surveillant)):''].filter(Boolean).join(' · '));
const xWhen=x=>{const k=daysBetween(todayISO(),x.date);return `<span class="chip ${x.rep?'info':k<=2?'exam':'off'}">${k<=0?'Aujourd’hui':k===1?'Demain':k<14?'Dans '+k+' jours':'Dans '+Math.round(k/7)+' semaines'}</span>`;};
const xCls=x=>`<span class="cl-num sm" title="${esc(gName(x.grp))}">${esc(xNum(x.grp))}</span>`;
const xRow=(cls,act,cells,label)=>`<article class="xm-row xm-cols ${cls}${act?' go':''}"${act?` ${act} tabindex="0" role="button" aria-label="${esc(label)}"`:''}>${cells}</article>`;
const xList=(cls,head,rows)=>`<div class="cl-list xm-list"><div class="xm-hd xm-cols ${cls}" aria-hidden="true">${head.map(h=>`<span${h[1]?` class="${h[1]}"`:''}>${h[0]}</span>`).join('')}</div>${rows}</div>`;
const xLabel=x=>`${x.rep?'Journée de reprise':(x.c?x.c.titre:x.e.titre||'Examen')} · ${dayLabel(parse(x.date))} · ${gName(x.grp)}`;
/* Ouvrir un examen : la fiche pour un examen planifié, sinon les résultats de la séance (ou la séance si elle n’a pas encore eu lieu) */
const xOpen=x=>!x.fromSess?`data-act="exam" data-id="${esc(x.e.id)}"`:x.past&&!x.rep&&x.els&&x.els.length?`data-act="x-open" data-key="${esc(x.key)}"`:examAct(x);

function examsPage(){
  const st=S.pg, g=st.g||'';
  if(S.role==='student') return studentExams();
  const view=st.xv==='grille'?'grille':'board';
  const vseg=`<div class="seg" role="group" aria-label="Affichage"><button type="button" id="xv-board" data-act="pg-set" data-k="xv" data-v="board" aria-pressed="${view==='board'}">Tableau de bord</button><button type="button" id="xv-grille" data-act="pg-set" data-k="xv" data-v="grille" aria-pressed="${view==='grille'}">Grille des résultats</button></div>`;
  if(view==='grille'){
    const mineOnly=S.role==='teacher'?x=>x.tch.includes(S.teacher):null;
    const gs=groups().filter(y=>studentsOf(y.id).length&&(!mineOnly||allExamItems().some(x=>x.grp===y.id&&mineOnly(x))));
    const gid=gs.some(y=>y.id===g)?g:(gs[0]||{}).id;
    const gsel=gs.length?`<select id="x-g" aria-label="Classe">${gs.map(y=>`<option value="${esc(y.id)}"${gid===y.id?' selected':''}>${esc(y.nom)}</option>`).join('')}</select>`:'';
    const tbG=`<div class="toolbar">${vseg}${gsel}<span class="grow"></span>${S.role==='teacher'?identitySelect():''}</div>`;
    return tbG+(gid?`<section class="panel xg-panel">${resultsGrid(gid,mineOnly)}</section>`:emptyBox('Aucune classe avec des élèves','La grille apparaîtra dès qu’une classe aura des élèves et des examens passés.'));
  }
  const filter=S.role==='teacher'?x=>x.tch.includes(S.teacher):g?x=>x.grp===g:()=>true;
  const B=examBoard(filter), tab=['up','todo','reps','done'].includes(st.xt)?st.xt:'up', nr=nextReprises();
  const sel=S.role==='admin'?`<select id="x-g" aria-label="Classe"><option value="">Toutes les classes</option>${groups().map(x=>`<option value="${esc(x.id)}"${g===x.id?' selected':''}>${esc(x.nom)}</option>`).join('')}</select>`:identitySelect();
  const can=canEditExam(null)&&S.conn==='shared';
  const tb=`<div class="toolbar">${vseg}${sel}<span class="grow"></span>${can?`<button class="btn primary" type="button" data-act="new-exam">${icon('plus')}Planifier un examen</button>`:''}</div>`;
  const nx=B.up.find(x=>!x.rep), nStud=new Set(B.reps.map(r=>r.e.id)).size;
  const tile=(k,lbl,val,cls,sub)=>`<button type="button" class="xm-tile" id="xt-${k}" data-act="pg-set" data-k="xt" data-v="${k}" aria-pressed="${tab===k}"><span class="lbl">${lbl}</span><b class="${cls}">${val}</b><small>${sub}</small></button>`;
  const tiles=`<div class="xm-tiles" role="group" aria-label="Tableau des examens">
    ${tile('up','À venir',B.up.filter(x=>!x.rep).length,'',nx?'Prochain : '+esc(WD[parse(nx.date).getDay()].slice(0,3).toLowerCase()+'. '+dn(parse(nx.date))+' '+fMonthS.format(parse(nx.date))):'Aucun examen prévu')}
    ${tile('todo','Résultats à entrer',B.todo.length,B.todo.length?'warn':'',B.todo.length?(B.todo.length>1?'examens passés':'examen passé'):'Tout est à jour')}
    ${tile('reps','Reprises à faire',B.reps.length,B.reps.length?'bad':'',B.reps.length?pl(nStud,'élève','élèves'):'Aucune reprise')}
    ${tile('done','Taux de réussite',B.rate==null?'—':B.rate+' %',passCls(B.rate),B.got?pl(B.got,'résultat','résultats'):'Aucun résultat')}
  </div>`;
  let body='';
  if(tab==='up'){
    const lim=+st.lim||25, list=B.up.slice(0,lim), RSu=repSessions();
    body=list.length?xList('xm-up',[['Date'],['Examen'],['Classe'],['Moment'],['','r']],list.map(x=>{const k=daysBetween(todayISO(),x.date);
      const rs=x.rep?RSu.find(y=>y.key===x.key):null, nq=rs?B.reps.filter(q=>{const dq=repDayFor(q.x,RSu);return dq&&dq.key===rs.key;}).length:0;
      const sub=x.rep?(rs&&rs.mods.length?`${rs.mods.map(m=>'M'+m).join(', ')}${nq?' · '+pl(nq,'reprise à faire','reprises à faire'):''}`:'Modules à reprendre : à choisir'):xSub(x);
      return xRow('xm-up'+(x.rep?' is-rep':''),xOpen(x),`${xDate(x,x.rep?'rep':k<=2?'hot':'')}<div class="xm-t"><b>${xTitle(x)}</b>${sub?`<small>${sub}</small>`:''}</div>${xCls(x)}<span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end">${x.rep?'<span class="chip info">Reprise</span>':xWhen(x)}</div>`,xLabel(x));}).join(''))
      +(B.up.length>lim?`<div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="pg-set" data-k="lim" data-v="${lim+25}">Afficher plus (${B.up.length-lim})</button></div>`:'')
      :`<section class="panel"><p class="help">Aucun examen à venir.</p></section>`;
  }else if(tab==='todo'){
    body=B.todo.length?xList('xm-todo',[['Date'],['Examen'],['Classe'],['Résultats entrés'],['','r']],B.todo.map(x=>{const p=Math.round(x.got/x.els.length*100);
      return xRow('xm-todo',xOpen(x),`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b><small>${esc(dayLabel(parse(x.date)))} · ${esc(momentOf(x))}</small></div>${xCls(x)}<div class="cl-big xm-p"><b>${x.got} / ${x.els.length}</b><div class="meter" aria-hidden="true"><i style="width:${p}%"></i></div></div><div class="xm-end">${canEditItem(x)?'<span class="btn sm">Entrer les résultats</span>':'<span class="chip warn">À entrer</span>'}</div>`,'Entrer les résultats : '+xLabel(x));}).join(''))
      :`<div class="cl-list"><p class="miss-ok"><span class="chip ok">À jour</span>Tous les résultats des examens passés sont entrés.</p></div>`;
  }else if(tab==='reps'){
    body=repsTab(B,S.role==='admin'?g:'');
  }else{
    body=B.done.length?xList('xm-done',[['Date'],['Examen'],['Classe'],['Réussite'],['','r']],B.done.map(x=>{const t=x.ok+x.ko+x.kf, r=t?Math.round(x.ok/t*100):null, c=passCls(r);
      return xRow('xm-done',xOpen(x),`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b><small>${esc(dayLabel(parse(x.date)))}${x.avg!=null?` · moyenne ${x.avg} %`:''}</small></div>${xCls(x)}<div class="cl-big xm-p ${c}"><b>${x.ok} / ${t}</b><div class="meter ${c}" aria-hidden="true"><i style="width:${r||0}%"></i></div></div><div class="xm-end">${x.ko?`<span class="chip bad">${pl(x.ko,'à reprendre','à reprendre')}</span>`:x.kf?`<span class="chip bad">${pl(x.kf,'échec de module','échecs de module')}</span>`:'<span class="chip ok">Tous réussis</span>'}</div>`,xLabel(x));}).join(''))
      :`<section class="panel"><p class="help">Aucun résultat pour l’instant.</p></section>`;
  }
  return tb+tiles+body;
}
/* Élève : ses prochains examens, ses résultats et ses reprises */
function studentExams(){
  const sid=S.student, me=!!sid, B=examBoard(x=>x.grp===S.group), nr=nextReprises();
  const mine=B.items.filter(x=>x.past&&!x.rep&&x.res[sid]).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  const todo=mine.filter(x=>resKo(x.res[sid])), n=nr[S.group];
  const up=B.items.filter(x=>!x.past).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start).slice(0,6);
  const tb=`<div class="toolbar">${identitySelect()}<span class="grow"></span>${me&&mine.length?`<button class="btn" type="button" id="pr-releve" data-act="pr-releve" data-id="${esc(sid)}">${icon('print')}Imprimer mon relevé</button>`:''}</div>`;
  const note=me?repNotice({id:sid},B.items):'';
  const upH=up.length?xList('xm-me',[['Date'],['Examen'],['Moment'],['','r']],up.map(x=>{const k=daysBetween(todayISO(),x.date);return xRow('xm-me',examAct(x),`${xDate(x,x.rep?'rep':k<=2?'hot':'')}<div class="xm-t"><b>${xTitle(x)}</b>${xSub(x)?`<small>${xSub(x)}</small>`:''}</div><span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end">${x.rep?'<span class="chip info">Reprise</span>':xWhen(x)}</div>`,xLabel(x));}).join('')):`<section class="panel"><p class="help">Les examens de votre classe apparaîtront ici dès qu’ils seront planifiés.</p></section>`;
  const resH=!me?'':mine.length?xList('xm-me',[['Date'],['Examen'],['Moment'],['Résultat','r']],mine.map(x=>{const v=x.res[sid];return xRow('xm-me','',`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b></div><span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end"><span class="chip ${RES[v][0]}">${RES[v][1]}${x.pct[sid]!=null?' · '+esc(noteTxt(x.pct[sid])):''}</span></div>`,'');}).join('')):`<section class="panel"><p class="help">Aucun résultat pour l’instant.</p></section>`;
  return tb+note+`<h2 class="xm-h">Prochains examens</h2>${upH}${me?`<h2 class="xm-h">Mes résultats</h2>${resH}`:''}`;
}
/* Ouvre les résultats d’une séance « Examen » de l’horaire */
function openSessExam(key){
  const x=allExamItems().find(k=>k.key===key);if(!x)return;
  if(!x.fromSess) return openExam(x.e.id);
  openDrawer({kind:'exam',id:null,sess:key,draft:{resultats:Object.assign({},examResOf(x)),pct:Object.assign({},examPctOf(x)),groupe:x.grp},err:'',warn:null,confirmDel:false});
}

/* Grille des résultats d’une classe : une ligne par élève, une colonne par examen passé (le plus récent à gauche) */
const GRID={reussi:['ok','✓'],echec:['bad','✗'],absent:['warn','Abs'],reprise:['info','✓R'],echecf:['fail','ÉM']};
function resultsGrid(gid,filter){
  const B=examBoard(x=>x.grp===gid&&(!filter||filter(x)));
  const xs=B.items.filter(x=>x.past&&!x.rep).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  const els=studentsOf(gid).slice().sort(byElNum);
  if(!els.length) return '<p class="help">Aucun élève dans cette classe.</p>';
  if(!xs.length) return '<p class="help">Aucun examen passé pour l’instant : la grille se remplira au fil des examens.</p>';
  const code=x=>x.c&&x.c.code?x.c.code:'Exam.';
  const sub=x=>{const t=String(x.e.titre||'');return x.fromSess?t.replace(/^Examen\s*/,''):t;};
  const name=x=>x.c?(x.c.code?x.c.code+' ':'')+x.c.titre:(x.e.titre||'Examen');
  const head=xs.map(x=>{const d=parse(x.date),todo=x.got<x.els.length;
    return `<th scope="col" class="xg-h${todo?' todo':''}"><button type="button" ${xOpen(x)} title="${esc(`${name(x)}${sub(x)?' · '+sub(x):''} · ${dayLabel(d)}${todo?' · résultats à entrer':''}`)}"><b>${esc(code(x))}</b><small>${esc(sub(x))||'&nbsp;'}</small><small>${dn(d)} ${esc(fMonthS.format(d).replace('.',''))}</small></button></th>`;}).join('');
  const rows=els.map(e=>{let ok=0,ko=0,kf=0;
    const cells=xs.map(x=>{const v=x.res[e.id], g=GRID[v];if(resOk(v))ok++;else if(resKo(v))ko++;else if(v==='echecf')kf++;
      return `<td><button type="button" class="xg-c ${g?g[0]:'none'}" ${xOpen(x)} aria-label="${esc(`${e.nom} · ${name(x)} · ${v?RES[v][1]:'sans résultat'}`)}" title="${esc(v?RES[v][1]+(x.pct[e.id]!=null?' · '+noteTxt(x.pct[e.id]):''):'Sans résultat')}">${g&&x.pct[e.id]!=null?Math.round(x.pct[e.id]):g?g[1]:'·'}</button></td>`;}).join('');
    const t=ok+ko+kf, r=t?Math.round(ok/t*100):null;
    return `<tr><th scope="row" class="xg-n"><button type="button" class="xg-who" data-act="student" data-id="${esc(e.id)}"><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span>${esc(e.nom)}</button></th><td class="xg-r ${passCls(r)}">${r==null?'—':r+' %'}${ko?`<small>${pl(ko,'à reprendre','à reprendre')}</small>`:''}${kf?`<small>${pl(kf,'échec de module','échecs de module')}</small>`:''}</td>${cells}</tr>`;}).join('');
  const foot=xs.map(x=>{const t=x.ok+x.ko+x.kf;return `<td class="xg-f">${t?`${x.ok}/${t}`:'—'}</td>`;}).join('');
  const legend=`<div class="xg-legend">${Object.entries(GRID).map(([k,[c,l]])=>`<span><i class="xg-c ${c}" aria-hidden="true">${l}</i>${RES[k][1]}</span>`).join('')}<span><i class="xg-c none" aria-hidden="true">·</i>Sans résultat</span></div>`;
  return legend+`<div class="xg-wrap"><table class="xg"><thead><tr><th scope="col" class="xg-n">Élève</th><th scope="col" class="xg-r">Réussite</th>${head}</tr></thead><tbody>${rows}</tbody><tfoot><tr><th scope="row" class="xg-n">Réussis</th><td class="xg-r"></td>${foot}</tr></tfoot></table></div>`;
}
/* Onglet Examens d’une fiche d’élève : ses résultats, ses reprises et ses prochains examens */
function studentExamsTab(e){
  const B=examBoard(x=>x.grp===e.groupe), nr=nextReprises(), n=nr[e.groupe];
  const mine=B.items.filter(x=>x.past&&!x.rep&&x.res[e.id]).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  const pend=mine.filter(x=>resKo(x.res[e.id])), ok=mine.filter(x=>resOk(x.res[e.id])).length, t=ok+pend.length+mine.filter(x=>resFail(x.res[e.id])).length, rate=t?Math.round(ok/t*100):null;
  const bar=`<div class="st-bar"><p class="summary"><span><b>${mine.length}</b>${mine.length>1?'résultats':'résultat'}</span><span><b class="${passCls(rate)}">${rate==null?'—':rate+' %'}</b>de réussite</span><span class="${pend.length?'need':''}"><b>${pend.length}</b>à reprendre</span></p><span class="grow"></span>${mine.length?`<button class="btn sm" type="button" id="pr-releve" data-act="pr-releve" data-id="${esc(e.id)}">${icon('print')}Imprimer le relevé</button>`:''}</div>`;
  const note=repNotice(e,B.items);
  const res=mine.length?xList('xm-sres',[['Date'],['Examen'],['Résultat'],['','r']],mine.map(x=>{const v=x.res[e.id], can=canEditItem(x);
    return xRow('xm-sres',can?xOpen(x):'',`${xDate(x,'')}<div class="xm-t"><b>${xTitle(x)}</b>${xSub(x)?`<small>${xSub(x)}</small>`:''}</div><div><span class="chip ${RES[v][0]}">${RES[v][1]}${x.pct[e.id]!=null?' · '+esc(noteTxt(x.pct[e.id])):''}</span></div><div class="xm-end">${resKo(v)&&can?`<button class="btn sm" type="button" data-act="x-rep" data-key="${esc(x.key)}" data-el="${esc(e.id)}"${dis()}>Réussi en reprise</button>`:''}</div>`,xLabel(x));}).join('')):'<section class="panel"><p class="help">Aucun résultat inscrit.</p></section>';
  const up=B.up.slice(0,5);
  const upH=up.length?xList('xm-me',[['Date'],['Examen'],['Moment'],['','r']],up.map(x=>{const k=daysBetween(todayISO(),x.date);return xRow('xm-me',examAct(x),`${xDate(x,x.rep?'rep':k<=2?'hot':'')}<div class="xm-t"><b>${xTitle(x)}</b>${xSub(x)?`<small>${xSub(x)}</small>`:''}</div><span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end">${x.rep?'<span class="chip info">Reprise</span>':xWhen(x)}</div>`,xLabel(x));}).join('')):'<section class="panel"><p class="help">Aucun examen prévu.</p></section>';
  return bar+note+`<h2 class="xm-h">Résultats</h2>${res}<h2 class="xm-h">À venir</h2>${upH}`;
}
/* Onglet Examens d’une fiche de classe : réussite, grille des résultats et prochains examens */
function classExamsTab(g){
  const B=examBoard(x=>x.grp===g.id);
  const bar=`<div class="st-bar"><p class="summary"><span><b class="${passCls(B.rate)}">${B.rate==null?'—':B.rate+' %'}</b>de réussite</span><span class="${B.todo.length?'need':''}"><b>${B.todo.length}</b>${B.todo.length>1?'examens à compléter':'examen à compléter'}</span><span class="${B.reps.length?'need':''}"><b>${B.reps.length}</b>${B.reps.length>1?'reprises à faire':'reprise à faire'}</span></p></div>`;
  const up=B.up.slice(0,5);
  const upH=up.length?xList('xm-me',[['Date'],['Examen'],['Moment'],['','r']],up.map(x=>{const k=daysBetween(todayISO(),x.date);return xRow('xm-me',xOpen(x),`${xDate(x,x.rep?'rep':k<=2?'hot':'')}<div class="xm-t"><b>${xTitle(x)}</b>${xSub(x)?`<small>${xSub(x)}</small>`:''}</div><span class="xm-m">${esc(momentOf(x))}</span><div class="xm-end">${x.rep?'<span class="chip info">Reprise</span>':xWhen(x)}</div>`,xLabel(x));}).join('')):'<section class="panel"><p class="help">Aucun examen prévu.</p></section>';
  return bar+`<section class="panel xg-panel"><h2>Grille des résultats</h2>${resultsGrid(g.id)}</section><h2 class="xm-h">Prochains examens</h2>${upH}`;
}

/* ---------- Affectation des enseignants : requis, candidatures, remplacements, disponibilités ----------
   candidatures/<séance__enseignant> : { seance, cours, groupe, date, debut, fin, enseignant, statut }
     statut : attente (a postulé) · approuve · refuse · retire (retiré de ce cours par l’administration)
   remplacements/<séance__enseignant> : l’enseignant attribué demande à être remplacé ({ motif })
   disponibilites/<enseignant> : { jours : { '2026-10-13' : 'J' | 'AM' | 'PM' } }
   Le titulaire du module (cours.enseignant) donne tous ses cours, sauf ceux dont on l’a retiré. */
const candId=(key,tid)=>(String(key)+'__'+String(tid)).replace(/[^A-Za-z0-9_-]/g,'-');
let _aff=null;
function affIdx(){
  const a=S.data.candidatures, r=S.data.remplacements;
  if(_aff&&_aff.a===a&&_aff.r===r) return _aff;
  const by={}, rp={};
  for(const d of a)(by[d.seance]||(by[d.seance]=[])).push(d);
  for(const d of r) rp[d.seance+'|'+d.enseignant]=d;
  return _aff={a,r,by,rp};
}
/* Module du programme (menu Modules) d’un cours, d’après son sigle « M7 » */
const modKey=c=>{const m=/^M?(\d+)$/i.exec(String(c&&c.code||'').trim());return m?+m[1]:null;};
const modOf=c=>{const k=modKey(c);return k==null?null:comps().find(x=>+x.code===k)||null;};
/* Enseignants requis : ceux du cours du module que la séance donne (le plus grand s’il y en a plusieurs).
   Pour un examen, une reprise ou une activité : la valeur réglée sur la séance, sinon 1 (0 pour une activité). */
const reqOf=s=>{const x=s.extra||s.sl||{}, m=modOf(s.c), ks=m?xCours(m,x):[];if(ks.length)return Math.max(...ks.map(cReq));if(x.requis!=null&&x.requis!=='')return Math.max(0,+x.requis||0);if(isActivity(s.c))return 0;return m&&+m.requis>0?+m.requis:reqDef();};
const linkedX=s=>!!(s&&s.extra&&acad()&&xCours(modOf(s.c),s.extra).length);
function tchOf(c,key){
  const cs=affIdx().by[key];if(!cs) return [c.enseignant];
  const out=[];
  if(c.enseignant&&!cs.some(d=>d.enseignant===c.enseignant&&d.statut==='retire')) out.push(c.enseignant);
  for(const d of cs) if(d.statut==='approuve'&&!out.includes(d.enseignant)) out.push(d.enseignant);
  return out;
}
function staffing(s){
  const I=affIdx(), cs=I.by[s.key]||[], st={}, known=id=>!!byId(S.data.enseignants,id);
  for(const d of cs) st[d.enseignant]=d.statut;
  const assigned=s.tch.filter(id=>id&&known(id));
  const pending=cs.filter(d=>d.statut==='attente'&&known(d.enseignant)).map(d=>d.enseignant);
  const remp=assigned.filter(t=>I.rp[s.key+'|'+t]);
  const requis=reqOf(s), firm=assigned.length-remp.length, clash=isPast(s)?[]:assigned.filter(t=>busyAt(t,s));
  return {requis,assigned,pending,remp,st,firm,clash,rclash:isPast(s)?[]:ressClash(s),open:Math.max(0,requis-firm)};
}
const DISPO={J:'Toute la journée',AM:'Avant-midi',PM:'Après-midi'};
const dispoOf=(tid,ds)=>{const d=S.data.dispos[tid];return (d&&d.jours&&d.jours[ds])||'';};
const dispoCovers=(v,s)=>v==='J'||(v==='AM'&&momentOf(s)==='Avant-midi')||(v==='PM'&&momentOf(s)==='Après-midi');
const hasComp=(t,c)=>{const k=modKey(c);return k==null||((t&&t.competences)||[]).some(x=>+x===k);};
/* Le même module donné à deux classes au même moment n’est pas un conflit : l’enseignant a les deux classes ensemble */
const sameMod=(a,b)=>acad()&&modKey(a)!=null&&modKey(a)===modKey(b);
const busyAt=(tid,s)=>sessionsOn(s.date).some(o=>o.key!==s.key&&!o.cancelled&&o.tch.includes(tid)&&o.start<s.end&&s.start<o.end&&!sameMod(o.c,s.c));
const sHours=s=>Math.round((s.extra?sessMinutes(s.extra):s.end-s.start)/6)/10;
const sTitle=s=>`${codeOf(s.c)}${esc(s.c.titre)}`;
const sSub=s=>esc([sessLabel(s),cardKind(tagsOf(s)).kind].filter(Boolean).join(' · '));
const sAria=s=>`${s.c.titre} · ${dayLabel(parse(s.date))} · ${gName(s.grp)}`;
const sAt=s=>`data-key="${esc(s.key)}" data-date="${s.date}"`;
const sHot=s=>daysBetween(todayISO(),s.date)<=2?'hot':'';
const sDay=s=>{const d=parse(s.date);return `${WD[d.getDay()]} ${dn(d)} ${fMonthS.format(d)}`;};
const weekCount=(tid,mon)=>{let n=0;for(let i=0;i<5;i++)for(const x of sessionsOn(iso(addDays(mon,i))))if(!x.cancelled&&x.tch.includes(tid))n++;return n;};
function upcomingSessions(days){return sessionsBetween(todayISO(),iso(addDays(new Date(),days))).filter(s=>s.kind==='cours'&&!s.cancelled&&!isPast(s));}
const candDoc=(s,tid,statut)=>({seance:s.key,cours:s.c.id,groupe:s.grp||'',date:s.date,debut:s.sl.debut,fin:s.sl.fin,enseignant:tid,statut,maj:new Date().toISOString()});
const affTile=(k,key,tab,lbl,val,cls,sub)=>`<button type="button" class="xm-tile" id="${k}-${key}" data-act="pg-set" data-k="${k}" data-v="${key}" aria-pressed="${tab===key}"><span class="lbl">${lbl}</span><b class="${cls}">${val}</b><small>${sub}</small></button>`;

/* ---------- Enseignant : mes cours (à pourvoir, en attente, attribués, donnés) ---------- */
function teacherBoard(tid){
  const t=byId(S.data.enseignants,tid)||{}, I=affIdx(), open=[], wait=[], mine=[];let noDispo=0;
  for(const s of upcomingSessions(horizonJ())){
    const st=staffing(s), my=st.st[tid];
    if(st.assigned.includes(tid)){mine.push({s,st,remp:I.rp[s.key+'|'+tid]||null});continue;}
    if(my==='attente'||my==='refuse'){wait.push({s,st,v:my});continue;}
    if(my==='retire'||st.open<=0||!hasComp(t,s.c)||onLeave(t)) continue;
    if(!dispoCovers(dispoOf(tid,s.date),s)){noDispo++;continue;}
    if(busyAt(tid,s)) continue;
    open.push({s,st});
  }
  const past=sessionsBetween(yearStart(),todayISO()).filter(s=>s.kind==='cours'&&!s.cancelled&&isPast(s)&&s.tch.includes(tid)).sort((a,b)=>b.date.localeCompare(a.date)||b.start-a.start);
  return {t,open,wait,mine,past,noDispo};
}

/* ---------- Disponibilités : un mois, du lundi au vendredi ; un clic change la journée ---------- */
function dispoDraft(tid){
  const st=S.pg, doc=S.data.dispos[tid];
  if(!st.dd||st.dd.tid!==tid||!st.dd.dirty) st.dd={tid,jours:Object.assign({},(doc&&doc.jours)||{}),dirty:false,maj:doc&&doc.maj};
  return st.dd;
}
function dispoMonthDays(ym){
  const [Y,M]=ym.split('-').map(Number), out=[];
  for(let d=new Date(Y,M-1,1);d.getMonth()===M-1;d=addDays(d,1)){const j=(d.getDay()+6)%7;if(j<5)out.push({d,ds:iso(d),j});}
  return out;
}
const dispoLocked=ds=>ds<todayISO()||!!offDay(ds);
function dispoCalHTML(tid,edit){

  let n=0;for(const {ds} of days) if(dr.jours[ds]) n++;

    const v=dr.jours[ds]||'', off=offDay(ds), lock=dispoLocked(ds);

  }

  return `<div class="toolbar dp-bar"><div class="weeknav"><button class="icon-btn" type="button" id="dp-prev" data-act="dp-month" data-n="-1" aria-label="Mois précédent">${icon('left')}</button><span class="range" id="dp-month">${esc(mName.charAt(0).toUpperCase()+mName.slice(1))} ${Y}</span><button class="icon-btn" type="button" id="dp-next" data-act="dp-month" data-n="1" aria-label="Mois suivant">${icon('right')}</button></div>
      <p class="summary" style="margin:0"><span><b>${n}</b>${n>1?'jours disponibles':'jour disponible'}</span></p><span class="grow"></span>
      ${edit?`<button class="btn sm" type="button" data-act="dp-all">Tout le mois</button><button class="btn sm ghost" type="button" data-act="dp-none">Effacer le mois</button>`:''}</div>
    <div class="dp-grid" role="group" aria-label="${esc('Disponibilités de '+mName+' '+Y)}">${DAYS.map((nm,i)=>edit?`<button type="button" class="dp-wd" data-act="dp-col" data-j="${i}" title="${esc('Tous les '+nm.toLowerCase()+'s du mois')}">${nm}</button>`:`<span class="dp-wd">${nm}</span>`).join('')}${cells}</div>

function affCell(st){
  const c=st.clash.length?'bad':st.open>0?(st.firm?'warn':'bad'):'ok';
  if(!st.requis&&!st.clash.length) return `<div class="af-n"><b class="none">—</b><small>${st.assigned.length?st.assigned.map(id=>esc(shortName(tName(id)))).join(', '):'aucun enseignant requis'}</small></div>`;
  return `<div class="af-n ${c}"><b>${st.firm} / ${st.requis}</b><small>${st.clash.length?'Conflit : '+st.clash.map(id=>esc(shortName(tName(id)))).join(', '):st.pending.length?pl(st.pending.length,'candidat','candidats'):st.open>0?'aucun candidat':st.assigned.map(id=>esc(shortName(tName(id)))).join(', ')}</small></div>`;
}

async function affReq(s,d){

/* ---------- Administration : modules du programme ----------
   Le catalogue est dans config/ecole.competences : { code, nom, heuresT, heuresP, heures, charge, cours[], examens[] }.
   · COURS du module : { id, num, type, requis } — ce qui compose le module, pareil pour toutes les classes.
   · EXAMENS du module : { id, type (t : théorique, p : pratique), nom }.
   · SÉANCE : un cours ou un examen donné à une classe, à une date. Chaque classe a son document cours/<id> (sigle M7) ;
     ses séances pointent vers les cours (x.cours) ou les examens (x.examens) du module.
   · CHARGÉ DE COURS (charge) : l’enseignant du module ; il donne ses séances à toutes les classes. */
const modList=()=>comps().map(k=>({id:String(k.code),nom:k.nom,k}));
const modCourses=code=>S.data.cours.filter(c=>modKey(c)===+code);
const modT=k=>k.heuresT!=null&&k.heuresT!==''?+k.heuresT:null;
const modP=k=>k.heuresP!=null&&k.heuresP!==''?+k.heuresP:null;
const modTot=k=>modT(k)!=null||modP(k)!=null?(modT(k)||0)+(modP(k)||0):(+k.heures||0);
const hTxt=v=>v==null?'<span class="muted">—</span>':v+' h';
const COURS_TYPES=['theorie','pratique','simulation','visite','stage','activite'];
const actLabel=k=>(ACTIVITES.find(a=>a.k===k)||{}).label||'';
const EXAM_T={t:'Théorique',p:'Pratique'};
const examActOf=e=>e.type==='t'?'examen-t':e.type==='p'?'examen-p':'examen';
const mCours=k=>(k&&Array.isArray(k.cours)?k.cours:[]).slice().sort((a,b)=>collator.compare(String(a.num),String(b.num)));
const mExams=k=>(k&&Array.isArray(k.examens)?k.examens:[]);
const xCours=(k,x)=>k&&x&&Array.isArray(x.cours)?x.cours.map(id=>(k.cours||[]).find(c=>c.id===id)).filter(Boolean):[];
const xExams=(k,x)=>k&&x&&Array.isArray(x.examens)?x.examens.map(id=>(k.examens||[]).find(e=>e.id===id)).filter(Boolean):[];
const cReq=c=>c.requis==null||c.requis===''?reqDef():Math.max(0,Math.min(9,+c.requis||0));
const autoLabel=a=>a.length===2?a.join('–'):a.join(', ');
const chargeName=k=>k&&k.charge&&byId(S.data.enseignants,k.charge)?tName(k.charge):'';
/* Dans quelles classes chaque cours et chaque examen du module est à l’horaire */
function modUse(code){
  const use={};
  for(const c of modCourses(code)) for(const x of datedOf(c)) for(const id of (x.cours||[]).concat(x.examens||[])) (use[id]||(use[id]=new Set())).add(c.groupe);
  return {use,n:id=>use[id]?use[id].size:0};
}
function chargeSelect(id,cur,k){
  const ts=teachers(), curT=cur?byId(S.data.enseignants,cur):null;
  const opt=t=>`<option value="${esc(t.id)}"${cur===t.id?' selected':''}>${esc(t.nom)}${k&&!(t.competences||[]).some(x=>+x===+k.code)?' (hors compétences)':''}</option>`;
  return `<select id="${id}"><option value="">À choisir plus tard</option>${ts.map(opt).join('')}${curT&&!ts.includes(curT)?opt(curT):''}</select>`;
}
/* Heures planifiées du module pour une classe, par type ; la reprise ne compte pas */
function modHours(c){
  let T=0,P=0,O=0,ex=0;const rep=[], ann=(c&&c.annulees)||[];
  for(const x of datedOf(c)){
    if(ann.includes(`${x.date}@${x.id}`)) continue;
    const m=sessMinutes(x), tg=x.tags||[];
    if(tg.includes('Reprise')&&!tg.includes('Examen')){rep.push(x.date);continue;}
    if(tg.includes('Examen')) ex++;
    if(tg.includes('Théorie')) T+=m; else if(tg.includes('Pratique')) P+=m; else O+=m;
  }
  return {T:Math.round(T/60),P:Math.round(P/60),O:Math.round(O/60),ex,rep:rep.sort()};
}

/* Enregistre le catalogue des modules, puis accorde le nom et les heures des cours des classes */
async function saveModule(code,vals,isNew){
  const c=configDoc(), i=c.competences.findIndex(x=>+x.code===+code);
  if(isNew&&i>=0){toast(`Le module M${code} existe déjà.`,'bad');return false;}
  const tot=vals.heuresT!=null||vals.heuresP!=null?(vals.heuresT||0)+(vals.heuresP||0):(i>=0?+c.competences[i].heures||0:0);
  const k=Object.assign({cours:[],examens:[]},i>=0?c.competences[i]:{code:+code},{nom:vals.nom,heuresT:vals.heuresT,heuresP:vals.heuresP,heures:tot,charge:vals.charge||''});
  delete k.requis;
  if(i>=0)c.competences[i]=k;else c.competences.push(k);
  c.competences.sort((a,b)=>a.code-b.code);
  if(!await saveConfig(c,isNew?`Module M${code} créé`:'Module enregistré')) return false;
  const stale=modCourses(code).filter(x=>x.titre!==k.nom||(+x.heures||0)!==tot);
  if(stale.length) await runAll(stale.map(x=>()=>col('cours').doc(x.id).update({titre:k.nom,heures:tot||null})),'');
  return true;
}
/* Modifie la structure d’un module (ses cours, ses examens) : fn reçoit la copie du module et la change */
async function editModule(code,fn,msg){
  if(S.busy) return false;
  const c=configDoc(), k=c.competences.find(x=>String(x.code)===String(code));if(!k) return false;
  k.cours=(k.cours||[]).map(x=>Object.assign({},x));k.examens=(k.examens||[]).map(x=>Object.assign({},x));
  const r=fn(k);if(r===false) return false;
  return saveConfig(c,typeof msg==='function'?msg():msg);
}
/* Après un changement de type dans le module : les séances de toutes les classes suivent */

/* Ajoute une séance à une classe : un ou plusieurs cours (ou examens) du module, ou une activité sans module.
   o.items : 'c:<id>' (cours), 'e:<id>' (examen), 'rep' (reprise). Renvoie un message d’erreur, ou '' */
async function addCourseDay(o){

  const mk=o.module&&o.module!=='__act'?comps().find(x=>String(x.code)===String(o.module)):null, titre=mk?mk.nom:String(o.titre||'').trim();

  if(!titre) return 'Écrivez le nom de l’activité.';
  const items=o.items||[], ks=mk?mCours(mk).filter(c=>items.includes('c:'+c.id)):[], es=mk?mExams(mk).filter(e=>items.includes('e:'+e.id)):[], rep=items.includes('rep');
  if(mk&&!ks.length&&!es.length&&!rep) return mCours(mk).length||mExams(mk).length?'Cochez le cours ou l’examen donné à cette séance.':'Ce module n’a pas encore de cours : ajoutez-les dans le menu Modules.';

  const x={id:'a'+date.replace(/-/g,'')+per.k+Math.random().toString(36).slice(2,5),date,debut:per.debut,fin:per.fin,tags:[],label:titre,minutes:perMin(per)};
  if(!mk) x.tags=withAct([],o.type||'activite');
  else if(es.length||ks.length){
    x.tags=withAct([],es.length?examActOf(es[0]):ks[0].type);
    x.label=autoLabel(ks.map(c=>c.num).concat(es.map(e=>e.nom)));
    if(ks.length) x.cours=ks.map(c=>c.id);

  if(ok) logEv('horaire',mk?'a ajouté la séance':'a ajouté l’activité',`${mk?'M'+mk.code+' ':''}${titre}${mk&&x.label?' ('+x.label+')':''} · ${gName(gid)}, ${dayLabel(dd).toLowerCase()}`);

/* ---------- Journées de reprise ----------
   Une journée de reprise est une séance « Reprise » à l’horaire d’une classe. On la crée d’abord, puis on y ajoute des
   modules (x.modules). Chaque élève qui a échoué ou manqué un examen d’un de ces modules le reprend ce jour-là :
   une reprise par examen échoué. Réussie : le résultat devient « réussi en reprise ». Ratée : « échec du module ».
   La liste des reprises se déduit des résultats ; resultats/<examen>.reprises = { élève : { date, v, de, pct } }
   garde la date et l’issue de chaque reprise (de : le premier résultat, pour pouvoir annuler). */
const resFail=v=>v==='echecf';
function repSessions(){
  const out=[];
  for(const c of S.data.cours) for(const x of datedOf(c)){
    const tg=x.tags||[];if(!tg.includes('Reprise')||tg.includes('Examen')) continue;
    if((c.annulees||[]).includes(`${x.date}@${x.id}`)||offDay(x.date)) continue;
    const own=modKey(c), mods=[...new Set((own!=null?[own]:[]).concat((x.modules||[]).map(Number).filter(n=>n>0)))].sort((a,b)=>a-b);
    out.push({c,x,own,date:x.date,grp:c.groupe,mods,key:`${c.id}_${x.id}_${x.date}`});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date)||collator.compare(gName(a.grp),gName(b.grp)));
}
/* La journée où se reprend un examen échoué : la première journée de reprise de la classe, après l’examen et pas encore passée, qui a son module */
function repDayFor(x,RS){
  const mk=x.c?modKey(x.c):null, t=todayISO();
  return mk==null?null:(RS||repSessions()).find(r=>r.grp===x.grp&&r.date>=t&&r.date>x.date&&r.mods.includes(mk))||null;
}
const modLbl=code=>{const k=comps().find(m=>+m.code===+code);return k?`M${k.code} ${k.nom}`:'M'+code;};
/* Modules échoués par un élève : une reprise ratée suffit */
function failedModules(e,items){
  const out=new Map();
  for(const x of items) if(resFail(x.res[e.id])&&x.c) out.set(modKey(x.c)!=null?'M'+modKey(x.c):x.c.id,(x.c.code?x.c.code+' ':'')+x.c.titre);
  return [...out.values()];
}
/* Ce qu’un élève doit reprendre, avec la date de chaque reprise quand elle est fixée */
function repNotice(e,items,RS){
  const pend=items.filter(x=>x.past&&!x.rep&&resKo(x.res[e.id])), fail=failedModules(e,items);
  const one=x=>{const d=repDayFor(x,RS);return `${esc((x.c&&x.c.code?x.c.code+' ':'')+(x.c?x.c.titre:'Examen'))}${x.e&&x.e.titre&&x.e.titre!=='Examen'?' ('+esc(x.e.titre)+')':''} : ${d?'reprise le '+esc(dayLabel(parse(d.date)).toLowerCase()):'date de reprise à venir'}`;};
  return (pend.length?`<div class="notice warn" id="rp-note"><p><b>${pl(pend.length,'reprise à faire','reprises à faire')}</b></p><ul>${pend.map(x=>`<li>${one(x)}</li>`).join('')}</ul></div>`:'')
    +(fail.length?`<div class="notice bad" id="rp-fail"><p><b>${fail.length>1?'Modules échoués':'Module échoué'}</b> : ${esc(fail.join(', '))}. La reprise n’a pas été réussie.</p></div>`:'');

/* Inscrit l’issue d’une reprise : réussie → « réussi en reprise » ; ratée → « échec du module » ; ok === null : on annule */
async function setRetake(key,el,ok,date,pct){
  const x=allExamItems().find(k=>k.key===key);if(!x||S.busy) return false;
  const cur=S.data.resultats[resKeyOf(x)]||{}, reps=Object.assign({},cur.reprises), res=Object.assign({},examResOf(x)), was=res[el], t=todayISO();
  if(ok===null){const r=reps[el];if(!r) return false;res[el]=r.de||'echec';delete reps[el];}
  else{

/* Ajoute ou retire un module d’une journée de reprise, pour toutes les classes qui ont cette journée */
async function repModules(date,code,add){
  const jobs=[];
  for(const r of repSessions().filter(r=>r.date===date)){
    if(r.own===+code) continue;
    const doc=courseDoc(r.c), x=doc.extras.find(e=>e.id===r.x.id);if(!x) continue;
    const set=new Set((x.modules||[]).map(Number));if(add)set.add(+code);else set.delete(+code);
    x.modules=[...set].sort((a,b)=>a-b);
    jobs.push(()=>putCours(r.c.id,doc));
  }
  if(!jobs.length) return false;
  const lbl=dayLabel(parse(date)).toLowerCase(), ok=await runAll(jobs,add?`M${code} ajouté à la reprise du ${lbl}`:`M${code} retiré de la reprise du ${lbl}`);
  if(ok) logEv('horaire',add?`a ajouté le module M${code} à la journée de reprise`:`a retiré le module M${code} de la journée de reprise`,lbl);
  return ok;
}

/* ---------- Stock : le matériel et les équipements de l’école (pas de vente) ----------
   stock/<id> : un article. À l’unité (EPI, ARI, matériel : numéro de série, état, inspections, à qui il est attribué)
     ou en quantité (consommables : quantité, seuil minimum).
     { nom, cat epi|ari|mat|conso, suivi unite|qte, code, serie, lot, empl, statut service|reserve|maint|hs, qte, min, unite,
       taille, fab, inspDer, inspFreq, epDer, resa, prix (cents), attrib { t eleve|classe, id, le }, sortie { le, instr, seance }, note }
   stock-mvt/<id> : un mouvement { le, date, type, art, nom, cat, qte, eleve, classe, seance { key, date, titre }, instr, par, note }
   Réglages (config/ecole.stock) : fréquences par catégorie, délai d’alerte, emplacements, droits des enseignants.
   Le matériel « réservable » (camion, lot d’ARI…) s’ajoute aux locaux et équipements des séances : deux séances qui le
   veulent au même moment sont en conflit. */
const SK_CATS=[['epi','EPI','helmet','Casques, habits de combat, bottes, gants'],['ari','ARI et air comprimé','tank','Bouteilles, masques, détendeurs'],['mat','Matériel','tool','Tuyaux, lances, échelles, désincarcération'],['conso','Consommables','drop','Émulseur, balises, premiers soins, carburant']];
const SK_ST={service:['ok','En service'],reserve:['info','En réserve'],maint:['warn','En maintenance'],hs:['bad','Hors service']};
const SK_MV={entree:['info','Entrée'],dotation:['k0','Dotation'],retourDot:['off','Retour de dotation'],sortie:['warn','Sortie'],retour:['ok','Retour'],bris:['bad','Bris'],maint:['warn','Maintenance'],service:['ok','Remise en service'],hs:['bad','Retrait'],insp:['ok','Inspection'],epreuve:['ok','Épreuve hydraulique'],conso:['k5','Consommation'],reappro:['info','Réapprovisionnement'],ajust:['off','Ajustement']};
const SK_DEF={cats:{epi:{insp:12,vie:10},ari:{insp:1,ep:5,vie:15},mat:{insp:12,vie:0},conso:{}},alerte:30,empl:['Réserve atelier','Salle ARI','Autopompe 119','Entrepôt'],perms:{sortie:true,bris:true}};
function skCfg(){
  const c=cfg().stock||{}, cc=c.cats||{}, cats={};
  for(const [k] of SK_CATS) cats[k]=Object.assign({},SK_DEF.cats[k],cc[k]||{});
  return {cats,alerte:+c.alerte>0?+c.alerte:SK_DEF.alerte,empl:Array.isArray(c.empl)?c.empl:SK_DEF.empl,perms:Object.assign({},SK_DEF.perms,c.perms||{})};
}
const skArts=()=>(S.data.stock||[]);
const skCat=k=>SK_CATS.find(c=>c[0]===k)||SK_CATS[2];
const skQte=a=>a.suivi==='qte';
const skName=a=>a.nom+(a.code?' · '+a.code:'');
const addMonths=(d,m)=>{if(!d||!m)return '';const x=parse(d);x.setMonth(x.getMonth()+(+m));return iso(x);};
/* L’épreuve hydraulique ne concerne que les bouteilles sous pression (ARI) */
const skEp=a=>a.cat==='ari'&&(!!a.epDer||/bouteille|cylindre/i.test(a.nom||''));
/* Les échéances d’un article à l’unité : inspection, épreuve hydraulique (bouteilles d’ARI), fin de vie */
function skDue(a){
  if(skQte(a)) return [];
  const k=skCfg().cats[a.cat]||{}, out=[], base=a.inspDer||a.fab||'';
  const f=+a.inspFreq||+k.insp;if(f&&base) out.push({t:'insp',l:'Inspection',date:addMonths(base,f)});
  if(skEp(a)&&k.ep&&(a.epDer||a.fab)) out.push({t:'epreuve',l:'Épreuve hydraulique',date:addMonths(a.epDer||a.fab,12*k.ep)});
  if(k.vie&&a.fab) out.push({t:'vie',l:'Fin de vie',date:addMonths(a.fab,12*k.vie)});
  return out.sort((x,y)=>x.date.localeCompare(y.date));
}
/* Conformité : ok (vert), warn (orange : échéance proche, maintenance, sous le seuil), bad (rouge : en retard, hors service, rupture) */
function skConf(a){
  const t=todayISO(), soon=iso(addDays(new Date(),skCfg().alerte));
  if(skQte(a)){const q=+a.qte||0;return q<=0?['bad','Rupture']:a.min&&q<+a.min?['warn','Sous le seuil']:['ok','Suffisant'];}
  if(a.statut==='hs') return ['bad','Hors service'];
  const d=skDue(a)[0];
  if(d&&d.date<t) return ['bad',`${d.l} en retard`];
  if(a.statut==='maint') return ['warn','En maintenance'];
  if(d&&d.date<=soon) return ['warn',`${d.l} le ${shortDate(parse(d.date))}`];
  return ['ok','Conforme'];
}

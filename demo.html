/* Le menu du Stock */
function stockTabs(){
  const A=skArts(), n=c=>A.filter(a=>a.cat===c).length, due=A.filter(a=>!skQte(a)&&skConf(a)[0]!=='ok'&&a.statut!=='hs').length, low=A.filter(a=>skQte(a)&&skConf(a)[0]!=='ok').length;
  const cats=SK_CATS.map(([k,l,i])=>({k,l,i,n:k==='conso'&&low?low:n(k),bad:k==='conso'&&!!low,nt:k==='conso'&&low?pl(low,'consommable sous le seuil','consommables sous le seuil'):''}));
  if(S.role!=='admin') return [{k:'tout',l:'Tout l’inventaire',i:'box',n:A.length}].concat(cats,[{k:'mvt',l:'Mouvements',i:'move',sec:'Suivi'}]);
  return [{k:'dash',l:'Tableau de bord',i:'spark'},{k:'tout',l:'Tout l’inventaire',i:'box',sec:'Inventaire',n:A.length}].concat(cats,
    [{k:'dot',l:'Dotations',i:'users',sec:'Suivi'},{k:'mvt',l:'Mouvements',i:'move'},{k:'insp',l:'Inspections',i:'calok',n:due,bad:!!due,nt:due?pl(due,'échéance proche ou dépassée','échéances proches ou dépassées'):''},{k:'regl',l:'Réglages du stock',i:'gear',sec:'Réglages'}]);
}
function stockPage(){
  const tabs=stockTabs(), tab=tabs.some(t=>t.k===S.pg.sk)?S.pg.sk:tabs[0].k;
  if(!S.loaded.stock) return '<div class="empty"><p>Chargement du stock…</p></div>';
  if(tab==='dash') return skDash();
  if(tab==='dot') return skDotPage();
  if(tab==='mvt') return skMvtPage();
  if(tab==='insp') return skInspPage();
  if(tab==='regl') return skReglPage();
  return skList(tab==='tout'?'':tab);
}
const skTile=(id,v,lbl,val,cls,sub)=>`<button type="button" class="xm-tile" id="${id}" data-act="pg-set" data-k="sk" data-v="${v}" aria-pressed="false"><span class="lbl">${lbl}</span><b class="${cls}">${val}</b><small>${sub}</small></button>`;
function skDash(){
  const A=skArts(), due=A.filter(a=>!skQte(a)&&a.statut!=='hs'&&skConf(a)[0]!=='ok'), late=due.filter(a=>skConf(a)[0]==='bad'), low=A.filter(a=>skQte(a)&&skConf(a)[0]!=='ok'), off=A.filter(a=>!skQte(a)&&(a.statut==='hs'||a.statut==='maint')), out=A.filter(a=>a.sortie&&a.sortie.le);
  const tiles=`<div class="xm-tiles" role="group" aria-label="Indicateurs du stock">${skTile('skd-tout','tout','Inventaire',A.length,'',`${A.filter(a=>!skQte(a)).length} à l’unité · ${A.filter(skQte).length} en quantité`)}
    ${skTile('skd-insp','insp','Inspections dues',due.length,due.length?late.length?'bad':'warn':'',late.length?pl(late.length,'en retard','en retard'):`dans les ${skCfg().alerte} prochains jours`)}
    ${skTile('skd-conso','conso','Consommables bas',low.length,low.length?'warn':'',low.length?esc(low.slice(0,2).map(a=>a.nom).join(', ')):'Tout est suffisant')}
    ${skTile('skd-off','tout','Hors service ou en maintenance',off.length,off.length?'bad':'',off.length?pl(off.filter(a=>a.statut==='hs').length,'hors service','hors service'):'Aucun')}</div>`;
  const todo=[...late,...low.filter(a=>skConf(a)[0]==='bad'),...due.filter(a=>skConf(a)[0]!=='bad'),...low.filter(a=>skConf(a)[0]!=='bad'),...A.filter(a=>a.statut==='hs')].filter((a,i,arr)=>arr.indexOf(a)===i).slice(0,10);
  const li=a=>{const c=skConf(a);return `<li><button class="link" type="button" data-act="stk-open" data-id="${esc(a.id)}">${esc(skName(a))}</button><span class="chip ${c[0]}">${esc(c[1])}</span></li>`;};
  const mv=(S.data.stockMvt||[]).slice(0,6);
  return tiles+`<div class="two">
    <section class="panel" id="skd-todo"><h2>À faire</h2>${todo.length?`<ul class="plist">${todo.map(li).join('')}</ul>`:'<p class="help">Rien à faire : tout le matériel est conforme et les consommables suffisent.</p>'}</section>
    <div class="stackp"><section class="panel" id="skd-out"><h2>Sorties en cours</h2>${out.length?`<ul class="plist">${out.map(a=>`<li><span><button class="link" type="button" data-act="stk-open" data-id="${esc(a.id)}">${esc(skName(a))}</button><span class="muted sm"> · ${esc(skSortieTxt(a))}</span></span>${skCanDo('retour')&&S.conn==='shared'?`<button class="btn sm" type="button" data-act="stk-go" data-id="${esc(a.id)}" data-v="retour">Retour</button>`:''}</li>`).join('')}</ul>`:'<p class="help">Aucun matériel sorti.</p>'}</section>
    <section class="panel" id="skd-mvt"><h2>Derniers mouvements</h2>${mv.length?`<ul class="plist">${mv.map(m=>`<li><span>${esc(m.nom||'')}<span class="muted sm"> · ${esc(ago(m.le))}</span></span><span class="chip ${(SK_MV[m.type]||['off'])[0]}">${esc((SK_MV[m.type]||['',m.type])[1])}</span></li>`).join('')}</ul><div class="row" style="margin-top:8px"><button class="btn sm ghost" type="button" data-act="pg-set" data-k="sk" data-v="mvt">Tous les mouvements</button></div>`:'<p class="help">Aucun mouvement pour l’instant.</p>'}</section></div></div>`;
}
const skSortieTxt=a=>{const s=a.sortie||{};return ['sorti '+ago(s.le),s.seance&&s.seance.titre?s.seance.titre:'',s.instr?tName(s.instr):''].filter(Boolean).join(' · ');};
/* L’inventaire (tout, ou une catégorie) */
function skList(cat){
  const st=S.pg, q=String(st.sq||'').trim().toLowerCase(), f=st.sf||'', can=S.conn==='shared';
  let A=skArts().filter(a=>!cat||a.cat===cat);
  const tot=A.length;
  if(q) A=A.filter(a=>[a.nom,a.code,a.serie,a.lot,a.empl,skWho(a)].some(x=>String(x||'').toLowerCase().includes(q)));
  if(f) A=A.filter(a=>f==='late'?skConf(a)[0]==='bad'&&!skQte(a):f==='soon'?skConf(a)[0]!=='ok'&&!skQte(a):f==='low'?skQte(a)&&skConf(a)[0]!=='ok':f==='attr'?!!(a.attrib&&a.attrib.id):f==='out'?!!(a.sortie&&a.sortie.le):!skQte(a)&&a.statut===f);
  A=A.slice().sort((a,b)=>SK_CATS.findIndex(c=>c[0]===a.cat)-SK_CATS.findIndex(c=>c[0]===b.cat)||collator.compare(a.nom||'',b.nom||'')||collator.compare(a.code||'',b.code||''));
  const opts=[['','Tout afficher'],['soon','À inspecter bientôt'],['late','En retard'],['low','Consommables bas'],['attr','Attribués'],['out','Sortis'],['service','En service'],['reserve','En réserve'],['maint','En maintenance'],['hs','Hors service']];
  const tb=`<div class="toolbar"><input class="search" id="stk-q" type="search" placeholder="Nom, code, n° de série, emplacement" aria-label="Rechercher dans le stock" autocomplete="off" value="${esc(st.sq||'')}"><select id="stk-f" aria-label="Afficher">${opts.map(([k,l])=>`<option value="${k}"${f===k?' selected':''}>${l}</option>`).join('')}</select><span class="grow"></span>${isAdmin()&&can?`<button class="btn primary" type="button" id="stk-add" data-act="stk-new" data-v="${cat||''}">${icon('plus')}Ajouter un article</button>`:''}</div>`;
  const head=[['Article'],[cat?'Emplacement':'Catégorie'],['Quantité ou attribution'],['État'],['','r']];
  if(!tot) return tb+emptyBox(cat?`Aucun article dans ${skCat(cat)[1]}`:'Le stock est vide',isAdmin()?'« Ajouter un article » inscrit un équipement, un lot ou un consommable.':'L’administration inscrit le matériel de l’école.');
  const rows=A.map(a=>{const c=skConf(a), who=skWho(a);
    const qty=skQte(a)?`<span class="stk-q"><b class="${c[0]==='ok'?'':c[0]}">${esc(String(+a.qte||0))}</b> ${esc(a.unite||'')}${a.min?`<small> · seuil ${esc(String(a.min))}</small>`:''}</span>`:who?`<span>${esc(who)}</span>`:a.sortie&&a.sortie.le?'<span class="muted">Sorti</span>':`<span class="muted">${esc((SK_ST[a.statut]||SK_ST.service)[1])}</span>`;
    return xRow('xm-sk',`data-act="stk-open" data-id="${esc(a.id)}"`,`<div class="xm-t"><b>${esc(a.nom)}</b><small>${esc([a.code,a.serie?'n° '+a.serie:'',a.taille?'taille '+a.taille:''].filter(Boolean).join(' · ')||'—')}</small></div>
      <span class="xm-m">${esc(cat?a.empl||'—':skCat(a.cat)[1])}</span>${qty}<span class="stk-c"><i class="dot ${c[0]}" aria-hidden="true"></i>${esc(c[1])}</span><div class="xm-end">${a.resa?'<span class="chip off">Réservable</span>':''}</div>`,skName(a));}).join('');
  return tb+(A.length?xList('xm-sk',head,rows):'<section class="panel"><p class="help">Aucun article ne correspond.</p></section>')+`<p class="help" style="margin-top:8px">${A.length===tot?pl(tot,'article','articles'):`${A.length} sur ${tot}`}.</p>`;
}
/* Dotations : ce que chaque élève (ou la classe) a reçu */
function skDotPage(){
  const gs=groups(), g=gs.some(x=>x.id===S.pg.sg)?S.pg.sg:(gs[0]||{}).id, can=isAdmin()&&S.conn==='shared', A=skArts();
  if(!gs.length) return emptyBox('Aucune classe','Les dotations se font aux élèves d’une classe.');
  const tb=`<div class="toolbar"><select id="stk-g" aria-label="Classe">${gs.map(x=>`<option value="${esc(x.id)}"${x.id===g?' selected':''}>${esc(x.nom)}</option>`).join('')}</select><span class="grow"></span>${can?`<button class="btn" type="button" id="stk-dot-cls" data-act="stk-dot" data-t="classe" data-id="${esc(g)}">${icon('plus')}Attribuer à la classe</button>`:''}</div>`;
  const els=sortElsByClass(S.data.eleves.filter(e=>e.groupe===g)), mine=id=>A.filter(a=>a.attrib&&a.attrib.t==='eleve'&&a.attrib.id===id), cls=A.filter(a=>a.attrib&&a.attrib.t==='classe'&&a.attrib.id===g);
  const chips=list=>list.length?list.map(a=>`<button class="chip ${skConf(a)[0]==='ok'?'off':skConf(a)[0]}" type="button" data-act="stk-open" data-id="${esc(a.id)}" title="${esc(skConf(a)[1])}">${esc(a.nom)}${a.taille?' '+esc(a.taille):''}</button>`).join(''):'<span class="muted">Rien d’attribué</span>';
  const all=els.reduce((n,e)=>n+mine(e.id).length,0)+cls.length;
  const rows=els.map(e=>{const m=mine(e.id);return `<tr id="stk-e-${esc(e.id)}"><td><span class="tb-who"><span class="st-num sm" aria-hidden="true">${e.numero!=null&&e.numero!==''?esc(e.numero):'—'}</span><span>${esc(e.nom)}</span></span></td><td><div class="stk-chips">${chips(m)}</div></td><td class="r">${can?`<button class="btn sm" type="button" data-act="stk-dot" data-t="eleve" data-id="${esc(e.id)}">Attribuer</button>`:''}${m.length?`<button class="btn sm ghost" type="button" data-act="stk-dot-pr" data-id="${esc(e.id)}">${icon('print')}Feuille</button>`:''}</td></tr>`;}).join('');
  return tb+`<section class="panel" id="stk-cls"><h2>Lot de la classe</h2><div class="stk-chips">${chips(cls)}</div></section>
    <div class="tbl-wrap" style="margin-top:12px"><table class="tbl stack"><thead><tr><th>Élève</th><th>Équipement attribué</th><th class="r"></th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="muted">Aucun élève dans cette classe.</td></tr>'}</tbody></table></div>
    ${can&&all?`<div class="row" style="margin-top:12px">${S.pg.sback===g?`<span class="help">Reprendre les ${all} articles de ${esc(gName(g))} (fin de cohorte) ?</span><button class="btn sm danger" type="button" id="stk-back-go" data-act="stk-back" data-id="${esc(g)}"${dis()}>Oui, tout reprendre</button><button class="btn sm ghost" type="button" data-act="pg-set" data-k="sback" data-v="">Annuler</button>`:`<button class="btn sm ghost" type="button" id="stk-back" data-act="pg-set" data-k="sback" data-v="${esc(g)}">Tout reprendre (fin de cohorte)</button>`}</div>`:''}`;
}
/* Mouvements : le journal de tout ce qui bouge */
function skMvtPage(){
  const st=S.pg, ty=st.smt||'', q=String(st.smq||'').trim().toLowerCase(), lim=+st.lim||60;
  let M=(S.data.stockMvt||[]).filter(m=>!ty||m.type===ty);
  if(q) M=M.filter(m=>[m.nom,m.note,m.par,m.instr?tName(m.instr):'',m.eleve?(byId(S.data.eleves,m.eleve)||{}).nom:'',m.classe?gName(m.classe):'',m.seance&&m.seance.titre].some(x=>String(x||'').toLowerCase().includes(q)));
  const tb=`<div class="toolbar"><input class="search" id="stk-mq" type="search" placeholder="Article, personne, séance" aria-label="Rechercher un mouvement" autocomplete="off" value="${esc(st.smq||'')}"><select id="stk-mt" aria-label="Type de mouvement"><option value="">Tous les mouvements</option>${Object.entries(SK_MV).map(([k,[,l]])=>`<option value="${k}"${ty===k?' selected':''}>${l}</option>`).join('')}</select><span class="grow"></span><button class="btn" type="button" id="stk-mvt-exp" data-act="stk-mvt-exp">${icon('down')}Exporter</button></div>`;
  if(!M.length) return tb+emptyBox('Aucun mouvement','Les dotations, sorties, retours, bris, inspections et consommations paraîtront ici.');
  const det=m=>[m.qte&&m.qte!==1?`${m.qte>0&&m.type!=='conso'?'+':''}${m.type==='conso'?'−':''}${Math.abs(m.qte)}`:'',m.eleve?(byId(S.data.eleves,m.eleve)||{}).nom:'',m.classe?gName(m.classe):'',m.seance&&m.seance.titre,m.instr?tName(m.instr):'',m.note].filter(Boolean).join(' · ');
  const rows=M.slice(0,lim).map(m=>xRow('xm-skm',m.art?`data-act="stk-open" data-id="${esc(m.art)}"`:'',`${xDate({date:m.date||String(m.le).slice(0,10)},'')}<div class="xm-t"><b>${esc(m.nom||'')}</b><small>${esc(det(m)||'—')}</small></div><span><span class="chip ${(SK_MV[m.type]||['off'])[0]}">${esc((SK_MV[m.type]||['',m.type])[1])}</span></span><span class="xm-m">${esc(m.par||'')}</span>`,m.nom||'')).join('');
  return tb+xList('xm-skm',[[''],['Article'],['Mouvement'],['Par']],rows)+(M.length>lim?`<div class="row" style="margin-top:12px"><button class="btn" type="button" data-act="pg-set" data-k="lim" data-v="${lim+60}">Afficher plus (${M.length-lim})</button></div>`:'');
}
/* Inspections : les échéances, de la plus urgente à la plus lointaine (90 jours) */
function skInspPage(){
  const t=todayISO(), far=iso(addDays(new Date(),90)), soon=iso(addDays(new Date(),skCfg().alerte)), can=isAdmin()&&S.conn==='shared';
  const L=[];for(const a of skArts()) if(!skQte(a)&&a.statut!=='hs') for(const d of skDue(a)) if(d.date<=far) L.push({a,d});
  L.sort((x,y)=>x.d.date.localeCompare(y.d.date));
  if(!L.length) return emptyBox('Aucune échéance dans les 90 prochains jours','Les inspections, épreuves hydrauliques et fins de vie à venir paraîtront ici.');
  const grp=[['En retard',x=>x.d.date<t,'bad'],[`Dans les ${skCfg().alerte} prochains jours`,x=>x.d.date>=t&&x.d.date<=soon,'warn'],['Plus tard (90 jours)',x=>x.d.date>soon,'']];
  return grp.map(([l,f,cls])=>{const xs=L.filter(f);if(!xs.length)return '';
    return `<section class="panel stk-ig"><h2>${l} <span class="chip ${cls||'off'}">${xs.length}</span></h2>${xList('xm-ski',[[''],['Article'],['Échéance'],['','r']],xs.map(({a,d})=>xRow('xm-ski','',`${xDate({date:d.date},cls==='bad'?'hot':'')}<div class="xm-t"><button class="link" type="button" data-act="stk-open" data-id="${esc(a.id)}">${esc(skName(a))}</button><small>${esc([skCat(a.cat)[1],a.empl,skWho(a)].filter(Boolean).join(' · '))}</small></div><span class="xm-m">${esc(d.l)}</span><div class="xm-end">${can?d.t==='vie'?`<button class="btn sm ghost" type="button" data-act="stk-go" data-id="${esc(a.id)}" data-v="hs">Retirer du service</button>`:`<button class="btn sm" type="button" data-act="stk-go" data-id="${esc(a.id)}" data-v="${d.t}">${d.t==='epreuve'?'Épreuve faite':'Inspection faite'}</button>`:''}</div>`,'')).join(''))}</section>`;}).join('');
}
/* Réglages du stock */

    ${SK_CATS.filter(c=>c[0]!=='conso').map(([c,l])=>`<section class="panel ps-card"><h3>${l}</h3>
      ${num('sr-'+c+'-insp','Inspection tous les (mois)',k.cats[c].insp||'','min="0" max="120" step="1"')}
      ${c==='ari'?num('sr-ari-ep','Épreuve hydraulique tous les (ans)',k.cats.ari.ep||'','min="0" max="20" step="1"'):''}

    <section class="panel ps-card"><h3>Les enseignants peuvent</h3>
      <label class="ps-chk"><input type="checkbox" id="sr-p-sortie"${k.perms.sortie?' checked':''}${off}><span><b>Sortir et retourner le matériel</b><small>Pour une manœuvre, avec le contrôle au retour.</small></span></label>
      <label class="ps-chk"><input type="checkbox" id="sr-p-bris"${k.perms.bris?' checked':''}${off}><span><b>Déclarer un bris</b><small>L’article passe en maintenance ou hors service.</small></span></label>

}
async function skSaveRegl(f){
  const q=id=>f.querySelector('#'+id), n=(id,a,b,d)=>{const v=Math.round(+q(id).value);return v>=a&&v<=b?v:d;};
  const c=configDoc(), cats={};
  for(const [k] of SK_CATS) if(k!=='conso') cats[k]={insp:n('sr-'+k+'-insp',0,120,SK_DEF.cats[k].insp),vie:n('sr-'+k+'-vie',0,50,0)};
  cats.ari.ep=n('sr-ari-ep',0,20,5);cats.conso={};
  c.stock={cats,alerte:n('sr-alerte',1,180,30),empl:[...new Set(q('sr-empl').value.split('\n').map(x=>x.trim()).filter(Boolean))],perms:{sortie:q('sr-p-sortie').checked,bris:q('sr-p-bris').checked}};
  await saveConfig(c,'Réglages du stock enregistrés');
}
/* ---------- La fenêtre d’un article : fiche, ajout et modification, actions ---------- */

  const d=S.dr, a=d.id?byId(skArts(),d.id):null;
  if(d.mode==='dot') return skDotDrawer(d);
  if(d.mode!=='new'&&!a) return goneHTML('Article');
  if(d.mode==='new'||d.mode==='edit') return skForm(d,a);
  if(d.mode==='act') return skActForm(d,a);
  const c=skConf(a), due=skDue(a), can=S.conn==='shared', mv=(S.data.stockMvt||[]).filter(m=>m.art===a.id).slice(0,12);
  const fact=(l,v)=>`<div><dt>${l}</dt><dd>${v||'<span class="muted">—</span>'}</dd></div>`;
  const btn=(act,l,cls)=>skCanDo(act)&&can?`<button class="btn sm${cls?' '+cls:''}" type="button" data-act="stk-do" data-v="${act}">${l}</button>`:'';
  const acts=skQte(a)?[btn('conso','Consommer'),btn('reappro','Réapprovisionner'),btn('ajust','Ajuster la quantité','ghost')]
    :[a.sortie&&a.sortie.le?btn('retour','Retour de manœuvre','primary'):a.statut!=='hs'&&a.statut!=='maint'?btn('sortie','Sortir pour une manœuvre'):'',
      a.attrib&&a.attrib.id?btn('retourDot','Reprendre l’article'):a.statut!=='hs'?btn('dotation','Attribuer'):'',
      btn('insp','Inspection faite'),skEp(a)?btn('epreuve','Épreuve hydraulique faite'):'',
      a.statut==='maint'||a.statut==='hs'?btn('service','Remettre en service'):btn('bris','Déclarer un bris'),a.statut!=='maint'&&a.statut!=='hs'?btn('maint','Envoyer en maintenance','ghost'):'',a.statut!=='hs'?btn('hs','Retirer du service','ghost'):''];
  return dTop(skCat(a.cat)[1],esc(a.nom),esc([a.code,a.serie?'n° '+a.serie:''].filter(Boolean).join(' · ')))

const CP_DEP=[['salaires','Salaires des instructeurs'],['materiel','Matériel et équipement'],['conso','Consommables'],['entretien','Entretien et réparations'],['examens','Frais d’examens'],['admin','Administration'],['autres','Autres dépenses']];

/* Frais d’un élève : ce qu’il doit (tarifs de sa classe, par échéance), ce qu’il a payé, les réductions, le retard */
function cpFee(e,src){
  const t=todayISO(), T=cpCfg().tarifs.filter(x=>!x.classe||x.classe===e.groupe);let du=0,dueNow=0,next=null;
  for(const x of T){
    const m=+x.montant||0, ech=(x.ech||[]).filter(y=>y.date&&+y.pct>0).sort((a,b)=>a.date.localeCompare(b.date));du+=m;
    if(!ech.length){dueNow+=m;continue;}
    let acc=0;ech.forEach((y,i)=>{const part=i===ech.length-1?m-acc:Math.round(m*(+y.pct)/100);acc+=part;if(y.date<=t)dueNow+=part;else if(!next||y.date<next.date)next={date:y.date,m:part};});
  }
  const E=(src||cpE()).filter(x=>x.eleve===e.id), paid=sumC(E.filter(x=>x.type==='rev').map(x=>x.ttc)), red=sumC(E.filter(x=>x.type==='red').map(x=>x.ttc));
  const solde=du-red-paid, retard=Math.max(0,Math.min(solde,dueNow-red-paid));
  return {du,paid,red,solde,retard,next,T,E,etat:!du?'aucun':solde<=0?'paye':retard>0?'retard':'ajour'};
}

  if(!E.length) return tb+emptyBox(t==='dep'?'Aucune dépense':'Aucun paiement reçu',t==='dep'?'Les achats, l’entretien et la paie payée paraîtront ici. Un réapprovisionnement du Stock avec un coût s’y ajoute tout seul.':'Les paiements des élèves, des factures et les autres revenus (subventions) paraîtront ici.');
  const rows=E.slice(0,lim).map(x=>`<tr class="row-link" data-act="ca-entry" data-id="${esc(x.id)}"><td>${esc(shortDate(parse(x.date)))}</td><td><b>${esc(x.libelle||cpPoste(x.type,x.poste))}</b>${x.type==='red'?' <span class="chip off">Réduction</span>':''}<small class="tb-sub">${esc([cpPoste(x.type==='red'?'rev':x.type,x.poste),x.eleve?(byId(S.data.eleves,x.eleve)||{}).nom:'',x.tiers].filter(Boolean).join(' · '))}</small></td><td>${esc(x.mode||'')}</td><td class="num"><b class="cp-amt ${x.type==='dep'?'dep':'rev'}">${esc(fmtM(x.ttc))}</b>${x.tps||x.tvq?`<small class="tb-sub">dont taxes ${esc(fmtM((+x.tps||0)+(+x.tvq||0)))}</small>`:''}</td></tr>`).join('');
  return tb+`<div class="tbl-wrap"><table class="tbl stack cp-tbl"><thead><tr><th>Date</th><th>Écriture</th><th>Mode</th><th class="num">Montant</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="3">${pl(E.length,'écriture','écritures')}</th><th class="num">${esc(fmtM(sumC(E.map(x=>x.ttc))))}</th></tr></tfoot></table></div>`

}
/* Paie des instructeurs */
function cpPaiePage(){

  const rows=R.map(r=>{const sl=cpSlip(r.t,m), h=sl?sl.h:r.h, mt=sl?sl.montant:r.mt, changed=sl&&(sl.h!==r.h||sl.montant!==r.mt);

/* Rapports */
function cpRapPage(){
  const E=cpE(), ms=hrMonths(), sm=(t,m)=>sumC(E.filter(x=>x.type===t&&String(x.date).slice(0,7)===m).map(x=>x.ttc));
  const rows=ms.map(m=>{const r=sm('rev',m), d=sm('dep',m);return `<tr><td>${esc(hrMonthName(m))}</td><td class="num">${esc(fmtM(r))}</td><td class="num">${esc(fmtM(d))}</td><td class="num ${r-d<0?'bad':''}">${esc(fmtM(r-d))}</td></tr>`;}).join('');
  const dep=sumC(E.filter(x=>x.type==='dep').map(x=>x.ttc)), nEl=S.data.eleves.length, TR=taughtRows(), hrs=sumC(TR.map(r=>r.h)), sal=sumC(TR.map(r=>Math.round(r.h*cpRate(r.t,r.s))));
  /* coût par module : heures données au taux des instructeurs, et consommables utilisés pendant ses séances */
  const byM={};const mk=s=>{const k=modOf(s.c);return k?`M${k.code} ${k.nom||''}`.trim():(s.c.code||s.c.titre||'—');};
  for(const r of TR){const k=mk(r.s), o=byM[k]||(byM[k]={h:0,sal:0,con:0});o.h+=r.h;o.sal+=Math.round(r.h*cpRate(r.t,r.s));}
  for(const m of S.data.stockMvt||[]) if(m.type==='conso'&&m.seance){const s=findSess(m.seance.date,m.seance.key), a=byId(skArts(),m.art);if(!s||!a||!a.prix) continue;const k=mk(s), o=byM[k]||(byM[k]={h:0,sal:0,con:0});o.con+=Math.round((+m.qte||0)*a.prix);}
  const mods=Object.entries(byM).sort((a,b)=>collator.compare(a[0],b[0]));
  return `<div class="kpis">${cpKpi('cpr-el','Coût par élève',nEl?fmtM(Math.round(dep/nEl)):'—','',`dépenses ÷ ${pl(nEl,'élève','élèves')}`)}${cpKpi('cpr-h','Heures d’instruction',hrFmt(hrs)+' h','','données depuis la rentrée')}${cpKpi('cpr-ch','Coût d’une heure',hrs?fmtM(Math.round(sal/hrs)):'—','','au taux des instructeurs')}${cpKpi('cpr-sal','Salaires estimés',fmtM(sal),'','pour les heures données')}</div>
    <div class="two" style="margin-top:12px"><section class="panel"><h2>Par mois</h2><div class="tbl-wrap"><table class="tbl cp-tbl"><thead><tr><th>Mois</th><th class="num">Revenus</th><th class="num">Dépenses</th><th class="num">Solde</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <section class="panel"><h2>Par module</h2>${mods.length?`<div class="tbl-wrap"><table class="tbl cp-tbl"><thead><tr><th>Module</th><th class="num">Heures</th><th class="num">Instructeurs</th><th class="num">Consommables</th><th class="num">Total</th></tr></thead><tbody>${mods.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${esc(hrFmt(o.h))}</td><td class="num">${esc(fmtM(o.sal))}</td><td class="num">${esc(fmtM(o.con))}</td><td class="num"><b>${esc(fmtM(o.sal+o.con))}</b></td></tr>`).join('')}</tbody></table></div>`:'<p class="help">Aucune heure donnée pour l’instant.</p>'}</section></div>
    <section class="panel" style="margin-top:12px"><h2>Exporter pour le comptable</h2><div class="row">${[['ecritures','Toutes les écritures'],['frais','Frais des élèves'],['factures','Factures'],['paie','Paie du mois']].map(([k,l])=>`<button class="btn sm" type="button" id="ca-exp-${k}" data-act="ca-exp" data-v="${k}">${icon('down')}${l}</button>`).join('')}</div><p class="help" style="margin-top:6px">Des fichiers CSV qui s’ouvrent dans Excel et s’importent dans la plupart des logiciels comptables.</p></section>`;
}

async function cpSaveRegl(f){
  const q=id=>f.querySelector('#'+id), pc=id=>{const n=+String(q(id).value).replace(',','.');return n>=0&&n<=50?n:null;};
  const tps=pc('cr-tps'), tvq=pc('cr-tvq');if(tps==null||tvq==null){toast('Les taux de taxes sont entre 0 et 50 %.','bad');return;}
  const td=money(q('cr-taux').value);if(td==null){toast('Le taux horaire par défaut n’est pas valide.','bad');return;}
  const opt=id=>{const v=q(id).value.trim();return v?money(v):null;}, par={};
  for(const x of f.querySelectorAll('[data-tp]')){const v=x.value.trim();if(!v)continue;const m=money(v);if(m==null){toast('Un taux d’instructeur n’est pas valide.','bad');return;}par[x.dataset.tp]=m;}
  const tarifs=[];
  for(const i of new Set([...f.querySelectorAll('[data-tf]')].map(x=>x.dataset.tf))){
    const g=k=>{const x=f.querySelector(`[data-tf="${i}"][data-k="${k}"]:not([data-e])`);return x?x.value.trim():'';}, nom=g('nom');if(!nom) continue;
    const m=money(g('montant'));if(!m){toast(`Le montant du tarif « ${nom} » n’est pas valide.`,'bad');return;}
    const ech=[];for(const j of [0,1,2]){const dt=(f.querySelector(`[data-tf="${i}"][data-e="${j}"][data-k="date"]`)||{}).value, p=+(f.querySelector(`[data-tf="${i}"][data-e="${j}"][data-k="pct"]`)||{}).value;if(dt&&p>0)ech.push({date:dt,pct:p});}
    if(ech.length&&sumC(ech.map(x=>x.pct))!==100){toast(`Les échéances du tarif « ${nom} » doivent totaliser 100 %.`,'bad');return;}
    const old=cpCfg().tarifs[+i];tarifs.push({id:old&&old.id?old.id:cpId('t'),nom,montant:m,classe:g('classe'),ech});
  }
  const c=Object.assign({},S.data.cptCfg||{},{taxes:{on:q('cr-tx').checked,tps,tvq},prefixe:q('cr-pre').value.trim(),modes:[...new Set(q('cr-modes').value.split('\n').map(x=>x.trim()).filter(Boolean))],taux:{defaut:td,theorie:opt('cr-taux-t'),pratique:opt('cr-taux-p'),par}});
  delete c.id;delete c.tarifs;
  const cd=configDoc();cd.tarifs=tarifs;
  S.busy=true;render();
  await write(async()=>{await DB.doc('compta-reglages/ecole').set(c);await DB.doc('config/ecole').set(cd);},'Réglages de la compta enregistrés');
  S.busy=false;render();
}

/* ---------- Import : liste d’élèves, copie de l’horaire d’une classe ----------
   Liste d’élèves collée ou lue d’un fichier, une ligne par élève. Colonnes séparées par une tabulation (cellules copiées
   d’Excel), un point-virgule ou une virgule : numéro, nom (ou prénom et nom), courriel, téléphone.
   Une première ligne de titres est reconnue ; sans titres, on devine chaque case. */
function csvCells(line,sep){
  const out=[];let cur='', q=false;
  for(let i=0;i<line.length;i++){const ch=line[i];
    if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"'&&!cur) q=true;
    else if(ch===sep){out.push(cur);cur='';}
    else cur+=ch;}
  out.push(cur);
  return out.map(c=>c.replace(/\s+/g,' ').trim());
}
function parseStudents(text){
  const lines=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean).slice(0,400);
  if(!lines.length) return [];
  const count=ch=>lines.slice(0,10).reduce((n,l)=>n+l.split(ch).length-1,0), sep=count('\t')?'\t':count(';')?';':count(',')?',':null;
  let rows=lines.map(l=>sep?csvCells(l,sep):[l.replace(/\s+/g,' ').trim()]), map=null;
  const H={numero:/^(n[°ºo]\.?|no\.?|num[ée]ro|#|matricule)$/i,prenom:/^pr[ée]nom$/i,nom:/^(nom|nom de famille|[ée]l[èe]ve|nom complet)$/i,courriel:/^(courriel|e-?mail|adresse courriel)$/i,telephone:/^(t[ée]l[ée]phone|t[ée]l\.?|cellulaire)$/i};
  const head=rows[0].map(c=>Object.keys(H).find(k=>H[k].test(c))||'');
  if(head.includes('nom')||head.includes('prenom')){map=head;rows=rows.slice(1);}
  return rows.map(r=>{
    const o={nom:'',numero:null,courriel:'',telephone:''}, names=[];let pre='';
    r.forEach((c,i)=>{
      if(!c) return;
      const k=map?map[i]:/^\d{1,3}$/.test(c)&&o.numero==null?'numero':/@/.test(c)?'courriel':/^[\d\s().+-]{7,}$/.test(c)?'telephone':'nom';
      if(k==='numero'){const n=parseInt(c,10);if(n>0)o.numero=n;}
      else if(k==='prenom') pre=c;
      else if(k==='nom') names.push(c);
      else if(k==='courriel') o.courriel=c;
      else if(k==='telephone') o.telephone=c;
    });
    o.nom=(pre?pre+' ':'')+names.join(' ');
    return o;
  }).filter(o=>o.nom.trim());
}
/* Lit un fichier texte ; un CSV enregistré par Excel sous Windows n’est pas en UTF-8 : on le relit alors en Windows-1252 */
function readTextFile(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej(r.error);
    r.onload=()=>{const t=String(r.result||'');if(!t.includes(String.fromCharCode(0xFFFD))){res(t);return;}const r2=new FileReader();r2.onerror=()=>res(t);r2.onload=()=>res(String(r2.result||''));r2.readAsText(file,'windows-1252');};
    r.readAsText(file);
  });
}
/* Copie de l’horaire d’une classe vers une autre : la première journée de classe de la source tombe à la date choisie,
   et les journées suivantes se suivent dans le même ordre, en sautant les fins de semaine et les congés.
   Les séances annulées, les présences et les résultats ne sont pas copiés. */
function copyPlan(src,dst,start){
  const items=[], schoolDay=ds=>{const j=parse(ds).getDay();return j!==0&&j!==6&&!offDay(ds);};
  for(const c of S.data.cours.filter(c=>c.groupe===src)) for(const x of datedOf(c)) if(!(c.annulees||[]).includes(`${x.date}@${x.id}`)&&schoolDay(x.date)) items.push({c,x});
  if(!items.length||!start) return {n:0,items:[]};
  items.sort((a,b)=>a.x.date.localeCompare(b.x.date)||String(a.x.debut).localeCompare(String(b.x.debut)));
  const first=items[0].x.date, last=items[items.length-1].x.date, from=[], to=[];
  for(let d=parse(first),n=0;iso(d)<=last&&n<800;d=addDays(d,1),n++) if(schoolDay(iso(d))) from.push(iso(d));
  for(let d=parse(start),n=0;to.length<from.length&&n<800;d=addDays(d,1),n++) if(schoolDay(iso(d))) to.push(iso(d));
  const map=new Map(from.map((ds,i)=>[ds,to[i]||'']));
  let out=0, clash=0;const keep=[];
  for(const it of items){
    const nd=map.get(it.x.date);
    if(!nd){out++;continue;}
    const a=toMin(it.x.debut), b=toMin(it.x.fin);
    if(sessionsOn(nd).some(s=>s.grp===dst&&!s.cancelled&&s.start<b&&a<s.end)){clash++;continue;}
    keep.push(Object.assign({nd},it));
  }
  return {n:keep.length,items:keep,out,clash,first,last,from:keep.length?keep[0].nd:'',to:keep.length?keep[keep.length-1].nd:''};
}
async function copySchedule(src,dst,start){
  const P=copyPlan(src,dst,start);if(!P.n) return false;
  const bySrc=new Map();for(const it of P.items){if(!bySrc.has(it.c.id))bySrc.set(it.c.id,{c:it.c,xs:[]});bySrc.get(it.c.id).xs.push(it);}
  const jobs=[];
  for(const {c,xs} of bySrc.values()){
    const mk=modKey(c), t0=mk!=null?S.data.cours.find(o=>o.groupe===dst&&modKey(o)===mk):S.data.cours.find(o=>o.groupe===dst&&modKey(o)==null&&String(o.titre||'').trim().toLowerCase()===String(c.titre||'').trim().toLowerCase());
    const doc=t0?courseDoc(t0):{titre:c.titre,code:c.code||'',couleur:+c.couleur||0,groupe:dst,enseignant:mk!=null?'':principalOf(dst),salle:c.salle||'',du:'',au:'',heures:c.heures||null,creneaux:[],annulees:[],extras:[]};
    const used=new Set(doc.extras.map(x=>x.id));
    for(const {x,nd} of xs){
      let id='a'+nd.replace(/-/g,'')+(toMin(x.debut)<720?'am':'pm');while(used.has(id)) id+=Math.random().toString(36).slice(2,4);
      used.add(id);
      const o={id,date:nd,debut:x.debut,fin:x.fin,tags:(x.tags||[]).filter(t=>!CHORE_TAGS.has(t)),label:x.label||''};
      for(const k of ['minutes','cours','examens','requis','salle']) if(x[k]!=null&&x[k]!=='') o[k]=JSON.parse(JSON.stringify(x[k]));
      doc.extras.push(o);
    }
    const id=t0?t0.id:genId('c');
    jobs.push(()=>putCours(id,doc));
  }
  const ok=await runAll(jobs,`${pl(P.n,'séance copiée','séances copiées')} vers ${gName(dst)}`);
  if(ok) logEv('horaire',`a copié l’horaire de ${gName(src)} vers ${gName(dst)}`,`${pl(P.n,'séance','séances')}, à partir du ${longDate(parse(P.from))}`);
  return ok;
}

/* ---------- Historique : qui a fait quoi, et quand ----------
   journal/<AAAA-MM> : un document par mois, où chaque action est une entrée de « ev » (la base ne grossit pas d’un
   document par clic ; au-delà de 600 entrées le mois continue dans AAAA-MM-2). Entrée : { le, par, role, cat, txt, obj,
   seance, date, groupe } — cat : horaire | aff | module. L’écriture ne bloque ni ne fait échouer l’action elle-même. */
const sObj=s=>`${s.c.code?s.c.code+' ':''}${s.c.titre} · ${gName(s.grp)}, ${dayLabel(parse(s.date)).toLowerCase()}`;
async function logEv(cat,txt,obj,s){
  if(!DB) return;
  try{
    const now=new Date(), ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
    const cur=(S.data.journal||[]).filter(d=>d.id===ym||d.id.startsWith(ym+'-')).sort((a,b)=>collator.compare(a.id,b.id)).pop();
    const id=!cur?ym:Object.keys(cur.ev||{}).length>=600?ym+'-'+((+(cur.id.split('-')[2]||1))+1):cur.id;
    const ev={le:now.toISOString(),par:whoAmI(),role:S.role,cat,txt,obj:obj||''};
    if(s){ev.seance=s.key;ev.date=s.date;ev.groupe=s.grp||'';}
    const body={ev:{[now.getTime().toString(36)+Math.random().toString(36).slice(2,5)]:ev}}, ref=col('journal').doc(id);
    try{await ref.update(body);}
    catch(e){
      /* le document du mois n’existe pas encore : on le crée (jamais d’écrasement d’un mois existant) */
      if(!e||e.code!=='invalid_argument') return;
      const snap=await ref.get();if(!snap.exists) await ref.set(body);
    }
  }catch(e){}
}
function ensureJournal(){
  if(!DB||S.jrSub) return;S.jrSub=true;
  try{col('journal').onSnapshot(q=>{LIVE().journal=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.jrLoaded=true;schedule();},()=>{S.jrLoaded=true;schedule();});}
  catch(e){S.jrLoaded=true;}
}
const JR_CAT={horaire:['info','Horaire'],aff:['warn','Affectations'],module:['k5','Modules']};

/* ---------- Notifications (la cloche) ----------
   Rien de plus n’est enregistré : la liste se déduit de ce que la personne peut déjà lire — ses candidatures,
   les demandes de remplacement, les séances annulées. Ce qui a été vu est noté dans le navigateur.

const whoAmI=()=>(S.me&&S.me.name)||'';

let _nf=null;
function notifs(){
  const D=S.data, who=S.role==='teacher'?S.teacher:S.role==='student'?S.group:'', day=todayISO(), k=S.role+'|'+who+'|'+day;
  if(_nf&&_nf.c===D.cours&&_nf.a===D.candidatures&&_nf.r===D.remplacements&&_nf.g===D.config&&_nf.st===D.stock&&_nf.cp===D.compta&&_nf.k===k) return _nf.out;
  const out=[], recent=iso(addDays(new Date(),-7));
  const info=(date,key)=>{const s=findSess(date,key);return s?{s,txt:`${s.c.code?s.c.code+' ':''}${s.c.titre} · ${gName(s.grp)}, ${dayLabel(parse(s.date)).toLowerCase()}`}:null;};
  /* séances annulées à venir : pour l’enseignant qui les donnait, ou pour la classe */
  const cancelled=(match,pre)=>{
    for(const c of D.cours) for(const tag of c.annulees||[]){
      const [date,sid]=String(tag).split('@');if(!sid||date<day) continue;
      const x=info(date,`${c.id}_${sid}_${date}`);if(!x||!x.s.cancelled||x.s.movedX||!match(x.s)) continue;
      const a=(c.annule||{})[tag]||{};
      out.push({id:`a:${pre}:${x.s.key}`,t:a.le||'',tone:'bad',title:W('Séance annulée','Cours annulé'),text:x.txt+'.',go:{k:'sess',key:x.s.key,date}});
    }
  };
  if(S.role==='teacher'&&who){
    if(nfOn('aff')) for(const d of D.candidatures){
      if(d.enseignant!==who||d.date<recent) continue;
      const T={approuve:d.par==='admin'?['ok','Séance attribuée','Vous donnez ']:['ok','Candidature approuvée','Vous donnez '],refuse:['bad','Candidature refusée','Pour '],retire:['warn','Séance retirée','Vous ne donnez plus ']}[d.statut], x=T&&info(d.date,d.seance);
      if(x) out.push({id:`c:${d.id}:${d.statut}`,t:d.maj||'',tone:T[0],title:T[1],text:T[2]+x.txt+'.',go:{k:'mes',tab:d.statut==='approuve'?'mine':'open'}});
    }
    if(nfOn('annulT')) cancelled(s=>(s.tch||[]).includes(who),'t:'+who);
  }else if(S.role==='student'&&who){if(nfOn('annulE')) cancelled(s=>s.grp===who,'g:'+who);}
  else if(S.role==='admin'){
    if(nfOn('remp')) for(const d of D.remplacements){
      if(d.date<day) continue;const x=info(d.date,d.seance);
      if(x&&!x.s.cancelled&&(x.s.tch||[]).includes(d.enseignant)) out.push({id:`r:${d.id}`,t:d.maj||'',tone:'warn',title:'Remplacement demandé',text:`${tName(d.enseignant)} · ${x.txt}.${d.motif?' Raison : '+d.motif:''}`,go:{k:'aff',tab:'remp'}});
    }
    if(nfOn('cand')) for(const d of D.candidatures){
      if(d.statut!=='attente'||d.date<day) continue;const x=info(d.date,d.seance);
      if(x&&!x.s.cancelled&&byId(D.enseignants,d.enseignant)) out.push({id:`c:${d.id}:attente`,t:d.maj||'',tone:'info',title:'Nouvelle candidature',text:`${tName(d.enseignant)} · ${x.txt}.`,go:{k:'aff',tab:'cand'}});
    }
  }
  if(S.role==='admin'&&nfOn('stock')){
    const A=D.stock||[], late=A.filter(a=>!skQte(a)&&a.statut!=='hs'&&skConf(a)[0]==='bad').length, low=A.filter(a=>skQte(a)&&skConf(a)[0]!=='ok').length;
    if(late) out.push({id:`sk:late:${late}:${day}`,t:day+'T07:00',tone:'bad',title:'Stock',text:`${pl(late,'échéance d’inspection dépassée','échéances d’inspection dépassées')}.`,go:{k:'stock',tab:'insp'}});
    if(low) out.push({id:`sk:low:${low}:${day}`,t:day+'T07:00',tone:'warn',title:'Stock',text:`${pl(low,'consommable sous le seuil','consommables sous le seuil')}.`,go:{k:'stock',tab:'conso'}});
  }
  if(S.role==='admin'&&nfOn('compta')&&S.loaded.compta){
    const late=D.eleves.filter(e=>cpFee(e).etat==='retard').length, ap=cpToApprove();
    if(late) out.push({id:`cp:late:${late}:${day}`,t:day+'T07:00',tone:'bad',title:'Compta',text:`${pl(late,'élève en retard de paiement','élèves en retard de paiement')}.`,go:{k:'compta',tab:'frais'}});
    if(ap) out.push({id:`cp:paie:${ap}:${day}`,t:day+'T07:00',tone:'warn',title:'Compta',text:`${pl(ap,'relevé de paie à approuver','relevés de paie à approuver')}.`,go:{k:'compta',tab:'paie'}});
  }
  out.push(...annNotifs());
  out.sort((a,b)=>(b.t||'').localeCompare(a.t||''));
  _nf={c:D.cours,a:D.candidatures,r:D.remplacements,g:D.config,st:D.stock,cp:D.compta,k,out};
  return out;
}

const prSlug=v=>String(v||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'feuille';

/* Une page : les cinq jours en colonnes, l’avant-midi et l’après-midi en lignes ; une journée complète occupe les deux */

  const days=[0,1,2,3,4].map(i=>{const d=addDays(mon,i), ds=iso(d), list=items.filter(s=>s.date===ds).sort((a,b)=>a.start-b.start), part=k=>list.filter(s=>moment(s.start,s.end)===k);

async function printDoc(title,body,land,file){
  const root=$('#print-root'), css=prCSS(land), t0=document.title;
  let shown=false, done=false;
  const clean=()=>{if(done)return;done=true;window.removeEventListener('afterprint',clean);document.title=t0;document.body.classList.remove('printing');root.innerHTML='';};
  const on=()=>{shown=true;};
  root.innerHTML=`<style>${css}</style><div class="pr-doc">${body}</div>`;
  document.body.classList.add('printing');document.title=title;
  window.addEventListener('beforeprint',on);window.addEventListener('afterprint',clean);
  try{window.print();}catch(e){}
  await new Promise(r=>setTimeout(r,350));
  window.removeEventListener('beforeprint',on);
  if(shown){setTimeout(clean,120000);return true;}
  clean();
  /* la fenêtre d’impression ne s’est pas ouverte : la feuille part en fichier */
  const ok=await saveFile(file+'.html',`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}body{margin:0}</style></head><body><div class="pr-doc">${body}</div></body></html>`);
  if(ok) toast('Ouvrez ce fichier, puis imprimez-le (Ctrl+P).');
  return ok;
}

const NV_TYPES={new:['ok','Nouveau'],up:['info','Amélioration'],fix:['warn','Correction']};
/* Ce qui a été vu : la clé du dernier push ouvert (date + numéro du push, car il y a souvent plusieurs pushes le même jour).
   Une ancienne valeur enregistrée est une date seule : tout ce jour-là compte comme vu. */
const nvKey=i=>NOUVEAUTES[i].date+'#'+String(NOUVEAUTES.length-i).padStart(3,'0');
const nvSeenKey=()=>{const s=S.nvSeen||'';return s&&!s.includes('#')?s+'#999':s;};
const nvLatest=()=>nvKey(0);
const nvUnseen=()=>NOUVEAUTES.reduce((n,v,i)=>n+(nvKey(i)>nvSeenKey()?v.items.length:0),0);
function newsPage(){
  const st=S.pg, f=NV_TYPES[st.nf]?st.nf:'', all=!!st.nall, byDate=st.nv==='date', N=NOUVEAUTES.length;
  if(st.since==null) st.since=nvSeenKey();
  // la pastille du menu disparaît dès qu’on a ouvert la page
  if(S.nvSeen!==nvLatest()){S.nvSeen=nvLatest();savePrefs();schedule();}
  const cnt={new:0,up:0,fix:0};let tot=0;for(const v of NOUVEAUTES)for(const it of v.items){cnt[it[0]]++;tot++;}
  const view=`<div class="seg" role="group" aria-label="Regrouper les changements">${[['','push','Par push'],['date','date','Par date']].map(([k,id,l])=>`<button type="button" id="nv-v-${id}" data-act="pg-set" data-k="nv" data-v="${k}" aria-pressed="${byDate===(k==='date')}">${l}</button>`).join('')}</div>`;
  const seg=`<div class="seg" role="group" aria-label="Filtrer">${[['','Tout',tot],['new','Nouvelles fonctions',cnt.new],['up','Améliorations',cnt.up],['fix','Corrections',cnt.fix]].map(([k,l,n])=>`<button type="button" id="nv-f-${k||'all'}" data-act="pg-set" data-k="nf" data-v="${k}" aria-pressed="${f===k}">${l} · ${n}</button>`).join('')}</div>`;
  const pages=new Set(NAV.admin.map(n=>n[0]));
  const row=([t,titre,texte,page])=>`<article class="nv-row"><span class="chip ${NV_TYPES[t][0]}">${NV_TYPES[t][1]}</span><div class="xm-t"><b>${esc(titre)}</b><small>${esc(texte)}</small></div><div class="xm-end">${page&&pages.has(page)&&page!=='nouveautes'?`<button class="btn sm" type="button" data-act="nav" data-page="${page}">Ouvrir</button>`:''}</div></article>`;
  /* Un bloc par push, ou un bloc par jour (les pushes du même jour réunis) */
  let groups;
  if(byDate){
    const m=new Map();
    NOUVEAUTES.forEach((v,i)=>{const g=m.get(v.date)||{date:v.date,items:[],n:0,fresh:false};g.items=g.items.concat(v.items);g.n++;if(nvKey(i)>st.since)g.fresh=true;m.set(v.date,g);});
    groups=[...m.values()];
  }else groups=NOUVEAUTES.map((v,i)=>({p:v,num:N-i,date:v.date,items:v.items,fresh:nvKey(i)>st.since}));
  /* avec un filtre, on garde seulement les blocs qui ont ce type de changement, puis on en montre les premiers */
  const vis=groups.map(g=>Object.assign({},g,{its:g.items.filter(it=>!f||it[0]===f)})).filter(g=>g.its.length);
  const lim=byDate?2:5, shown=all?vis:vis.slice(0,lim);
  const blocks=shown.map(g=>{
    const items=g.its;
    const d=parse(g.date), day=`${dayLabel(d)} ${d.getFullYear()}`, fresh=g.fresh?'<span class="chip exam">Depuis votre dernière visite</span>':'', n=`<span class="nv-n">${pl(items.length,'changement','changements')}</span>`;
    const link=g.p?(g.p.id?`<a href="${NV_REPO}/commit/${esc(g.p.id)}" target="_blank" rel="noopener" title="Voir ce push sur GitHub">${esc(g.p.id)}</a>`:`<a href="${NV_REPO}/commits/main" target="_blank" rel="noopener" title="Voir les pushes sur GitHub">le plus récent</a>`):'';
    const head=g.p?`<div class="xm-hd nv-hd nv-push"><span class="cl-num sm nv-num" title="Push n° ${g.num}">${g.num}</span><div class="nv-pt"><b>${esc(g.p.push)}</b><small>${esc(day)} · push ${link}</small></div>${fresh}${n}</div>`
      :`<div class="xm-hd nv-hd"><span>${esc(day)}</span>${g.n>1?`<span class="nv-k">${g.n} pushes</span>`:''}${fresh}${n}</div>`;
    return `<section class="cl-list nv-list" id="nv-${g.p?'p'+g.num:g.date}">${head}${items.map(row).join('')}</section>`;
  }).join('');
  const more=!all&&vis.length>lim?`<div class="row" style="margin-top:4px"><button class="btn" type="button" id="nv-more" data-act="pg-set" data-k="nall" data-v="1">${byDate?'Voir les jours précédents':`Voir les ${vis.length-lim} pushes précédents`}</button></div>`:'';
  return `<div class="toolbar">${view}${seg}</div>`+(blocks||'<section class="panel"><p class="help">Rien de ce type dans les dernières mises à jour.</p></section>')+more;
}

function keyDates(){
  const c=cfg(), out=[];
  if(c.debut) out.push({date:c.debut,label:'Premier jour de classe',chip:['ok','Rentrée']});
  for(const e of c.etapes||[]){if(e.du)out.push({date:e.du,label:'Début : '+(e.nom||'Étape'),chip:['info','Étape']});if(e.au)out.push({date:e.au,label:'Fin : '+(e.nom||'Étape'),chip:['info','Étape']});}
  for(const k of c.conges||[]) if(k.du) out.push({date:k.du,end:k.au&&k.au!==k.du?k.au:'',label:k.nom||'Congé',chip:['warn','Congé']});
  if(c.fin) out.push({date:c.fin,label:'Dernier jour de classe',chip:['ok','Fin']});
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

  const et=(c.etapes||[]).map((e,i)=>({e,i})).sort((a,b)=>String(a.e.du).localeCompare(String(b.e.du)));
  const cg=(c.conges||[]).map((k,i)=>({k,i})).sort((a,b)=>String(a.k.du).localeCompare(String(b.k.du)));
  const rng=(a,b)=>b&&b!==a?`${shortDate(parse(a))} au ${shortDate(parse(b))}`:shortDate(parse(a));

    <div class="stackp">${(()=>{const mine=x=>S.role==='teacher'?x.tch.includes(S.teacher):S.role==='student'?x.grp===S.group:true, up=allExamItems().filter(x=>x.date>=t&&mine(x)).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start), ex=up.filter(x=>!x.rep), rp=up.find(x=>x.rep), d0=ex[0]&&parse(ex[0].date), d1=rp&&parse(rp.date);
      return `<section class="panel" id="yr-exams"><h2>Examens</h2><p class="help" style="margin-bottom:8px">${ex.length?`<b>${ex.length}</b> ${ex.length>1?'examens à venir':'examen à venir'}. Prochain : ${esc(dayLabel(d0).toLowerCase())}.`:'Aucun examen à venir.'}${rp?` Prochaine journée de reprise : ${esc(dayLabel(d1).toLowerCase())}.`:''}</p><div class="row"><button class="btn sm" type="button" data-act="nav" data-page="examens">Voir les examens</button></div></section>`;})()}<section class="panel"><h2>Étapes</h2>${et.length?`<ul class="plist">${et.map(({e,i})=>`<li><span><b>${esc(e.nom||'Étape')}</b> <span class="muted">${esc(rng(e.du,e.au))}</span></span>${adm?`<button type="button" class="x" data-act="p-del-etape" data-i="${i}" aria-label="${esc('Retirer '+(e.nom||'cette étape'))}"${dis()}>×</button>`:''}</li>`).join('')}</ul>`:'<p class="help">Aucune étape inscrite.</p>'}

      ${adm?`<form class="inline-add" data-form="p-add-conge" style="margin-top:10px"><label class="field"><span>Nom</span><input id="p-cnom" maxlength="60" placeholder="Journée pédagogique" autocomplete="off"></label><label class="field" style="flex:0 1 150px"><span>Du</span><input type="date" id="p-cdu"></label><label class="field" style="flex:0 1 150px"><span>Au</span><input type="date" id="p-cau"></label><button class="btn" type="submit"${dis()}>Ajouter</button></form>`:''}</section></div></div>`;

/* Applique les réglages qui changent l’apparence ou les listes : heures des moments, couleur principale, fonctions du personnel */
let cfgInit=false;
function applyConfig(){
  const c=cfg(), m=c.moments, am=PERIODES[0], pm=PERIODES[1], jr=PERIODES[2];
  const ok=t=>/^\d{1,2}:\d{2}$/.test(t||'');
  am.debut=m&&m.am&&ok(m.am.debut)?m.am.debut:'08:00';am.fin=m&&m.am&&ok(m.am.fin)?m.am.fin:'11:00';
  pm.debut=m&&m.pm&&ok(m.pm.debut)?m.pm.debut:'12:00';pm.fin=m&&m.pm&&ok(m.pm.fin)?m.pm.fin:'15:00';
  jr.debut=am.debut;jr.fin=pm.fin;
  const st=document.documentElement.style, col=c.couleur==='perso'&&okHex(c.couleurPerso)?['perso','',c.couleurPerso,darker(c.couleurPerso)]:COULEURS.find(x=>x[0]===(c.couleur||''))||COULEURS[0];
  if(col[0]){st.setProperty('--accent',col[2]);st.setProperty('--accent-hover',col[3]);st.setProperty('--today',col[2]);}
  else{st.removeProperty('--accent');st.removeProperty('--accent-hover');st.removeProperty('--today');}
  const fl=Array.isArray(c.fonctions)&&c.fonctions.length?c.fonctions:FONCTIONS_DEF;
  if(fl.join('|')!==FONCTIONS.join('|')) FONCTIONS.splice(0,FONCTIONS.length,...fl);
  /* à l’ouverture du site : la vue du calendrier et la page d’accueil choisies (si la personne n’a rien choisi elle-même) */
  if(!cfgInit&&S.data.config){cfgInit=true;
    if(c.vueCal==='jour'&&!prefs.view) S.view='jour';
    if(S.role==='admin'&&S.page==='calendar'&&c.accueil&&c.accueil!=='calendar'&&navGroup(c.accueil)) S.page=c.accueil;}
}

/* Exports de la page Données */
async function exportData(kind){
  const D=S.data, day=todayISO();
  if(kind==='json'){
    const strip=a=>(a||[]).map(x=>Object.assign({},x));
    const out={exporte:new Date().toISOString(),site:'PompierNote',config:D.config,groupes:strip(D.groupes),eleves:strip(D.eleves),enseignants:strip(D.enseignants),dossiersPersonnel:D.dossiers,cours:strip(RAWC),examens:strip(D.examens),resultats:D.resultats,candidatures:strip(D.candidatures),remplacements:strip(D.remplacements),disponibilites:D.dispos,presencesPersonnel:D.staffPres,comptes:strip(D.comptes)};
    return saveFile(`pompiernote-donnees-${day}.json`,new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  }
  if(kind==='eleves') return saveFile(`pompiernote-eleves-${day}.csv`,new Blob([csvText([['Numéro','Nom','Classe','Grade','Courriel','Téléphone','Date de naissance','Contact d’urgence']].concat(sortElsByClass(D.eleves).map(e=>[e.numero,e.nom,gName(e.groupe),e.fonction,e.courriel,e.telephone,e.naissance,e.parent])))],{type:'text/csv'}));
  if(kind==='seances'){
    const c=cfg(), a=c.debut||yearStart(), b=c.fin||iso(addDays(parse(a),365));
    const rows=sessionsBetween(a,b).filter(s=>s.kind==='cours').sort((x,y)=>x.date.localeCompare(y.date)||x.start-y.start||gName(x.grp).localeCompare(gName(y.grp)));
    const hm=v=>pad(Math.floor(v/60))+':'+pad(v%60);
    return saveFile(`pompiernote-horaire-${day}.csv`,new Blob([csvText([['Date','Début','Fin','Moment','Classe','Code','Cours','Enseignants','Annulée']].concat(rows.map(s=>[s.date,hm(s.start),hm(s.end),momentOf(s),gName(s.grp),s.c.code||'',s.c.titre||'',(s.tch||[]).map(tName).join(', '),s.cancelled?'Oui':''])))],{type:'text/csv'}));
  }
  return saveFile(`pompiernote-personnel-${day}.csv`,new Blob([csvText([['Nom','Fonction','Statut','Courriel','Téléphone']].concat(staff().map(p=>[p.nom,p.fonction||'Enseignant',p.statut||'Actif',p.courriel,(D.dossiers[p.id]||{}).telephone])))],{type:'text/csv'}));
}

const AN_ST={cours:['ok','En cours'],prog:['info','Programmée'],brouillon:['off','Brouillon'],fini:['off','Terminée']};
const AN_MODELES=[
  ['tempete','Fermeture (tempête)','École fermée aujourd’hui','En raison des conditions météo, l’école est fermée aujourd’hui. Les séances seront reprises ; surveillez les annonces.','urgent'],
  ['evac','Exercice d’évacuation','Exercice d’évacuation','Un exercice d’évacuation aura lieu [jour] à [heure]. Suivez les consignes des instructeurs.','warn'],
  ['examen','Rappel d’examen','Examen à venir','Rappel : examen de [module] le [jour]. Présentez-vous 15 minutes à l’avance avec votre équipement complet.','warn'],
  ['local','Changement de local','Changement de local','La séance de [jour] se donne exceptionnellement à [local].','info'],
  ['tenue','Tenue exigée','Tenue de service','Tenue de service complète exigée [jour], pour [raison].','info'],
  ['conge','Congé','Congé','Aucun cours le [jour] : [raison]. Bon congé !','info']];
/* La liste ; l’ancienne annonce unique (config.annonce) est reprise telle quelle */
function annList(){
  const c=cfg();if(Array.isArray(c.annonces)) return c.annonces;
  const a=c.annonce;return a&&String(a.texte||'').trim()?[{id:'a0',titre:'',texte:a.texte,niv:a.ton==='warn'?'warn':'info',pub:a.pub||'tous',classes:[],actif:a.on===true,fermable:true,ou:'toutes'}]:[];
}
const annState=a=>{const t=todayISO();return !a.actif?'brouillon':a.du&&t<a.du?'prog':a.au&&t>a.au?'fini':'cours';};
const annKey=a=>a.id+'@'+(a.maj||a.cree||'');
const annNiv=a=>AN_NIV.some(x=>x[0]===a.niv)?a.niv:'info';
/* ordre : urgentes, épinglées, importantes, puis les plus récentes */
const annRank=a=>annNiv(a)==='urgent'?0:a.epingle?1:annNiv(a)==='warn'?2:3;
const annSort=(a,b)=>annRank(a)-annRank(b)||String(b.maj||b.cree||'').localeCompare(String(a.maj||a.cree||''));
/* Pour la personne affichée ? (l’administration voit toutes celles en cours) */
function annFor(a,anyPage){
  if(annState(a)!=='cours') return false;
  if(!anyPage&&a.ou==='calendrier'&&S.page!=='calendar') return false;
  if(S.role==='admin') return true;
  const p=a.pub||'tous', cl=a.classes||[];
  if(p==='tous') return true;
  if(p==='teacher') return S.role==='teacher';
  if(p==='student') return S.role==='student';
  if(p==='classes') return S.role==='student'?cl.includes(S.group):S.role==='teacher'&&!!a.profs&&principalClasses(S.teacher).some(g=>cl.includes(g.id));
  return false;
}
function annAud(a){
  const p=a.pub||'tous';if(p!=='classes') return (AN_PUB.find(x=>x[0]===p)||AN_PUB[0])[1];
  const n=(a.classes||[]).map(gName).filter(Boolean);
  return (n.length?'Élèves de '+n.join(', '):'Aucune classe')+(a.profs?', et leur enseignant principal':'');
}
/* Le texte : retours à la ligne gardés, adresses web cliquables */
const annText=t=>esc(t||'').replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)»])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
function annNotice(a,preview){
  const niv=annNiv(a), adm=S.role==='admin', url=a.lien&&a.lien.url;
  const meta=[a.epingle?icon('pin')+'Épinglée':'',adm?esc(annAud(a)):'',a.par?'Par '+esc(a.par):'',a.maj||a.cree?esc(ago(a.maj||a.cree)):'',a.au?'Jusqu’au '+esc(shortDate(parse(a.au))):''].filter(Boolean);
  return `<div class="notice ann ${niv==='urgent'?'bad':niv}"${preview?'':` id="ann-${esc(a.id)}"`} role="${niv==='urgent'&&!preview?'alert':'status'}">
    <span class="ann-ic" aria-hidden="true">${icon('mega')}</span>
    <div class="ann-b">${a.titre?`<b class="ann-t">${niv==='urgent'?'<span class="ann-u">Urgent</span>':''}${esc(a.titre)}</b>`:niv==='urgent'?'<b class="ann-t"><span class="ann-u">Urgent</span></b>':''}<p>${annText(a.texte)||'<span class="muted">Votre message paraîtra ici.</span>'}</p>${meta.length?`<small class="ann-m">${meta.join(' · ')}</small>`:''}</div>
    <div class="ann-a">${url?`<a class="btn sm" href="${esc(url)}" target="_blank" rel="noopener">${esc(a.lien.texte||'En savoir plus')}${icon('ext')}</a>`:''}${!preview&&adm&&isAdmin()&&S.conn==='shared'?`<button class="btn sm ghost" type="button" data-act="an-edit" data-id="${esc(a.id)}">Modifier</button>`:''}${!preview&&a.fermable!==false&&niv!=='urgent'?`<button class="ann-x" type="button" data-act="an-hide" data-id="${esc(a.id)}" aria-label="Masquer cette annonce" title="Masquer (elle reste dans la cloche)">${icon('x')}</button>`:''}</div></div>`;
}
/* Sous le bandeau : urgentes et épinglées d’abord ; au-delà de deux, les autres se déplient */
function annoncesHTML(){
  const vu=new Set(S.annVu||[]), vis=annList().filter(a=>annFor(a)&&!vu.has(annKey(a))).sort(annSort);
  if(!vis.length) return '';
  const max=S.annAll?vis.length:2, more=vis.length-max;
  return vis.slice(0,max).map(a=>annNotice(a)).join('')
    +(more>0?`<button type="button" class="ann-more" id="ann-more" data-act="an-all">${icon('down')}Voir ${pl(more,'autre annonce','autres annonces')}</button>`:S.annAll&&vis.length>2?`<button type="button" class="ann-more" id="ann-more" data-act="an-all">${icon('up')}Réduire</button>`:'');
}
/* Dans la cloche : les annonces en cours pour la personne (même masquées) */
function annNotifs(){
  if(S.role==='admin') return [];
  return annList().filter(a=>annFor(a,true)).map(a=>({id:'an:'+annKey(a),t:a.maj||a.cree||'',tone:annNiv(a)==='urgent'?'bad':annNiv(a)==='warn'?'warn':'info',title:annNiv(a)==='urgent'?'Annonce urgente':'Annonce',text:(a.titre?a.titre+' — ':'')+a.texte,go:{k:'ann',id:a.id,cal:a.ou==='calendrier'}}));
}

/* Ce que contient le formulaire (aperçu et enregistrement) */

function annModele(f,k){
  const m=AN_MODELES.find(x=>x[0]===k);if(!m) return;
  f.querySelector('#an-titre').value=m[2];f.querySelector('#an-texte').value=m[3];const r=f.querySelector('#an-niv-'+m[4]);if(r)r.checked=true;

async function annWrite(list,msg){
  const c=configDoc();
  /* au-delà de 60, les plus anciennes annonces terminées s’effacent */
  const fin=list.filter(a=>annState(a)==='fini').sort((a,b)=>String(a.maj||a.cree||'').localeCompare(String(b.maj||b.cree||'')));
  while(list.length>60&&fin.length){const x=fin.shift();list=list.filter(a=>a!==x);}
  c.annonces=list;delete c.annonce;
  return saveConfig(c,msg);
}
async function annSave(f,actif){
  const a=annFromForm(f);
  if(!a.texte){toast('Écrivez le message de l’annonce.','bad');f.querySelector('#an-texte').focus();return;}
  if(a.pub==='classes'&&!a.classes.length){toast('Choisissez au moins une classe.','bad');return;}
  if(a.du&&a.au&&a.au<a.du){toast('La date de fin précède la date de début.','bad');return;}
  if(a.lien&&!/^https?:\/\/[^\s]+\.[^\s]+$/i.test(a.lien.url)){toast('Le lien du bouton doit être une adresse web complète (https://…).','bad');return;}
  const st=S.pg, now=new Date().toISOString(), id=st.aed==='new'?'an'+Date.now().toString(36):st.aed, old=annList().find(x=>x.id===id)||{};
  Object.assign(a,{id,actif,cree:old.cree||now,maj:now,par:old.par||S.me.name||''});
  const msg=!actif?'Brouillon enregistré':annState(a)==='prog'?`Annonce programmée pour le ${shortDate(parse(a.du))}`:annState(a)==='fini'?'Annonce enregistrée (sa date de fin est passée)':'Annonce publiée';
  if(await annWrite([a,...annList().filter(x=>x.id!==id)],msg)){S.pg.aed='';S.pg.adup='';S.pg.adraft=null;render();}
}
/* Actions sur une annonce de la liste */
async function annSet(id,ch,msg){
  const list=annList().map(a=>a.id===id?Object.assign({},a,ch(a),{maj:new Date().toISOString()}):a);
  await annWrite(list,msg);
}
/* ---------- Clôture de l’année et archives ----------
   archives/<id>        une année clôturée : { nom, debut, fin, cloture, par, parts, taille, garde, compte { classes, eleves, seances, examens, presences } }
   archives-parts/<id>-<k>  le contenu de l’année, en morceaux de texte JSON : { archive, part, json }
   Clôturer : tout ce qui appartient à l’année est copié dans une archive, puis retiré pour repartir à neuf. On garde l’école,
   les réglages, les modules, les locaux, le personnel et les comptes ; au choix, les classes et leurs élèves.
   Consulter : tout le site s’affiche avec les données de l’archive, en lecture seule (S.conn = 'archive') ; les données en
   cours restent dans S.liveData et continuent de s’y mettre à jour. */
const ARCH_PART=100000;
const LIVE=()=>S.archive?S.liveData:S.data;
const archList=()=>(LIVE().archives||[]);
/* « 2026–2027 » devient « 2027–2028 » ; une date avance d’un an */
const nextYearName=n=>{const m=/(\d{4})(\D+)(\d{4})/.exec(n||'');return m?n.replace(m[0],`${+m[1]+1}${m[2]}${+m[3]+1}`):'';};
const plusYear=d=>/^\d{4}-/.test(d||'')?(+d.slice(0,4)+1)+d.slice(4):'';
/* Tout ce qui appartient à l’année. Présences, résultats par élève et historique sont lus en entier dans la base
   (le site n’en charge qu’une partie). */
async function yearSnapshot(){
  const D=S.data, c=cfg(), strip=a=>(a||[]).map(x=>Object.assign({},x));
  const all=async k=>{const q=await col(k).get();return q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));};
  const [pres,resEl,journal,stockMvt,compta,factures,paie]=await Promise.all([all('presences'),all('resultats-eleves'),all('journal'),all('stock-mvt'),all('compta'),all('compta-factures'),all('compta-paie')]);
  return {version:1,nom:c.annee||'',debut:c.debut||'',fin:c.fin||'',config:D.config,groupes:strip(D.groupes),eleves:strip(D.eleves),enseignants:strip(D.enseignants),dossiers:D.dossiers,
    cours:strip(RAWC),examens:strip(D.examens),resultats:D.resultats,resultatsEleves:resEl,presences:pres,candidatures:strip(D.candidatures),remplacements:strip(D.remplacements),
    dispos:D.dispos,staffPres:D.staffPres,absProfs:D.absProfs,journal,stock:strip(D.stock),stockMvt,compta,factures,paie};
}
/* Une facture envoyée et pas encore payée en entier reste ouverte */
function yearOpenInv(f,sn){if(f.statut!=='envoyee')return false;const paid=sumC((sn.compta||[]).filter(x=>x.type==='rev'&&x.facture===f.id).map(x=>x.ttc))+(+f.report||0);return paid<cpFTot(f).ttc;}
/* Les documents que la clôture retire (ils sont dans l’archive) */
function yearDocs(sn,keep){
  const out=[], add=(k,ids)=>{for(const id of ids) out.push([k,id]);}, ids=a=>(a||[]).map(d=>d.id), keys=o=>Object.keys(o||{});
  add('cours',ids(sn.cours));add('examens',ids(sn.examens));add('resultats',keys(sn.resultats));add('resultats-eleves',ids(sn.resultatsEleves));
  add('presences',ids(sn.presences));add('candidatures',ids(sn.candidatures));add('remplacements',ids(sn.remplacements));
  add('disponibilites',keys(sn.dispos));add('presences-personnel',keys(sn.staffPres));add('profs-absents',keys(sn.absProfs));add('journal',ids(sn.journal));
  add('stock-mvt',ids(sn.stockMvt));add('compta',ids(sn.compta));add('compta-paie',ids(sn.paie));add('compta-factures',ids((sn.factures||[]).filter(f=>!yearOpenInv(f,sn))));
  if(!keep){add('groupes',ids(sn.groupes));add('eleves',ids(sn.eleves));}
  return out;
}
/* Première étape : vérifier la nouvelle année et demander confirmation */
function askCloseYear(f){

async function closeYear(){

  const id='a'+Date.now().toString(36), txt=JSON.stringify(sn), parts=[];
  for(let i=0;i<txt.length;i+=ARCH_PART) parts.push(txt.slice(i,i+ARCH_PART));
  const seances=sessionsBetween(sn.debut||yearStart(),sn.fin||todayISO()).filter(s=>s.kind==='cours'&&!s.cancelled).length;
  const meta={nom:sn.nom||'Année sans nom',debut:sn.debut,fin:sn.fin,cloture:new Date().toISOString(),par:S.me.name||'',parts:parts.length,taille:txt.length,garde:p.keep,

  const c=configDoc();c.annee=p.nom;c.debut=p.debut;c.fin=p.fin;c.etapes=[];c.conges=[];
  const fns=yearDocs(sn,p.keep).map(([k,d])=>()=>col(k).doc(d).delete());
  /* une facture encore ouverte passe à la nouvelle année, avec ce qui a déjà été payé */
  for(const f of (sn.factures||[]).filter(x=>yearOpenInv(x,sn))) fns.push(()=>col('compta-factures').doc(f.id).update({report:sumC((sn.compta||[]).filter(x=>x.type==='rev'&&x.facture===f.id).map(x=>x.ttc))+(+f.report||0)}));
  fns.push(()=>DB.doc('config/ecole').set(c));
  S.busy=false;
  if(await runAll(fns,`${meta.nom} est archivée ; ${p.nom} commence.`)){S.week=monday(parse(p.debut>todayISO()?todayISO():p.debut));render();}
}
async function loadArchive(id){

let cfgSeen=null, cfgN=0;

function setHTML(el,html,key){
  if(el._h===html&&el._k===key) return;
  const same=key!==undefined&&el._k===key, vals={};
  const a=document.activeElement;let fid=null,sel=null;
  if(a&&el.contains(a)&&a.id){fid=a.id;try{sel=[a.selectionStart,a.selectionEnd];}catch(e){sel=null;}}
  if(same) el.querySelectorAll('input[id],textarea[id]').forEach(i=>{if(!i.dataset.f&&i.type!=='radio'&&i.type!=='checkbox')vals[i.id]=i.value;});
  const st=el.scrollTop;
  el.innerHTML=html;el._h=html;el._k=key;
  for(const [id,v] of Object.entries(vals)){const i=document.getElementById(id);if(i&&el.contains(i))i.value=v;}
  if(same) el.scrollTop=st;
  if(fid){const f=document.getElementById(fid);if(f&&el.contains(f)){f.focus({preventScroll:true});if(sel&&sel[0]!=null){try{f.setSelectionRange(sel[0],sel[1]);}catch(e){}}}}
}

function ensureMyRes(){
  if(!DB||S._mrFor===S.student) return;
  if(unsubMR){try{unsubMR();}catch(e){}unsubMR=null;}
  S._mrFor=S.student;S.data.mesRes={};
  if(S.archive){const m={},mp={};for(const v of S.archive.resEl) if(v&&v.eleve===S.student&&v.examen){m[v.examen]=v.v;if(v.pct!=null)mp[v.examen]=v.pct;}S.data.mesRes=m;S.data.mesPct=mp;return;}
  if(!S.student) return;
  const who=S.student;
  unsubMR=col('resultats-eleves').where('eleve','==',who).onSnapshot(q=>{if(S._mrFor!==who)return;const m={},mp={};for(const d of q.docs){const v=d.data();if(v&&v.examen){m[v.examen]=v.v;if(v.pct!=null)mp[v.examen]=v.pct;}}S.data.mesRes=m;S.data.mesPct=mp;schedule();},()=>{});
}

function openCourse(id,sess,preset){
  const c=id?byId(S.data.cours,id):null;
  const draft=c?{heures:c.heures!=null?String(c.heures):'',titre:c.titre||'',code:c.code||'',couleur:+c.couleur||0,groupe:c.groupe||'',enseignant:c.enseignant||'',salle:c.salle||'',du:c.du||'',au:c.au||'',creneaux:activeSlots(c).map(s=>({type:s.type||'activite',id:s.id,jour:String(s.jour),debut:s.debut||'',fin:s.fin||'',salle:s.salle||'',du:s.du||'',au:s.au||''}))}

  if(preset) Object.assign(draft,preset);

function conflicts(f,selfId){
  const out=[];
  for(const sl of f.creneaux){
    const a=toMin(sl.debut),b=toMin(sl.fin);if(isNaN(a)||isNaN(b))continue;
    for(const c of S.data.cours){
      if(c.id===selfId)continue;
      const sameG=f.groupe&&c.groupe===f.groupe, sameT=f.enseignant&&c.enseignant===f.enseignant;
      if(!sameG&&!sameT)continue;
      for(const s2 of activeSlots(c)){
        if(+s2.jour!==+sl.jour)continue;
        const x=toMin(s2.debut),y=toMin(s2.fin);
        if(a<y&&x<b) out.push(`${DAYS[sl.jour-1]} ${momentIn(a,b)} : ${sameG?`${gName(f.groupe)} a déjà ${c.titre}`:`${tName(f.enseignant)} donne déjà ${c.titre} (${gName(c.groupe)})`}`);
      }
    }
  }
  return [...new Set(out)];
}

async function saveCourse(force){

    annulees:prev&&prev.annulees?[...prev.annulees]:[],extras:prev&&prev.extras?JSON.parse(JSON.stringify(prev.extras)):[]};

function commonPeriod(){
  const n=new Map();
  for(const c of S.data.cours) for(const x of activeSlots(c).concat(datedOf(c))){if(x.debut&&x.fin){const k=x.debut+'-'+x.fin;n.set(k,(n.get(k)||0)+1);}}
  let best='',m=0;for(const [k,v] of n) if(v>m){best=k;m=v;}
  return best;
}
function periodOptions(extra){

  if(extra&&!m.has(extra)) m.set(extra,toMin(extra.split('-')[0]));
  return [...m].sort((a,b)=>a[1]-b[1]).map(([k])=>k);
}

const courseDoc=c=>{const o=JSON.parse(JSON.stringify(c));delete o.id;delete o.ens0;delete o.seances;o.annulees=o.annulees||[];o.extras=o.extras||[];o.creneaux=o.creneaux||[];return o;};
/* ---------- Séances : chaque séance d’une classe s’enregistre à part, dans cours/<id>.seances = { idSéance: {…} }.
   Deux personnes peuvent ainsi modifier deux séances du même module sans s’écraser.
   L’ancien tableau « extras » reste lu ; en mémoire, c.extras est toujours la liste des séances du cours. ---------- */
let RAWC=[];
function normCours(raw){
  const ch=new Map(comps().filter(k=>k.charge).map(k=>[+k.code,k.charge]));
  return raw.map(r=>{
    const c=Object.assign({},r), m=new Map();
    for(const x of r.extras||[]) if(x&&x.id) m.set(x.id,x);
    for(const [id,v] of Object.entries(r.seances||{})){
      if(!v){m.delete(id);continue;}
      const o=Object.assign({},m.get(id),v,{id});
      for(const k of Object.keys(o)) if(o[k]===null) delete o[k];
      m.set(id,o);
    }
    c.extras=[...m.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.debut).localeCompare(String(b.debut)));
    delete c.seances;
    /* Le chargé de cours du module donne ses séances à toutes les classes */
    const t=ch.get(modKey(r));
    if(t){c.ens0=r.enseignant||'';c.enseignant=t;}
    return c;
  });
}
/* Écrit seulement ce qui a changé dans cours/<id> : une séance ajoutée, modifiée ou retirée part seule */
const xBody=(x,old)=>{const o=Object.assign({},x);delete o.id;if(old)for(const k of Object.keys(old))if(k!=='id'&&!(k in o))o[k]=null;return o;};
function putCours(id,doc){
  const c0=byId(S.data.cours,id), same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
  if(!c0){const o=Object.assign({},doc);delete o.id;delete o.ens0;o.seances={};for(const x of doc.extras||[])o.seances[x.id]=xBody(x);delete o.extras;return col('cours').doc(id).set(o);}
  const p={}, a=new Map((c0.extras||[]).map(x=>[x.id,x])), b=new Map((doc.extras||[]).map(x=>[x.id,x])), sx={};
  for(const k of Object.keys(doc)) if(k!=='extras'&&k!=='seances'&&k!=='id'&&k!=='ens0'&&!same(doc[k],c0[k])) p[k]=doc[k];
  for(const [xid,x] of b) if(!a.has(xid)||!same(a.get(xid),x)) sx[xid]=xBody(x,a.get(xid));
  for(const xid of a.keys()) if(!b.has(xid)) sx[xid]=null;
  if(Object.keys(sx).length) p.seances=sx;
  return Object.keys(p).length?col('cours').doc(id).update(p):Promise.resolve();
}
function moveSlotWeekly(cr,sid,jour,debut,fin,eff){
  const i=cr.findIndex(s=>s.id===sid);if(i<0)return cr;
  const s=cr[i];
  if(s.du&&s.du>=eff){cr[i]=Object.assign({},s,{jour,debut,fin});return cr;}
  const end=iso(addDays(parse(eff),-1));
  cr[i]=Object.assign({},s,{au:end});
  const n={id:slotId(),jour,debut,fin,salle:s.salle||'',du:eff};if(s.au)n.au=s.au;
  cr.push(n);
  return cr;
}
function moveOnce(doc,s,date,debut,fin){
  if(s.extra){
    const x=doc.extras.find(e=>e.id===s.extra.id);if(!x)return;
    if(x.de){const [od,osid]=x.de.split('@'),orig=doc.creneaux.find(e=>e.id===osid);
      if(orig&&od===date&&orig.debut===debut&&orig.fin===fin){doc.extras=doc.extras.filter(e=>e.id!==x.id);doc.annulees=doc.annulees.filter(t=>t!==x.de);return;}}
    Object.assign(x,{date,debut,fin});return;
  }
  const tag=`${s.date}@${s.sl.id}`;
  if(!doc.annulees.includes(tag)) doc.annulees.push(tag);
  doc.extras.push({id:'x'+Math.random().toString(36).slice(2,8),date,debut,fin,salle:s.sl.salle||'',de:tag});
}
async function applyMove(){

  if(!s||(d.swapKey&&!t))return;

  const docs=new Map(), get=c=>{if(!docs.has(c.id))docs.set(c.id,courseDoc(c));return docs.get(c.id);};
  const prev=new Map();
  for(const c of [s.c,t&&t.c].filter(Boolean)) prev.set(c.id,courseDoc(c));
  const weekly=d.scope==='weekly'&&!s.extra&&(!t||!t.extra);
  const jourOf=ds=>(parse(ds).getDay()+6)%7+1, eff=iso(monday(parse(s.date)));
  if(t){
    if(weekly){
      const ds=get(s.c);ds.creneaux=moveSlotWeekly(ds.creneaux,s.sl.id,jourOf(t.date),t.sl.debut,t.sl.fin,eff);
      const dt=get(t.c);dt.creneaux=moveSlotWeekly(dt.creneaux,t.sl.id,jourOf(s.date),s.sl.debut,s.sl.fin,eff);
    }else{
      moveOnce(get(s.c),s,t.date,t.sl.debut,t.sl.fin);
      moveOnce(get(t.c),t,s.date,s.sl.debut,s.sl.fin);
    }
  }else if(weekly){const dc=get(s.c);dc.creneaux=moveSlotWeekly(dc.creneaux,s.sl.id,jourOf(d.toDate),deb,fin,eff);}
  else moveOnce(get(s.c),s,d.toDate,deb,fin);
  S.busy=true;renderDrawer();
  const ok=await write(async()=>{for(const [id,doc] of docs) await putCours(id,doc);});
  S.busy=false;
  if(ok){
    if(S.dr===d) S.dr=null;
    const what=t?`${sObj(s)} ⇄ ${sObj(t)}`:`${sObj(s)} → ${dayLabel(parse(d.toDate)).toLowerCase()}, ${momentIn(toMin(deb),toMin(fin)).replace(/^en /,'')}`;
    logEv('horaire',t?W('a échangé deux séances','a échangé deux cours'):W('a déplacé la séance','a déplacé le cours'),what);
    toast(t?W('Séances échangées','Cours échangés'):W('Séance déplacée','Cours déplacé'),null,{label:'Annuler',fn:async()=>{if(await write(async()=>{for(const [id,doc] of prev) await putCours(id,doc);},'Changement annulé'))logEv('horaire','a annulé son changement',what);}});
  }
  render();
}

async function saveExam(force){
  const d=S.dr, f=d.draft;if(S.busy)return;
  const err=m=>{d.err=m;renderDrawer();};
  if(d.sess){
    const x=allExamItems().find(k=>k.key===d.sess);if(!x) return err('Cet examen n’existe plus.');
    const res={};
    for(const el of studentsOf(x.grp)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
    S.busy=true;d.err='';renderDrawer();
    const ok=await writeResults(x,res,'Résultats enregistrés',f.pct||{});
    S.busy=false;if(ok&&S.dr===d)S.dr=null;render();return;
  }
  if(S.role==='teacher'&&!f.cours) return err('Choisissez le cours visé par l’examen.');
  if(!f.groupe) return err('Choisissez la classe qui passe l’examen.');
  if(!f.date) return err('Indiquez la date de l’examen.');
  const j=parse(f.date).getDay();
  if(j===0||j===6) return err('L’examen tombe une fin de semaine.');
  const off=offDay(f.date);
  if(off) return err(`Le ${dn(parse(f.date))} ${fMonth.format(parse(f.date))} n’est pas un jour de classe (${off}).`);
  const a=toMin(f.debut),b=toMin(f.fin);
  if(isNaN(a)||isNaN(b)) return err('Indiquez l’heure de début et de fin.');
  if(b<=a) return err('L’examen se termine avant de commencer.');
  if(!force){
    const w=S.data.examens.filter(x=>!x.seance&&x.id!==d.id&&x.date===f.date&&x.groupe===f.groupe&&toMin(x.debut)<b&&a<toMin(x.fin)).map(x=>`${gName(f.groupe)} a déjà « ${x.titre||'un examen'} » ${momentIn(toMin(x.debut),toMin(x.fin))}.`);
    if(w.length){d.warn=w;d.err='';renderDrawer();return;}
  }
  const res={};for(const el of studentsOf(f.groupe)) if(f.resultats&&f.resultats[el.id]) res[el.id]=f.resultats[el.id];
  const doc={cours:f.cours,groupe:f.groupe,titre:f.titre.trim()||'Examen',date:f.date,debut:f.debut,fin:f.fin,salle:f.salle.trim(),surveillant:f.surveillant,notes:f.notes.trim(),maj:new Date().toISOString()};
  const id=d.id||genId('x');
  S.busy=true;d.err='';renderDrawer();
  const prevX=d.id?byId(S.data.examens,d.id):null;
  if(prevX&&prevX.exemple) doc.exemple=true;
  let ok=await write(()=>col('examens').doc(id).set(doc),d.id?'Examen enregistré':'Examen planifié');
  if(ok&&(Object.keys(res).length||Object.keys(examResOf(examItem(Object.assign({id},prevX||doc)))).length)) ok=await writeResults(examItem(Object.assign({},prevX||{},doc,{id})),res,'',f.pct||{});
  S.busy=false;
  if(ok&&S.dr===d) S.dr=null;
  render();
}

/* Remet un fichier à la personne : par la fenêtre de claude.ai quand la page y est ouverte, sinon par le navigateur */
async function saveFile(name,data){
  try{
    const C=window.claude, dl=C&&typeof C.use==='function'?await C.use('downloads'):null;
    if(dl){await dl.save({filename:name,data});toast('Fichier enregistré : '+name);return true;}
  }catch(e){
    const c=e&&e.code;
    if(c==='declined'||c==='rate_limited') return false;
    if(c&&!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){toast('Le fichier n’a pas pu être préparé.','bad');return false;}
  }
  try{
    const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data])), a=document.createElement('a');
    a.href=u;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},1500);
    toast('Fichier téléchargé : '+name);return true;
  }catch(e){toast('Téléchargement impossible dans cette fenêtre.','bad');return false;}
}
function toast(msg,kind,action){
  const t=document.createElement('div');t.className='toast'+(kind?' '+kind:'');t.setAttribute('role','status');
  const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.addEventListener('click',()=>{t.remove();action.fn();});t.appendChild(b);}
  $('#toasts').appendChild(t);setTimeout(()=>t.remove(),action?9000:4000);
}
function errMsg(e){
  const c=e&&e.code;
  if(c==='invalid_argument') return 'Modification refusée : votre accès à cette page ne le permet pas.';
  if(c==='quota_exceeded') return 'Stockage plein. Supprimez d’anciennes données, puis réessayez.';
  if(c==='revoked'){S.conn='off';return 'Votre accès a changé. Rechargez la page.';}
  return 'Enregistrement impossible pour le moment. Réessayez.';
}
async function write(fn,okMsg){
  if(S.archive){toast('Archive en lecture seule : revenez à l’année en cours pour modifier.','bad');return false;}
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  for(let i=0;i<2;i++){
    try{await fn();if(okMsg)toast(okMsg);return true;}
    catch(e){
      if(e&&e.code==='unavailable'&&i===0){await new Promise(r=>setTimeout(r,400+Math.random()*600));continue;}
      toast(errMsg(e),'bad');return false;
    }
  }
  return false;
}
async function runAll(fns,okMsg){
  if(S.archive){toast('Archive en lecture seule : revenez à l’année en cours pour modifier.','bad');return false;}
  if(!DB){toast('Ouvrez la page dans claude.ai, connecté, pour enregistrer.','bad');return false;}
  S.busy=true;render();
  const q=[...fns];let fail=0,first=null;
  const worker=async()=>{while(q.length){const f=q.shift();try{await f();}catch(e){fail++;first=first||e;}}};
  await Promise.all([worker(),worker(),worker(),worker()]);
  S.busy=false;
  if(fail) toast(errMsg(first),'bad'); else if(okMsg) toast(okMsg);
  render();
  return !fail;
}

async function clearExamples(){
  const fns=[];
  for(const k of ['comptes','cours','eleves','enseignants','groupes','examens']) for(const d of S.data[k]) if(d.exemple) fns.push(()=>col(k).doc(d.id).delete());

  for(const k of ['candidatures','remplacements']) for(const d of S.data[k]) if(d.exemple) fns.push(()=>col(k).doc(d.id).delete());
  for(const [k,c] of [['stock','stock'],['stockMvt','stock-mvt'],['compta','compta'],['factures','compta-factures'],['paie','compta-paie']]) for(const d of S.data[k]||[]) if(d.exemple) fns.push(()=>col(c).doc(d.id).delete());
  for(const [id,z] of Object.entries(S.data.dispos)) if(z&&z.exemple) fns.push(()=>col('disponibilites').doc(id).delete());
  for(const [id,z] of Object.entries(S.data.resultats)) if(z&&z.exemple) fns.push(()=>col('resultats').doc(id).delete());
  try{const q=await col('resultats-eleves').where('exemple','==',true).get();for(const d of q.docs)fns.push(()=>col('resultats-eleves').doc(d.id).delete());}catch(e){}
  for(const [id,z] of Object.entries(S.data.staffPres)) if(z&&z.exemple) fns.push(()=>col('presences-personnel').doc(id).delete());
  try{const q=await col('presences').where('exemple','==',true).get();for(const d of q.docs)fns.push(()=>col('presences').doc(d.id).delete());}catch(e){}
  if(S.data.config&&S.data.config.exemple){const c=configDoc();c.nom='';c.exemple=false;fns.push(()=>DB.doc('config/ecole').set(c));}
  S.confirmClear=false;

}

      if(!(toMin(m.am.debut)<toMin(m.am.fin)&&toMin(m.am.fin)<=toMin(m.pm.debut)&&toMin(m.pm.debut)<toMin(m.pm.fin))){toast('Les heures doivent se suivre : l’avant-midi, puis l’après-midi.','bad');return;}

document.addEventListener('input',e=>{

  if(t.dataset&&t.dataset.gradeC!=null){const sw=t.closest('.ps-grade').querySelector('.ps-gs');if(sw)sw.style.background=(GRADE_C.find(x=>x[0]===t.value)||GRADE_C[4])[2];return;}
  if(t.id==='ac-q'&&S.dr&&S.dr.kind==='acct'){
    const d=S.dr, q=t.value.trim();d.q=t.value;
    if(!q||!USER){d.hits=[];renderDrawer();return;}
    USER.search(q).then(h=>{if(S.dr===d&&d.q.trim()===q){d.hits=h||[];for(const p of d.hits)PROF[p.id]=p;renderDrawer();}}).catch(()=>{});
    return;
  }
  if(t.id==='s-q'){S.pg.q=t.value;render();return;}
  if(t.id==='stk-q'){S.pg.sq=t.value;render();return;}
  if(t.id==='stk-mq'){S.pg.smq=t.value;render();return;}
  if(t.id==='ca-q'){S.pg.cq=t.value;render();return;}
  if(t.id==='ca-q2'){S.pg.cq2=t.value;render();return;}

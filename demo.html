  if(t.id==='sa-cat'||t.id==='sa-suivi'){const f=t.form;if(t.id==='sa-cat'){f.dataset.cat=t.value;const su=f.querySelector('#sa-suivi');if(su&&f.dataset.suivi!==(t.value==='conso'?'qte':'unite')&&!f.dataset.touched){su.value=t.value==='conso'?'qte':'unite';}}else f.dataset.touched='1';f.dataset.suivi=f.querySelector('#sa-suivi').value;return;}

  if(t.id==='jr-q'){S.pg.jq=t.value;S.pg.jl='';render();return;}
  /* note en % d’un élève : elle inscrit le résultat selon le seuil de réussite */
  if(t.dataset&&t.dataset.xn&&S.dr&&S.dr.kind==='exam'){
    const dx=S.dr, el=t.dataset.xn, r=dx.draft.resultats||(dx.draft.resultats={}), p=dx.draft.pct||(dx.draft.pct={}), v=t.value.trim();
    if(v===''){if(t.validity&&t.validity.badInput)return;delete p[el];}
    else if(!isNaN(+v)){const n=Math.max(0,Math.min(100,+v));p[el]=n;r[el]=n>=seuil()?'reussi':'echec';}
    renderDrawer();return;
  }
  const d=S.dr, f=t.dataset&&t.dataset.f;
  if(!d||!f)return;
  if(d.kind==='course'){
    if(t.dataset.i!=null){const s=d.draft.creneaux[+t.dataset.i];if(s)s[f]=t.value;}else d.draft[f]=t.value;
    if(f==='titre'){const k=comps().find(x=>x.nom.toLowerCase()===t.value.trim().toLowerCase());if(k&&!d.draft.code){d.draft.code='M'+k.code;d.draft.couleur=(+k.code)%8;if(k.heures&&!d.draft.heures)d.draft.heures=String(k.heures);renderDrawer();}}
    if(d.err||d.warn){d.err='';d.warn=null;renderDrawer();}
  }else if(d.kind==='addc'){d.draft[f]=t.value;if(f==='module')d.draft.items=[];if(f==='module'||f==='groupe'||f==='date'||d.err){d.err='';renderDrawer();const again=document.getElementById(t.id);if(again&&again!==t&&t.tagName==='INPUT'&&t.type!=='date'){again.focus();}}}
  else if(d.kind==='att'&&f==='note'){d.draft.note=t.value;if(!d.dirty){d.dirty=true;renderDrawer();}}
  else if(d.kind==='exam'){
    d.draft[f]=t.value;
    if(f==='cours'){fillExamFromCourse(d.draft,true);d.err='';d.warn=null;renderDrawer();}
    else if(f==='date'){if(d.draft.cours)fillExamFromCourse(d.draft,false);d.err='';d.warn=null;renderDrawer();}
    else if(d.err||d.warn){d.err='';d.warn=null;renderDrawer();}
  }else if(d.kind==='student'||d.kind==='staff'){d.draft[f]=t.value;if(d.err){d.err='';renderDrawer();}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  {const m={'stk-f':'sf','stk-mt':'smt','stk-g':'sg','ca-g':'cg','ca-e':'ce','ca-fe':'cfe','ca-pf':'cpf','ca-m':'cm'}[t.id];if(m){S.pg[m]=t.value;if(m==='cm'||m==='sg')S.pg.sback='';render();return;}}

  if(t.dataset&&t.dataset.rpn){const v=t.value.trim();if(v===''||isNaN(+v))return;const n=Math.max(0,Math.min(100,+v));await setRetake(t.dataset.key,t.dataset.el,n>=seuil(),t.dataset.date||'',n);return;}

  /* locaux et équipements : d’une séance (pour elle seule), ou d’un cours du module (pour toutes les classes) */
  if(t.dataset&&t.dataset.rs){
    const se=findSess(t.dataset.date,t.dataset.key);if(!se)return;
    const ids=new Set(ressOf(se));if(t.checked)ids.add(t.value);else ids.delete(t.value);
    await saveSessRess(se,[...ids]);return;
  }
  if(t.dataset&&t.dataset.mcr){
    const cid=t.dataset.id, rid=t.value, on=t.checked;
    await editModule(t.dataset.code,m=>{const c=m.cours.find(x=>x.id===cid);if(!c)return false;const set=new Set(c.ress||[]);if(on)set.add(rid);else set.delete(rid);c.ress=[...set];},'Locaux et équipements du cours enregistrés');return;
  }
  /* liste d’élèves lue d’un fichier : elle arrive dans la zone de texte, à vérifier avant d’inscrire */
  if(t.dataset&&t.dataset.imp&&t.files){

    if(!f0||!ta) return;
    if(/\.(xlsx?|xlsm|ods|numbers)$/i.test(f0.name)){t.value='';toast('Un classeur Excel ne se lit pas directement : enregistrez la feuille en CSV, ou copiez ses cellules et collez-les ici.','bad');return;}
    if(f0.size>1e6){t.value='';toast('Ce fichier est trop gros pour une liste d’élèves.','bad');return;}
    let txt='';try{txt=await readTextFile(f0);}catch(e){toast('Ce fichier n’a pas pu être lu.','bad');return;}
    t.value='';
    const n=parseStudents(txt).length;
    if(!n){toast('Aucun élève reconnu dans ce fichier.','bad');return;}
    ta.value=txt.replace(/^\uFEFF/,'').trim();ta.focus();
    toast(`${pl(n,'élève reconnu','élèves reconnus')} dans ${f0.name}. Vérifiez la liste, puis Inscrire.`);return;
  }
  /* copie d’horaire : classe à copier et première journée */
  if(t.dataset&&t.dataset.cp){S.pg[t.dataset.cp==='src'?'cps':'cpd']=t.value;render();return;}
  /* fenêtre « Imprimer » : la semaine (ramenée au lundi) et pour qui */
  if(t.dataset&&t.dataset.pr&&S.dr&&S.dr.kind==='print'){
    const dp=S.dr;
    if(t.dataset.pr==='week'){if(t.value)dp.week=iso(monday(parse(t.value)));}
    else{dp.g=t.value.startsWith('g:')?t.value.slice(2):'';dp.t=t.value.startsWith('e:')?t.value.slice(2):'';}
    renderDrawer();return;
  }
  /* cours et examens cochés pour composer une séance (fenêtre « Ajouter une séance » ou fiche du module) */
  if(t.dataset&&t.dataset.pick){
    const v=t.dataset.pick, tog=a=>{const i=a.indexOf(v);if(t.checked&&i<0)a.push(v);else if(!t.checked&&i>=0)a.splice(i,1);};
    if(S.dr&&S.dr.kind==='addc'){tog(S.dr.draft.items||(S.dr.draft.items=[]));if(S.dr.err){S.dr.err='';renderDrawer();}return;}

$('#scrim').addEventListener('click',()=>closeDrawer());
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('xm-row')&&e.target.dataset.act){e.preventDefault();e.target.click();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('st-row')){e.preventDefault();openFiche('eleves',e.target.dataset.id);return;}
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.classList&&e.target.classList.contains('cl-row')){e.preventDefault();openFiche('classes',e.target.dataset.id);return;}
  if(e.key==='Escape'&&DRAG){e.preventDefault();endDrag(false);return;}
  if(e.key==='Escape'&&S.dr){e.preventDefault();closeDrawer();return;}
  if(!S.dr&&S.pg&&S.pg.fiche&&(S.page==='eleves'||S.page==='personnel'||S.page==='classes'||S.page==='modules')&&!e.altKey&&!e.ctrlKey&&!e.metaKey&&!/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')){
    if(e.key==='ArrowLeft'){e.preventDefault();ficheStep(-1);return;}
    if(e.key==='ArrowRight'){e.preventDefault();ficheStep(1);return;}
    if(e.key==='Escape'){e.preventDefault();closeFiche();return;}
  }
  if(S.dr||S.page!=='calendar'||e.altKey||e.ctrlKey||e.metaKey) return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test((e.target&&e.target.tagName)||'')) return;
  if(e.key==='ArrowLeft'&&!e.shiftKey){e.preventDefault();if(dayMode())stepDay(-1);else setWeek(addDays(S.week,-7));}
  else if(e.key==='ArrowRight'&&!e.shiftKey){e.preventDefault();if(dayMode())stepDay(1);else setWeek(addDays(S.week,7));}
  else if((e.key==='+'||e.key==='=')&&S.compact){S.compact=false;savePrefs();render();}
  else if((e.key==='-'||e.key==='_')&&!S.compact){S.compact=true;savePrefs();render();}
});

/* ---------- Glisser-déposer (administration), à la souris ----------
   Géré avec les événements du pointeur plutôt qu’avec le glisser-déposer du navigateur : pas d’animation
   de retour qui bloque la page, et la carte est toujours remise en place, même en lâchant très vite. */
let DRAG=null, dropEl=null, pendingMain=false, swallowClick=false;
function clearDrop(){if(dropEl){dropEl.classList.remove('drop-ok','drop-swap');dropEl=null;}}
function dropAt(x,y){
  if(!DRAG) return null;
  const el=document.elementFromPoint(x,y);
  if(!el||!el.closest) return null;
  const cell=el.closest('.wk-cell[data-date]');
  if(!cell||cell.dataset.off||cell.dataset.grp!==DRAG.grp) return null;
  const card=el.closest('.cc[data-key]');
  if(card&&card.dataset.key===DRAG.key) return null;
  if(card&&card.dataset.drag==='1') return {type:'swap',el:card,key:card.dataset.key,date:card.dataset.date};
  return {type:'cell',el:cell,date:cell.dataset.date};
}
function endDrag(apply,x,y){
  const d=DRAG;if(!d)return;
  const t=apply&&d.active?dropAt(x,y):null;
  DRAG=null;
  if(d.ghost) d.ghost.remove();
  document.querySelectorAll('.cc.dragging').forEach(n=>n.classList.remove('dragging'));
  document.body.classList.remove('is-dragging');
  clearDrop();
  if(d.active){swallowClick=true;setTimeout(()=>{swallowClick=false;},0);}
  if(pendingMain){pendingMain=false;renderMain();}
  if(t) openMove(d.key,d.date,t.date,t.type==='swap'?t.key:null);
}
document.addEventListener('pointerdown',e=>{
  if(DRAG) endDrag(false);
  if(e.button!==0||e.pointerType==='touch'||S.dr) return;
  const card=e.target&&e.target.closest&&e.target.closest('.cc[data-drag="1"]');
  if(!card) return;
  DRAG={key:card.dataset.key,date:card.dataset.date,grp:card.dataset.grp,x0:e.clientX,y0:e.clientY,active:false,src:card};
});
window.addEventListener('pointermove',e=>{
  const d=DRAG;if(!d)return;
  if(!d.active){
    if(Math.hypot(e.clientX-d.x0,e.clientY-d.y0)<6) return;
    if(!d.src.isConnected){DRAG=null;return;}
    d.active=true;
    const r=d.src.getBoundingClientRect();d.dx=d.x0-r.left;d.dy=d.y0-r.top;
    const g=d.src.cloneNode(true);g.removeAttribute('id');g.removeAttribute('data-act');g.classList.add('drag-ghost');g.setAttribute('aria-hidden','true');g.style.width=r.width+'px';
    document.body.appendChild(g);d.ghost=g;
    d.src.classList.add('dragging');document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  d.ghost.style.transform=`translate(${e.clientX-d.dx}px,${e.clientY-d.dy}px) rotate(1.5deg)`;
  if(e.clientY>window.innerHeight-48) window.scrollBy(0,14); else if(e.clientY<48) window.scrollBy(0,-14);
  const t=dropAt(e.clientX,e.clientY);
  if(!t){clearDrop();return;}
  if(dropEl!==t.el){clearDrop();dropEl=t.el;dropEl.classList.add(t.type==='swap'?'drop-swap':'drop-ok');}
});
window.addEventListener('pointerup',e=>{if(DRAG)endDrag(true,e.clientX,e.clientY);});
window.addEventListener('pointercancel',()=>endDrag(false));
window.addEventListener('blur',()=>endDrag(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden)endDrag(false);});
// le clic qui suit un glisser ne doit pas ouvrir le cours
document.addEventListener('click',e=>{if(swallowClick){swallowClick=false;e.preventDefault();e.stopPropagation();}},true);
setInterval(()=>{if(S.conn==='shared')renderMain();},60000);

/* ---------- Données partagées ---------- */
function onErr(e){
  if(e&&(e.code==='revoked'||e.code==='unavailable'||e.code==='not_granted'||e.code==='capability_disabled')){S.conn='off';schedule();}
}
function subWeek(){
  if(!DB||S.archive)return;
  if(unsubPres){unsubPres();unsubPres=null;}
  S.data.presences={};
  const from=iso(S.week), to=iso(addDays(S.week,6));
  try{
    unsubPres=col('presences').where('date','>=',from).where('date','<=',to).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().presences=m;schedule();
    },onErr);
  }catch(e){onErr(e);}
}
/* Présences passées : on ne charge que la période que la page affiche (le mois en cours par défaut), et on l’élargit
   quand une page en demande plus (« Depuis la rentrée », la fiche d’un élève). Une fois élargie, elle le reste. */
function ensureTerm(from){
  if(!DB||S.archive)return;
  const t=todayISO(), now=new Date(), want=from||iso(new Date(now.getFullYear(),now.getMonth(),1)), f=S.termFrom&&S.termFrom<=want?S.termFrom:want, k=f+'|'+t;
  if(S.termKey===k)return;
  if(unsubTerm){unsubTerm();unsubTerm=null;}
  S.termKey=k;S.termFrom=f;S.termLoaded=false;
  try{
    unsubTerm=col('presences').where('date','>=',f).where('date','<=',t).onSnapshot(q=>{
      const m={};for(const d of q.docs)m[d.id]=d.data();const D=LIVE();D.presTerm=Object.assign({},D.presOne,m);if(!S.archive)S.termLoaded=true;schedule();
    },e=>{S.termLoaded=true;onErr(e);});
  }catch(e){onErr(e);}
}
/* Les présences d’une séance hors de la période chargée (ouverte depuis l’historique ou les examens) se lisent à la demande,
   pour ne jamais ouvrir une feuille vide par-dessus des présences déjà prises. */
const _pw=new Set();
function loadPres(key,date){
  if(!DB||S.archive||!key||!date||S.role==='student'||presDoc(key)||_pw.has(key)) return;
  if(date>todayISO()||(date>=iso(S.week)&&date<=iso(addDays(S.week,6)))||(S.termLoaded&&S.termFrom&&date>=S.termFrom)) return;
  _pw.add(key);
  col('presences').doc(key).get().then(s=>{
    if(!s.exists) return;
    const D=LIVE();D.presOne[key]=s.data();
    if(!D.presTerm[key]) D.presTerm=Object.assign({},D.presTerm,{[key]:s.data()});
    schedule();
  }).catch(()=>{_pw.delete(key);});
}
function subscribe(){
  DB.doc('config/ecole').onSnapshot(s=>{LIVE().config=s.exists?s.data():null;S.loaded.config=true;if(!S.archive)S.data.cours=normCours(RAWC);schedule();},onErr);
  for(const k of ['cours','enseignants','groupes','eleves','examens']){
    col(k).onSnapshot(q=>{const a=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(k==='cours'){if(S.archive)S.liveRawc=a;else{RAWC=a;S.data.cours=normCours(a);}}else LIVE()[k]=a;S.loaded[k]=true;schedule();},e=>{S.loaded[k]=true;onErr(e);});
  }
  col('dossiers-personnel').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().dossiers=m;schedule();},()=>{});
  col('resultats').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().resultats=m;schedule();},()=>{});
  for(const k of ['candidatures','remplacements']) col(k).onSnapshot(q=>{LIVE()[k]=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{});
  col('disponibilites').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().dispos=m;schedule();},()=>{});
  col('profs-absents').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=(d.data().ids||[]);LIVE().absProfs=m;schedule();},()=>{});
  col('presences-personnel').onSnapshot(q=>{const m={};for(const d of q.docs)m[d.id]=d.data();LIVE().staffPres=m;schedule();},()=>{});
  if(S.me.id) DB.doc('comptes/'+S.me.id).onSnapshot(x=>{S.myAcct=x.exists?Object.assign({},x.data(),{id:x.id}):null;schedule();},()=>{});
  if(S.canAdmin!==false) col('demandes').onSnapshot(q=>{LIVE().demandes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{LIVE().demandes=[];});
  if(S.canAdmin!==false) col('comptes').onSnapshot(q=>{LIVE().comptes=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));schedule();},()=>{LIVE().comptes=[];});
  /* stock : le personnel ; compta : l’administration */
  if(S.canAdmin!==false||S.role!=='student'){
    col('stock').onSnapshot(q=>{LIVE().stock=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));S.loaded.stock=true;schedule();},()=>{S.loaded.stock=true;schedule();});
    col('stock-mvt').onSnapshot(q=>{LIVE().stockMvt=q.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((x,y)=>String(y.le||'').localeCompare(String(x.le||'')));schedule();},()=>{});
  }else S.loaded.stock=true;
  if(S.canAdmin!==false){
    let n=0;const done=()=>{if(++n>=4){S.loaded.compta=true;}schedule();};
    for(const [c,k] of [['compta','compta'],['compta-factures','factures'],['compta-paie','paie']]) col(c).onSnapshot(q=>{LIVE()[k]=q.docs.map(d=>Object.assign({},d.data(),{id:d.id}));if(!S['_cp'+k]){S['_cp'+k]=1;done();}else schedule();},()=>{if(!S['_cp'+k]){S['_cp'+k]=1;done();}});
    DB.doc('compta-reglages/ecole').onSnapshot(x=>{LIVE().cptCfg=x.exists?x.data():null;if(!S._cpcfg){S._cpcfg=1;done();}else schedule();},()=>{if(!S._cpcfg){S._cpcfg=1;done();}});
  }
  /* années clôturées (administration seulement) */
  if(S.canAdmin!==false) col('archives').onSnapshot(q=>{LIVE().archives=q.docs.map(d=>Object.assign({},d.data(),{id:d.id})).sort((x,y)=>String(y.cloture||'').localeCompare(String(x.cloture||'')));schedule();},()=>{LIVE().archives=[];});
  subWeek();
}
async function init(){
  S.day=defaultDay();
  render();
  const C=window.claude;
  if(!C||typeof C.use!=='function'){S.conn='off';render();return;}
  let db=null,user=null;
  try{[db,user]=await Promise.all([C.use('db'),C.use('user')]);}catch(e){db=null;}
  if(user){
    try{S.canAdmin=await user.canEdit();}catch(e){S.canAdmin=null;}
    try{S.canWrite=await user.can('data.write');}catch(e){S.canWrite=null;}
    USER=user;
    try{const m=await user.me();S.me={id:m.id||null,name:m.name||'',avatarUrl:m.avatarUrl||''};S.isOwner=!!m.isOwner;}catch(e){}
  }
  if(!db){S.conn='off';render();return;}
  DB=db;S.conn='shared';
  subscribe();
  render();
  // Les personnes qui ont la page ouverte : l’administration peut leur créer un compte.
  C.use('room').then(r=>{ROOM=r||null;if(r)r.onPeers(ch=>{S.peers=ch.peers.filter(p=>p.kind==='viewer'&&p.by).map(p=>({by:p.by,isMe:p.isMe,guest:p.guest}));if(S.page==='comptes'||(S.dr&&S.dr.kind==='acct'))schedule();},()=>{});schedule();}).catch(()=>{ROOM=null;});
}
init();
})();
</script>

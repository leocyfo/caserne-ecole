<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PompierNote · démo</title>
<meta name="description" content="Démo de PompierNote : horaire, classes, élèves, personnel, présences, examens, stock et comptes.">
</head>
<body>
<script src="demo/donnees.js"></script>
<script src="site/connexion.js"></script>
<script src="demo/connexion-demo.js"></script>
<title>PompierNote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{
  /* PompierNote v2, style compact : menu marine étroit, fond gris très clair, cartes blanches serrées, un seul rouge. Thème clair seulement. */
  color-scheme:light;
  --side:#0E1A2B; --side-ink:#E9EEF5; --side-soft:#B9C4D3; --side-muted:#7F8DA3; --side-line:#1F2E44; --side-hover:#162539; --side-active:#1D2F4A;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --head:#F8FAFC; --head-ink:#52627A; --row-ink:#16294A;
  --ink:#0E1A2B; --ink-2:#334256; --muted:#617086; --line:#E3E8EF; --line-2:#EDF1F6; --line-strong:#CBD4E0; --role:#0E1A2B; --role-bg:#EDF1F6;
  --accent:#C62F2A; --accent-hover:#AD2722; --accent-ink:#FFFFFF; --eyebrow:#617086; --today:#C62F2A; --focus:#2563EB;
  --ok:#17784E; --ok-bg:#DDF5E8; --warn:#93580C; --warn-bg:#FFEDCC; --bad:#B42F3A; --bad-bg:#FDE3E4; --info:#245C9A; --info-bg:#DFEBFC; --off:#5A6676; --off-bg:#E7EAEE;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px; --r-sm:7px;
  --shadow-sm:0 1px 2px rgba(14,26,43,.05),0 1px 3px rgba(14,26,43,.07);
  --shadow:0 16px 48px rgba(14,26,43,.22);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11"}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.k0{--card:#EDF4FE;--chip:#DCEAFD;--chip-ink:#275F9D;--bar:#7AA9E3}
.k1{--card:#FFF6E6;--chip:#FFEBC7;--chip-ink:#995D12;--bar:#E5A84B}
.k2{--card:#F5EFFE;--chip:#EADCFC;--chip-ink:#7043A5;--bar:#A982DB}
.k3{--card:#FDF0F6;--chip:#FBDCEC;--chip-ink:#A3326B;--bar:#DA7BA8}
.k4{--card:#F8F6E8;--chip:#F0EAC2;--chip-ink:#6F6311;--bar:#C2B04A}
.k5{--card:#EBF8F6;--chip:#D2F1EC;--chip-ink:#146C62;--bar:#4DB3A5}
.k6{--card:#EDF9F2;--chip:#D7F6E6;--chip-ink:#1C7951;--bar:#56B486}
.k7{--card:#F0F3F8;--chip:#E1E7F2;--chip-ink:#546C91;--bar:#9AA8BD}
.kx{--card:#FFF0F1;--chip:#FFE0E1;--chip-ink:#B1353F;--bar:#E26A70}
.role-chip{display:inline-flex;align-items:center;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:700;background:#FFF1E0;color:#995D12;vertical-align:1px}
/* capitaine : rouge foncé ; lieutenants : bleu marine (mêmes couleurs que leurs cartes) */
.role-chip.rc-cap{background:#9F2D35;color:#FFFFFF}
.role-chip.rc-lt{background:#1E3A5F;color:#FFFFFF}
.role-chip.rc-vert{background:#1F5F45;color:#FFFFFF}
.role-chip.rc-or{background:#8A6416;color:#FFFFFF}
.role-chip.rc-gris{background:#4B5563;color:#FFFFFF}
/* Coquille : menu marine à gauche, barre de titre blanche en haut, contenu sur fond gris très clair */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.app.side-mini{grid-template-columns:60px minmax(0,1fr)}
@media (prefers-reduced-motion: reduce){.app{transition:none}}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:0 10px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--side-line) transparent}
.brand{display:flex;align-items:center;gap:10px;padding:14px 4px 12px;color:#FFFFFF;font-weight:800;font-size:17px;letter-spacing:-.01em;line-height:1.2;min-width:0}
.brand>div{min-width:0;overflow-wrap:anywhere}
.brand .bn{white-space:nowrap;font-size:16px;letter-spacing:-.015em}
.brand .bn i{font-style:normal;color:#F3A19D}
.brand small{display:block;margin-top:1px;font-size:11.5px;letter-spacing:0;color:var(--side-muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-icon{width:32px;height:36px;border-radius:8px 8px 15px 15px;background:var(--accent);display:grid;place-items:center;flex:none;color:#FFFFFF;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand-icon svg{width:18px;height:18px}
.ws-label{display:inline-flex;align-self:flex-start;margin:0 4px 2px;padding:2px 8px;border-radius:999px;background:var(--side-hover);color:var(--side-soft);letter-spacing:.08em;font-size:10px;font-weight:700;text-transform:uppercase}
.nav{position:relative;z-index:1;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.nav-sec{padding:12px 10px 3px;color:var(--side-muted);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.nav-sec:first-child{padding-top:8px}
.nav button{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--side-soft);font-size:13.5px;font-weight:500;text-align:left}
.nav button .ic{opacity:.85}
.nav button:hover{background:var(--side-hover);color:#FFFFFF}
.nav-todo{margin-left:auto;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.09);color:var(--side-muted);font-size:11px;font-style:normal;font-weight:600;white-space:nowrap}
.side-mini .nav-todo{display:none}
.nav button[aria-current="page"] .nav-todo{background:rgba(255,255,255,.22);color:#FFFFFF}
.nav button[aria-current="page"]{background:none;color:#FFFFFF;font-weight:600}
.nav button[aria-current="page"] .ic{opacity:1;color:#FFFFFF}
/* Page ouverte : la bulle rouge du logo est derrière son entrée et glisse jusqu’à la page choisie (placée par placeNavBulle).
   Menu réduit : la bulle a la taille et la forme du logo, derrière l’icône. */
.nav-bulle{position:absolute;top:0;left:0;opacity:0;pointer-events:none;will-change:transform;border-radius:var(--r-sm);background:var(--accent);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 4px 14px rgba(198,47,42,.38);transition:transform .38s cubic-bezier(.34,1.3,.5,1),width .3s ease,height .3s ease,border-radius .3s ease,opacity .2s}
.side-mini .nav-bulle{border-radius:8px 8px 14px 14px}
.nav-bulle.on{opacity:1}
/* Menu des paramètres : « Paramètres » en tête (retour au menu), puis les sections */
.nav .nav-back{margin-bottom:6px;padding-block:8px;border-bottom:1px solid var(--side-line);border-radius:var(--r-sm) var(--r-sm) 0 0;color:#FFFFFF;font-weight:700}
.nav .nav-back .ic{opacity:1}
.nav.nav-in button>*{animation:navIn .24s ease-out}
.nav.nav-back-in button>*,.nav.nav-back-in .nav-sec{animation:navBackIn .24s ease-out}
@keyframes navIn{from{opacity:0;transform:translateX(14px)}}
@keyframes navBackIn{from{opacity:0;transform:translateX(-14px)}}
@media (prefers-reduced-motion: reduce){.nav.nav-in button>*,.nav.nav-back-in button>*,.nav.nav-back-in .nav-sec{animation:none}}
.nav-bulle.still{transition:none}
@media (prefers-reduced-motion: reduce){.nav-bulle{transition:opacity .2s}}
.person{border-top:1px solid var(--side-line);display:flex;align-items:center;gap:10px;padding:10px 4px 12px;font-size:12px;color:var(--side-ink)}
.person b{display:block;font-size:13px}
.person small{display:block;color:var(--side-muted);margin-top:2px;font-size:12px}
.content{min-width:0;padding:0 clamp(12px,1.8vw,24px) 40px;display:flex;flex-direction:column;gap:12px}
/* Menu rétractable */
.side-toggle{margin-top:auto;margin-bottom:4px;display:flex;align-items:center;gap:10px;width:100%;padding:6px 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--side-muted);font-size:12.5px;text-align:left}
.nav+.side-toggle{margin-top:auto;padding-top:9px}
.side-toggle:hover{background:var(--side-hover);color:#FFFFFF}
.side-toggle .ic{transition:transform .2s}
.side-mini .sidebar{padding:0 8px}
.side-mini .brand{justify-content:center;padding-inline:0}
.side-mini .brand>div,.side-mini .ws-label,.side-mini .person>div,.side-mini .nav-sec{display:none}
.side-mini .nav button,.side-mini .side-toggle{justify-content:center;padding-inline:0;position:relative}
.side-mini .nav button{padding-block:9px}
.side-mini .nav button>span,.side-mini .side-toggle>span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.side-mini .side-toggle .ic{transform:rotate(180deg)}
.side-mini .person{justify-content:center;padding-inline:0}
@media (prefers-reduced-motion: reduce){.side-toggle .ic{transition:none}}
/* Bandeau et profils */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:8px 10px 8px 14px;box-shadow:var(--shadow-sm)}
.banner strong{display:block;font-size:13.5px;color:var(--ink)}
.banner p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
.banner>div:first-child{min-width:0;flex:1 1 280px}
.roles{display:inline-flex;gap:3px;padding:3px;background:var(--role-bg);border-radius:10px}
.roles button{border:0;background:none;padding:5px 12px;border-radius:var(--r-sm);font-weight:600;font-size:13px;color:var(--muted)}
.roles button:hover{color:var(--ink)}
.roles button[aria-pressed="true"]{background:var(--role);color:#FFFFFF;box-shadow:var(--shadow-sm)}
/* Bandeau de démonstration (profils + données d’exemple) : se replie, le choix est retenu */
.demo{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s ease,opacity .2s ease,margin .26s ease}
.demo-in{min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:8px;padding:1px 1px 3px}
.demo.is-hidden{grid-template-rows:0fr;opacity:0;margin-bottom:-12px;visibility:hidden;transition:grid-template-rows .26s ease,opacity .2s ease,margin .26s ease,visibility 0s .26s}
.demo.is-hidden .demo-in{padding:0}
.demo-hide{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--muted);font-size:12.5px;font-weight:600;flex:none}
.demo-hide:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface-2)}
.head-side{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.demo-show{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600}
.demo-show:hover{color:var(--ink);border-color:var(--line-strong)}
.demo-hide .ic,.demo-show .ic{width:15px;height:15px}
@media (prefers-reduced-motion: reduce){.demo,.demo.is-hidden{transition:none}}
.notices{display:flex;flex-direction:column;gap:8px}
.notices:empty{display:none}
.notice{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:13px;box-shadow:var(--shadow-sm)}
.notice.warn{border-color:#F1D39C;background:#FFF8EA}
.notice p{margin:0;flex:1 1 280px;min-width:0}
.notice ul{margin:4px 0 0;padding-left:18px;flex-basis:100%}
/* Barre de titre : bande blanche en haut du contenu, titre à gauche, cloche et actions à droite */
.page-heading{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 calc(-1 * clamp(12px,1.8vw,24px));padding:10px clamp(12px,1.8vw,24px);background:var(--surface);border-bottom:1px solid var(--line);min-height:54px}
.page-heading h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.2;color:var(--ink);text-wrap:balance}
.page-heading p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
/* Titre (ou onglets), barre de la page, cloche : une ligne si tout y entre ; sinon libellés courts (hd-short) ;
   sinon la barre de la page passe sur une deuxième ligne (hd-two). fitHeading choisit. */
.ph-t{min-width:0}
.ph-row{display:flex;align-items:center;gap:6px 14px;flex-wrap:nowrap}
.pg-tabs button{padding:5px 11px}
/* Entrée qui réunit plusieurs pages : les onglets servent de titre ; le titre reste pour les lecteurs d’écran */
.has-tabs .ph-row h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ph-tools{flex:1 1 auto;min-width:0}
.ph-tools:empty{display:none}
.page-heading.with-tools{flex-wrap:nowrap;gap:8px 14px}
.with-tools .ph-t,.with-tools .head-side{flex:none}
.head-side{flex-wrap:nowrap}
.ph-tools>.ctl,.ph-tools>.toolbar{flex-wrap:nowrap;gap:8px;margin:0;padding:0;background:none;border:0;border-radius:0;box-shadow:none}
.ph-tools>.ctl>*:not(.grow),.ph-tools>.toolbar>*:not(.grow){flex:none}
.ph-tools .seg.sm button{padding:5px 11px}
.ph-tools .wk-range,.ph-tools .summary{white-space:nowrap}
.ph-tools .summary{font-size:13px}
.ph-tools .summary b{font-size:14px}
.vm-seg button{display:inline-grid;place-items:center;padding:5px 8px}
.vm-seg .ic{width:16px;height:16px}
.hd-short .t-long,.hd-short .ds-t{display:none}
.hd-short .t-short{display:inline}
.hd-short .demo-show{padding:0 9px}
.hd-short .ph-tools .search{width:170px}
.page-heading.hd-two{flex-wrap:wrap}
.hd-two .ph-t{flex:1 1 auto}
.hd-two .ph-tools{order:3;flex-basis:100%}
.hd-two .ph-tools>.ctl,.hd-two .ph-tools>.toolbar{flex-wrap:wrap}
/* sur deux lignes, la barre de la page peut aussi se replier (onglets, résumés, recherche) pour ne jamais dépasser */
.hd-two .ph-tools>.toolbar>*:not(.grow){flex:0 1 auto;min-width:0}
.hd-two .ph-tools .summary{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Boutons et champs */
.btn{min-height:34px;padding:6px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);box-shadow:0 1px 2px rgba(14,26,43,.05);font-size:13px;font-weight:600;color:var(--ink);transition:background .12s,border-color .12s,box-shadow .12s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(198,47,42,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.danger{color:var(--bad);border-color:#EBB7BC;background:var(--surface)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--role-bg)}
.btn.sm{min-height:30px;padding:4px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:15px;height:15px}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 1px 2px rgba(14,26,43,.05);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
select,.search{min-height:34px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 9px;font-size:13.5px;color:var(--ink);min-width:0;max-width:100%}
.search{padding-left:12px;width:240px}
select:hover,.search:hover{border-color:#B5C0CE}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--role-bg);border-radius:var(--r);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(14,26,43,.08),0 1px 4px rgba(14,26,43,.08)}
/* Barre d’outils */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .grow{flex:1 1 0}
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range{min-height:34px;display:inline-flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 1px 2px rgba(14,26,43,.05);background:var(--surface);font-weight:700;font-size:13.5px;color:var(--ink);white-space:nowrap}
.summary{display:flex;flex-wrap:wrap;gap:4px 20px;margin:0;font-size:14px;color:var(--muted)}
.summary b{color:var(--ink);font-size:16px;margin-right:4px}
.summary .need b{color:var(--warn)}
/* Étiquettes */
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;background:var(--chip,#E1E7F2);color:var(--chip-ink,#546C91);font-variant-numeric:tabular-nums;flex:none}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad,.chip.exam{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.off{background:var(--off-bg);color:var(--off)}
.chip.today{background:var(--accent);color:var(--accent-ink)}
/* Tableau de la semaine */
.week{display:grid;grid-template-columns:90px repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wk-row{display:contents}
.wk-corner,.wk-day{background:var(--head);color:var(--head-ink);border-bottom:1px solid var(--line);padding:8px 6px;font-size:12.5px;font-weight:700;text-align:center}
.wk-corner{text-align:left;padding-left:12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.wk-day.is-today{box-shadow:inset 0 -3px var(--today)}
.wk-class{background:var(--surface-2);border-bottom:1px solid var(--line-2);padding:9px 10px;display:flex;flex-direction:column;color:var(--row-ink);font-weight:700;font-size:15px;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.wk-class small{color:var(--muted);font-size:11px;font-weight:500;margin-bottom:2px}
.day-head{font-size:16px}
.day-head small{text-transform:capitalize;font-size:12px;font-weight:700}
.day-head.is-today{box-shadow:inset 3px 0 var(--today)}
.wk-day.day-col{padding:0}
.day-pick{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:12px 6px;border:0;background:none;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.day-pick:hover{background:#E4ECF6}
.day-pick small{font-size:11px;font-weight:600;margin-top:2px}
.wk-day.day-col.on{background:#E8F0FA;box-shadow:inset 0 -3px var(--role)}
.wk-day-range{min-width:190px;text-transform:none}
.wk-cell{border-bottom:1px solid var(--line-2);border-left:1px solid var(--line-2);padding:6px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wk-cell.is-today{background:#F9FBFF}
.week>.wk-row:last-child>*{border-bottom:0}
.cell-note{margin:0;padding:10px 6px;font-size:13px;color:#8E9AAB}
.cc{display:flex;flex-direction:column;gap:2px;width:100%;padding:6px 9px 7px;border:1px solid transparent;border-left:3px solid var(--bar,#9AA8BD);border-radius:var(--r-sm);background:var(--card,#F1F4F9);text-align:left;color:var(--ink);min-width:0;transition:border-color .15s,box-shadow .15s}
button.cc:hover{border-top-color:#C8D3DF;border-right-color:#C8D3DF;border-bottom-color:#C8D3DF;box-shadow:0 2px 8px rgba(20,33,50,.09)}
.cc-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:3px 8px}
.cc-time{font-size:12px;font-weight:700;color:var(--chip-ink,var(--muted));font-variant-numeric:tabular-nums;white-space:nowrap}
.cc-kind{padding:2px 8px;border-radius:999px;background:var(--chip,#E1E7F2);color:var(--chip-ink,#546C91);font-size:11px;font-weight:700;line-height:1.3;white-space:nowrap}
.cc-foot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px;padding-top:4px;border-top:1px solid rgba(20,33,50,.08)}
.cc-st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.cc-st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.cc-st.ok{color:var(--ok)}
.cc-st.warn{color:var(--warn)}
.cc-st.info{color:var(--info)}
.cc-st.bad{color:var(--bad)}
.cc-flag{margin-left:auto;padding:1px 7px;border:1px solid var(--line-strong);border-radius:5px;background:rgba(255,255,255,.65);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.cc-st+.cc-flag,.cc-flag+.cc-flag{margin-left:0}
.cc-tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.cc strong{font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);overflow-wrap:break-word;margin-top:1px}
.cc-meta{font-size:12px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.cc.cancelled{background:#F2F3F5}
.cc.cancelled strong{text-decoration:line-through;color:var(--muted)}
.cc.offday{background:#F0F3F8}
.cc.exam{background:#FFF0F1}
@media (prefers-reduced-motion: reduce){.cc{transition:none}}
.daytabs{display:none;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.daytabs.show{display:grid}
.daytabs button{display:flex;flex-direction:column;align-items:center;padding:7px 4px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--muted);font-size:12px;min-width:0}
.daytabs strong{font-size:18px;color:var(--ink);line-height:1.15}
.daytabs button[aria-pressed="true"]{background:var(--role);border-color:var(--role);color:#FFFFFF}
.daytabs button[aria-pressed="true"] strong{color:#FFFFFF}
.daytabs .is-today:not([aria-pressed="true"]){border-color:var(--today)}
.daytabs .mark{width:6px;height:6px;border-radius:50%;background:var(--ok);margin-top:3px}
/* Panneaux, tableaux, indicateurs */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px;align-items:start}
.panel,.page-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;box-shadow:var(--shadow-sm)}
.page-panel{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:860px}
.panel h2{margin:0 0 8px;font-size:14px;font-weight:700;letter-spacing:-.005em;color:var(--ink)}
.panel p{margin:0 0 8px}
.big{font-weight:700;font-size:26px;line-height:1;margin:0 0 6px;font-variant-numeric:tabular-nums}
.big span{font-size:18px;color:var(--muted)}
.meter{height:7px;background:var(--role-bg);border-radius:999px;overflow:hidden;margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;min-width:0;box-shadow:var(--shadow-sm)}
.kpi span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kpi b{display:block;font-size:23px;margin-top:3px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.kpi.need b{color:var(--warn)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{background:var(--head);color:var(--head-ink);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:8px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle;font-size:13.5px}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.row-link{cursor:pointer}
.tbl tr.row-link:hover td{background:var(--surface-2)}
.tbl tr.row-link:hover .link{text-decoration:underline}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th.num{text-align:right}
.tbl select{min-height:34px;font-size:13px}
.hr-tbl th,.hr-tbl td{padding-left:12px;padding-right:12px}
.hr-tbl th:first-child,.hr-tbl td:first-child{padding-left:20px}
.hr-tbl th.on,.hr-tbl td.on{background:var(--role-bg)}
.hr-tbl tr.row-link:hover td.on{background:var(--role-bg)}
.hr-m{border:0;background:none;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:5px 8px;margin:-5px -8px;border-radius:var(--r-sm);cursor:pointer}
.hr-m:hover{background:var(--surface)}
.hr-m[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--role)}
.hr-tot td{font-weight:700;background:var(--head);border-top:1px solid var(--line)}
.hr-tot td.on{background:var(--role-bg)}
.bell{position:relative;width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:0 1px 2px rgba(14,26,43,.05);background:var(--surface);display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.bell:hover{background:var(--surface-2);color:var(--ink)}
.bell .ic{width:17px;height:17px}
.bell-n{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--bad);color:#FFFFFF;font-size:10.5px;font-weight:700;font-style:normal;line-height:17px;text-align:center}
.nf-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.nf-row{display:flex;flex-direction:column;gap:6px;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.nf-row:hover{background:var(--surface-2)}
.nf-row.new{border-color:var(--role);box-shadow:inset 3px 0 0 var(--role)}
.nf-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nf-h small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.nf-tx{font-size:14.5px;line-height:1.4}
#print-root{display:none}
@media print{body.printing{background:#fff}body.printing>*:not(#print-root){display:none!important}body.printing>#print-root{display:block}}
.pr-btns{display:flex;flex-wrap:wrap;gap:8px}
.cp-box{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.link{background:none;border:0;padding:0;font-weight:700;color:var(--ink);text-align:left}
.link:hover{text-decoration:underline;color:var(--head-ink)}
.help{font-size:13px;color:var(--muted);margin:0}
.muted{color:var(--muted)}
.sm{font-size:13px}
.list{display:flex;flex-direction:column}
.lrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:7px 0;background:none;border:0;text-align:left;color:var(--ink)}
.lrow+.lrow{border-top:1px solid var(--line-2)}
button.lrow:hover .ti{text-decoration:underline}
.lrow.cancelled .ti{text-decoration:line-through;color:var(--muted)}
.when{font-weight:700;font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.when small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.what{min-width:0;display:flex;flex-direction:column;gap:2px}
.what .ti{font-weight:700;font-size:14px}
.what .sub{color:var(--muted);font-size:13px}
.next{display:flex;flex-direction:column;gap:6px}
.next .nx-t{font-weight:700;font-size:19px;line-height:1.2;margin:0;text-wrap:balance}
.next .nx-w{font-weight:600;color:var(--ink-2)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line-2)}
.tl li:first-child{border-top:0}
.tl .d{font-weight:700;font-variant-numeric:tabular-nums}
.tl .d small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.tl .t{min-width:0}
.tl .t b{display:block;font-size:15px}
.tl .t span{color:var(--muted);font-size:13px}
.tl li.past{opacity:.55}
.empty{padding:26px 18px;text-align:center;background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r)}
.empty h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.empty p{margin:0 auto 14px;max-width:52ch;color:var(--muted)}
.steps{text-align:left;max-width:52ch;margin:0 auto 18px;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.empty .row{justify-content:center}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px;align-items:start}
.stackp{display:flex;flex-direction:column;gap:10px;min-width:0}
/* Les grands blocs blancs ont la même ombre légère que les panneaux */
.boardbox,.cl-list,.xm-tile,.md-m,.fiche-list,.ctl{box-shadow:var(--shadow-sm)}
/* Tiroir */
.scrim{position:fixed;inset:0;background:rgba(20,33,50,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;overflow-y:auto;box-shadow:var(--shadow);animation:slide .18s ease-out;display:flex;flex-direction:column}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.dr-top{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0}
.dr-tt{min-width:0}
.eyebrow{margin:0;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--eyebrow);font-size:11px}
.dr-top h2{margin:4px 0 0;font-weight:700;font-size:19px;line-height:1.2;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink)}
.dr-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.dr-body{padding:12px 20px 18px;display:flex;flex-direction:column;gap:12px;flex:1}
.dr-sec{display:flex;flex-direction:column;gap:8px}
.dr-sec h3,.dr-h3{margin:0;font-weight:700;font-size:16px}
.dr-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:9px 20px calc(9px + env(safe-area-inset-bottom,0px));display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;z-index:2}
.dr-foot p{margin:0;flex:1 1 200px;font-size:14px}
.state{font-size:13px;color:var(--muted)}
.state.dirty{color:var(--warn);font-weight:700}
.sess-box{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.sess-box p{margin:0}
.sess-box .per-lg{font-weight:700;font-size:16px}
.sb-head{display:flex;flex-direction:column;gap:7px}
.sb-chips{display:flex;flex-wrap:wrap;gap:6px}
.sb-chips .chore-chip{margin-left:0}
.sb-facts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 14px}
.sb-facts dd{font-size:14px}
.sb-h3{margin:6px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin:0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.facts dd{margin:3px 0 0;font-weight:700;font-size:15px;overflow-wrap:anywhere}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.wlist li{display:flex;gap:10px}
.wlist .d{font-weight:700;min-width:44px}
/* Présences */
.att-sum{display:flex;flex-wrap:wrap;gap:6px}
.att-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.att-list li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line-2)}
.att-list li:first-child{border-top:0}
.att-list .nm{flex:1;min-width:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.att-list .nm small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.att-btns{display:inline-flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.ab{font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:var(--r-sm);padding:6px 9px;min-width:36px}
.ab:hover{color:var(--ink);border-color:var(--line-strong)}
.ab .abbr{display:none}
.ab-P[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.ab-A[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.ab-R[aria-pressed="true"],.ab-C[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#FFFFFF}
.ab-M[aria-pressed="true"],.ab-F[aria-pressed="true"]{background:var(--info);border-color:var(--info);color:#FFFFFF}
/* Formulaires */
form{display:flex;flex-direction:column;gap:10px;margin:0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600;min-width:0}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:7px 9px;font-size:14px;font-weight:400;color:var(--ink);width:100%;min-width:0;min-height:36px}
.field textarea{min-height:76px;resize:vertical}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px 12px;margin:0;min-width:0;display:flex;flex-direction:column;gap:10px}
legend{font-size:13px;color:var(--ink-2);font-weight:600;padding:0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-code{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
.slot{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
.slot-times{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,170px));gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{position:relative;cursor:pointer;display:inline-flex}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw-dot{display:block;width:28px;height:28px;border-radius:50%;background:var(--chip-ink);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong)}
.sw input:checked+.sw-dot{box-shadow:0 0 0 2px var(--ink)}
.sw input:focus-visible+.sw-dot{outline:2px solid var(--focus);outline-offset:3px}
.inline-add{flex-direction:row;flex-wrap:wrap;align-items:flex-end;gap:8px}
.inline-add .field{flex:1 1 170px}
.form-err{color:var(--bad);font-size:14px;margin:0;font-weight:700}
.t-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line-2);font-size:14px}
.plist li:first-child{border-top:0}
.x{width:30px;height:30px;border:1px solid transparent;border-radius:var(--r-sm);background:none;color:var(--muted);font-size:18px;line-height:1;flex:none}
.x:hover{border-color:var(--line-strong);color:var(--bad)}
.confirm{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:var(--r);background:#FFF5F5;border:1px solid #F1C4C8}
.confirm p{margin:0;font-size:14px}
.sec-title{margin:0;font-size:16px;font-weight:700}
.access{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.access li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px}
/* Bande d’agrandissement (reprise de l’Encyclopédie de Sky-Helper) : ▶ agrandit, ◀ réduit */
.boardbox{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.boardbox>.week{flex:1;min-width:0;border:0;border-radius:0}
.expander{display:flex;align-items:center;justify-content:center;gap:8px;width:32px;flex:none;border:0;border-right:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);padding:0}
.expander:hover{background:var(--head);color:var(--ink)}
.exp-arrow{width:14px;height:14px;transition:transform .2s}
.expander[aria-expanded="true"] .exp-arrow{transform:rotate(180deg)}
.expander .lbl{display:none;font-size:13px;font-weight:700}
.tstart,.xtag{display:none}
.cc-title{display:flex;align-items:baseline;gap:6px;min-width:0}
.week.compact .cc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:3px 6px;padding:6px 9px 7px}
.week.compact .cc-tags,.week.compact .cc-meta,.week.compact .cc-foot,.week.compact .cc-note{display:none}
.week.compact .cc-top{grid-column:1/3;grid-row:1;justify-content:flex-start;flex-wrap:nowrap;gap:6px;min-width:0}
.week.compact .cc-tr{margin-left:0}
.week.compact .cc-time{font-size:11.5px}
.week.compact .cc-kind{padding:0 6px;font-size:10px;line-height:1.55}
.week.compact .cc-title{grid-column:1/-1;grid-row:2;min-width:0}
.week.compact .cc.offday strong{grid-column:1/-1;grid-row:2}
.week.compact .cc strong{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.week.compact .cc[data-st]::after{content:"";grid-column:3;grid-row:1;width:8px;height:8px;border-radius:50%}
.week.compact .cc[data-st="done"]::after{background:var(--ok)}
.week.compact .cc[data-st="todo"]::after,.week.compact .cc[data-st="partial"]::after{background:var(--warn)}
.week.compact .wk-cell{gap:4px;padding:5px}
.week.compact .wk-class{padding:8px 12px;font-size:15px}
.week.compact .cell-note{padding:5px 6px}
.week.compact .cell-add{padding:3px}
.cc.enter{animation:card-in .2s ease-out both}
@keyframes card-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.exp-arrow{transition:none}.cc.enter{animation:none}}
/* Statuts d’un cours (style Pronote) : étiquette en bas à droite, carte grisée */
.cc.has-badge{position:relative;background:#F2F3F5;--bar:#B8C0CC;--chip:#E3E6EB;--chip-ink:#5E6B7D;padding-bottom:34px}
.cc.has-badge strong{text-decoration:none}
.cc.cancelled strong{color:var(--ink-2)}
.cc-badge{position:absolute;right:0;bottom:0;padding:4px 10px;border-radius:var(--r-sm) 0 7px 0;font-size:12px;font-weight:700;line-height:1.3;color:#FFFFFF;white-space:nowrap}
.cc-badge.bad{background:#E5484D}
.cc-badge.info{background:#3B9BD9}
.cc-note{font-size:12.5px;font-weight:600;color:var(--info);line-height:1.35}
.week.compact .cc.has-badge{padding-bottom:7px}
.week.compact .cc.has-badge .cc-title{grid-column:1}
.week.compact .cc-badge{position:static;grid-column:2/4;grid-row:2;padding:1px 6px;border-radius:4px;font-size:10px}
.week.compact .cc.has-badge[data-st]::after{display:none}
/* Comptes et profils */
.av{width:34px;height:34px;border-radius:50%;background:#2C4F78;color:#FFFFFF;display:inline-grid;place-items:center;flex:none;font-size:12px;font-weight:700;overflow:hidden}

.av.lg{width:72px;height:72px;font-size:24px}

.person-btn:hover,.person-btn[aria-current="page"]{background:var(--side-hover)}
.pinfo{min-width:0}
.pinfo b,.pinfo small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-mini .person .pinfo{display:none}
.side-mini .person-btn{justify-content:center;margin:0}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-size:14px}

/* Barre de contrôle de l’horaire : une seule ligne, l’essentiel seulement */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(20,33,50,.04)}
.ctl .grow{flex:1 1 0}
.wk{display:inline-flex;align-items:stretch;height:40px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.wk>button{width:38px;border:0;background:none;color:var(--ink-2);display:grid;place-items:center;flex:none}
.wk>button:hover{background:var(--surface-2);color:var(--ink)}
.wk-range{display:flex;align-items:center;justify-content:center;padding:0 16px;border-inline:1px solid var(--line);min-width:150px;font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.today-btn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px;font-weight:700;color:var(--head-ink)}
.today-btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.vsep{width:1px;height:24px;background:var(--line-2);flex:none}
.viewsel{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;min-width:0}
.seg.sm button{padding:6px 12px;font-size:12.5px}
.ctl .seg.sm{padding:3px}
.ctl .seg.sm button{padding:8px 15px;font-size:13px}
.token{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 5px 0 12px;border-radius:999px;background:var(--role);color:#FFFFFF;font-size:13px;font-weight:700;white-space:nowrap}
.token button{width:22px;height:22px;border:0;border-radius:50%;background:rgba(255,255,255,.2);color:#FFFFFF;display:grid;place-items:center;font-size:14px;line-height:1;padding:0}
.token button:hover{background:rgba(255,255,255,.34)}
.viewsel .fchip{min-height:32px;padding:4px 12px;font-size:12.5px}
.tch-row{gap:6px}
.tch-row .fchip{min-height:30px;padding:3px 11px;font-size:12.5px}
.late{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:0;border-radius:999px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:700;white-space:nowrap}
.late::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.late:hover{text-decoration:underline}
@media (max-width: 760px){
  .wk{flex:1 1 100%}
  .wk-range{flex:1;min-width:0}
  .vsep,.ctl .grow{display:none}
}
/* Ligne d’une classe : un clic l’affiche seule, un autre revient à toutes les classes */
.wk-class.pick{padding:0}
.wk-pick{display:flex;flex-direction:column;align-items:flex-start;width:100%;height:100%;padding:12px;border:0;background:none;text-align:left;color:inherit;font:inherit;font-weight:700;cursor:pointer;transition:background-color .15s}
.wk-pick:hover{background:var(--head)}
.wk-class.on{background:#E8F0FA;box-shadow:inset 3px 0 var(--role)}
.pick-hint{margin-top:8px;font-size:11.5px;font-weight:600;line-height:1.3;color:var(--head-ink);opacity:0;transition:opacity .15s}
.wk-pick:hover .pick-hint,.wk-pick:focus-visible .pick-hint,.wk-class.on .pick-hint{opacity:1}
@media (hover:none){.pick-hint{opacity:1}}
@media (prefers-reduced-motion: reduce){.wk-pick,.pick-hint{transition:none}}
.week.compact .wk-pick{padding:8px 12px}
.week.compact .pick-hint{margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.fchip{display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;font-weight:700;color:var(--ink-2)}
.fchip:hover{border-color:var(--line-strong);background:var(--surface-2)}
.fchip small{font-weight:600;font-size:11.5px;color:var(--muted);background:var(--role-bg);border-radius:999px;padding:1px 7px}
.fchip[aria-pressed="true"]{background:var(--role);border-color:var(--role);color:#FFFFFF}
.fchip[aria-pressed="true"] small{background:rgba(255,255,255,.18);color:#FFFFFF}
.hint{margin:0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.hint .ic{width:16px;height:16px}
.cc[data-drag="1"]{cursor:grab;touch-action:pan-y}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
.drag-ghost{position:fixed!important;left:0;top:0;z-index:40;margin:0;pointer-events:none;box-shadow:0 14px 34px rgba(20,33,50,.28);opacity:.96;transition:none!important}
.cc.dragging{opacity:.4}
.wk-cell.drop-ok{background:#EEF5FF;box-shadow:inset 0 0 0 2px #7FA7E0}
.cc.drop-swap{box-shadow:0 0 0 2px var(--focus);border-color:var(--focus)}
body.is-dragging .cell-add{opacity:0!important}
.cell-add{margin-top:auto;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:none;color:var(--muted);font-size:12.5px;font-weight:700;padding:6px;opacity:0;transition:opacity .15s}
.cell-add:hover{color:var(--ink);border-color:var(--muted);background:var(--surface)}
.wk-cell:hover .cell-add,.cell-add:focus-visible{opacity:1}
@media (hover:none){.cell-add{opacity:1}}
.drawer.dialog{top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);border-radius:var(--r);animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}to{opacity:1;transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion: reduce){.drawer.dialog{animation:none}.cell-add{transition:none}}
.mv-route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.mv-arrow{font-size:20px;color:var(--muted);font-weight:700}
.mv-box{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2);min-width:0}
.mv-box small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mv-box b{display:block;font-size:14px;margin-top:2px}
.mv-box span{font-size:13px;color:var(--ink-2)}
.choice{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.opt:has(input:checked){border-color:var(--role);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--role)}
.opt input{margin:3px 0 0;accent-color:var(--role)}
.opt b{display:block;font-size:14px}
.opt span{font-size:13px;color:var(--muted)}
/* Toasts */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:8px;width:min(460px,calc(100% - 32px));pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;background:var(--side);color:#FFFFFF;padding:12px 16px;border-radius:var(--r);font-size:14px;box-shadow:var(--shadow);pointer-events:auto}
.toast.bad{background:var(--bad)}
.toast button{margin-left:auto;flex:none;background:none;border:1px solid rgba(255,255,255,.55);color:#FFFFFF;border-radius:var(--r-sm);padding:5px 11px;font-weight:700;font-size:13px}
.toast button:hover{background:rgba(255,255,255,.12)}
@media (max-width: 1100px){ .week{grid-template-columns:84px repeat(5,minmax(0,1fr))} .wk-class{font-size:15px;padding:10px 8px} .two{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 900px){

  .brand{padding:16px 0 12px}

  .sidebar{position:relative}

@media (max-width: 460px){ .ab .full{display:none} .ab .abbr{display:inline} }
/* Téléphone : ce qui change sur un écran étroit (jusqu’à 760 px). Vérifié par tests/steps-phone.js à 390 px. */
/* Un texte réservé aux lecteurs d’écran ne doit pas sortir de la boîte d’un tableau qui défile (il élargissait la page Comptes) */
.tbl-wrap{position:relative}
/* Texte long sur grand écran, texte court sur téléphone (même bouton) */
.t-short{display:none}
/* iPhone tenu à l’horizontale : rien sous l’encoche */
body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer{padding-right:env(safe-area-inset-right,0px)}
@media (max-width:760px){
  /* Barre de titre plus basse et blocs plus serrés : l’horaire arrive plus vite */
  .page-heading{min-height:0;padding-top:12px;padding-bottom:12px}
  .page-heading h1{font-size:20px}
  .content{gap:14px}
  /* Champs à 16 px : en dessous, l’iPhone zoome chaque fois qu’on touche un champ */
  :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea){font-size:16px}
  /* Panneau latéral : marges de téléphone */
  .dr-top,.dr-body,.dr-foot{padding-left:16px;padding-right:16px}
  /* Présences : boutons à la taille du doigt (44 px) */
  .ab{min-width:44px;min-height:44px;padding:0 6px;font-size:15px}
  .att-btns{gap:5px}
  .dr-body [data-act=att-all],.dr-foot .btn{min-height:44px}
  #dr-close{width:44px;height:44px}
  /* Une ligne de liste : le moment et l’état en haut, le titre sur toute la largeur dessous */
  .lrow{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}
  .lrow>.when{grid-column:1;grid-row:1}
  .lrow>.chip{grid-column:2;grid-row:1;justify-self:end}
  .lrow>.chip+.chip{grid-column:1/-1;grid-row:3;justify-self:start}
  .lrow>.what{grid-column:1/-1;grid-row:2}
  /* À rattraper : la date à gauche, le bouton sous le titre */
  .miss-list .lrow{grid-template-columns:52px minmax(0,1fr);column-gap:14px;row-gap:10px}
  .miss-list .lrow>.miss-d{grid-column:1;grid-row:1/span 2;align-self:start}
  .miss-list .lrow>.what{grid-column:2;grid-row:1}
  .miss-list .lrow>.miss-go{grid-column:2;grid-row:2;justify-self:start}
  /* Examens en liste : l’étiquette sous le titre, et le titre entier */
  .xm-mini{grid-template-columns:52px minmax(0,1fr);row-gap:8px}
  .xm-mini>.chip{grid-column:2;justify-self:start}
  .xm-t b,.xm-t small,.xm-tile small{white-space:normal}
  /* Barre de l’horaire sur trois rangées : la semaine ; l’affichage ; les retards et l’ajout */
  .t-long{display:none}
  .t-short{display:inline}
  .ctl{gap:10px}
  .ctl>.seg,.ctl>.viewsel{flex:1 1 40%;min-width:0}
  .ctl>.viewsel:has(.chips){flex-basis:100%}
  .ctl>.seg,.ctl>.viewsel>.seg{display:flex;flex-wrap:nowrap}
  .ctl>.viewsel>.seg{flex:1 1 100%}
  .ctl .seg.sm button{flex:1 1 auto;padding:8px 6px}
  .ctl>.late,.ctl>#new-course{flex:1 1 40%;justify-content:center;min-height:40px}
  /* Élèves, Personnel, Comptes : un tableau devient une liste, une personne par bloc ;
     l’essentiel en haut (nom, et à droite la présence, le statut ou le rôle), le reste dessous avec son libellé */
  .tbl-wrap:has(>.tbl.stack){overflow:visible}
  table.tbl.stack,.tbl.stack tbody{display:block;width:100%;min-width:0}
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{display:block;padding:0;border:0;font-size:14px;text-align:left}
  .tbl.stack td:first-child{flex:1 1 0;min-width:0}
  .tbl.stack tr::after{content:"";order:1;flex-basis:100%;margin-top:-6px}
  .tbl.stack td.tb-line{flex-basis:100%}
  .tbl.stack td.tb-top{order:1;flex:none;margin-left:auto}
  .tbl.stack td:not(:first-child):not(.tb-top){order:2;color:var(--ink-2)}
  .tbl.stack td.tb-act{margin-left:auto}
  .tbl.stack td[data-l]::before{content:attr(data-l) " ";color:var(--muted)}
  .tbl.stack td:has(>.tb-empty){display:none}
  .tbl.stack .tb-n{font-size:14px}
  .tbl.stack .tb-cls .cl-num,.tbl.stack .tb-rate .meter{display:none}
  .tbl.stack .tb-rate{min-width:0}
  /* Petits textes : 12 px au moins */
  .chip,.chore-chip,.role-chip,.wk-corner,.wk-class small,.day-pick small,.cc-kind,.cc-flag,.kpi span,.tbl th,.eyebrow,.facts dt,
  .cl-hd,.cl-row [data-l]::before,.xm-tile .lbl,.xm-hd,.xm-d small,.nav-n,.nav-todo,.dp-wd,.dp-c span,.md-m>span,.xg thead th,.xg tfoot .xg-n,
  .xg thead .xg-r,.xg-r small,.xg-h small,.st-hd,.st-row [data-l]::before,.miss-d small,.col-prin,.fh-stats dt,.fiche-h3,
  .cell-chore small,.fchip small,.mv-box small,.pick-hint{font-size:12px}
}

/* ---------- Stock ---------- */

/* ---------- Compta ---------- */
.cp-tbl td.num,.cp-tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Affichage des listes (Affectations, Classes, Élèves, Personnel, Modules, Examens) : Liste par défaut, Cartes ou Compact.
   #main porte la classe view-cards ou view-dense ; le choix est retenu pour chaque page (bouton dans la barre du titre). */

/* ----- Cartes : listes à lignes (Affectations, Modules, Examens) ----- */
#main.view-cards .xm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px;background:none;border:0;box-shadow:none;overflow:visible}
#main.view-cards .xm-list>.xm-hd{display:none}
#main.view-cards .xm-list>.xm-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px 16px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm)}
#main.view-cards .xm-list>.xm-row.go:hover{background:var(--surface);border-color:var(--line-strong)}
#main.view-cards .xm-list>.xm-row>*{min-width:0}
/* en haut de la carte : la vignette (date, numéro) et le titre */
#main.view-cards .xm-list>.xm-row>.xm-t:not([data-l]){flex:1 1 calc(100% - 80px)}

/* ---------- Calcul des cours et des examens ---------- */
function offDay(ds){
  const c=cfg();
  if((c.debut&&ds<c.debut)||(c.fin&&ds>c.fin)) return 'Hors année scolaire';
  for(const k of c.conges||[]){ if(k&&k.du&&ds>=k.du&&ds<=(k.au||k.du)) return k.nom||'Congé'; }
  return null;
}
const activeSlots=c=>(c.creneaux||[]).filter(s=>!s.au||s.au>=todayISO());
/* L’horaire d’un jour est gardé en mémoire tant que les séances, le calendrier scolaire et les affectations ne changent pas.
   Le tableau rendu est figé : qui veut le trier ou le filtrer en fait une copie. */
let _so={c:null,g:null,a:null,m:new Map()};
function sessionsOn(ds){
  const D=S.data;
  if(_so.c!==D.cours||_so.g!==D.config||_so.a!==D.candidatures) _so={c:D.cours,g:D.config,a:D.candidatures,m:new Map()};
  let r=_so.m.get(ds);
  if(!r){r=Object.freeze(sessionsOnRaw(ds));_so.m.set(ds,r);}
  return r;
}
function sessionsOnRaw(ds){
  const d=parse(ds), j=(d.getDay()+6)%7+1;
  if(j>5||offDay(ds)) return [];
  const out=[];
  for(const c of S.data.cours){
    const ann=c.annulees||[];
    if(!((c.du&&ds<c.du)||(c.au&&ds>c.au))) for(const sl of c.creneaux||[]){
      if(+sl.jour!==j||(sl.du&&ds<sl.du)||(sl.au&&ds>sl.au)) continue;
      const a=toMin(sl.debut), b=toMin(sl.fin);
      if(isNaN(a)||isNaN(b)||b<=a) continue;
      const tag=`${ds}@${sl.id}`, cancelled=ann.includes(tag);
      out.push({kind:'cours',key:`${c.id}_${sl.id}_${ds}`,c,sl,date:ds,start:a,end:b,grp:c.groupe,tch:tchOf(c,`${c.id}_${sl.id}_${ds}`),salle:String(sl.salle||c.salle||'').trim(),cancelled,movedX:cancelled?(c.extras||[]).find(x=>x.de===tag)||null:null});
    }
    for(const x of c.extras||[]){
      if(x.date!==ds) continue;
      const a=toMin(x.debut), b=toMin(x.fin);
      if(isNaN(a)||isNaN(b)||b<=a) continue;
      out.push({kind:'cours',key:`${c.id}_${x.id}_${ds}`,c,sl:{id:x.id,jour:j,debut:x.debut,fin:x.fin,salle:x.salle||''},extra:x,date:ds,start:a,end:b,grp:c.groupe,tch:tchOf(c,`${c.id}_${x.id}_${ds}`),salle:String(x.salle||c.salle||'').trim(),cancelled:ann.includes(`${ds}@${x.id}`)});
    }
  }
  return out.sort((x,y)=>x.start-y.start||x.end-y.end);
}
/* On parle d’avant-midi, d’après-midi ou de toute la journée, jamais d’heures. */
/* Le moment d’une séance : avant midi, après midi, ou les deux (au-delà de 13 h). Si l’administration a changé les heures
   (Paramètres), la frontière est à mi-chemin entre la fin de l’avant-midi et le début de l’après-midi. */
function moment(a,b){const cm=cfg().moments, m=cm?(toMin(PERIODES[0].fin)+toMin(PERIODES[1].debut))/2:12*60;if(a<m&&b>m+60)return 'Toute la journée';return a<m?'Avant-midi':'Après-midi';}
const momentOf=s=>moment(s.start,s.end);
const momentShort=s=>({'Avant-midi':'AM','Après-midi':'PM'})[momentOf(s)]||'Journée';
const momentIn=(a,b)=>({'Avant-midi':'en avant-midi','Après-midi':'en après-midi'})[moment(a,b)]||'toute la journée';
const codeOf=c=>c&&c.code?`<span class="cc-code">${esc(c.code)}</span> `:'';
function movedLabel(s){
  const x=s.movedX;if(!x)return '';
  if(x.date===s.date) return 'Déplacé '+momentIn(toMin(x.debut),toMin(x.fin));
  const d=parse(x.date);return `Déplacé au ${WD[d.getDay()].toLowerCase()} ${dn(d)}`;
}
function examItem(e){
  const c=byId(S.data.cours,e.cours), a=toMin(e.debut), b=toMin(e.fin);
  return {kind:'exam',key:'x_'+e.id,e,c,date:e.date,start:isNaN(a)?0:a,end:isNaN(b)?(isNaN(a)?0:a+75):b,grp:e.groupe||(c&&c.groupe)||'',tch:[c&&c.enseignant,e.surveillant].filter(Boolean),salle:String(e.salle||(c&&c.salle)||'').trim()};
}
function weekItems(){
  let out=[];const from=iso(S.week), to=iso(addDays(S.week,4));
  for(let i=0;i<5;i++) out=out.concat(sessionsOn(iso(addDays(S.week,i))));
  out=out.concat(S.data.examens.filter(e=>!e.seance&&e.date>=from&&e.date<=to).map(examItem));
  return out.sort((x,y)=>x.date.localeCompare(y.date)||x.start-y.start||(x.kind==='exam'?-1:1));
}

const presDoc=key=>S.data.presences[key]||S.data.presTerm[key];
function attInfo(s){
  if(s.cancelled) return {state:'cancelled',c:{},marked:0,total:0,past:isPast(s),due:false};
  const els=studentsOf(s.c.groupe), p=presDoc(s.key), st=(p&&p.statuts)||{};
  const c={P:0,A:0,R:0,M:0}; let marked=0;
  for(const e of els){const v=st[e.id];if(c[v]!=null){c[v]++;marked++;}}
  const past=isPast(s);
  /* une activité (Accueil, Graduation…) n’a des présences à prendre que si on a commencé à les prendre */
  const state=els.length&&marked>=els.length?'done':marked>0?'partial':past?(isActivity(s.c)?'none':'todo'):'future';
  return {state,c,marked,total:els.length,past,doc:p,due:past&&els.length>0&&(state==='todo'||state==='partial')};
}
function statusChip(s,mode){return (!s.cancelled&&profAbsent(s)?'<span class="chip bad">Enseignant absent</span>':'')+statusChip0(s,mode);}
function statusChip0(s,mode){
  if(s.kind==='exam') return '';
  if(s.cancelled) return s.movedX?`<span class="chip info">${esc(movedLabel(s))}</span>`:'<span class="chip off">Annulé</span>';
  const moved=s.extra&&s.extra.de?'<span class="chip info">Déplacé ici</span>':'';
  if(mode==='student') return moved;
  const a=attInfo(s);
  if(a.state==='done') return moved+'<span class="chip ok">Présences faites</span>';
  if(a.state==='partial') return moved+`<span class="chip warn">${a.marked}/${a.total} marqués</span>`;
  if(a.state==='todo') return moved+'<span class="chip warn">Présences à faire</span>';
  return moved;
}
/* Numéro du cours dans l’horaire annuel : « 7.5 » devient « Cours 7.5 » */
function sessLabel(s){
  const l=s&&s.extra&&s.extra.label?String(s.extra.label).trim():'';
  if(!l||l.toLowerCase()===String(s.c&&s.c.titre||'').toLowerCase()) return '';
  /* « 8.1–8.2 » : deux cours ; « 16-6 » : un seul cours, numéroté avec un trait d’union */
  const r=/^(\d+(?:[.,-]\d+)*)\s*–\s*(\d+(?:[.,-]\d+)*)$/.exec(l)||/^(\d+(?:[.,]\d+)*)\s+-\s+(\d+(?:[.,]\d+)*)$/.exec(l);
  if(r) return `Cours ${r[1]} et ${r[2]}`;
  return /^\d+([.,-]\d+)*$/.test(l)?'Cours '+l:l;
}
function metaFor(s,mode){
  if(s.kind==='exam'){
    const e=s.e;
    return [s.c?e.titre:'',mode==='admin'?'':gName(s.grp),s.salle?'Local '+s.salle:'',e.surveillant?'Surveillance : '+shortName(tName(e.surveillant)):''].filter(Boolean).join(' · ');
  }
  const c=s.c, id=sessLabel(s), ids=(s.tch||[]).filter(t=>t&&byId(S.data.enseignants,t)), who=ids.length?shortName(tName(ids[0]))+(ids.length>1?' +'+(ids.length-1):''):shortName(tName(c.enseignant));
  if(mode==='admin') return [who,s.salle?'Local '+s.salle:'',id].filter(Boolean).join(' · ');
  if(mode==='teacher') return [gName(c.groupe),s.salle?'Local '+s.salle:'',id].filter(Boolean).join(' · ');
  return [who,s.salle?'Local '+s.salle:'',id].filter(Boolean).join(' · ');
}
/* Étiquettes d’une séance de l’horaire annuel (Pratique, Théorie, Examen, Ménage…), comme sur le site. */
const TAGCHIP={Pratique:'ok',Théorie:'info',Examen:'bad',Reprise:'bad',Simulation:'k2',Sport:'k2',Stage:'k5',Visite:'k4',Musée:'k4',Ménage:'warn','Ménage ?':'warn',Maison:'off',Congé:'off'};
const TAGTONE={Pratique:'k6',Théorie:'k0',Examen:'kx',Reprise:'kx',Simulation:'k2',Stage:'k5',Visite:'k4',Musée:'k4',Congé:'k7'};
const tagsOf=s=>(s.extra&&s.extra.tags)||(s.sl&&s.sl.type?withAct([],s.sl.type):[]);
/* Période et activité d’une séance, comme dans le formulaire du site de l’Académie */
const PERIODES=[{k:'am',label:'Avant-midi',debut:'08:00',fin:'11:00'},{k:'pm',label:'Après-midi',debut:'12:00',fin:'15:00'},{k:'jour',label:'Toute la journée',debut:'08:00',fin:'15:00'}];
const ACTIVITES=[{k:'theorie',label:'Théorie',tags:['Théorie']},{k:'pratique',label:'Pratique',tags:['Pratique']},{k:'examen',label:'Examen',tags:['Examen']},{k:'examen-t',label:'Examen théorique',tags:['Examen','Théorie']},{k:'examen-p',label:'Examen pratique',tags:['Examen','Pratique']},{k:'reprise',label:'Reprise',tags:['Reprise']},{k:'simulation',label:'Simulation',tags:['Simulation']},{k:'conge',label:'Congé / journée spéciale',tags:['Congé']},{k:'visite',label:'Visite',tags:['Visite']},{k:'stage',label:'Stage',tags:['Stage']},{k:'activite',label:'Activité',tags:[]}];
const ACT_TAGS=new Set(['Théorie','Pratique','Examen','Reprise','Simulation','Visite','Congé','Stage']);
const periodOf=(debut,fin)=>{const p=PERIODES.find(x=>x.debut===debut&&x.fin===fin);return p?p.k:'autre';};
function actOf(tags){const t=new Set(tags||[]);if(t.has('Examen')&&t.has('Théorie'))return 'examen-t';if(t.has('Examen')&&t.has('Pratique'))return 'examen-p';if(t.has('Examen'))return 'examen';if(t.has('Reprise'))return 'reprise';if(t.has('Théorie'))return 'theorie';if(t.has('Pratique'))return 'pratique';if(t.has('Simulation'))return 'simulation';if(t.has('Visite'))return 'visite';if(t.has('Congé'))return 'conge';if(t.has('Stage'))return 'stage';return 'activite';}
function withAct(tags,k){const a=ACTIVITES.find(x=>x.k===k);return (a?a.tags:[]).concat((tags||[]).filter(t=>!ACT_TAGS.has(t)));}
function periodSelect(id,debut,fin,attrs,custom){const p=custom?'autre':periodOf(debut,fin);return `<select id="${id}" ${attrs}>${PERIODES.map(x=>`<option value="${x.k}"${p===x.k?' selected':''}>${x.label}</option>`).join('')}<option value="autre"${p==='autre'?' selected':''}>${p==='autre'&&debut&&fin?`Heures précises (${fmtT(debut)} – ${fmtT(fin)})`:'Heures précises…'}</option></select>`;}
const actSelect=(id,k,attrs)=>`<select id="${id}" ${attrs}>${ACTIVITES.map(x=>`<option value="${x.k}"${k===x.k?' selected':''}>${x.label}</option>`).join('')}</select>`;
const CHORE_TAGS=new Set(['Ménage','Ménage ?']);
/* La corvée de ménage est pour toute la classe, toute la journée.
   Elle est notée dans la classe (groupes/<id>.menage : liste de dates) ; les anciennes étiquettes « Ménage »
   d’une séance de la classe ce jour-là comptent aussi. */
let choreMemo=new Map();
function choreDay(gid,date){
  if(!gid||!date||cfg().menage===false) return '';
  const k=gid+'|'+date;if(choreMemo.has(k)) return choreMemo.get(k);
  let r='';
  const g=byId(S.data.groupes,gid);
  if(g&&Array.isArray(g.menage)&&g.menage.includes(date)) r='oui';
  else for(const x of sessionsOn(date)){
    if(x.grp!==gid||x.kind==='exam'||x.cancelled) continue;
    const t=tagsOf(x);if(t.includes('Ménage')){r='oui';break;}if(t.includes('Ménage ?'))r='maybe';
  }
  choreMemo.set(k,r);return r;
}
const choreOf=s=>!s||s.kind==='exam'||s.cancelled?'':choreDay(s.grp,s.date);
async function setChoreDay(gid,date,on){
  const g=byId(S.data.groupes,gid);if(!g||S.busy)return;
  const days=new Set(Array.isArray(g.menage)?g.menage:[]);
  if(on) days.add(date); else days.delete(date);
  const jobs=[()=>col('groupes').doc(gid).update({menage:[...days].sort()})];
  // en retirant la corvée, les anciennes étiquettes « Ménage » des séances de ce jour disparaissent aussi
  if(!on) for(const c of S.data.cours.filter(c=>c.groupe===gid)){
    if(!(c.extras||[]).some(x=>x.date===date&&(x.tags||[]).some(t=>CHORE_TAGS.has(t)))) continue;
    const doc=courseDoc(c);doc.extras.forEach(x=>{if(x.date===date)x.tags=(x.tags||[]).filter(t=>!CHORE_TAGS.has(t));});
    jobs.push(()=>putCours(c.id,doc));
  }
  S.busy=true;render();
  await write(async()=>{for(const j of jobs)await j();},on?'Corvée de ménage ajoutée pour la journée':'Corvée de ménage retirée');
  S.busy=false;render();
}
const choreChip=s=>{const k=choreOf(s);return k?`<span class="chore-chip${k==='maybe'?' maybe':''}" title="${k==='maybe'?'Corvée de ménage à confirmer':'Corvée de ménage de la classe, toute la journée'}">${icon('broom')}Ménage${k==='maybe'?' ?':''}</span>`:'';};
const choreNote=s=>{const k=choreOf(s);return k?`<div class="chore-note${k==='maybe'?' maybe':''}">${icon('broom')}<p><b>Corvée de ménage${k==='maybe'?' à confirmer':''}</b>La classe ${k==='maybe'?'aura peut-être':'a'} la corvée de ménage toute la journée.</p></div>`:'';};
const sessTone=s=>{for(const t of tagsOf(s)) if(TAGTONE[t]) return TAGTONE[t];return tone(s.c);};
const datedOf=c=>(c&&c.extras||[]).filter(x=>!x.de);
const sessMinutes=x=>x.minutes!=null?+x.minutes:Math.max(0,toMin(x.fin)-toMin(x.debut));
function filterItems(items,mode){
  if(mode==='teacher') return items.filter(s=>s.tch.includes(S.teacher));
  if(mode==='student') return items.filter(s=>s.grp===S.group);
  const f=S.filtre;
  if(!f) return items;
  return f.startsWith('g:')?items.filter(s=>s.grp===f.slice(2)):items.filter(s=>s.tch.includes(f.slice(2)));
}

/* ---------- Statistiques de présence ---------- */
function sessionsBetween(from,to){
  const out=[];let d=parse(from);const end=parse(to);let n=0;
  while(d<=end&&n<400){out.push(...sessionsOn(iso(d)));d=addDays(d,1);n++;}
  return out;
}
function studentStats(from,to){
  const m={};
  for(const [k,p] of Object.entries(S.data.presTerm)){
    if(!p||p.date<from||p.date>to) continue;
    for(const [id,v] of Object.entries(p.statuts||{})){
      const s=m[id]||(m[id]={P:0,A:0,R:0,M:0,n:0,log:[]});
      if(s[v]==null) continue;
      s[v]++;s.n++;
      if(v!=='P') s.log.push({date:p.date,cours:p.cours,v,key:k});
    }
  }
  return m;
}
const rateOf=s=>s&&s.n?Math.round((s.P+(cfg().retardPresent===false?0:s.R)+(cfg().motivePresent===true?s.M:0))/s.n*100):null;
function periodRange(p){
  const t=todayISO(), d=new Date();
  if(p==='semaine') return [iso(monday(d)),t];
  if(p==='mois') return [iso(new Date(d.getFullYear(),d.getMonth(),1)),t];
  return [yearStart(),t];
}

/* Carte d’un cours : heure et activité en haut, nom, enseignant et local, puis une ligne discrète
   (présences, Ménage…) seulement quand il y a quelque chose à dire. */
function cardKind(tags){
  const k=actOf(tags), used=new Set();let kind='';
  if(k==='examen-t'||k==='examen-p'){kind=k==='examen-t'?'Examen théorique':'Examen pratique';used.add('Examen').add(k==='examen-t'?'Théorie':'Pratique');}
  else{const f=tags.find(x=>TAGTONE[x]);if(f){kind=f;used.add(f);}}
  return {kind,flags:tags.filter(x=>!used.has(x))};
}
function cardStatus(s,mode){
  if(s.kind==='exam'||s.cancelled) return '';
  const moved=s.extra&&s.extra.de?'<span class="cc-st info">Déplacé ici</span>':'';
  if(mode==='student') return moved;
  const a=attInfo(s);
  let aff='';
  if(mode==='admin'&&!isPast(s)){const f=staffing(s);aff=(f.clash.length?`<span class="cc-st bad" title="${esc(f.clash.map(tName).join(', ')+W(' : aussi dans une autre séance à ce moment',' : aussi dans un autre cours à ce moment'))}">Conflit</span>`:'')+(f.rclash.length?`<span class="cc-st bad" title="${esc(ressNames([...new Set(f.rclash.map(x=>x.id))])+' : déjà pris à ce moment')}">${ressClashLbl(f.rclash)}</span>`:'')+(f.open>0?`<span class="cc-st warn" title="Enseignants attribués sur enseignants requis">${f.firm}/${f.requis} ens.</span>`:f.requis>1?`<span class="cc-st ok">${f.firm}/${f.requis} ens.</span>`:'')+(f.pending.length?`<span class="cc-st info">${f.pending.length} cand.</span>`:'')+(f.remp.length?'<span class="cc-st warn">Remplacement</span>':'');}
  return moved+aff+(a.state==='done'?'<span class="cc-st ok">Présences faites</span>':a.state==='partial'?`<span class="cc-st warn">${a.marked}/${a.total} marqués</span>`:a.state==='todo'?'<span class="cc-st warn">Présences à faire</span>':'');
}
const cardTop=(time,kind,ch)=>`<span class="cc-top"><span class="cc-time">${time}</span><span class="cc-tr">${ch?`<span class="cc-chore-pill${ch==='maybe'?' maybe':''}" title="Corvée de ménage de la classe, toute la journée">${icon('broom')}<span class="vh">Corvée de ménage</span></span>`:''}${kind?`<span class="cc-kind">${esc(kind)}</span>`:''}</span></span>`;

    ${cardTop(momentOf(s),kind,ch)}

/* Rôle d’un élève dans sa classe : capitaine ou lieutenant (couleur de sa carte et de son étiquette) */
/* Le grade d’un élève : sa place dans la liste des grades (Paramètres > Élèves), -1 s’il n’en a pas ;
   « Lieutenant » seul retrouve « Lieutenant 1 » (même premier mot). Sa couleur sert aux cartes et aux étiquettes. */
const gradeIdx=f=>{const x=String(f||'').trim().toLowerCase();if(!x)return -1;const gs=gradesL();let i=gs.findIndex(g=>g.nom.toLowerCase()===x);
  if(i<0){const w=x.split(/\s+/)[0];i=gs.findIndex(g=>g.nom.toLowerCase().split(/\s+/)[0]===w);}return i;};

/* ---------- Pages : élèves ---------- */
/* Notes d’un élève, d’après les résultats d’examens : moyenne des notes en %, examens réussis, examens à reprendre */
function studentNotes(){
  const out={};
  for(const d of Object.values(S.data.resultats||{})){
    const r=(d&&d.resultats)||{}, p=(d&&d.pct)||{};
    for(const [id,v] of Object.entries(r)){
      if(!v) continue;
      const o=out[id]||(out[id]={sum:0,np:0,ok:0,tot:0,todo:0});
      o.tot++;if(v==='reussi'||v==='reprise')o.ok++;if(v==='echec'||v==='absent')o.todo++;
      const x=p[id];if(x!=null&&x!==''&&!isNaN(+x)){o.sum+=+x;o.np++;}
    }
  }
  for(const o of Object.values(out)) o.avg=o.np?Math.round(o.sum/o.np):null;
  return out;
}
/* Ordre des grades : celui de la liste, puis les autres fonctions, puis sans grade */
const gradeRank=f=>{const x=String(f||'').trim();if(!x)return 999;const i=gradeIdx(x);return i<0?500:i;};

const EL_SORTS=[['num','numéro'],['nom','nom'],['classe','classe'],['grade','grade'],['note-d','note ↓'],['note-a','note ↑'],['pres','présence ↑']];

const elFilters=()=>gradesL().map((g,i)=>['g'+i,g.nom]).concat([['none','Sans grade'],['sous','Moyenne sous le seuil'],['rep','Examens à reprendre']]);
